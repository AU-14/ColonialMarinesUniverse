- type: cmu3DModel
  id: CMU3DRMCEntityDesertWaterShallow
  label: Desert water shallow
  sourcePrototypes:
  - RMCEntityDesertWaterShallow
  status: draft
  referenceRsi: _RMC14/Tiles/planet/desert_water.rsi
  referenceState: shallow
  sourceDirections: 1
  description: Thin ground-level water volume with original first South frame projected in XY. Cutouts reveal terrain
    and half-alpha shore shadows retain fractional coverage. Water top .012 tiles is below catwalk grates. Saved
    transform is preserved. Static draft; waves, refraction, reflection and depth are unfinished. See SOURCES_WATER.md.
  parts:
  - label: water surface
    min: -0.5, -0.5, 0.008
    max: 0.5, 0.5, 0.012
    color: '#FFFFFF'
    surface: CMU3DWaterArtRMCEntityDesertWaterShallow
    surfaceAxis: XY
