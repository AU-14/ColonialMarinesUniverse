  referenceState: support_struts_l
  sourceDirections: 1
  useEntityRotation: true
  description: Two small cast-metal edge brackets at the exact source pixel offsets. The far bracket is six pixels
    wide and the near bracket five; their L silhouettes are real opaque volumes. Left and right variants occupy
    opposite edges of a shared tile and leave the middle clear. Attachment height .45-.62 tiles is inferred to meet
    the turbine side lugs; no floor pier is invented. Static source pose; original CC-BY-SA-3.0 artwork. See SOURCES_BIOMASS_TURBINE.md.
  parts:
  - label: cast edge bracket 1
    min: -0.5000000, 0.9375000, 0.4500000
    max: -0.3125000, 1.0937500, 0.6200000
    color: '#FFFFFF'
    surface: CMU3DBiomassLeftArt0
    surfaceAxis: XY
  - label: cast edge bracket 2
    min: -0.4375000, 0.8750000, 0.4500000
    max: -0.3125000, 0.9375000, 0.6200000
    color: '#FFFFFF'
    surface: CMU3DBiomassLeftArt1
    surfaceAxis: XY
  - label: cast edge bracket 3
    min: -0.5000000, -1.0625000, 0.4500000
    max: -0.3437500, -0.9062500, 0.6200000
