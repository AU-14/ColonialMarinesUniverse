  description: Plasteel plate, deep capped reinforcement posts, foot shoes and lower rails with distinct original front/rear
    artwork in four paired damage poses, each also authored with a straight barbed strand and four red ties.
    South-edge pivot follows the source collision fixture; the .625-tile body height, wire section, depth and hidden bends
    are draft reconstruction assumptions. Five bubbling acid frames accompany each damage/wire pose.
    Eight acid loop clips repeat one source sequence across eight contexts; the game owns expiry and removal.
    Burning, corrosive melting, debris, side fidelity and native interaction remain unfinished.
