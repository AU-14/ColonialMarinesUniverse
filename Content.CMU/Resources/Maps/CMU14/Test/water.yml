    - type: MetaData
      name: Water test arena guide
    - type: Paper
      content: 'WATER EFFECTS TEST ARENA


        NORTH: depth 2 / 4 / 8 / 12 / 18 lanes, with marines, drones and queens.

        WEST: bodies to control (marine, larva, facehugger, runner, lurker, Yautja).

        MIDDLE SOUTH: red, dark red, river, transparent, desert and shore water.

        FAR SOUTH: bridge, grate, carry, buckle, live/dead bubbles, resting poses,
        throws and pounces.


        Examine the yellow signs for instructions. You are a local admin in Sandbox.

        Right-click a body and use Debug > Control mob. Use the rest action/key binding
        to lie down.

        Hold your walk modifier to compare silent walking with running.

        Use the Yautja''s cloak or lurker''s camouflage to verify visible wakes.

        Samples and the initial player have godmode to stay available for testing.'
