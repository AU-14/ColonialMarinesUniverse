# Compatibility prototypes required by the pre-rebase USS Bush Redux maps.
# Keep aliases and legacy marker data here so each modernization can be audited.

# Modern hydroponics leaves still inherit this pre-RMC compatibility base.
- type: entity
  abstract: true
  parent: ProduceBase
  id: ProduceBaseRuminant

# The legacy warship station intentionally excluded cargo/evacuation systems.
# Current StandardUNMCWarship gained those parents after the rebase, so the
# Bush keeps its original station composition here.
- type: entity
  id: CMUUSSBushStation
  parent:
  - BaseStation
  - BaseStationNews
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform

- type: entity
  parent: RMCGuidebookLawMarine
  id: AU14GuidebookLawMarine

- type: entity
  parent: RMCGuidebookSOP
  id: AU14GuidebookSOP

- type: entity
  parent: RMCDeskFlag
  id: AU14UADeskFlag

- type: entity
  parent: RMCSecureCaseMedicalBig
  id: AU14CrateMedicalVendor
  name: We-Ya-Med vendor crate
  description: A crate containing one We-Ya-Med vendor.
  components:
  - type: SpawnOnTerminate
    spawn: AU14GeneralMedicalVendor

- type: entity
  parent: RMCOrbitalCannon
  id: AU14OrbitalCannonGovfor

- type: entity
  parent: RMCComputerIntel
  id: RMCComputerIntelGovfor

- type: entity
  parent: RMCComputerIntel
  id: ComputerObjectivesGovfor
  name: GOVFOR objectives console
  description: A legacy objectives console using the current intelligence interface.

- type: entity
  parent: CMAirlockGlass
  id: CMULegacyBushAirlockGlassCommandLocked
  suffix: Command, Locked, Glass
  components:
  - type: AccessReader
    access: [["RMCAccessCommand"]]

- type: entity
  parent: CMAirlockGlass
  id: CMULegacyBushAirlockGlassMarineLocked
  suffix: Marine, Locked, Glass
  components:
  - type: AccessReader
    access: [["CMAccessMarinePrep"], ["RMCAccessCommand"]]

- type: entity
  parent: RMCAutodocNoConsole
  id: CMUAutodocPod

- type: entity
  parent: RMCAutodocConsole
  id: CMUAutodocConsole

- type: entity
  parent: RMCBodyScannerNoConsole
  id: CMUBodyScannerPod

- type: entity
  parent: RMCBodyScannerConsole
  id: CMUBodyScannerConsole

- type: entity
  parent: DefibrillatorCabinetFilled
  id: CMUDefibrillatorCabinetFilled

- type: entity
  parent: MedicalTechFab
  id: CMULimbPrinter
  name: limb printer

- type: entity
  parent: CMWoundClamp
  id: CMUOrganClampItem
  name: organ vessel clamp

- type: entity
  parent: RMCShutterAlmayerOpen
  id: CMUShutterLamentOpen

- type: entity
  parent: RMCAICore
  id: AU14AICoreApolloGOVFOR
  name: APOLLO Central A.I.

- type: entity
  parent: RMCStairs
  id: AU14FlightStairs
  components:
  - type: Sprite
    state: rampbottom
    color: "#a6aeab"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1000
        hard: false

# Shepherd beach overlays are mapped to the current equivalent water entities.
- type: entity
  abstract: true
  id: AU14ContainerTartarusBase
  name: cargo container
  description: A huge industrial shipping container.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.8"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: Structures/containers.rsi
  - type: Clickable
  - type: Occluder
    boundingBox: "-0.5,-0.5,0.5,0.8"
  - type: DeleteOnExplosion
  - type: XenoToggleChargingDamage
    stageLoss: 4
    destroy: true

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusLeftMedicalEmpty
  components:
  - type: Sprite
    state: emptymedicalleft

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusRightMedicalEmptyAlt
  components:
  - type: Sprite
    state: medicalright

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusLeftTanWYWings
  components:
  - type: Sprite
    state: tanwywingsleft

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusRightTanWYWings
  components:
  - type: Sprite
    state: tanwywingsright

# Fallout-derived floor clutter retained by the Bush maps.
- type: entity
  abstract: true
  id: CMULegacyBushFloorDecor
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: N14content/world.rsi
    noRot: true
    drawdepth: FloorObjects
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline

- type: entity
  parent: CMULegacyBushFloorDecor
  id: DecorFloorPaper
  name: scattered paper
  description: A mess of papers.
  components:
  - type: Sprite
    state: scattered_papers

- type: entity
  parent: CMULegacyBushFloorDecor
  id: DecorFloorPaper2
  name: scattered paper
  description: A mess of papers.
  components:
  - type: Sprite
    state: papers_2

- type: entity
  parent: CMULegacyBushFloorDecor
  id: DecorFloorPallet
  name: pallet
  description: A wooden pallet.
  components:
  - type: Sprite
    state: pallet

- type: entity
  parent: CMULegacyBushFloorDecor
  id: DecorFloorPalletStack
  name: pallet stack
  description: A stack of wooden pallets.
  components:
  - type: Sprite
    state: pallet_stack

# Legacy platoon markers. The replacement field selects the current default
# UNMC equivalent without restoring the removed AU platoon framework.
- type: entity
  abstract: true
  parent: MarkerBase
  id: CMULegacyBushShipMarker
  components:
  - type: VendorMarker
    ship: true
  - type: Sprite
    state: green
