# Tartarus cargo containers used on the Bush hangar decks.
- type: entity
  abstract: true
  id: AU14ContainerTartarusBase
  name: cargo container
  description: A huge industrial shipping container.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.8"
        density: 190
        layer:
        - MobMask
  - type: Sprite
    sprite: _AU14/Structures/containers.rsi
  - type: Clickable
  - type: Occluder
    boundingBox: "-0.5,-0.5,0.5,0.8"
  - type: DeleteOnExplosion
  - type: XenoToggleChargingDamage
    stageLoss: 4
    destroy: true

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusLeftMedicalEmpty
  components:
  - type: Sprite
    state: emptymedicalleft

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusRightMedicalEmptyAlt
  components:
  - type: Sprite
    state: medicalright

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusLeftTanWYWings
  components:
  - type: Sprite
    state: tanwywingsleft

- type: entity
  parent: AU14ContainerTartarusBase
  id: AU14ContainerTartarusRightTanWYWings
  components:
  - type: Sprite
    state: tanwywingsright

