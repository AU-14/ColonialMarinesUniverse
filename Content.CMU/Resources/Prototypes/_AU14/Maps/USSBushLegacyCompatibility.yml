# Compatibility prototypes required by the pre-rebase USS Bush Redux maps.
# Keep aliases and legacy marker data here so each modernization can be audited.

# The legacy warship station intentionally excluded cargo/evacuation systems.
# Current StandardUNMCWarship gained those parents after the rebase, so the
# Bush keeps its original station composition here.
- type: entity
  id: CMUUSSBushStation
  parent:
  - BaseStation
  - BaseStationNews
  - BaseStationJobsSpawning
  - BaseStationRecords
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform

- type: entity
  parent: RMCGuidebookLawMarine
  id: AU14GuidebookLawMarine

- type: entity
  parent: RMCGuidebookSOP
  id: AU14GuidebookSOP

- type: entity
  parent: RMCDeskFlag
  id: AU14UADeskFlag

