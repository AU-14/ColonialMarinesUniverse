- type: entity
  parent: VehicleBoxVanBase
  id: AU14VehicleCivHSVan
  name: Hyperdyne systems Van
  description: A Hyperdyne Systems van, used for synthetic maintance. Still sturdy enough for transport.
  components:
  - type: Sprite
    sprite: _AU14/Structures/vehicles/hybrisavehicles/civvan.rsi
    offset: "0,0.5"
    layers:
    - map: [ base ]
      state: civvan
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_0
  - type: VehicleEnter
    interiorPath: /Maps/_CMU14/Vehicleinteriors/Civillians/PaddyWagonVanEmpty.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    maxXenos: 2
    entryPoints:
    - offset: 1,-0.25
      radius: 0.6
      interiorCoords: -1.3,1
    - offset: -1,-0.25
      radius: 0.6
      interiorCoords: -1.3,1
    - offset: 0,2
      radius: 0.75
      interiorCoords: -1.3,1
      
