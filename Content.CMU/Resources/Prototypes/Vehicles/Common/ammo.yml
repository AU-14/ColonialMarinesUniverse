- type: entity
  parent: VehicleAmmoBoxBase
  id: CMUAmmoBoxGrenadeLauncherHEFA
  name: grenade launcher ammo crate (HEFA)
  description: Ammunition for vehicle grenade launchers. 30mm HEFA grenades, a fragmentation round that showers the area in shrapnel. Better against infantry, weaker against structures and vehicles than HEDP.
  components:
  - type: Sprite
    layers:
    - state: glauncher_0
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: glauncher_2, visible: true }
          Low: { state: glauncher_2, visible: true }
          Medium: { state: glauncher_1, visible: true }
          High: { state: glauncher_0, visible: true }
          Full: { state: glauncher_0, visible: true }
  - type: BulletBox
    amount: 10
    max: 10
    bulletType: VehicleAmmoBoxGrenadeLauncher
    ammoProto: CMGrenadeFrag
    usedIn: Tank grenade launcher, Humvee launcher

