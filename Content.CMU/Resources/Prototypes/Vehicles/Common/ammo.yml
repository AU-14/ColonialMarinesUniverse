- type: entity
  parent: VehicleAmmoBoxBase
  id: CMUAmmoBoxLTBCannonNapalm
  name: LTB napalm cannon shell
  description: Ammunition for light tank cannons. A napalm-filled shell with very little blast, but scatters sticky burning fragments that spread across the impact area. Good for burning out entrenched positions or setting the field alight.
