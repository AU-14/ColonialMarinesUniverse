- type: entity
  parent: VehicleAmmoBoxBase
  id: CMUAmmoBoxCupolaTracer
  name: cupola cannon ammo crate (tracer)
  description: Tracer ammunition for cupola-mounted vehicle cannons. Burns bright in flight to help the gunner walk fire onto target, at the cost of giving away the tank's position.
  components:
  - type: Sprite
    layers:
    - state: cupola_0
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: cupola_0, visible: true }
          Low: { state: cupola_0, visible: true }
          Medium: { state: cupola_1, visible: true }
          High: { state: cupola_1, visible: true }
          Full: { state: cupola_1, visible: true }
  - type: BulletBox
    amount: 500
    max: 500
    bulletType: VehicleAmmoBoxCupola
    ammoProto: CMUCartridgeCupolaTracer
    usedIn: Tank cupola

- type: entity
  parent: VehicleAmmoBoxBase
  id: CMUAmmoBoxLTBCannonAPFSDS
  name: LTB APFSDS cannon shell
  description: Ammunition for light tank cannons. A fin-stabilized discarding-sabot penetrator with no explosive filler, meant to punch through armor rather than fragment. Barely scratches infantry or structures.
  components:
  - type: Sprite
    sprite: _CMU14/Structures/Vehicles/ammo/vehicles.rsi
    layers:
    - state: lbtshell_apfsds
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: lbtshell_casing, visible: true }
          Full: { state: lbtshell_apfsds, visible: true }
  - type: BulletBox
    amount: 1
    max: 1
    bulletType: VehicleAmmoBoxLTBCannon
    ammoProto: CMUCartridgeLTBCannonAPFSDS
    usedIn: Tank LTB cannon

- type: entity
  parent: VehicleAmmoBoxBase
  id: CMUAmmoBoxLTBCannonHEAT
  name: LTB HEAT cannon shell
  description: Ammunition for light tank cannons. A shaped-charge warhead that punches a focused jet through armor with a small blast, backed by light fragmentation. Less effective against armor than a dedicated penetrator, but hits far harder than a standard HE shell.
  components:
  - type: Sprite
    sprite: _CMU14/Structures/Vehicles/ammo/vehicles.rsi
    layers:
    - state: lbtshell_heat
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: lbtshell_casing, visible: true }
          Full: { state: lbtshell_heat, visible: true }
  - type: BulletBox
    amount: 1
    max: 1
    bulletType: VehicleAmmoBoxLTBCannon
    ammoProto: CMUCartridgeLTBCannonHEAT
    usedIn: Tank LTB cannon

