- type: entity
  parent: BaseItem
  id: AU14BaseDefibrillator
  name: lifepak 15f
  description: A portable emergency defibrillator and patient monitor designed for fibrillating patients, it delivers powerful defibrillation to restore normal heart rhythms in patients, sometimes even pulling them back from the brink of death.
  abstract: true
  components:
  - type: Sprite
    sprite: Items/audefib.rsi
    layers:
    - state: defib
    - state: defib_on
      map: [ "enum.ToggleableVisuals.Layer" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Normal
    sprite: Items/audefib.rsi
    heldPrefix: defib
  - type: Clothing
    sprite: Items/audefib.rsi
    slots:
    - OUTERCLOTHING
    - back
    quickEquip: false
  - type: Speech
    speechVerb: Robotic
  - type: ItemToggle
    soundActivate:
      path: /Audio/Medical/defib_SafetyOn.ogg
    soundDeactivate:
      path: /Audio/Medical/defib_SafetyOff.ogg
  - type: Defibrillator
    zapDelay: 0
    doAfterDuration: 12.5
    allowDoAfterMovement: true
    canDefibCrit: false
    zapHeal:
      groups:
        Airloss: -150
    zapSound:
      path: /Audio/Medical/defib_release.ogg
      params:
        volume: 0.1
    chargeSound:
      path: /Audio/Medical/defib_charge.ogg
      params:
        volume: -5
    failureSound:
      path: /Audio/Medical/defib_failed.ogg
      params:
        volume: 0.1
    successSound:
      path: /Audio/Medical/defib_success.ogg
      params:
        volume: 0.1
    readySound:
      path: /Audio/Medical/defib_ready.ogg
      params:
        volume: 0.1
    zapDamage: 25
  - type: DoAfter
  - type: UseDelay
  - type: StaticPrice
    price: 100
  - type: GuideHelp
    guides:
    - MedicalDoctor
  - type: RequiresSkill
    skills:
      RMCSkillMedical: 2

- type: entity
  id: AU14CMDefibrillator
  parent: [AU14BaseDefibrillator, RMCPowerCellSlotUnremovable]
  suffix: AU14
  components:
  - type: PowerCellDraw
    enabled: false
    useRate: 50
  - type: RMCPowerUsageDisplay

- type: entity
  id: AUCMDefibrillatorEmpty
  parent: AU14CMDefibrillator
  suffix: AU14, Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: AU14BaseDefibrillator
  id: AUDefibrillatorInfinite
  suffix: AU14, Infinite
