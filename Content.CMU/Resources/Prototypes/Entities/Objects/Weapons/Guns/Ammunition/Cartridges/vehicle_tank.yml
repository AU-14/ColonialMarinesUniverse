    minShrapnel: 70
    maxShrapnel: 160
    shrapnelSpeed: 8
  - type: RMCScorchEffect
    radius: 5
    centerRadius: 2
  - type: Explosive
    explosionType: RMCLTBCannon
    maxIntensity: 12
    intensitySlope: 2
    totalIntensity: 220
    tileBreakScale: 0
    maxTileBreak: 0

- type: entity
