- type: entity
  parent: CMComputerDropshipNavigation
  id: AU14GovforComputerDropshipPilotSmall
  name: dropship navigation computer
  suffix: Govfor, small
  description: A compact computer that can pilot the dropship and designate tactical landings.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: Objects
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: security_cam
    layers: []
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: WallMount
    arc: 360
  - type: DropshipNavigationComputer
    canTacticalLand: true
    tacticalLandFootprintOverride: 9, 15
  - type: RequiresSkill
    skills:
      RMCSkillPilot: 1
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 1
    offset: "0,0"
    color: "#FFEFD2"
    mask: /Textures/_RMC14/Effects/LightMasks/quad_cone.png
  - type: WhitelistedShuttle
    faction: govfor
    ShuttleType: Dropship

