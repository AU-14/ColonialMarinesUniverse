# The cooking, taken from crystall-punk-14 and adapted: a vessel (a pot, a pan, a pie mould) with the ingredients in it is put in a stove and heated, and when it has been
# heated long enough it holds a dish, which is poured into a bowl or onto a plate. The ingredients are not those of crystall but the things of the game: the recipes ask for
# tags, and the maps of the tags below give the tags to the things of the game, so that the things themselves are not touched. Generated by gen_cooking.py.

- type: cookingFoodType
  id: Meal

- type: cookingFoodType
  id: Soup

- type: cookingFoodType
  id: Pie

# What a dish becomes when it burns.
- type: reagent
  id: RUMCBurntFood
  name: reagent-name-au14-burnt-food
  group: Foods
  desc: reagent-desc-au14-burnt-food
  physicalDesc: reagent-physical-desc-powdery
  flavor: terrible
  color: black
  recognizable: true

