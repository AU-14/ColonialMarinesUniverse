# ---------------------------------------------------------------- the vessels
- type: entity
  id: RUMCCookerBase
  parent: BaseStorageItem
  abstract: true
  components:
  - type: Sprite
    noRot: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        lid:
          True: { state: opened }
          False: { state: closed }
      enum.CookingVisuals.Cooking:
        cook:
          True: { visible: true }
          False: { visible: false }
      enum.CookingVisuals.Burning:
        burn:
          True: { visible: true }
          False: { visible: false }
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,3
    whitelist:
      components:
      - Edible
    blacklist:
      components:
      - FoodHolder
      - SolutionTransfer
  - type: FoodCooker
    containerId: storagebase
  - type: DoAfter
  - type: AmbientSound
    enabled: false
    volume: 5
    range: 5

- type: entity
  id: RUMCCookingPot
  parent: RUMCCookerBase
  name: cooking pot
  description: "A pot for cooking soups: put the ingredients in it, pour water in it, shut it and put it in a stove."
  components:
  - type: Sprite
    sprite: CMU14/Cooking/cooking_pot.rsi
    layers:
    - state: base
    - map: ["au14_foodLayers"]
    - state: closed
      map: [ lid ]
    - state: cooking
      visible: false
      map: [ cook ]
    - state: cooking
      visible: false
      color: "#38312e"
      map: [ burn ]
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 150
  - type: FoodHolder
    foodType: Soup
    solutionId: cooker
    canGiveFood: true
  - type: FoodCooker
    foodType: Soup
    solutionId: cooker
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: RefillableSolution
    solution: cooker
  - type: Spillable
    solution: cooker
  - type: ExaminableSolution
    solution: cooker
  - type: AmbientSound
    sound:
      path: /Audio/CMU14/Cooking/pot_brewing.ogg
  - type: Storage
    storageOpenSound: /Audio/CMU14/Cooking/pan_open.ogg
    storageCloseSound: /Audio/CMU14/Cooking/pan_close.ogg

- type: entity
  id: RUMCFryingPan
  parent: RUMCCookerBase
  name: frying pan
  description: "You can always watch three things: how fire burns, how water flows, and how delicious meat is cooked."
  components:
  - type: Sprite
    sprite: CMU14/Cooking/frying_pan.rsi
    layers:
    - state: base
    - map: ["au14_foodLayers"]
    - state: closed
      map: [ lid ]
    - state: cooking
      visible: false
      map: [ cook ]
    - state: cooking
      visible: false
      color: "#38312e"
      map: [ burn ]
  - type: MeleeWeapon
    wideAnimationRotation: 270
    damage:
      types:
        Blunt: 6
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 100
  - type: FoodHolder
    foodType: Meal
    solutionId: cooker
    canGiveFood: true
  - type: FoodCooker
    foodType: Meal
    solutionId: cooker
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: RefillableSolution
    solution: cooker
  - type: DrainableSolution
    solution: cooker
  - type: Spillable
    solution: cooker
  - type: AmbientSound
    sound:
      path: /Audio/CMU14/Cooking/pan_frying.ogg
  - type: Storage
    storageOpenSound: /Audio/CMU14/Cooking/pan_open.ogg
    storageCloseSound: /Audio/CMU14/Cooking/pan_close.ogg

- type: entity
  id: RUMCPiePlate
  parent: RUMCCookerBase
  name: pie plate
  description: "A mould for making a delicious pie."
  components:
  - type: Sprite
    sprite: CMU14/Cooking/pie_plate.rsi
    layers:
    - state: iron
    - map: ["au14_foodLayers"]
  - type: GenericVisualizer
    visuals:
      enum.CookingVisuals.Cooking:
        cook:
          True: { visible: true }
          False: { visible: false }
      enum.CookingVisuals.Burning:
        burn:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2
  - type: SolutionContainerManager
    solutions:
      cooker:
        maxVol: 50
  - type: FoodCooker
    foodType: Pie
    solutionId: cooker
  - type: FoodHolder
    foodType: Pie
    solutionId: cooker
  - type: AmbientSound
    sound:
      path: /Audio/CMU14/Cooking/pan_frying.ogg
  - type: Edible
    transferAmount: 2.5
    solution: cooker
    trash:
    - RUMCPiePlate
  - type: Spillable
    solution: cooker

# ---------------------------------------------------------------- the bowls and the plates: the dishes are poured into them
- type: entity
  id: RUMCBowlBase
  parent: BaseItem
  abstract: true
  description: "A bowl for a good soup."
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
  - type: FoodHolder
    foodType: Soup
    solutionId: food
    canAcceptFood: true
  - type: Appearance
  - type: Edible
    utensil: Spoon
    transferAmount: 2.5
  - type: Spillable
    solution: food

- type: entity
  id: RUMCBowlWooden
  parent: RUMCBowlBase
  name: wooden bowl
  components:
  - type: Sprite
    sprite: CMU14/Cooking/bowls.rsi
    layers:
    - state: wooden
    - map: ["au14_foodLayers"]
  - type: Edible
    trash:
    - RUMCBowlWooden

- type: entity
  id: RUMCBowlIron
  parent: RUMCBowlBase
  name: iron bowl
  components:
  - type: Sprite
    sprite: CMU14/Cooking/bowls.rsi
    layers:
    - state: iron
    - map: ["au14_foodLayers"]
  - type: Edible
    trash:
    - RUMCBowlIron

- type: entity
  id: RUMCPlateBase
  parent: BaseItem
  abstract: true
  description: "A plate for a good meal."
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
  - type: FoodHolder
    foodType: Meal
    solutionId: food
    canAcceptFood: true
  - type: Appearance
  - type: Edible
    transferAmount: 2.5
  - type: Spillable
    solution: food

- type: entity
  id: RUMCPlateWooden
  parent: RUMCPlateBase
  name: wooden plate
  components:
  - type: Sprite
    sprite: CMU14/Cooking/plates.rsi
    layers:
    - state: wooden
    - map: ["au14_foodLayers"]
  - type: Edible
    trash:
    - RUMCPlateWooden

- type: entity
  id: RUMCPlateIron
  parent: RUMCPlateBase
  name: iron plate
  components:
  - type: Sprite
    sprite: CMU14/Cooking/plates.rsi
    layers:
    - state: iron
    - map: ["au14_foodLayers"]
  - type: Edible
    trash:
    - RUMCPlateIron

# ---------------------------------------------------------------- the stoves: they heat the vessels put in them while the door is shut
- type: entity
  abstract: true
  parent: RUMCSteamMachineBase
  id: RUMCStoveBase
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StoveVisuals.Open:
        base:
          True: { state: open }
          False: { state: closed }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ItemSlots
    slots:
      fuel:
        whitelist:
          components:
          - Stack
        insertOnInteract: true
        locked: true
      cooker:
        whitelist:
          components:
          - FoodCooker
        insertOnInteract: true
        locked: true
  - type: ContainerContainer
    containers:
      fuel: !type:ContainerSlot
      cooker: !type:ContainerSlot
  - type: PointLight
    enabled: false
    radius: 2.5
    energy: 1.5
    color: "#FF8C1A"
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 4
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: CookingStove
    fuels:
      RMCWood: 45
      RUMCFirewood: 90
      RUMCBranch: 40
      Coal: 160
      RUMCCokeCoal: 220

- type: entity
  parent: RUMCStoveBase
  id: RUMCStoveBarrel
  name: barrel stove
  description: "A barrel with a grate, a stove of the poor. Put the pot on it, open the lid and put firewood in, and light it with a lighter or a match: then it cooks."
  components:
  - type: Sprite
    noRot: true
    sprite: CMU14/Cooking/stove_barrel.rsi
    layers:
    - state: closed
      map: [ base ]

- type: entity
  parent: RUMCStoveBase
  id: RUMCStoveWood
  name: wood kitchen stove
  description: "A kitchen stove that burns wood. Put the pot or the pan on it, open the door and put firewood in, and light it with a lighter or a match: then it cooks."
  components:
  - type: Sprite
    noRot: true
    sprite: CMU14/Cooking/stove_wood.rsi
    offset: 0,0.4
    layers:
    - state: closed
      map: [ base ]

- type: entity
  parent: [ BaseMachinePowered, BaseMachineDestructible ]
  id: RUMCStoveOven
  name: kitchen stove with an oven
  description: "A compact kitchen stove with an oven, as handy as a microwave and as good as an oven: it runs on power, takes up to two vessels, and cooks while its door is shut."
  components:
  - type: PortableStructure
  - type: NodeContainer
    examinable: true
    nodes:
      direct:
        !type:CableDeviceNode
        nodeGroupID: Apc
        connection: Direct
  - type: Sprite
    noRot: true
    sprite: CMU14/Cooking/stove_oven.rsi
    layers:
    - state: closed
      map: [ base ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StoveVisuals.Open:
        base:
          True: { state: open }
          False: { state: closed }
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: ItemSlots
    slots:
      cooker1:
        whitelist:
          components:
          - FoodCooker
        insertOnInteract: true
        locked: true
      cooker2:
        whitelist:
          components:
          - FoodCooker
        insertOnInteract: true
        locked: true
  - type: ContainerContainer
    containers:
      cooker1: !type:ContainerSlot
      cooker2: !type:ContainerSlot
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 1
    color: "#FFB060"
  - type: AmbientSound
    enabled: false
    volume: -10
    range: 3
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: CookingStove
    electric: true
    fuelSlot: null
    cookerSlots:
    - cooker1
    - cooker2

