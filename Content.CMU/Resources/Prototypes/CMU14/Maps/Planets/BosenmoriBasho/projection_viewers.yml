- type: entity
  abstract: true
  parent: RMCTriggerTeleporterViewer
  id: CMUBosenmoriProjectionViewerBase
  name: Bosenmori projection viewer
  suffix: CMU14, Bosenmori
  components:
  - type: RMCTeleporterViewer
    projectionEnabled: false
    projectAnchored: true
    projectTiles: true

- type: entity
  parent: CMUBosenmoriProjectionViewerBase
  id: CMUBosenmoriProjectionViewer4x4
  components:
  - type: RMCTeleporterViewer
    projectionTileMask: "...#/..##/.###/###."
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.99,-1.99,1.99,1.99"
        density: 1500
        hard: false
        mask:
        - MobMask
        - MobLayer
        - GhostImpassable
        layer:
        - MobMask
        - MobLayer
        - GhostImpassable

