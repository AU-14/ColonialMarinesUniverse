    mapId: SolarisRidge
    lorePrimer: AU14PrimerPlanetLV1413
    allegiance: UA
    camouflage: Desert
    announcement: "The desert colony of Solaris Ridge on LV-1413 has gone silent. A response force has been dispatched to investigate the blackout."
    platoonsGovfor:
