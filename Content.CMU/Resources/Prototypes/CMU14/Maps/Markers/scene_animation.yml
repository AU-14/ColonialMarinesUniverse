- type: entity
  id: CMUSceneMarine
  parent: CMMobHuman
  name: USCM scene marine
  description: A background marine used by scene-animation markers.
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomHumanoidAppearance
  - type: InputMover
  - type: MobMover
  - type: NpcFactionMember
    factions:
    - AUUnitedAmericas

- type: entity
  abstract: true
  id: CMUSceneSpawnerBase
  parent: MarkerBase
  name: scene animation spawner
  description: Faces the direction its scene-animation group will travel. Waves wait for the full 40-tile route to clear.
  suffix: CMU, Scene
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: green

- type: entity
  id: CMUSceneVehicleSpawner
  parent: CMUSceneSpawnerBase
  name: scene vehicle spawner (all)
  description: Randomly spawns a full Humvee, APC, truck, or tank group in its facing direction.
  components:
  - type: CMUSceneSpawnMarker
    spawnGroups:
    - spawns: [ VehicleHumvee, VehicleHumveeMedical, VehicleHumveeTransport, VehicleHumveeARC ]
      minSize: 2
      maxSize: 5
      mixPrototypes: true
      memberClearance: 4
    - spawns: [ VehicleAPC, VehicleAPCMed, VehicleAPCCommand ]
      minSize: 2
      maxSize: 4
      mixPrototypes: true
      apc: true
      memberClearance: 7
    - spawns: [ AU14VehicleCivArmoredTruck, AU14VehicleCivTruck, AU14VehicleCivVan ]
      minSize: 2
      maxSize: 4
      mixPrototypes: true
      memberClearance: 5
    - spawns: [ VehicleTank, VehicleTankTWE ]
      minSize: 2
      maxSize: 4
      mixPrototypes: false
      tank: true
      memberClearance: 5

- type: entity
  id: CMUSceneHumveeSpawner
  parent: CMUSceneSpawnerBase
  name: scene Humvee group spawner
  components:
  - type: CMUSceneSpawnMarker
    spawnGroups:
    - spawns: [ VehicleHumvee, VehicleHumveeMedical, VehicleHumveeTransport, VehicleHumveeARC ]
      minSize: 2
      maxSize: 5
      mixPrototypes: true
      memberClearance: 4

- type: entity
  id: CMUSceneAPCSpawner
  parent: CMUSceneSpawnerBase
  name: scene APC group spawner
  components:
  - type: CMUSceneSpawnMarker
    spawnGroups:
    - spawns: [ VehicleAPC, VehicleAPCMed, VehicleAPCCommand ]
      minSize: 2
      maxSize: 4
      mixPrototypes: true
      apc: true
      memberClearance: 7

- type: entity
  id: CMUSceneTruckSpawner
  parent: CMUSceneSpawnerBase
  name: scene truck group spawner
  components:
  - type: CMUSceneSpawnMarker
    spawnGroups:
    - spawns: [ AU14VehicleCivArmoredTruck, AU14VehicleCivTruck, AU14VehicleCivVan ]
      minSize: 2
      maxSize: 4
      mixPrototypes: true
      memberClearance: 5

- type: entity
  id: CMUSceneTankSpawner
  parent: CMUSceneSpawnerBase
  name: scene tank group spawner
  components:
  - type: CMUSceneSpawnMarker
    spawnGroups:
    - spawns: [ VehicleTank, VehicleTankTWE ]
      minSize: 2
      maxSize: 4
      mixPrototypes: false
      tank: true
      memberClearance: 5

