- type: entity
  id: CMUSceneMarineSpawner
  parent: CMUSceneSpawnerBase
  name: scene marine group spawner
  description: Spawns loose groups of walking USCM marines in snow camouflage and cold-weather gear.
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: blue
  - type: CMUSceneSpawnMarker
    actorLateralVariance: 0.7
    actorLongitudinalVariance: 0.25
    spawnGroups:
    - spawns: [ CMUSceneMarine ]
      minSize: 2
      maxSize: 6
      mixPrototypes: true
      marine: true
      memberClearance: 0

- type: entity
  id: CMUSceneDeleteMarker
  parent: MarkerBase
  name: scene entity delete marker
  description: Deletes scene vehicles and marines that pass within its radius.
  suffix: CMU, Scene
  components:
  - type: Sprite
    sprite: Markers/cross.rsi
    state: red
  - type: CMUSceneDeleteMarker
    radius: 2.5

- type: entity
  id: CMUGroundTextDecalTool
  parent: BaseItem
  name: ground text decal tool
  description: Writes multiline stencil text to the ground, with adjustable spacing and graffiti-like wonkiness.
  suffix: CMU, Scene
  components:
  - type: Sprite
    sprite: Objects/Fun/crayons.rsi
    state: black
  - type: Item
    sprite: Objects/Fun/crayons.rsi
    size: Small
  - type: ActivatableUI
    key: enum.CMUGroundTextDecalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CMUGroundTextDecalUiKey.Key:
        type: CMUGroundTextDecalBui
  - type: CMUGroundTextDecalTool
