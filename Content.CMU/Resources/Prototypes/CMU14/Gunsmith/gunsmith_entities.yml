# The things of the gunsmith's bench: the bench itself, the kit that unfolds it, the weapons, the magazines and the cartridges it makes.
# The numbers of a made weapon are not here: the bench works them out of the design and sets them when it builds the thing.

- type: Tag
  id: RUMCCraftedMagazine

- type: Tag
  id: RUMCCraftedCartridge

# ---------------------------------------------------------------- the bench

- type: entity
  parent: BaseItem
  id: RUMCGunsmithBenchKit
  name: gunsmith's bench kit
  suffix: Sapper
  description: A folded gunsmith's bench. Use it in hand to unfold it where you stand. Only someone trained as a sapper knows how.
  components:
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    state: icon
    scale: 0.5, 0.5
    color: "#5a6a4a"
  - type: Item
    size: Normal
  - type: SapperWorkbenchKit
    workbenchPrototype: RUMCGunsmithBench

- type: entity
  id: RUMCGunsmithBench
  name: gunsmith's bench
  suffix: Sapper
  description: A bench with a vice, a drill, calipers and a heavy handbook of strength of materials. Feed it ingots, sheets and powder, then design a weapon on paper, and it will only be as good as the sums behind it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
    color: "#5a6a4a"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable
  - type: Pullable
  - type: Appearance
  - type: GunsmithBench
  - type: ContainerContainer
    containers:
      gunsmith_weapon: !type:ContainerSlot {}
  - type: ActivatableUI
    key: enum.GunsmithUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GunsmithUiKey.Key:
        type: GunsmithBui
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# ---------------------------------------------------------------- the cartridge and its bullet

- type: entity
  parent: RMCBaseBullet
  id: RUMCCraftedBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 10
  - type: SolutionContainerManager
    solutions:
      ammo:
        maxVol: 20

- type: entity
  parent: BaseCartridge
  id: RUMCCraftedCartridge
  name: handmade cartridge
  description: A cartridge made at a gunsmith's bench.
  components:
  - type: Tag
    tags:
    - Cartridge
    - RUMCCraftedCartridge
  - type: CartridgeAmmo
    proto: RUMCCraftedBullet
    deleteOnSpawn: false
  - type: CraftedCartridge
  - type: Stack
    stackType: RUMCCraftedStackCartridge
    count: 1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

# ---------------------------------------------------------------- the weapons

# What every handmade weapon is, however it is fed.
- type: entity
  abstract: true
  parent: [ BaseItem, CMBaseWeaponGun, RMCBaseAttachableHolder ]
  id: RUMCCraftedFirearmCommon
  name: handmade firearm
  description: A firearm made at a gunsmith's bench.
  components:
  - type: CraftedFirearm
  - type: Sprite
    sprite: CMU14/Objects/Weapons/Gunsmith/parts.rsi
    layers:
    - state: pistol_rear
      map: [ "gunsmith_rear" ]
    - state: carbine_mid
      map: [ "gunsmith_mid" ]
    - state: carbine_front
      map: [ "gunsmith_front" ]
  - type: Item
    size: Large
  - type: Clothing
    slots:
    - suitStorage
    - Back
  - type: AmmoCounter
  - type: Wieldable
  - type: WieldDelay
    baseDelay: 0.5
  - type: WieldableSpeedModifiers
    base: 0.7
    light: 0.92
    medium: 0.87
    heavy: 0.87
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: CMM1984Shoot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 5
    scatterWielded: 8
    scatterUnwielded: 16
    baseFireRate: 1.0
    burstScatterMult: 4
  - type: Appearance
  - type: GunPointBlank
  - type: StaticPrice
    price: 400
  # The four sockets for attachments: those of a rifle, unless the weapon looks like a weapon of the game (then they are its own).
  - type: AttachableHolder
    randomAttachmentChance: 0
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        whitelist:
          tags:
          - RMCAttachmentM16Stock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentBipod
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlamer # TODO RMC14 advanced flamer
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentLaserSight
          - RMCAttachmentM203GrenadeLauncher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.81, -0.03
      rmc-aslot-rail: -0.15, 0.12
      rmc-aslot-stock: -0.5, 0
      rmc-aslot-underbarrel: 0.28, -0.33

# Fed from a magazine that is put in.
- type: entity
  abstract: true
  parent: [ RUMCCraftedFirearmCommon, RMCBaseWeaponGunMagazineProvider ]
  id: RUMCCraftedFirearmBase
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - RUMCCraftedMagazine
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: RMCAmmoEject
  - type: MagazineAmmoProvider
    autoEject: false

# Fed from inside, the way a shotgun is: the cartridges are put into it one by one. The inner magazine (BallisticAmmoProvider) is put on at the bench,
# by the template of the capacity (AU14CraftedFeedInternal*).
- type: entity
  abstract: true
  parent: RUMCCraftedFirearmCommon
  id: RUMCCraftedFirearmBaseInternal
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

# Fed from a cylinder, the way a revolver is (RevolverAmmoProvider, put on at the bench by AU14CraftedFeedRevolver*).
- type: entity
  abstract: true
  parent: RUMCCraftedFirearmCommon
  id: RUMCCraftedFirearmBaseRevolver
  components:
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container

