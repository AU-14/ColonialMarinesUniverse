# The ammunition bench and its kit; the projectiles and the cartridges with the armor penetration of the bullets it makes (the armor penetration
# of a projectile cannot be set on the fly, so there is a projectile for each step of it).

- type: entity
  parent: BaseItem
  id: RUMCAmmoBenchKit
  name: ammunition bench kit
  suffix: Sapper
  description: A folded ammunition bench. Use it in hand to unfold it where you stand. Only someone trained as a sapper knows how.
  components:
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    state: icon
    scale: 0.5, 0.5
    color: "#8a5a3a"
  - type: Item
    size: Normal
  - type: SapperWorkbenchKit
    workbenchPrototype: RUMCAmmoBench

- type: entity
  id: RUMCAmmoBench
  name: ammunition bench
  suffix: Sapper
  description: A bench with a mold, a press, a scale and a tank. Feed it ingots and powder, and pour the fuel of a flamethrower or any other liquid into the tank, then load cartridges the way you want them.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
    color: "#8a5a3a"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable
  - type: Pullable
  - type: Appearance
  - type: AmmoBench
  - type: SolutionContainerManager
    solutions:
      ammo_tank:
        maxVol: 500
  - type: ContainerContainer
    containers:
      ammo_item: !type:ContainerSlot {}
  - type: ActivatableUI
    key: enum.AmmoBenchUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AmmoBenchUiKey.Key:
        type: AmmoBenchBui
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

