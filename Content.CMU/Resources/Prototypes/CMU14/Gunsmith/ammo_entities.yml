# ---------------------------------------------------------------- shotgun shells: the cartridges of the shotgun calibers are shells, like the shells of the game

- type: entity
  abstract: true
  parent: BaseCartridge
  id: RUMCCraftedShellBase
  name: handmade shotgun shell
  description: A shotgun shell loaded at the ammunition bench.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Handfuls/shotgun_handfuls.rsi
    layers:
    - state: buckshot_shell_1
  - type: Item
    size: Small
  - type: Tag
    tags:
    - Cartridge
    - RMCShellShotgun
    - RUMCCraftedCartridge
  - type: CartridgeAmmo
    proto: RUMCCraftedBullet
    deleteOnSpawn: false
    soundEject:
      collection: ShellEject
    soundInsert:
      collection: CMShotgunLoad
  - type: CraftedCartridge
  - type: Appearance

- type: entity
