# The data of the gunsmith's bench: the materials (real values, a little rounded), the powders, the actions and some common cartridges.
# The player takes these numbers from the window of the bench and puts them into the formulas.

# ---------------------------------------------------------------- materials
# yieldMpa / ultimateMpa / enduranceMpa in MPa, youngGpa / shearGpa in GPa, densityGcm3 in g/cm3, specificHeat in J/(g K), limitTempC in C.
# volumeCm3 is how much metal one item of the stack gives.

- type: gunsmithMaterial
  id: GunsmithIron
  name: gunsmith-material-iron
  stackType: RUMCIronIngot
  volumeCm3: 120
  yieldMpa: 200
  ultimateMpa: 350
  enduranceMpa: 170
  youngGpa: 200
  shearGpa: 77
  densityGcm3: 7.8
  specificHeat: 0.45
  limitTempC: 700
  machinability: 0.9
  color: "#8a8a8f"

