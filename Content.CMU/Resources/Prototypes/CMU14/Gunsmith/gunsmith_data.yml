# ---------------------------------------------------------------- powders
# forceMpaCm3PerG: specific force f; covolumeCm3PerG: alpha; energyJPerG: Q; efficiency: the best share of Q that goes into the bullet.
# costPerGram is in items of saltpeter powder.

- type: gunsmithPowder
  id: GunsmithPowderBlack
  name: gunsmith-powder-black
  force: 220
  covolume: 0.62
  energy: 2700
  efficiency: 0.12
  costPerGram: 0.5

