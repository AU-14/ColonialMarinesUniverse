# Uranium: only as the tip of a bullet. A bullet with a uranium tip hurts like the uranium cartridges do: part of the damage comes as radiation.
- type: ammoMaterial
  id: AmmoMaterialUranium
  material: GunsmithUranium
  note: ammo-note-uranium
  parts:
    Tip: { damage: 1.05, armorPierce: 7, extra: { Radiation: 0.4 } }

# ---------------------------------------------------------------- liquids in the core of a bullet
# A liquid that is not listed here is carried and injected into whoever the bullet hits, like the chemicals of a dart.
#   ignite       the bullet sets the target on fire
#   inject       the liquid is injected
#   injectShare  the share of what the bullet carries that is injected
#   damageType / damagePerUnit   the damage the liquid does by itself for each unit the bullet carries

# The fuel of the flamethrowers.
- type: ammoPayload
  id: AmmoPayloadNapalm
  reagent: RMCNapalm
  ignite: true
  inject: false
  damageType: Heat
  damagePerUnit: 2.0
  note: ammo-note-fuel

