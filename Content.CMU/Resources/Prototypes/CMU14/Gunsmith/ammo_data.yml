# The data of the ammunition bench: what each material does when it is put into a part of a cartridge, and what each liquid does in a bullet.
# Based on the mod "CE Custom Ammo" (the bullet is made of a core, a jacket, a tip and a casing, and each material has its own effect on each
# of the parts it can be used for). A material that is not listed for a part cannot be put into it.
#
#   damage       the damage of the bullet is multiplied by this
#   armorPierce  armor penetration added
#   seal         (casing only) how well the casing keeps the gases in: the energy the powder gives the bullet is multiplied by this
#   jam          the chance that the cartridge fails to cycle
#   extra        damage of another type, as a share of the damage of the bullet

# ---------------------------------------------------------------- materials

# The differences are large, as they are in real life, but not past it: the energy of the bullet (its mass, the powder) does most of the damage, and the material
# the rest. A soft metal (lead) gives up all its energy to the target and expands: the most damage. A hard one (steel, tungsten) goes through: clearly less damage,
# much more penetration. A light one (aluminum, plastic, wood) has little mass and little strength. The casing keeps the gases in (seal) or lets them out.
- type: ammoMaterial
  id: AmmoMaterialLead
  material: GunsmithLead
  parts:
    Core: { damage: 1.0 }
    Jacket: { damage: 1.08, jam: 0.02 }
    Tip: { damage: 1.14, armorPierce: -3 }
    Casing: { seal: 0.85, jam: 0.04 }

