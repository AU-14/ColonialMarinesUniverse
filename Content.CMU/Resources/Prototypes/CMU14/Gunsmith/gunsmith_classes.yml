# The classes of weapons. A class says what a weapon of it can be: the bore and the powder of its cartridge (a caliber too big for a pistol is not a pistol's),
# the length of the barrel, the stock. The looks of the weapons of the game are each of a class, and so is a weapon made of parts, by choice.

- type: gunsmithClass
  id: GunsmithClassPistol
  name: gunsmith-class-pistol
  minBoreMm: 4.5
  maxBoreMm: 13.0
  maxChargeG: 3.5
  maxCaseLengthMm: 40
  minBarrelMm: 40
  maxBarrelMm: 260
