- type: htnCompound
  id: CMUThreatRoot
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    - !type:KeyExistsPrecondition
      key: TargetCoordinates
    tasks:
    - !type:HTNCompoundTask
      task: CMUThreatMelee
  - preconditions:
    - !type:KeyExistsPrecondition
      key: RallyCoordinates
    tasks:
    - !type:HTNCompoundTask
      task: CMUThreatRally
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

- type: htnCompound
  id: CMUThreatMelee
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: TargetCoordinates
        pathfindKey: TargetPathfind
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange

- type: htnCompound
  id: CMUThreatRally
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: RallyCoordinates
        pathfindKey: RallyPathfind
        rangeKey: RallyRange
