- type: entity
  parent: CMUThreatHumanBase
  id: CMUThreatCommon
  name: threat
  description: A frail member of the horde.
  components:
  - type: CMUThreat
    kind: Common
    detectionRadius: 12
  - type: CMUCommonThreat
    bilePriorityRadius: 18
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4
  - type: MeleeWeapon
    hidden: true
    attackRate: 1.2
    damage:
      types:
        Slash: 15

- type: entity
  parent: CMUThreatCommon
  id: CMUThreatCommonPolice
  name: police threat
  description: A fallen NSPA officer wearing heavy police protection.
  components:
  - type: Loadout
    prototypes:
    - CMUThreatPoliceOutfitCap
    - CMUThreatPoliceOutfitBeret
    - CMUThreatPoliceOutfitPeaked

- type: entity
  abstract: true
  parent: CMUThreatHumanBase
  id: CMUThreatSpecialBase
  components:
  - type: CMUThreat
    attackSound: null
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.5

- type: entity
  parent: CMUThreatSpecialBase
  id: CMUThreatHunter
  name: hunter
  description: A fast ambusher that pins isolated prey.
  components:
  - type: CMUThreat
    kind: Hunter
    eyeColor: "#dc143c"
    delimbChance: 0.15
  - type: CMUHunterThreat
    range: 8
    cooldown: 12
    telegraphTime: 0.6
    flightDuration: 0.8
    strength: 30
    impactDamage:
      types:
        Slash: 60
    pinDamage:
      types:
        Slash: 21
    pinDamageInterval: 1
    maxPinDuration: 15
    sound: !type:SoundCollectionSpecifier
      collection: CMMaleScreams
  - type: XenoLeap
    delay: 0
    range: 8
    strength: 30
    knockdownTime: 2
    leapSound: /Audio/_RMC14/Xeno/alien_pounce.ogg
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5.5

- type: entity
  parent: CMUThreatSpecialBase
  id: CMUThreatSmoker
  name: smoker
  description: Pulls distant prey into choking range.
  components:
  - type: CMUThreat
    kind: Smoker
    eyeColor: "#a0a0a0"
  - type: CMUSmokerThreat
    range: 8
    cooldown: 15
    pullSpeed: 3
    holdDistance: 1.25
    chokeDamage:
      types:
        Asphyxiation: 7.5
    chokeDamageInterval: 1
    maxPinDuration: 20
    smokePrototype: CMUSmokeGrenade
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3
    baseSprintSpeed: 4

- type: entity
  parent: CMUThreatSpecialBase
  id: CMUThreatBoomer
  name: boomer
  description: Covers prey in bile and bursts into a caustic cloud.
  components:
  - type: CMUThreat
    kind: Boomer
    eyeColor: "#32ff32"
  - type: CMUBoomerThreat
    range: 5
    coneDegrees: 70
    cooldown: 15
    bileDuration: 20
    hordeRadius: 18
    explosionRadius: 3
    explosionKnockback: 5
    acidCloudPrototype: CMUThreatBoomerAcidCloud
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3.4

- type: entity
  parent: CMUThreatSpecialBase
  id: CMUThreatScreamer
  name: screamer
  description: Calls a horde of weak threat from the ground.
  components:
  - type: CMUThreat
    kind: Screamer
    eyeColor: "#ff69b4"
  - type: CMUScreamerThreat
    cooldown: 35
    telegraphTime: 1.5
    hordeCount: 8
    spawnRadius: 4
    hordeTargetRadius: 18
    hordePrototypes:
    - CMUThreatCommon
    - CMUThreatCommonPolice
    emergenceDuration: 1.4
    sound: !type:SoundCollectionSpecifier
      collection: CMMaleScreams
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.3
    baseSprintSpeed: 4

- type: entity
  parent: CMUThreatDwarfBase
  id: CMUThreatJockey
  name: jockey
  description: A small threat that rides and steers its prey.
  components:
  - type: CMUThreat
    kind: Jockey
    eyeColor: "#ff8c00"
    attackSound: null
  - type: HideHealthBar
  - type: CMUJockeyThreat
    range: 4
    leapStrength: 22
    leapDuration: 0.6
    cooldown: 15
    pullSpeed: 2
    walkModifier: 0.7
    sprintModifier: 0.7
    rideDamage:
      types:
        Slash: 15
    damageInterval: 1
    maxPinDuration: 15
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5

- type: entity
  parent: CMUThreatSpecialBase
  id: CMUThreatSpitter
  name: spitter
  description: Spits spreading acid to deny an area.
  components:
  - type: CMUThreat
    kind: Spitter
    eyeColor: "#ffff33"
  - type: CMUSpitterThreat
    range: 8
    cooldown: 15
    projectilePrototype: CMUThreatSpitProjectile
    projectileSpeed: 8
    acidPoolPrototype: CMUThreatAcidPool
    acidRadius: 0.45
    acidDuration: 12
    acidDamage:
      types:
        Heat: 12
    acidDamageInterval: 1
  - type: MobThresholds
    thresholds:
      0: Alive
      125: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.2

- type: entity
  parent: CMUThreatSpecialBase
  id: CMUThreatWitch
  name: witch
  description: A dormant threat that erupts when disturbed.
  components:
  - type: CMUThreat
    kind: Witch
    detectionRadius: 12
    eyeColor: "#ffffff"
    delimbChance: 0.15
  - type: CMUWitchThreat
    irritationThreshold: 100
    noticeRadius: 4
    noticeGainPerSecond: 15
    damageGain: 100
    decayPerSecond: 8
    enrageSound: !type:SoundCollectionSpecifier
      collection: CMMaleScreams
  - type: MobThresholds
    thresholds:
      0: Alive
      700: Dead
  - type: MeleeWeapon
    hidden: true
    attackRate: 1.5
    damage:
      types:
        Slash: 37.5
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 6
