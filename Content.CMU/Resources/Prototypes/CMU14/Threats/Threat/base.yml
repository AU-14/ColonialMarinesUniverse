- type: npcFaction
  parent: THREAT
  id: CMUThreat

- type: entity
  id: FactionCMUThreat
  categories: [ HideSpawnMenu ]
  components:
  - type: IFFFaction

- type: entity
  abstract: true
  save: false
  id: CMUThreatMixin
  components:
  - type: CMUThreat
  - type: ThreatImmune
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomHumanoidAppearanceWhitelisted
    allowedEyeColorsHex: [ "#ff3030", "#32ff32", "#ffffff", "#a0a0a0", "#ff8c00", "#ffff33", "#dc143c", "#ff69b4" ]
  - type: Loadout
    prototypes:
    - CMUThreatCivilianOutfitWorkwear
    - CMUThreatCivilianOutfitBusiness
    - CMUThreatCivilianOutfitFlannel
    - CMUThreatCivilianOutfitFloral
    - CMUThreatCivilianOutfitColonist
    - CMUThreatCivilianOutfitPuffer
    - CMUThreatCivilianOutfitParka
    - CMUThreatCivilianOutfitTrench
  - type: NpcFactionMember
    factions:
    - CMUThreat
  - type: UserIFF
    factions:
    - FactionCMUThreat
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: CMUThreatRoot
    blackboard:
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      MeleeRange: !type:Single
        1.45
      RallyRange: !type:Single
        2
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    resistanceBypass: true
    soundSwing:
      path: /Audio/Weapons/slash.ogg
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 36
  - type: DamageImpactProfile
    melee:
      contact: Stab
      penetration: Forced
      energy: High

- type: entity
  abstract: true
  save: false
  parent: [ CMMobHuman, CMUThreatMixin ]
  id: CMUThreatHumanBase
  components:
  - type: MeleeWeapon
    soundSwing:
      path: /Audio/Weapons/slash.ogg
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 36

- type: entity
  abstract: true
  save: false
  parent: [ MobDwarf, CMUThreatMixin ]
  id: CMUThreatDwarfBase
  components:
  - type: MeleeWeapon
    soundSwing:
      path: /Audio/Weapons/slash.ogg
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 36
