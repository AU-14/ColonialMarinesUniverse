- type: entity
  save: false
  parent:
  - AppearanceYautja
  - CMMobHuman
  id: CMUMobYautjaYoungblood
  name: Yautja Youngblood
  suffix: Yautja, Youngblood, Event
  components:
  - type: CMUNoDragSuffocation
  # Why: without a VisualBodyComponent, SharedVisualBodySystem.ApplyProfileTo resolves nothing and returns silently, so
  # the applied profile never reaches the body organs. Hunters inherit it from CMUMobYautja; youngbloods parent the human
  # base and must declare it.
  - type: VisualBody
  # same queen sever cut as hunters, and youngbloods don't even regrow
  - type: XenoMeleeSeverResistance
    chanceMultiplier: 0.25
  - type: YautjaVitalsWarning
  - type: Language
    spokenLanguages:
    - Yautja
    - Xeno
    understoodLanguages:
    - Yautja
    - Xeno
    currentLanguage: Yautja
    defaultLanguage: Yautja
