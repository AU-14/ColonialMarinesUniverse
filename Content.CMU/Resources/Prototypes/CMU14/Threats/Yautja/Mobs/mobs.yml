    clanRank: YoungBlood
  - type: Hands
    throwRange: 14
  - type: YautjaYoungblood
  - type: Satiation
    satiations:
      Hunger:
        prototype: CMUYautjaHunger
      Thirst:
        prototype: CMUYautjaThirst
  - type: IgnoreXenoWeedsSlowdown
  - type: SlowOnPull
    multiplier: 1
    slowdowns: []
  - type: Skills
    preset: CMUSkillPresetYautjaWarrior
  - type: Icon
    sprite: CMU14/Yautja/body.rsi
    state: full
  - type: FixedIdentity
    name: species-name-yautja
  - type: Speech
    speechSounds: CMUYautjaSpeech
    allowedEmotes:
    - Scream
    - Laugh
    - Growl
    - Warcry
    - CMUYautjaClick
    - CMUYautjaRoar
    - CMUYautjaLaugh
    - CMUYautjaGrowl
    - CMUYautjaPain
    - CMUYautjaDeathCry
    - CMUYautjaDeathLaugh
  # CMU14: as on CMUMobYautja - the youngblood declares its own Vocal because it does not inherit that mob, and it
  # must not grant the hotbar Scream action either: emoteAction null means VocalSystem grants no action for it.
  - type: Vocal
