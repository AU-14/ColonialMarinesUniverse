- type: entity
  save: false
  parent: [AppearanceYautja, CMMobHuman]
  id: CMUMobYautja
  name: Yautja Hunter
  suffix: Yautja, Event
  components:
  - type: Satiation
    satiations:
      Hunger:
        prototype: CMUYautjaHunger
      Thirst:
        prototype: CMUYautjaThirst
  - type: Language
    spokenLanguages:
    - Yautja
    - Xeno
    understoodLanguages:
    - Yautja
    - Xeno
    currentLanguage: Yautja
    defaultLanguage: Yautja
  - type: Yautja
  # cmss13 /datum/pain/yautja ignores a hostile xeno dragging them in crit
  - type: CMUNoDragSuffocation
  # cmss13 YAUTJA_SLOWED_AMOUNT / YAUTJA_SUPERSLOWED_AMOUNT take most of the human slow off preds (+0.75 / +1 move
  # delay instead of +2 / +4). without this they got the full marine slow from CMMobHuman
  - type: RMCSpeciesSlowdownModifier
    slowModifier: 0.75
    superSlowModifier: 1
  # CMU14: Yautja throw further than a human. ThrowHeldItem clamps the throw distance to HandsComponent.ThrowRange
  # (human default 8) or the item's ItemThrowRange, and then throws with compensateFriction, so the object stops on the
  # target
  # Why: ThrowHeldItem clamps the throw distance to HandsComponent.ThrowRange (human default 8) or the item's
  # ItemThrowRange, then throws with compensateFriction so the object stops on the target - the range is what lets a
  # distant cursor actually be reached.
  - type: Hands
    throwRange: 14
  - type: YautjaLimbRegeneration
    requiredSeverAttempts: 2
    severAttemptWindow: 30
    regrowDelay: 300
  # the queen rolls 40% a hit to take a limb, which shredded hunters. a quarter of that here
  - type: XenoMeleeSeverResistance
    chanceMultiplier: 0.25
  # no crit grace, cmss13 preds drop the tick they cross crit. this beeps first so they know to SD
  - type: YautjaVitalsWarning
  - type: TacticalMapTracked
    trackDead: true
  - type: YautjaMapTracked
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: leader
  - type: TacticalMapUser
    actionId: CMUActionYautjaOpenTacticalMap
    liveUpdate: true
  - type: UserInterface
    interfaces:
      enum.TacticalMapUserUi.Key:
        type: TacticalMapUserBui
  - type: IgnoreXenoWeedsSlowdown
  # human base slows the puller by the target's weight, preds drag anything at full speed
  - type: SlowOnPull
    multiplier: 1
    slowdowns: []
  - type: Skills
    preset: CMUSkillPresetYautjaWarrior
  - type: Loadout
    prototypes:
    - CMUYautjaHunterSpawnGear
  - type: Icon
    sprite: CMU14/Yautja/body.rsi
    state: full
  - type: FixedIdentity
    name: species-name-yautja
  - type: Speech
    speechSounds: CMUYautjaSpeech
    allowedEmotes:
    - Scream
    - Laugh
    - Growl
    - Warcry
    - CMUYautjaClick
    - CMUYautjaRoar
    - CMUYautjaLaugh
    - CMUYautjaGrowl
    - CMUYautjaPain
    - CMUYautjaDistract
    - CMUYautjaDeathCry
    - CMUYautjaDeathLaugh
  - type: Vocal
    emoteAction: null
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 0
    animation: WeaponArcFist
    attackRate: 1.15
    damage:
      types:
        Blunt: 12
        Structural: 3
  - type: Damageable
    damageModifierSet: CMUYautja
  # cmss13 armour deflection zeroes anything below armour*2, and the 0.28 species mod lands first,
  # so most hits on armoured limbs did nothing. a big mult turns deflection into a sliver off the top
  - type: RMCArmorModifier
    meleeArmorModifier: 100
    rangedArmorModifier: 100
  - type: Injurable
    damageContainer: Biological
    healthBarThreshold: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CMUYautjaBlood
        Quantity: 650
    maxBleedAmount: 35
    bleedReductionAmount: 0
    bloodRefreshAmount: 0.2
    bloodlossDamage:
      types:
        Bloodloss: 0.35
    bloodlossHealDamage:
      types:
        Bloodloss: -1
    damageBleedModifiers: CMBloodlossHuman
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.2
    baseSprintSpeed: 8.0
  # preds shrug off cold, without this their open gear lets them cool to room temp and read hypothermic.
  # heating is left alone so fire still cooks them
  - type: TemperatureProtection
    coolingCoefficient: 0.1
  # cmss13 /datum/pain/yautja: nothing until horrible, and horrible only gives the distressing slowdown
  - type: PainShock
    minimumFeltTier: Shock
    maximumFeltTier: Severe
  - type: MobThresholds
    thresholds:
      0: Alive
      240: Critical
      340: Dead
  - type: MaxDamage
    max: 900
  - type: EmoteOnDamage
    emotes:
    - CMUYautjaPain
    emoteCooldown: 8
    hiddenFromChatWindow: true
  - type: MotionDetectorTracked
  # a recovered hunter body is worth as much intel as a queen's
  - type: IntelRecoverCorpseObjectiveOnDeath
    value: 1.4

