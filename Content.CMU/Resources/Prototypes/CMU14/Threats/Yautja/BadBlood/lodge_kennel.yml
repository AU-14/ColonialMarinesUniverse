# Lodge part: the kennel. Deployed with the Lodge and removed with it. A free hound spawner, like RMC's lesser-drone
# pylon: 2 hounds on offer at pitch, one more every 2 minutes, up to 2 or one per 2 living Bad Bloods. The armory's
# kennel wares (lodge_armory.yml) speed it up and raise the floor.
- type: entity
  parent: CMUYautjaStructureBase
  id: CMUBadBloodCampKennel
  name: Lodge kennel
  description: A slatted livestock crate dragged out of the prey's colony, its bars gnawed from the inside. The clan's hounds sleep here until they are called.
  suffix: Bad Blood
  components:
  # the upstream livestock crate: the only animal cage in the tree that is not a hamster cage or a pet carrier
  - type: Sprite
    sprite: Structures/Storage/Crates/livestock.rsi
    drawdepth: Objects
    layers:
    - state: base
    - state: closed
  - type: Icon
    sprite: Structures/Storage/Crates/livestock.rsi
    state: base
  - type: BadBloodCampPart
    kind: Kennel
  # ARCH-603: the stock. BadBloodCampSystem.Kennel.cs sets the takeovers on the spawner below
  - type: BadBloodKennelSpawner
    minStock: 2
    badBloodsPerHound: 2
    interval: 120
    reservePriority: 60
  - type: GhostRole
    name: cmu-bad-blood-kennel-ghost-name
    description: cmu-bad-blood-kennel-ghost-description
    rules: cmu-bad-blood-hound-ghost-rules
    # like the squad seats: a job and the threat mind role, so the hound counts as part of the clan's threat
    job: CMUYautjaHellhound
    mindRoles:
    - MindRoleThreat
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: CMUMobYautjaBadBloodHound
    deleteOnSpawn: false
  # CMU14 STATE-702 / ARCH-707: the kennel is also the Beast-Master's vendor (the Lodge's 3x3 is full). Ghosts take
  # hounds through the ghost-role menu, not by using the kennel, so the vendor window does not get in their way.
  # Sold for the buyer's own Honour like the clan's armory: war-paint for the kennel's hounds, and thrall cages, each
  # stocking one thrall a ghost takes here (beasts.yml). A Beast-Master keeps at most two thralls, and thralls count
  # against the clan's threat budget
  - type: UserInterface
    interfaces:
      enum.CMAutomatedVendorUI.Key:
        type: CMAutomatedVendorBui
        interactionRange: 2.5
  - type: ActivatableUI
    key: enum.CMAutomatedVendorUI.Key
  - type: BadBloodCampArmory
    pointsType: BadBloodSp
    requiredCaste: BeastMaster
    tiers:
      CMUBadBloodKennelWarPaint: 1
      CMUBadBloodThrallCageRunner: 2
      CMUBadBloodThrallCageDefender: 2
      CMUBadBloodThrallCageSentinel: 3
      CMUBadBloodThrallCageLurker: 3
      CMUBadBloodThrallCageWarrior: 3
      CMUBadBloodThrallCageSpitter: 3
  - type: CMAutomatedVendor
    uiStyle: Yautja
    pointsType: BadBloodSp
    scaling: false
    sections:
    - name: Kennel
      entries:
      - id: CMUBadBloodKennelWarPaint
        name: War-paint (kennel hounds bite 15% harder, once)
        points: 3
    - name: Thrall Cages (tier II)
      entries:
      - id: CMUBadBloodThrallCageRunner
        name: Runner Cage
        points: 6
      - id: CMUBadBloodThrallCageDefender
        name: Defender Cage
        points: 7
    - name: Thrall Cages (tier III)
      entries:
      - id: CMUBadBloodThrallCageSentinel
        name: Sentinel Cage
        points: 8
      - id: CMUBadBloodThrallCageLurker
        name: Lurker Cage
        points: 9
      - id: CMUBadBloodThrallCageWarrior
        name: Warrior Cage
        points: 10
      - id: CMUBadBloodThrallCageSpitter
        name: Spitter Cage
        points: 10

# CMU14 STATE-702: not a thing to carry. Buying it war-paints the standing kennel: its living hounds and every hound it
# lets out bite 15% harder. The kennel's vendor deletes this placeholder
- type: entity
  id: CMUBadBloodKennelWarPaint
  name: war-paint
  description: The kennel's hounds are daubed in the clan's colours and bite harder for it.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: CMU14/HunterShip/mob/humans/onmob/hunter/hellhound.rsi
    state: "Normal_Hellhound_Sleeping"
  - type: BadBloodWarPaintWare
    multiplier: 1.15
