# Bad Blood Clan — dishonored Yautja hunters. Distress Signal only.
- type: lorePrimer
  id: AU14PrimerThreatBadBlood
  threattext: "You are a Bad Blood — a dishonored Yautja cast out from your clan. You are no longer bound by the code. Hunt everything."
  KnowledgeLevelsGovforThreat:
    "Threat Unknown": 1
    "Anomalous cloaked contacts detected. Something is hunting us.": 2
    "Yautja confirmed in AO. Expect plasma casters, cloaking technology, and wrist blades.": 3

# Base: 1 leader + 3 grunts. Scales at 1:20 (one extra grunt per 20 players above 40).
- type: threat
  id: BadBloodClanThreat
  lorePrimer: AU14PrimerThreatBadBlood
  roundstartspawns: badBloodClanParty
  whitelistedGamemodes:
  - DistressSignal
  blacklistedGamemodes:
  - ColonyFall
  jobScaling: DefaultDistressScale
  spawnExtraVoteMembers: false
  # No honourable hunt on a Bad Blood round: off the ballot while it is queued, and it stands down if we win.
  blockedGameRules:
  - CMUYautjaPredatorRound
  winconditions:
  - KillAllGovforRule
  # the clan state: Superiority Points, the Leader, the Lodge. It is also the end rule: marines win when the
  # Leader is gone and no Lodge stands, the clan wins if the Lodge outlasts the clan ship (no KillAllYautjaRule)
  - CMUBadBloodCampRule
  # leftover threat voters wait in the Blood Reserve instead of being sent back to the lobby
  reserveLeftoverVoters: true
  minplayers: 30

- type: partySpawn
  id: badBloodClanParty
  leadersToSpawn:
    CMUMobYautjaBadBloodLeader: 1
  gruntsToSpawn:
    CMUMobYautjaBadBloodGrunt: 3
  scaling:
    CMUMobYautjaBadBloodGrunt:
      scale: 0.05
      whenToBeginScaling: 40
  spawnTogether: true
