# Bad Blood copies of honourable gear that the Lodge armory sells (lodge_armory.yml). The honourable prototypes keep
# their values: whatever would be too strong in a Bad Blood's hands is cut down here and sold in its place.

# the hunters' spike is 30 piercing through 50 armor. the clan's is filed down from scrap: 22 through 30.
# it keeps the spike's bite on walls and barricades
- type: entity
  parent: CMUYautjaSpikeProjectile
  id: CMUBadBloodScavengedSpike
  name: scrap spike
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 22
  - type: CMArmorPiercing
    amount: 30

# half the magazine (6 for 12) and half the recharge (a spike every 20 s for every 10 s), firing the scrap spike.
# a ranged weapon that reloads itself must not stand in for the plasma caster
- type: entity
  parent: CMUYautjaSpikeLauncher
  id: CMUBadBloodScavengedSpikeLauncher
  name: scavenged spike launcher
  description: A spike launcher with a cracked housing and a magazine patched from scrap. It holds half of what it should and recharges slowly.
  suffix: Bad Blood
  components:
  - type: BadBloodGearLock
  - type: BasicEntityAmmoProvider
    proto: CMUBadBloodScavengedSpike
    capacity: 6
    count: 6
  - type: YautjaSpikeLauncher
    rechargeCooldown: 20
    rechargeSound: null

# ARCH-02 weapon tiers: starter (the bracer weapon picked on landing) -> forged (tier II, the forge ware below) ->
# golden (tier III, the gilded war glaive and the golden ancient shield).

# tier II: not a thing to carry. Buying it forges the buyer's bracer weapon in place (BadBloodForged: +20% damage)
# and the armory deletes this placeholder
- type: entity
  id: CMUBadBloodForgeUpgrade
  name: forged bracer weapon
  description: The clan's forge reworks your bracer weapon. It hits a fifth harder from now on.
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: CMU14/Yautja/actions.rsi
    state: bracer_framed
  - type: BadBloodForgeUpgrade
    multiplier: 1.2

# tier III, golden: the clan's blessed weapons. Like the hunters' blessed relics they wear their own sprite in gold
# (#ffd65c); the glaive keeps the ancient art. Each hits about a quarter harder than the weapon it copies.
- type: entity
  parent: CMUYautjaWarGlaive
  id: CMUBadBloodBlessedWarGlaive
  name: blessed war glaive
  description: An ancient war glaive, its acid-scarred blades reforged and blessed in gold by the clan. Few hunters ever carry one.
  suffix: Bad Blood
  components:
  - type: BadBloodGearLock
  - type: Sprite
    color: "#ffd65c"
    state: ancient_war_glaive
  - type: MeleeWeapon
    damage:
      types:
        Slash: 20
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 40
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 20

