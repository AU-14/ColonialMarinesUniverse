# Bad Bloods can only digest prey cooked at the Lodge spit, and pills so they can still take medicine
- type: entity
  parent: CMUOrganHumanStomach
  id: CMUOrganYautjaBadBloodStomach
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - CMUYautjaPreyCooked
      - Pill

# everything the Bad Blood mobs share for survival. honourable hunters stay on CMUMobYautja
- type: entity
  abstract: true
  save: false
  parent: CMUMobYautja
  id: CMUMobYautjaBadBloodBase
  components:
  - type: Damageable
    damageModifierSet: CMUYautjaBadBlood
  # ECS-608: tougher than an honourable hunter (240 / 340), so closing in to fight is survivable. Overriding
  # thresholds replaces the whole map, so this is CMUMobYautja's full list with the numbers raised
  - type: MobThresholds
    thresholds:
      0: Alive
      280: Critical
      380: Dead
  # overriding organs replaces the whole map, so this is AppearanceYautja's list with the stomach swapped
  - type: InitialBody
    organs:
      Torso: CMUPartYautjaTorso
      Head: CMUPartYautjaHead
      ArmLeft: CMUPartYautjaLeftArm
      ArmRight: CMUPartYautjaRightArm
      HandRight: CMUPartYautjaRightHand
      HandLeft: CMUPartYautjaLeftHand
      LegLeft: CMUPartYautjaLeftLeg
      LegRight: CMUPartYautjaRightLeg
      FootLeft: CMUPartYautjaLeftFoot
      FootRight: CMUPartYautjaRightFoot
      Brain: CMUOrganHumanBrain
      Eyes: CMUOrganHumanEyes
      Lungs: CMUOrganHumanLungs
      Heart: CMUOrganHumanHeart
      Stomach: CMUOrganYautjaBadBloodStomach
      Liver: CMUOrganHumanLiver
      Kidneys: CMUOrganHumanKidneys
  - type: Satiation
    satiations:
      Hunger:
        prototype: CMUYautjaBadBloodHunger
      Thirst:
        prototype: CMUYautjaBadBloodThirst
  - type: SatiationSpeedModifier
    satiations:
      Hunger:
        thresholds:
          Peckish: 0.85
          Starving: 0.6
      Thirst:
        thresholds:
          Thirsty: 0.85
          Parched: 0.6
  - type: SatiationDamage
    satiations:
      Hunger:
        thresholds:
          Starving:
            types:
              Blunt: 0.15
      Thirst:
        thresholds:
          Parched:
            types:
              Blunt: 0.15
  - type: BadBloodSurvival
  # CMU14 (Playtest 5 follow-up): a Bad Blood understands the clan's hounds (Beast) as well as Yautja and the
  # thralls' Xeno. It speaks as every Yautja does
  - type: Language
    spokenLanguages:
    - Yautja
    - Xeno
    understoodLanguages:
    - Yautja
    - Xeno
    - Beast
    currentLanguage: Yautja
    defaultLanguage: Yautja
  # CMU14 COUPLING-704: a xeno dragging a downed Bad Blood chokes it (RMC's species base), but the clan's own beasts
  # drag their downed clanmates to safety. Every RMC xeno carries LarvaQueueable (base_xeno.yml); clan hounds never
  # had it and thralls strip it (beasts.yml), so requiring both spares the clan's beasts and no hostile xeno
  - type: DamageOnPulledWhileCrit
    pullerWhitelist:
      requireAll: true
      components:
      - Xeno
      - LarvaQueueable
  # xeno-rate damage against vehicle hulls, so a crewed tank or APC is not untouchable for the clan
  - type: VehicleDamageMultiplier
    multiplier: 3
