# Bad Blood-only gear variants. The scavenged bracer installs these, so the honourable hunters' gear stays as it is.

# every mode drains its own cost per shot. the honourable caster stores the cost of the last mode switch instead
- type: entity
  parent: CMUYautjaPlasmaCasterCrimson
  id: CMUYautjaBadBloodPlasmaCaster
  suffix: Bad Blood
  components:
  - type: BadBloodGearLock
  - type: YautjaCaster
    # use in hand steps through every mode the carrier has earned, so a bought lethal bolt and eradicator show up
    cycleEarnedModes: true
    modes:
    - name: cmu-yautja-caster-mode-stun
      projectile: CMUYautjaBadBloodCasterStunBolt
      examineStrength: cmu-yautja-caster-mode-stun
      fireRate: 0.5
      powerCost: 80
      fireSound:
        path: /Audio/CMU14/Yautja/Weapons/Plasma/pred_plasmacaster_fire.wav
    - name: cmu-yautja-caster-mode-immobilizer
      projectile: CMUYautjaBadBloodCasterImmobilizerBolt
      examineStrength: cmu-yautja-caster-mode-immobilizer
      fireRate: 0.058824 # one every 17 s
      powerCost: 300
      fireSound:
        path: /Audio/CMU14/Yautja/Weapons/Plasma/pulse.wav
    - name: cmu-yautja-caster-mode-lethal
      projectile: CMUYautjaBadBloodCasterPlasmaBolt
      examineStrength: cmu-yautja-caster-mode-lethal
      fireRate: 0.083333 # one every 12 s, so a Bad Blood cannot chain lethal bolts
      powerCost: 150
      fireSound:
        path: /Audio/CMU14/Yautja/Weapons/Plasma/pred_lasercannon.wav
    - name: cmu-yautja-caster-mode-eradicator
      projectile: CMUYautjaBadBloodCasterEradicatorBolt
      examineStrength: cmu-yautja-caster-mode-eradicator
      fireRate: 0.071429 # one every 14 s
      powerCost: 1500
      fireSound:
        path: /Audio/CMU14/Yautja/Weapons/Plasma/pulse.wav

# The Bad Blood caster's own bolts. The hunters' bolts stay as they are.
# Range by mode, closer for control: stun and immobilizer fly 7 tiles, lethal and eradicator 12, all short of the
# hunters' 20-22, so a Bad Blood has to close in to use its caster. BadBloodValueSheetTest pins each mode.

# 3 s on anyone, no extra second on humans. diminishing returns (COUPLING-601): for the stun plus 6 s afterwards a
# target only takes a 2 s slow from a Bad Blood stun or immobilizer bolt
- type: entity
  parent: CMUYautjaCasterStunBolt
  id: CMUYautjaBadBloodCasterStunBolt
  categories: [HideSpawnMenu]
  components:
  - type: YautjaCasterStunProjectile
    stunTime: 3
    humanBonusStunTime: 0
    immunityWindow: 6
    immuneSlow: 2
  - type: ProjectileMaxRange
    max: 7

# radius 4 for 3 s, with the stun bolt's diminishing returns
- type: entity
  parent: CMUYautjaCasterImmobilizerBolt
  id: CMUYautjaBadBloodCasterImmobilizerBolt
  categories: [HideSpawnMenu]
  components:
  - type: YautjaCasterImmobilizerProjectile
    stunRange: 4
    stunTime: 3
    immunityWindow: 6
    immuneSlow: 2
  - type: ProjectileMaxRange
    max: 7

# the hunters' lethal bolt at 68 Heat instead of 75 and a smaller blast (45 instead of 50), flying only 12 tiles.
# VehicleDamageMultiplier: vehicles' RequireProjectileTarget always lets it hit (alwaysHitWhitelist), and the
# hardpoint combat damage takes the multiplier from the bolt, so the lethal bolt reliably hurts vehicles
- type: entity
  parent: CMUYautjaCasterLethalBolt
  id: CMUYautjaBadBloodCasterPlasmaBolt
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    impactEffect: null
    damage:
      types:
        Heat: 68
  - type: Explosive
    explosionType: CMUYautjaCasterExplosion
    maxIntensity: 45
    intensitySlope: 6
    totalIntensity: 45
    maxTileBreak: 2
  - type: ProjectileMaxRange
    max: 12
  - type: VehicleDamageMultiplier
    multiplier: 3

# the hunters' eradicator bolt at 50 Heat instead of 55, capped at 12 tiles like the lethal bolt.
# hits and hurts vehicles like the lethal bolt above
- type: entity
  parent: CMUYautjaCasterEradicatorBolt
  id: CMUYautjaBadBloodCasterEradicatorBolt
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    impactEffect: null
    damage:
      types:
        Heat: 50
  - type: ProjectileMaxRange
    max: 12
  - type: VehicleDamageMultiplier
    multiplier: 3

# structure-only Breaching: the boost only lands on things flagged Breaching (barricades, doors, windows), never on mobs
# Bad Blood melee (ECS-604/607/609, STATE-603): about a quarter harder than the honourable weapon, sharper against
# marines (penetration 50 / strip 0.004 against the honourable 40 / 0.01), a short stagger on a living human, 10
# bracer charge back per hit on one, and +1 Honour when a marked worthy target dies within 5 s (camp_rule.yml).
# only damage is overridden in MeleeWeapon, so attack rate, animation and sounds stay inherited. the Lodge forge
# (BadBloodForgeUpgrade) still multiplies the damage
- type: entity
  parent: CMUYautjaWristBlades
  id: CMUYautjaBadBloodWristBlades
  suffix: Bad Blood
  components:
  - type: BadBloodGearLock
  - type: MeleeWeapon
    damage:
      types:
        Slash: 24
  - type: YautjaHumanMelee
    penetration: 50
    stripChancePerArmor: 0.004
  - type: BadBloodMelee
    staggerSlow: 0.8
    staggerCooldown: 2
    chargeRefund: 10
  - type: DamageBoosts
    boosts:
    - flags: Breaching
      damage:
        types:
          Blunt: 25

- type: entity
  parent: CMUYautjaScimitar
  id: CMUYautjaBadBloodScimitar
  suffix: Bad Blood
  components:
  - type: BadBloodGearLock
  - type: MeleeWeapon
    damage:
      types:
        Slash: 32
  - type: YautjaHumanMelee
    penetration: 50
    stripChancePerArmor: 0.004
  - type: BadBloodMelee
    staggerSlow: 1.5
    staggerCooldown: 2.5
    chargeRefund: 10
  - type: DamageBoosts
    boosts:
    - flags: Breaching
      damage:
        types:
          Blunt: 45

- type: entity
  parent: CMUYautjaChainGauntlet
  id: CMUYautjaBadBloodChainGauntlet
  suffix: Bad Blood
  components:
  - type: BadBloodGearLock
  # the stamina damage (StaminaDamageOnHit 15) stays inherited
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 24
  - type: YautjaHumanMelee
    penetration: 50
    stripChancePerArmor: 0.004
  - type: BadBloodMelee
    staggerSlow: 1.2
    staggerCooldown: 2
    chargeRefund: 10
  - type: DamageBoosts
    boosts:
    - flags: Breaching
      damage:
        types:
          Blunt: 45
