# The Bad Blood clan's state for the round: Superiority Points, ledgers, the Leader, the Lodge, Totems and the ship.
# Started with the threat through BadBloodClanThreat winconditions. Every number of the loop is a field here.
- type: entity
  parent: BaseGameRule
  id: CMUBadBloodCampRule
  name: Bad Blood Clan
  description: Tracks the Bad Blood clan, its Lodge and its Superiority Points.
  components:
  - type: BadBloodCampRule
    tierTwoLifetimeSp: 12
    tierThreeLifetimeSp: 30
    totemTierCredit: 0.5
    offeringSp: 1
    maxOfferingsPerBody: 2
    corpseCookSp: 3
    meatCookSp: 0.5
    cookSpCapPerBody: 3
    # reinforcement tiers: 1, 3 and 5 grunts
    squadOfOneCost: 7
    squadOfThreeCost: 16
    squadOfFiveCost: 24
    lastStandCost: 12
    houndCost: 6
    totemCost: 3
    livingCapBonus: 3
    # 0.3: the bigger landing (5 + 3 sleeping hounds) still leaves the clan room to buy reinforcements at 30-40 players
    threatBudgetFraction: 0.3
    landingHoundDivisor: 2 # rounded up: a landing party of 5 brings 3 hounds
    houndCapDivisor: 2
    houndCapBonus: 1
    foundingSquadBase: 1
    foundingSquadDivisor: 2
    lastStandSeats: 2
    deadPriorityWindow: 30
    leaderSsdTimeout: 300
    campRebuildCooldown: 300
    foundingGrace: 900
    campLandingZoneDistance: 25
    voteDuration: 60
    votePerCandidate: 10
    voteMaxDuration: 120
    reserveChoiceTime: 20
    seatRaffleTime: 15
    squadSpawnTimeout: 60
    clanWipeDelay: 120
    totemLimit: 3
    totemLimitHighPop: 4
    totemHighPopPlayers: 80
    ripeTotemsForCall: 3
    ripeHoldForCall: 600
    shipEarliestCall: 2700
    shipInboundTime: 1200
    summonInterval: 60
    shipRegenBonus: 0.25
    departureTime: 1200
  # the end rule's decision and its absence ledger. BadBloodCampRuleSystem.End.cs
  - type: BadBloodCampEnd
  # the marine objective chain: infrastructure gate, clan signature, uplink. BadBloodObjectiveChainSystem
  - type: BadBloodObjectiveChain
    reactorHold: 300
    gatePartsRequired: 2
    totemSurveyTime: 75
    lodgeSurveyTime: 75
    bracerStepTime: 5
    fieldRelayCrate: CMUCrateBadBloodFieldRelay
    fieldRelayCost: 1500
    fieldRelayCategory: Research
  # the Vessel Strike fired from a GOVFOR overwatch console after the uplink. BadBloodVesselStrikeSystem
  - type: BadBloodVesselStrike
    duration: 1080
    sabotagePenalty: 60
    rerouteTime: 30
    repairImmunity: 180
    cancelLockout: 300
    authorizedJobs: [ AU14JobGOVFORPlatCo, AU14JobGOVFORPlatCoCMBCIU, AU14JobGOVFORPlatCoRMC, AU14JobGOVFORPlatCoUPP, AU14JobGOVFORPlatCoWYPMC, AU14JobGOVFORAdjutant, AU14JobGOVFORAdjutantCMBCIU, AU14JobGOVFORAdjutantRMC, AU14JobGOVFORAdjutantUPP, AU14JobGOVFORAdjutantWYPMC, AU14JobGOVFORPlatOp, AU14JobGOVFORPlatOpRMC, AU14JobGOVFORPlatOpUPP, AU14JobGOVFORPlatOpWYPMC ]
  # the shipside counter: a Bad Blood at the strike console cancels a running strike. BadBloodStrikeSabotageSystem
  - type: BadBloodShipsideCounter
    sabotageDoAfter: 30
    announceOnStart: true
