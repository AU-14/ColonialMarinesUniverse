# --- graphs ---

# a dead end so the parents' girder/metal-refund graphs don't apply
- type: constructionGraph
  id: CMUYautjaLodgeStatic
  start: static
  graph:
  - node: static

- type: constructionGraph
  parent: RMC
  id: CMUYautjaBrazier
  start: frame
  graph:
  - node: frame
    entity: CMUYautjaBrazierFrame
    edges:
    - to: brazier
      steps:
      - material: RMCWood
        amount: 5
        doAfter: 2

  - node: brazier
    entity: CMUYautjaBrazier
