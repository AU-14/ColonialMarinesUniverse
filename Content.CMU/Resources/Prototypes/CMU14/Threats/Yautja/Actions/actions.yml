- type: entity
  parent: CMUYautjaActionBase
  id: CMUActionYautjaLeap
  name: Leap
  description: Leap to a target location.
  components:
  - type: Action
    useDelay: 15
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Yautja.YautjaLeapActionEvent
  - type: Sprite
    layers:
    - sprite: CMU14/Yautja/actions.rsi
      state: leap_framed
      map: [enum.ActionVisuals.Icon]

- type: entity
  parent: ActionXenoBase
  id: CMUActionYautjaHellhoundGorge
  name: Gorge
  description: Pounce and gore prey with your spikes.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:XenoLeapActionEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: headbite
      map: [enum.ActionVisuals.Icon]
- type: entity
  parent: ActionXenoBase
  id: CMUActionYautjaHellhoundSenseOwner
  name: Find Owner
  description: Sniff out your Yautja handler.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Yautja.YautjaHellhoundSenseOwnerActionEvent
  - type: ActionBlockIfResting

  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: mark_hosts
      map: [enum.ActionVisuals.Icon]
- type: entity
  parent: CMUYautjaActionBase
  id: CMUActionYautjaMarkForHunt
  name: Mark for Hunt
  description: Mark a target for the hunt.
  components:
  - type: Action
    raiseOnUser: true
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    toggleOutline: false
    event: !type:Content.Shared.CMU14.Yautja.YautjaMarkForHuntActionEvent
  - type: Sprite
    layers:
    - sprite: CMU14/Yautja/actions.rsi
      state: mark_for_hunt_framed
      map: [enum.ActionVisuals.Icon]
