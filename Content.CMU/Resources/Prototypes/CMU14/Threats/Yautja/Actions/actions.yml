  id: CMUActionYautjaAddTrackedItem
  name: Add Tracked Item
  description: Add an item to the tracked gear list.
  components:
  - type: Action
  - type: InstantAction
    event: !type:Content.Shared.CMU14.Yautja.YautjaAddTrackedItemActionEvent
  - type: YautjaPowerAction
    cost: 0

  - type: Sprite
    layers:
    - sprite: CMU14/Yautja/actions.rsi
      state: bracer_framed
      map: [enum.ActionVisuals.Icon]
