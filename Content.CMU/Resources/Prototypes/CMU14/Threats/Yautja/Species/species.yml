- type: species
  id: Yautja
  name: species-name-yautja
  roundStart: false
  prototype: CMUMobYautja
  maleFirstNames: CMUNamesYautjaFirst
  femaleFirstNames: CMUNamesYautjaFirst
  lastNames: CMUNamesYautjaLast
  naming: FirstLast
  defaultSkinTone: "#ffffff"
  dollPrototype: AppearanceYautja
  skinColoration: Hues
  sexes:
  - Male
  - Female
  defaultSoundsBySex:
  - CMUMaleYautja
  - CMUFemaleYautja
  - CMUMaleYautja
  voices:
  - CMUMaleYautja
  - CMUFemaleYautja
  minAge: 100
  youngAge: 200
  oldAge: 600
  maxAge: 1200

- type: markingsGroup
  id: Yautja
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: true
      default: [ CMUYautjaDreadlocksStandard ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceYautja
  categories: [ HideSpawnMenu ]
  name: yautja appearance
  components:
  - type: NightVision
    state: Half
    innate: true
    drawVisibleMobs: false
  - type: InitialBody
    organs:
      Torso: CMUPartYautjaTorso
      Head: CMUPartYautjaHead
      ArmLeft: CMUPartYautjaLeftArm
      ArmRight: CMUPartYautjaRightArm
      HandRight: CMUPartYautjaRightHand
      HandLeft: CMUPartYautjaLeftHand
      LegLeft: CMUPartYautjaLeftLeg
      LegRight: CMUPartYautjaRightLeg
      FootLeft: CMUPartYautjaLeftFoot
      FootRight: CMUPartYautjaRightFoot
      Brain: CMUOrganHumanBrain
      Eyes: CMUOrganHumanEyes
      Lungs: CMUOrganHumanLungs
      Heart: CMUOrganHumanHeart
      Stomach: CMUOrganHumanStomach
      Liver: CMUOrganHumanLiver
      Kidneys: CMUOrganHumanKidneys
  - type: HumanoidProfile
    species: Yautja
    voice: CMUMaleYautja

# the bits of the cmss13 Thrall species that live on components locked to their own systems.
# YautjaThrallHeroSystem copies them onto a thrall when the bracer links and puts the originals back after
- type: entity
  id: CMUYautjaThrallSpecies
  categories: [HideSpawnMenu]
  components:
  # hero darksight 5, always on like a xeno's half night vision
  - type: NightVision
    state: Half
    innate: true
    onlyHalf: true
  # hero cold_level_1 is 220 against the human 260, so the cold slowdowns start 40 K later
  - type: TemperatureSpeed
    thresholds:
      233: 1.0
      183: 0.95
      133: 0.85
