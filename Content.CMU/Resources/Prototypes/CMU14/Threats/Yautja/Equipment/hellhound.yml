- type: entity
  parent:
  - RMCSimpleMob
  - SimpleSpaceMobBase
  - MobCombat
  id: CMUMobYautjaHellhound
  name: Hellhound
  description: A vicious Yautja hunting beast, all muscle, claw, and ritual scar.
  suffix: Yautja
  components:
  - type: YautjaHellhound
  - type: K9Dog
    presetBond: true
    silentSensesAlert: true
    batteryTrick: false
    headbiteStrikes: false
    canGrabXenos: true
    grabEscapeMessage: rmc-k9-arm-grab-escape-hellhound
    praiseMessage: rmc-k9-good-boy-hellhound
    praiseSound: /Audio/_RMC14/Voice/Vulpkanin/dog_whine.ogg
    bindMessageMaster: rmc-k9-bind-master-hellhound
    bindMessageDog: rmc-k9-bind-dog-hellhound
  - type: Language
    preset: CMUHellhoundLanguagePreset
  - type: RMCCamera
    rename: false
  - type: GhostRole
    name: cmu-yautja-hellhound-ghost-name
    description: cmu-yautja-hellhound-ghost-description
    rules: cmu-yautja-hellhound-ghost-rules
    allowMovement: true
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Sprite
    drawdepth: Mobs
    sprite: CMU14/HunterShip/mob/humans/onmob/hunter/hellhound.rsi
    # the 64x64 frames are bottom-aligned (CM-SS13 draws them from the tile's bottom edge): the hound sits 16 px
    # low in the frame, so lift it half a tile to stand on its own tile. The Bad Blood hound inherits this
    offset: 0,0.5
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: "Normal_Hellhound_Walking"
  - type: DamageStateVisuals
    states:
      Alive:
        Base: "Normal_Hellhound_Walking"
      Critical:
        Base: "Normal_Hellhound_Knocked_Down"
      Dead:
        Base: "Normal_Hellhound_Dead"
  # FLOW-610: the body that walks is 0.35 like every marine, Yautja and xeno. A 0.45 body stops against the wall at a
  # stair's top before reaching the height that carries it up a level (CMUMultiZStairs), so the hound could not climb.
  # fix2 keeps the old 0.45 hitbox for bullets and thrown things, the way base_xeno does. The density keeps the old
  # ~102 mass (160 at 0.45)
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 265
        mask:
        - MobMask
        layer:
        - MobLayer
      fix2:
        shape: !type:PhysShapeCircle
          radius: 0.45
        density: 0
        layer:
        - BulletImpassable
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      230: Critical
      330: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: Eye
    pvsScale: 1.5
  - type: CombatMode
    canDisarm: true
    disarmFailChance: 0
  - type: Input
    context: "xenonid"
  - type: Xeno
    role: CMUYautjaHellhound
    accessLevels: []
    tier: 0
    contributesToVictory: false
    countedInSlots: false
    autoAssignHive: false
    unlockAt: 0
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoHide
    - CMUActionYautjaHellhoundGorge
    - CMUActionYautjaHellhoundSenseOwner
    - ActionXenoZoom
  - type: XenoDevour
  - type: XenoHide
  - type: XenoZoom
  - type: BodyZoneTargeting
  - type: RemoveComponents
    components:
    - type: Internals
    - type: Satiation
      satiations: {}
    - type: Barotrauma
      damage: {}
  - type: Puller
  - type: Hands
    examineShowEmpty: false
  - type: GiveHands
    hands:
    - name: Right Paw
      location: Right
    - name: Left Paw
      location: Left
  - type: SlowOnPull
    slowdowns:
    - multiplier: 0.3825
      whitelist:
        components:
        - Marine
    - multiplier: 0.425
      whitelist:
        components:
        - XenoLight
    - multiplier: 0.2475
      whitelist:
        components:
        - XenoHeavy
  - type: PullWhitelist
    whitelist:
      components:
      - Xeno
      - Infectable
      - Synth
      - Yautja
  - type: RMCAllowXenoPullToggleStop
  - type: XenoPlasma
    plasma: 0
    maxPlasma: 0
    plasmaRegenOnWeeds: 0
  - type: XenoRegen
    restHealMultiplier: 2.5
    standHealingMultiplier: 1.25
    critHealMultiplier: 1.25
    healOffWeeds: true
  - type: XenoLeap
    delay: 0
    canBeShieldBlocked: false
    knockdownTime: 2
    leapSound: /Audio/_RMC14/Xeno/alien_pounce.ogg
    damage:
      types:
        Blunt: 10
        Slash: 10
        Piercing: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 5.55
    baseSprintSpeed: 10
  - type: MeleeWeapon
    autoAttack: true
    widePrimary: true
    altDisarm: true
    soundHit:
      path: /Audio/Effects/bite.ogg
    attackRate: 1.4
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 7.5
        Slash: 7.5
        Piercing: 7.5
  - type: Tackle
    min: 4
    max: 5
    chance: 0.4
    stunMin: 4
    stunMax: 4
  - type: CMArmor
    xenoArmor: 30
    explosionArmor: 20
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300
  - type: Speech
    speechVerb: LargeMob
    allowedEmotes:
    - CMUYautjaHellhoundRoar
    - CMUYautjaHellhoundGrowl
    - CMUYautjaHellhoundHiss
    emoteOverrides:
      XenoRoar: CMUYautjaHellhoundRoar
      Growl: CMUYautjaHellhoundGrowl
      Hiss: CMUYautjaHellhoundHiss
  - type: NightVision
    alert: XenoNightVision
    overlay: true
  - type: RMCNightVisionVisible
  - type: HideHealthBar
  - type: TypingIndicator
    proto: alien
  - type: ReplacementAccent
    accent: genericAggressive
  - type: NPCRetaliation
    attackMemoryLength: 12
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - CMUYautja
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool true
      NavInteract: !type:Bool true
      NavSmash: !type:Bool true
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: RMCSize
    size: SmallXeno
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: hellhound
  - type: VentCrawler
    ventCrawlIcon: runner
  - type: CameraNetworkMember
    networks:
    - CMUMobYautjaHellhound
    sourceKinds: Rmc
