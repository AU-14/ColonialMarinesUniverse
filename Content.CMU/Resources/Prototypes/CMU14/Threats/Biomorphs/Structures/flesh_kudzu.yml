# Flesh kudzu (tendons) for abominations. Adapted from upstream FleshKudzu
# survives in space / vacuum. Fire is lethal
#
# - Heals abominations on contact, damages everyone else (DamageContacts).
# - Periodically sobs / gasps via AbominationFleshKudzuSystem.
- type: entity
  parent: BaseKudzu
  id: AU14BiomorphFleshKudzu
  name: tendons
  description: A pulsing carpet of fused sinew. It sounds like it's sobbing.
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path: "/Audio/Weapons/slash.ogg"
  - type: Sprite
    sprite: CMU14/Objects/Misc/fleshkudzu.rsi
    state: kudzu_11
    drawdepth: HighFloorObjects
  - type: KudzuVisuals
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Damageable
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Kudzu
    growthTickChance: 0.2
    spreadChance: 0.4
    spriteVariants: 1 # One sprite per growth stage in the RSI, so variants must stay pinned to 1.
    damageRecovery:
      types:
        Slash: -0.5
        Blunt: -0.5
  # Tendons go up easily. Anti-flesh-kudzu countermeasure is fire.
  - type: Flammable
    fireSpread: true
    canResistFire: false
    damage:
      types:
        Heat: 8
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: TemperatureDamage
    heatDamageThreshold: 320
    heatDamage:
      types:
        Heat: 15
  # Slashes/pierces anyone standing on it - except abominations. Mimics in
  # disguise only carry AbominationMimicTransformed (the polymorph drops
  # Abomination), so the tracker component whitelists them too.
  - type: DamageContacts
    damage:
      types:
        Slash: 1.5
        Piercing: 1.5
        Poison: 0.5
        Radiation: 0.5
    ignoreWhitelist:
      components:
      - Biomorph
      - BiomorphMimicTransformed
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.7
    sprintSpeedModifier: 0.7
    ignoreWhitelist:
      components:
      - IgnoreKudzu
      - Biomorph
      - BiomorphMimicTransformed
  # Periodic sob/gasp + heal-abominations-in-contact tick. Server-side.
  # Heal values doubled from the original tuning so tendons are a real
  # rally point for the threat to retreat to.
  - type: BiomorphFleshKudzu
    fireDamage: 10
    fireInterval: 1
    heal:
      types:
        Blunt: -6
        Slash: -6
        Piercing: -6
        Heat: -6
  - type: Flamability
    chance: 1.0
    rate: 0.08
    range: 1.0
    spread: 1.5
  - type: UserIFF
    factions:
    - FactionBiomorph
  - type: NpcFactionMember
    factions:
    - Biomorph

# Spawner for the flesh kudzu. Used by skitter's Spread Kudzu action and
# by abomination death-on-gib.
- type: entity
  id: AU14BiomorphFleshKudzuSource
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomSpawner
    deleteSpawnerAfterSpawn: true
    offset: 0
    chance: 1
    prototypes:
    - AU14BiomorphFleshKudzu
