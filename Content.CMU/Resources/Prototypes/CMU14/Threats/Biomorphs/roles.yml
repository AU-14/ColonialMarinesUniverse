# One job + playTimeTracker per abomination caste. Deliberately NOT
# inheriting CMJobXenoBase (and isXeno: false on the tracker) so the
# role/playtime systems don't register abominations as xenomorphs.

- type: job
  parent: CMJobBase
  id: AU14BiomorphSpider
  name: au14-job-name-biomorph-spider
  playTimeTracker: AU14JobBiomorphSpider
  joinNotifyCrew: false
  hidden: true
  hasIcon: false

- type: playTimeTracker
  id: AU14JobBiomorphSpider
  isXeno: false

- type: job
  parent: CMJobBase
  id: AU14BiomorphGrunt
  name: au14-job-name-biomorph-grunt
  playTimeTracker: AU14JobBiomorphGrunt
  joinNotifyCrew: false
  hidden: true
  hasIcon: false

- type: playTimeTracker
  id: AU14JobBiomorphGrunt
  isXeno: false

- type: job
  parent: CMJobBase
  id: AU14BiomorphSkitter
  name: au14-job-name-biomorph-skitter
  playTimeTracker: AU14JobBiomorphSkitter
  joinNotifyCrew: false
  hidden: true
  hasIcon: false

- type: playTimeTracker
  id: AU14JobBiomorphSkitter
  isXeno: false

- type: job
  parent: CMJobBase
  id: AU14BiomorphMimic
  name: au14-job-name-biomorph-mimic
  playTimeTracker: AU14JobBiomorphMimic
  joinNotifyCrew: false
  hidden: true
  hasIcon: false

- type: playTimeTracker
  id: AU14JobBiomorphMimic
  isXeno: false

# Generic abomination speech verb used by AU14AbominationBase.
- type: speechVerb
  id: Biomorph
  name: chat-speech-verb-name-default
  speechVerbStrings:
  - chat-speech-verb-robotic-1
  - chat-speech-verb-robotic-2

# General abomination radio channel, the hive-equivalent for the threat.
# Spider / Grunt / Skitter / Mimic all share this band.
- type: radioChannel
  id: Biomorph
  name: chat-radio-biomorph
  keycode: "g"
  frequency: 42.8
  color: "#6b8f3a"
  longRange: true

# Mimic-only radio channel, modelled on Hivemind.
# Private side-channel mimics also have so disguised mimics can coordinate
# without breaking cover on local chat.
- type: radioChannel
  id: BiomorphMimic
  name: chat-radio-biomorph-mimic
  keycode: "e"
  frequency: 42.7
  color: "#a63636"
  longRange: true
