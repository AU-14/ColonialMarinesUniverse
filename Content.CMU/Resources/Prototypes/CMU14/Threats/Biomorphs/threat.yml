# Small abomination party — drawn as a third party. One mimic + one
# skitter, no nest seed. Available on every planet/mode.
- type: partySpawn
  id: biomorphSmallParty
  leadersToSpawn:
    AU14BiomorphMimic: 1
  gruntsToSpawn:
    AU14BiomorphSkitter: 1
  spawnTogether: true

- type: thirdParty
  id: biomorphThirdParty
  partyspawn: biomorphSmallParty
  entrymethod: ground
  weight: 4
  minplayers: 0
  maxplayers: 250
  GhostsNeeded: 2
  roundstart: false
  announcearrival: "Anomalous biological signatures detected in the area of operation."

- type: lorePrimer
  id: AU14PrimerThreatBiomorph
  threattext: "You are a biomorph. Spread the flesh, drag the prey, wear their faces."
  KnowledgeLevelsGovforThreat:
    "Threat Unknown": 1
    "Reports of colonists turning on their own and bodies vanishing from the morgue.": 2
    "Pulsing 'tendons' growing through colony infrastructure. Burn everything.": 3
