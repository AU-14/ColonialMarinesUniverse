# The contracts of the companies. A contract put into a trade platform (nine at most in one) opens the assortment of the company: its drones buy what the contract lists (for the
# price listed) and sell the goods it lists, those that its level has opened. A company has a contract for each category of goods, and the trade through a contract is its points:
# the levels come with them, up to the third.
#
# A line of the list: what it is (a stack, a prototype and what is made from it, or whatever has a component), what the drone pays for one of it (sell), what a lot costs when it is
# sold (buy, ten times the sell for the ores; the metals are sold to the company as ore and ordered of it as ingots, ten to a lot), and the level of the contract that opens it for buying.

