# ---------------------------------------------------------------- the papers
- type: entity
  parent: BaseItem
  id: RUMCTradeContractMetals
  name: metals contract
  description: A contract with a mining company for the metals. Put it into a trade platform to sell it metal ore and to order ready ingots of it, ten to a lot.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      color: "#9aa3ad"
    - state: paper_words
  - type: Item
    size: Tiny
  - type: TradeContract
    contract: RUMCTradeContractMetals

