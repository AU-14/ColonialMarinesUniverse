- type: construction
  id: CMUCavernLadder
  name: cmu-cavern-ladder
  description: cmu-cavern-ladder-desc
  graph: CMUCavernLadderGraph
  startNode: start
  targetNode: ladder
  category: construction-category-tools
  objectType: Item
  isCM: true
  spawnlist: ZLevel

- type: constructionGraph
  id: CMUCavernLadderGraph
  start: start
  graph:
