- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceCMUHuman
  categories: [ HideSpawnMenu ]
  name: CMU human appearance
  components:
  - type: CMUBurnPanic
  - type: CMUCombatHearing
  # cmss13 bodies are the same for both sexes (cmss13-devs/cmss13#6073) and its uniforms have no
  # female versions, so clothing is not pinched in at the waist for female characters.
  - type: Inventory
    femaleDisplacements: { }
  - type: InitialBody
    organs:
      Torso: CMUPartHumanTorso
      Head: CMUPartHumanHead
      ArmLeft: CMUPartHumanLeftArm
      ArmRight: CMUPartHumanRightArm
      HandLeft: CMUPartHumanLeftHand
      HandRight: CMUPartHumanRightHand
      LegLeft: CMUPartHumanLeftLeg
      LegRight: CMUPartHumanRightLeg
      FootLeft: CMUPartHumanLeftFoot
      FootRight: CMUPartHumanRightFoot
      Brain: CMUOrganHumanBrain
      Eyes: CMUOrganHumanEyes
      Lungs: CMUOrganHumanLungs
      Heart: CMUOrganHumanHeart
      Stomach: CMUOrganHumanStomach
      Liver: CMUOrganHumanLiver
      Kidneys: CMUOrganHumanKidneys
  - type: HumanoidProfile
    species: Human
    voice: RMCMaleHuman

- type: entity
  parent: AppearanceCMUHuman
  id: MobHumanDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: CMUHumanMedical
  - type: HitLocation
  - type: PainShock
  - type: BodyZoneTargeting
  - type: CMSurgeryTarget
