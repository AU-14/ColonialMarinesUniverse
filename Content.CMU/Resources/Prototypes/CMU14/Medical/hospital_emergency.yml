- type: entity
  parent: RMCCommunicationsConsoleBase
  id: AU14HospitalEmergencyComputer
  name: emergency computer
  description: Coordinates hospital evacuation shuttles, casualty releases, and treatment payouts.
  suffix: Hospital
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.HospitalEmergencyComputerUi.Key
  - type: UserInterface
    interfaces:
      enum.HospitalEmergencyComputerUi.Key:
        type: HospitalEmergencyComputerBui
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: HospitalEmergencyComputer
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["CMAccessColonyMedbay"], ["AU14AccessColonyHeadPhysician"], ["CMAccessColonyCommand"]]

- type: entity
  parent: CMDropshipDestinationThirdPartyWhitelist
  id: AU14HospitalDropshipLandingZone
  name: hospital dropship landing zone
  description: Designates a hospital landing point for emergency casualty shuttles.
  suffix: Hospital
  components:
  - type: HospitalDropshipLandingZone

