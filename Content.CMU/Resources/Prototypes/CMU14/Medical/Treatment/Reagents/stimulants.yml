- type: reagent
  parent: CMReagent
  id: CMUMethamphetamine
  name: reagent-name-cmu-methamphetamine
  desc: reagent-desc-cmu-methamphetamine
  flavor: bitter
  physicalDesc: reagent-physical-desc-crystalline
  color: "#f5f5ff"
  overdose: 25
  criticalOverdose: 40
  metabolisms:
    Bloodstream:
      cmuToxicity: [ Poison ]
      metabolismRate: 0.1
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          min: 25
        damage:
          types:
            Poison: 3
            Asphyxiation: 2
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.4
        sprintSpeedModifier: 1.4
      - !type:Jitter
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          min: 25
        effectProto: StatusEffectCMUTachycardia
        time: 6
        type: Update
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          min: 40
        probability: 0.15
