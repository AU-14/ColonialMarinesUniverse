- type: job
  abstract: true
  parent: CMJobBase
  displayWeight: 16
  id: AU14JobCivilianScientistBase
  # Playtime awards are name badges, not service medals, for office and science staff.
  medals:
    Bronze: RMCMedalBronzeNametagService
    Silver: RMCMedalSilverNametagService
    Gold: RMCMedalGoldNametagService
    Platinum: RMCMedalPlatinumNametagService
  name: au14-job-name-civilianscientist
  description: au14-job-description-civilianscientist
  playTimeTracker: AU14JobCivilianScientist
  basePlaytimeTracker: true

- type: job
  parent: AU14JobCivilianScientistBase
  id: AU14JobCivilianScientist
  roundSide: Civilian
  roundForce: WY
  roundProfiles:
  - AU14RoundJobProfileThirdParty
  roundRole: CivilianScientist
  roundComponents:
  - type: Skills
    skills:
      RMCSkillResearch: 1
      RMCSkillFireman: 1
      RMCSkillVehicles: 1
      RMCSkillDomestics: 1
      RMCSkillMedical: 3
      RMCSkillFirearms: 2
      RMCSkillSurgery: 4
  - type: JobPrefix
    prefix: au14-job-prefix-civilianscientist
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: weya_scientist
  - type: CMUAssignSquad
    squad: CMUSquadWYScience

  name: au14-job-name-civilianscientist
  description: au14-job-description-civilianscientist
  setPreference: true
  canBeAntag: true
  playTimeTracker: AU14JobCivilianScientist
  # Professor is reserved for the Lead Researcher so a round has one science head.
  ranks:
    AU14RankScientistAssociate:
    - !type:RoleTimeRequirement
      role: AU14JobCivilianScientist
      time: 36000 # 10 hours
    AU14RankScientistAssistant: []
  startingGear: AU14GearCivilianScientist
  icon: "RMCJobIconPMCScientist"
  requireAdminNotify: false
  joinNotifyCrew: false
  supervisors: cmu-job-supervisors-lead-researcher
  spawnMenuRoleName: au14-spawn-role-name-wy-scientist
  accessGroups:
  - Colonist
  - CMUWYResearch
  - aumed
  roleWeight: 0.25

- type: startingGear
  id: AU14GearCivilianScientist
  equipment:
    id: AU14IDCardCivilianScientist
    jumpsuit: AU14CivilianWorkwearBlue
    shoes: RMCShoesBlack
    ears: AU14ColonyWeylandHeadset
    ears2: RMCM5CameraGear
    outerClothing: RMCLabcoatOpened
  storage:
    back:
    - AU14StampWYSci

- type: entity
  parent: CMSpawnPointJobBase
  id: AU14SpawnPointCivilianScientist
  name: Spawn Point Civilian Scientist
  components:
  - type: SpawnPoint
    job_id: AU14JobCivilianScientist
  # Until these roles' own spawn points are mapped in, they spawn here too.
  - type: CMUSpawnPointExtraJobs
    jobs:
    - CMUJobCorporateLeadResearcher
  - type: Sprite
    state: syn_spawn

- type: playTimeTracker
  id: AU14JobCivilianScientist
  isHumanoid: true

- type: roleLoadout
  id: JobAU14JobCivilianScientist
  points: 7
  groups:
  - MedGlovesAU14
  - MedMaskAU14
  - ScientistPouchAU14
  - ScientistPouchRightAU14
  - MedBackpackAU14
  - PaperworkRMC
  - WYCLJumpsuitAU14
  - WYCLOuterwearAU14
  - CMUResearchLabcoat
  - MedJacketAU14
  - CivJacketAU14
  - WYCLHeadwearAU14
  - WYCLFootwearAU14
  - CMUStockings
  - RecreationalRMC
  - CannedDrinksAU14
  - SmokablesRMC
  - EyewearRMC
  - MasksRMC
  - HeadwearCLFAU14

