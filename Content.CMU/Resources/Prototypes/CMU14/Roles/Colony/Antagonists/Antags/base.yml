# Colony antag rules roll server side in ColonyAntagsRuleSystem: each rule flips its own coin
# once per round, and the chance rises with the ready players who enabled that antag, pity weighted.
# Shared abstract base for all colony antag prototypes.
- type: antag
  abstract: true
  id: CMUAntagColonyBase
  setPreference: false
  antagonist: true
  category: roles-antag-category-colony
  isCM: true

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleFreeAgentSynth
  name: Free Agent Synth Role
  components:
  - type: SubvertedSynthRole
  - type: MindRole
    antagPrototype: FreeAgentSynthRole
    exclusiveAntag: true
    roleType: TeamAntagonist
    subtype: cmu-role-subtype-free-agent-synth

- type: antag
  parent: CMUAntagColonyBase
  id: FreeAgentSynthRole
  name: roles-antag-free-agent-synth-name
  objective: roles-antag-free-agent-synth-objective
