- type: antagSpecifier
  id: CLFVeteran
  prefRoles: [ CLFVeteranRole ]
  jobBlacklistGroup:
  - AllGovforJobs
  - AllOpforJobs
  - AllCLFJobs
# - AllColonyDepartmentHeadJobs
  - AllSynthJobs
  briefing:
    text: clfveteran-role-greeting
    color: OliveDrab
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: AU14GearCLFVeteran
  startingSkills:
    RMCSkillFirearms: 3
    RMCSkillMeleeWeapons: 3
    RMCSkillCqc: 4
    RMCSkillEndurance: 3
    RMCSkillFireman: 4
    RMCSkillConstruction: 3
    RMCSkillLeadership: 2
    RMCSkillMedical: 3
    RMCSkillPolice: 2
    RMCSkillSurgery: 3
  components:
  - type: CLFVeteran
  - type: ColonyBounty
    bounty: 1450
    reason: Known CLF insurgent - armed and dangerous
    recordName: CLF Veteran (Unknown)
    includeLanguages: true
    capturedFaxPaper: AUPaperCLFVeteranCaptured
  mindRoles:
  - MindRoleCLFVeteran

- type: entity
  id: CLFVeteran
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: CLFVeteranRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: CLFVeteran
      range:
        min: 1
        max: 2

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleCLFVeteran
  name: CLF Veteran Mind Role
  components:
  - type: MindRole
    antagPrototype: CLFVeteranRole
    exclusiveAntag: true
    roleType: SoloAntagonist

- type: antag
  parent: CMUAntagColonyBase
  id: CLFVeteranRole
  name: roles-antag-clfveteran-name
  setPreference: true
  objective: roles-antag-clfveteran-objective

- type: startingGear
  id: AU14GearCLFVeteran
  storage:
    back:
    - AU14CaseCLFVeteranKeepsake
    - AUPaperCLFVeteran
    - RMCLighter

- type: entity
  parent: RMCGunCaseBase
  id: AU14CaseCLFVeteranKeepsake
  name: worn keepsake case
  description: A scuffed personal case that has clearly traveled a long way. The lock is worn from daily use.
  components:
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,1
    whitelist:
      tags:
      - RMCWeaponRevolverM44
      - RMCSpeedLoaderM44
      - RMCSpeedLoader44Marksman
      - AU14TeleBaton
  - type: StorageFill
    contents:
    - id: AU14TeleBaton
    - id: AU14WeaponRevolverM44Inscribed
    - id: RMCSpeedLoaderM44
      amount: 4
    - id: RMCSpeedLoader44Marksman
      amount: 3

# Inscribed M44 - Unique CLF Veteran sidearm
- type: entity
  parent: RMCWeaponRevolverM44Custom
  id: AU14WeaponRevolverM44Inscribed
  name: inscribed M44 combat revolver
  description: A well-worn M44 combat revolver with crude inscriptions scratched into the barrel and grip. The words 'FREEDOM OR DEATH' are etched along the side. This weapon has clearly seen many battles.
  components:
  - type: RevolverAmmoProvider
    proto: RMCCartridgeRevolver44
    capacity: 10
    chambers:
    - True
    - True
    - True
    - True
    - True
    - True
    - True
    - True
    - True
    - True
    ammoSlots:
    - null
    - null
    - null
    - null
    - null
    - null
    - null
    - null
    - null
    - null
  - type: RMCSelectiveFire
    baseFireRate: 6
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        startingAttachable: RMCAttachmentRecoilCompensator
      rmc-aslot-rail:
        startingAttachable: RMCAttachmentRailFlashlight
      rmc-aslot-underbarrel:
        startingAttachable: RMCAttachmentLaserSight
