- type: antagSpecifier
  abstract: true
  id: CMUCLFSleeperAgentBase
  prefRoles: [ CLFSleeperAgentRole ]
  briefing:
    text: clf-sleeper-agent-role-greeting
    color: OliveDrab
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  components:
  - type: CLFSleeperAgent
  mindRoles:
  - MindRoleCLFSleeperAgent

- type: antag
  parent: CMUAntagColonyBase
  id: CLFSleeperAgentRole
  name: roles-antag-clf-sleeper-agent-name
  setPreference: true
  blacklistedGamemodes:
  - DistressSignal
  objective: roles-antag-clf-sleeper-agent-objective

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleCLFSleeperAgent
  name: CLF Sleeper Agent Mind Role
  components:
  - type: MindRole
    antagPrototype: CLFSleeperAgentRole
    exclusiveAntag: true
    roleType: SoloAntagonist
    subtype: cmu-role-subtype-clf-sleeper-agent
  - type: CMUAdminRoleIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: hudCLF

- type: antagSpecifier
  parent: CMUCLFSleeperAgentBase
  id: CLFSleeperAgent
  jobWhitelist:
    - AU14JobGOVFORSquadRifleman
    - AU14JobGOVFORSquadAutomaticRifleman
    - AU14JobGOVFORRadioTelephoneOperator
    - AU14JobGOVFORRadioTrafficOperator
    - AU14JobGOVFORCombatCorrespondent
    - AU14JobGOVFORDCC
    - AU14JobGOVFORNurse
    - AU14JobGOVFORVehicleCrewman
    - AU14JobGOVFOREngineeringTech
    - AU14JobGOVFORSquadCombatTech
    - AU14JobOPFORSquadRifleman
    - AU14JobOPFORSquadAutomaticRifleman
    - AU14JobOPFORRadioTelephoneOperator
    - AU14JobOPFORRadioTrafficOperator
    - AU14JobOPFORCombatCorrespondent
    - AU14JobOPFORDCC
    - AU14JobOPFORNurse
    - AU14JobOPFORVehicleCrewman
    - AU14JobOPFOREngineeringTech
    - AU14JobOPFORSquadCombatTech

- type: entity
  parent: BaseGameRule
  id: CLFSleeperAgent
  components:
  - type: GameRule
  - type: CLFSleeperAgentRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: CLFSleeperAgent
      range:
        min: 1
        max: 2

- type: entity
  parent: BaseGameRule
  id: CLFSleeperAgentCommand
  components:
  - type: GameRule
  - type: CLFSleeperAgentRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: CLFSleeperAgentCommand
      range:
        min: 1
        max: 2

- type: antagSpecifier
  parent: CMUCLFSleeperAgentBase
  id: CLFSleeperAgentCommand
  jobWhitelist:
    - AU14JobCivilianCorporateLiaison
    - AU14JobCivilianCMBMarshal
    - AU14JobCivilianColonyAdministrator
    - AU14JobGOVFORPlatOp
    - AU14JobGOVFORAdjutant
    - AU14JobGOVFORSquadSergeant
    - AU14JobGOVFORSectionSergeant
    - AU14JobGOVFORVehicleCommander
    - AU14JobGOVFORMilitaryPoliceMan
    - AU14JobGOVFOROfficerEngi
    - AU14JobGOVFOROfficerIntel
    - AU14JobGOVFOROfficerLogistics
    - AU14JobGOVFOROfficerMedical
    - AU14JobOPFORPlatOp
    - AU14JobOPFORAdjutant
    - AU14JobOPFORSquadSergeant
    - AU14JobOPFORSectionSergeant
    - AU14JobOPFORVehicleCommander
    - AU14JobOPFORMilitaryPoliceMan
    - AU14JobOPFOROfficerEngi
    - AU14JobOPFOROfficerIntel
    - AU14JobOPFOROfficerLogistics
    - AU14JobOPFOROfficerMedical
