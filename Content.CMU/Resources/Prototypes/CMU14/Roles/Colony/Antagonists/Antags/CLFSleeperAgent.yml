    antagPrototype: CLFSleeperAgentRole
    exclusiveAntag: true
    roleType: SoloAntagonist

- type: antag
  parent: CMUAntagColonyBase
  id: CLFSleeperAgentRole
  name: roles-antag-clf-sleeper-agent-name
  setPreference: true
  objective: roles-antag-clf-sleeper-agent-objective
