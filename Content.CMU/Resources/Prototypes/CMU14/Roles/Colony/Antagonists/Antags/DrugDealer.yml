- type: antagSpecifier
  id: DrugDealer
  prefRoles: [ DrugDealerRole ]
  jobBlacklistGroup:
  - AllGovforJobs
  - AllOpforJobs
  - AllCLFJobs
  - AllWeYuJobs
  - AllSynthJobs
  briefing:
    text: dealer-role-greeting
    color: MediumVioletRed
    sound: "/Audio/Ambience/Antag/headrev_start.ogg"
  startingGear: CMUGearDrugDealer
  startingSkills:
    RMCSkillMedical: 2
    RMCSkillSurgery: 1
  components:
  - type: DrugDealer
  - type: ColonyBounty
    bounty: 1225
    reason: Distribution of controlled substances - wanted alive for prosecution
    recordName: Narcotics Dealer (Unknown)
    includePrints: true
    includeLanguages: true
    deadCounts: false
    capturedFaxPaper: CMUPaperColonyAntagCaptured
  mindRoles:
  - MindRoleDrugDealer

- type: entity
  id: DrugDealer
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: DrugDealerRule
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:RandomAntagCount
      proto: DrugDealer
      range:
        min: 1
        max: 2

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleDrugDealer
  name: Drug Dealer Mind Role
  components:
  - type: MindRole
    antagPrototype: DrugDealerRole
    exclusiveAntag: true
    roleType: SoloAntagonist

- type: antag
  parent: CMUAntagColonyBase
  id: DrugDealerRole
  name: roles-antag-dealer-name
  setPreference: true
  objective: roles-antag-dealer-objective

- type: startingGear
  id: CMUGearDrugDealer
  equipment:
    back: CMUDrugDealerDrugBackpack
  inhand:
  - CMUDrugDealerChemKit
  storage:
    back:
    - AUPaperDrugs

- type: entity
  parent: RMCBoxCardboard
  id: CMUDrugDealerChemKit
  name: unmarked cardboard box
  description: A plain cardboard box. Something inside rattles like glass.
  components:
  - type: Storage
    grid:
    - 0,0,19,1 # 10 small bottles
  - type: StorageFill
    contents:
    # One full run each of the methamphetamine and fentanyl reaction chains
    - id: CMUBottleWater
    - id: CMUBottleChlorine
    - id: CMUBottleFluorine
    - id: CMUBottlePhosphorus
    - id: CMUBottleSulphuricAcid
    - id: CMUBottleCarbon
    - id: CMUBottleEthanol
    - id: CMUBottleMethylphenidate
    - id: CMUBottleOxycodone
    - id: CMUBottleEpinephrine

- type: entity
  parent: ClothingBackpackSatchelSmugglerUnanchored
  id: CMUDrugDealerDrugBackpack
  name: worn satchel
  suffix: "CMU"
  description: A scuffed satchel that smells faintly of solvent. Just flat enough to fit underneath floor tiles.
  components:
  - type: StorageFill
    contents:
    - id: Joint
      amount: 7
    - id: AU14DrugDealerDrugBottle
      amount: 5
    - id: AU14PillBottleSpaceDrugs
      amount: 6
    - id: RMCSyringeDrugs
      amount: 3
    - id: AU14PillBottleRMCPsilocybin
      amount: 4
    - id: CannabisSeeds
      amount: 2
    - id: RainbowCannabisSeeds
      amount: 1
    - id: FlyAmanitaSeeds
      amount: 2
