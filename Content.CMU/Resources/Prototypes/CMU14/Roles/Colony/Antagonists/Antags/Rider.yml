  name: Grip
  description: How tightly you hold on. Abilities spend it, resistance drains it, and it returns on its own.
  minSeverity: 0
  maxSeverity: 18

# The phantom: the parasite projected into the host's mind's eye. Rider-layered,
# so only the host (while it is out), ghosts and admins can see it.
- type: entity
  id: CMURiderManifest
  name: flickering parasite
  categories: [ HideSpawnMenu ]
  components:
  - type: RiderManifest
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Rider
  - type: Sprite
    noRot: true
    drawdepth: Ghosts
    scale: "0.65, 0.65"
    color: "#6d655299"
    layers:
    - sprite: CMU14/Mobs/thirdPartiesXenos/parasite_runner.rsi
      state: alive
      shader: unshaded
  - type: Physics
    bodyType: KinematicController
    bodyStatus: InAir
  - type: CanMoveInAir
  - type: MovementIgnoreGravity
  - type: GravityAffected
  - type: MovementSpeedModifier
    # Matches CMURiderHatchling so the projection keeps pace with the real body
    baseWalkSpeed: 5.5
    baseSprintSpeed: 9.75
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 15
        layer:
        - GhostImpassable
  - type: Input
    context: "ghost"
  - type: RMCActiveInputMover

- type: entity
  id: ActionRiderManifest
  name: Mind's Eye
  description: Project yourself into your host's mind. Watch, drift nearby, point. You cannot touch anything.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: toggle_queen_zoom
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:RiderManifestActionEvent

- type: entity
  id: ActionRiderWithdraw
  name: Withdraw
  description: Slip back inside your host.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: queen_exit
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:RiderWithdrawActionEvent
