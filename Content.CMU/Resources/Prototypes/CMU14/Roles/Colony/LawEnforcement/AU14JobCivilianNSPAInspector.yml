- type: job
  parent: AU14JobLEOLeaderBase
  displayWeight: 18
  id: AU14JobCivilianNSPAInspector
  roundSide: Civilian
  roundForce: NSPA
  roundRole: CivilianNSPAInspector
  roundComponents:
  - type: NpcFactionMember
    factions:
    - AUBureau
  - type: Skills
    skills:
      RMCSkillCqc: 3
      RMCSkillEndurance: 3
      RMCSkillFirearms: 2
      RMCSkillFireman: 2
      RMCSkillIntel: 1
      RMCSkillMedical: 1
      RMCSkillMeleeWeapons: 1
      RMCSkillOverwatch: 1
      RMCSkillPolice: 2
      RMCSkillLeadership: 3
      RMCSkillVehicles: 1
      RMCSkillEngineer: 1
      RMCSkillConstruction: 1
  - type: JobPrefix
    prefix: au14-job-prefix-civiliannspainspector
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: tse_painspector
  - type: Language
    preset: AU14LanguagePresetTWE

  name: au14-job-name-civiliannspainspector
  description: au14-job-description-civiliannspainspector
  setPreference: false
  canBeAntag: false
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 43200 # 12 hours
  - !type:TotalJobsTimeRequirement
    group: CMUJobsSecurity
    time: 36000 # 10 hours
  - !type:TraitsRequirement
    inverted: true
    traits:
    - CMUAlcoholic
    - CMUDrugAddict
    - CMUBadLeg
  ranks:
    RMCRankCivilian: []
  chevrons: # highest rank the player has the law enforcement leadership playtime for
    AU14RankNSPACommissioner:
      entity: AU14ChevronNSPACommissioner
      requirements:
      - !type:TotalJobsTimeRequirement
        group: CMUJobsLawEnforcementLeaders
        time: 180000 # 50 hours
    AU14RankNSPADeputyCommissioner:
      entity: AU14ChevronNSPADeputyCommissioner
      requirements:
      - !type:TotalJobsTimeRequirement
        group: CMUJobsLawEnforcementLeaders
        time: 108000 # 30 hours
    AU14RankNSPASuperintendent:
      entity: AU14ChevronNSPASuperintendent
      requirements:
      - !type:TotalJobsTimeRequirement
        group: CMUJobsLawEnforcementLeaders
        time: 54000 # 15 hours
    AU14RankNSPAChiefInspector:
      entity: AU14ChevronNSPAChiefInspector
      requirements: []
  startingGear: AU14GearCivilianNSPAInspector
  icon: "RMCJobIconTSEPAInspector"
  requireAdminNotify: true
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-colonycivilian
  spawnMenuRoleName: NSPA Inspector (CMU)
  accessGroups:
  - auadmin
  - aucmb
  - Colonist
  - AUPrisonStaff
  roleWeight: 0.25

- type: startingGear
  id: AU14GearCivilianNSPAInspector
  equipment:
    id: AU14IDCardColonyNSPAInspector
    back: RMCSatchelTSEPA
    jumpsuit: RMCJumpsuitTSEPA
    shoes: RMCBootsPMCFilled
    head: RMCHeadCapTSEPAPeakedGold
    belt: CMBeltSecurityMarshalFilled
    ears: AU14CMBHeadset
    outerClothing: RMCCoatTSEPAFormal
    # Fallback for spawns without a loadout, such as the ghost role. The rig picked from the NSPAInspectorSidearmCMU
    # loadout group is equipped first and keeps the slot; this one is then discarded.
    suitstorage: CMUBeltHolsterRevolverNSPA
    pocket1: AU14PouchIFAKFill
    pocket2: AU14PouchGeneralLargeLEOFilled
  storage:
    back:
    - CMUCameraGearM3aCivilian
    - AU14GuidebookLawColonial
    - AU14StampNSPA
    - CMURecordsTablet
    - ForensicScanner

- type: roleLoadout
  id: JobAU14JobCivilianNSPAInspector
  points: 7
  groups:
  - NSPAInspectorSidearmCMU
  - PaperworkRMC
  - RecreationalRMC
  - CannedDrinksAU14
  - SmokablesRMC
  - EyewearRMC
  - MasksRMC
  - HeadwearCLFAU14

- type: entity
  parent: CMSpawnPointJobBase
  id: AU14SpawnPointCivilianNSPAInspector
  name: Spawn Point Civilian NSPA Inspector
  components:
  - type: SpawnPoint
    job_id: AU14JobCivilianNSPAInspector
  - type: Sprite
    state: syn_spawn

- type: entity
  parent: MarkerBase
  id: aughostinspector
  name: Inspector colonist ghost role
  components:
  - type: Sprite
    layers:
    - state: red
  - type: RandomHumanoidSpawner
    settings: Aughostinspector

- type: randomHumanoidSettings
  parent: RMCSettingsGhostRole
  id: Aughostinspector
  components:
  - type: RMCJobSpawner
    job: AU14JobCivilianNSPAInspector
