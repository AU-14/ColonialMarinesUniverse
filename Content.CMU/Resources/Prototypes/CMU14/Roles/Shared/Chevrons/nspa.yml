- type: entity
  parent: RMCArmbandBase
  id: AU14ChevronNSPABase
  abstract: true
  suffix: NSPA Rank Chevron
  description: Civil policing rank insignia. The last series of pins were metal, but a senior inspector complained about getting stabbed, so these are made of plastic.

- type: entity
  parent: AU14ChevronNSPABase
  id: AU14ChevronNSPAProbationaryConstable
  name: probationary constable chevron
  components:
  - type: Sprite
    sprite: CMU14/Clothing/Accessory/Chevrons/universal.rsi
    state: ranks_enlisted
  - type: UniformAccessory
    playerSprite:
      sprite: CMU14/Clothing/Accessory/Chevrons/universal.rsi
      state: equipped-ranks_enlisted
  - type: RankChanger
    rank: AU14RankNSPAProbationaryConstable
    override: true

