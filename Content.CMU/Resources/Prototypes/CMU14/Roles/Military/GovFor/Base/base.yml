# Faction children of this base need mirror IDs, identical except the GOVFOR/OPFOR substring.
# Slot dealing (FoF) swaps a player's preferences between sides by replacing that substring
# and drops any preference whose mirrored job prototype does not exist.
- type: job
  abstract: true
  parent: CMJobBase
  id: AU14JobMilitaryBase
  roundSide: Govfor
  roundForce: GOVFOR
  roleWeight: 1 # every marine latejoin counts full; drives Hive latejoin burrowed larva
  supervisors: au14-job-supervisors-govfor
  hidden: true          # abstract hides by default, but for children/factions to remain hidden
  setPreference: false  # all faction variants are hidden in the loadout menu
  roundComponents:
    - type: RegulationAppearance
    - type: SpawnHungryThirsty
