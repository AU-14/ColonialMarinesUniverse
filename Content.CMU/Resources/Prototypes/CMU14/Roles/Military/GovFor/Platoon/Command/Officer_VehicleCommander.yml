      RMCSkillMedical: 2
      RMCSkillSurgery: 1
      RMCSkillPolice: 1
      RMCSkillLeadership: 3
  - type: JobPrefix
    prefix: au14-job-prefix-vehiclecommander
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/au14govforjobicons.rsi
      state: govfor_vcc
  roundForceComponents:
    OPFOR:
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/CMU14/Interface/au14opforjobicons.rsi
        state: vcc
  requirements:
  - !type:TotalJobsTimeRequirement
    group: CMUJobsVehicleCrew
    time: 18000 # 5 hours
#  - !type:RoleTimeRequirement
#    role: AU14JobGOVFORVehicleCrewman
#    time: 14400 # 4 hours
#  - !type:RoleTimeRequirement
#    role: AU14JobGOVFORSquadSergeant
#    time: 7200 # 2 hours
  - !type:AgeRequirement
    requiredAge: 25
  - !type:TraitsRequirement
    inverted: true
    traits:
    - SocialAnxietyHeavy
    - FrontalLisp
    - NonResuscitable
    - Epilepsy
    - NoEnglish
    - SlowRunner
    - Anemic
    - Asthmatic
  ranks:
    RMCRankCivilian: []
  chevrons:
    RMCRankSecondLT:
      entity: AU14ChevronSecondLT
      requirements:
      - !type:RoleTimeRequirement
        role: AU14JobGOVFORVehicleCommander
        time: 90000 #25 hours
    RMCRankChiefWarrantOfficer3:
      entity: AU14ChevronUSCMChiefWarrantOfficer3
      requirements:
      - !type:RoleTimeRequirement
        role: AU14JobGOVFORVehicleCommander
        time: 36000 #10 hours
    RMCRankChiefWarrantOfficer:
      entity: AU14ChevronUSCMChiefWarrantOfficer2
      requirements: []

