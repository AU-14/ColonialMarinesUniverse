- type: job
  abstract: true
  parent: AU14JobMilitaryBase
  id: AU14JobGOVFORCombatCorrespondentBaseAbstract
  name: au14-job-name-govforcombatcorrespondent
  description: au14-job-description-govforcombatcorrespondent
  icon: "AU14JobIconGovRifleman"
  spawnMenuRoleName: cmu-spawn-role-combat-correspondent-govfor 
  startingGear: AU14GearGOVFORCombatCorrespondent
  dummyStartingGear: AU14GearGOVFORCombatCorrespondentDummy
  playTimeTracker: AU14JobGOVFORCombatCorrespondent
  displayWeight: -1
  accessGroups:
  - AU14GovforSquad
  hasIcon: false

- type: job
  abstract: true
  parent: AU14JobGOVFORCombatCorrespondentBaseAbstract
  id: AU14JobGOVFORCombatCorrespondentBase
  roundRole: CombatCorrespondent
  roundProfiles:
  - AU14RoundJobProfileMilitaryBase
  roundComponents:
  - type: Skills
    preset: AU14SkillPresetPlatoonRifleman
  - type: JobPrefix
    prefix: au14-job-prefix-govforcombatcorrespondent
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/au14govforjobicons.rsi
      state: rifleman
  roundForceComponents:
    OPFOR:
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/CMU14/Interface/au14opforjobicons.rsi
        state: rifleman

  requirements:
  - !type:TotalDepartmentsTimeRequirement
    group: CMUDepartmentsMilitary
    time: 18000 # 5 hours
  - !type:TraitsRequirement
    inverted: true
    traits:
    - Epilepsy
    - NoEnglish
    - CMUProstheticLeftArm
    - CMUProstheticRightArm
    - CMUProstheticLeftLeg
    - CMUProstheticRightLeg
    - SlowRunner
    - Anemic
    - Asthmatic
    - CMUAlcoholic
    - CMUDrugAddict
    - CMUBadLeg
  ranks:
    RMCRankCivilian: []
  chevrons:
    RMCRankStaffSergeant:
      entity: AU14ChevronUSCMStaffSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: AU14JobGOVFORCombatCorrespondent
        time: 86400 # 24 hours
    RMCRankSergeant:
      entity: AU14ChevronUSCMSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: AU14JobGOVFORCombatCorrespondent
        time: 36000 # 10 hours
    RMCRankCorporal:
      entity: AU14ChevronUSCMCorporal
      requirements: []

- type: playTimeTracker
  id: AU14JobGOVFORCombatCorrespondent
  isHumanoid: true

- type: startingGear
  id: AU14GearGOVFORCombatCorrespondent
  equipment:
    id: AU14IDCardGOVFORCombatCorrespondent
    ears: AU14HeadsetGovforCommand

- type: startingGear
  id: AU14GearGOVFORCombatCorrespondentDummy
  equipment:
    outerClothing: RMCOuterClothingExternalWebbing
    shoes: AU14BootsJungle
    head: AU14JunglePatrolCap
    jumpsuit: AU14JungleFatigues
    ears: AU14HeadsetGovforCommand

- type: entity
  parent: CMSpawnPointJobBase
  id: AU14SpawnPointGOVFORCombatCorrespondent
  name: Spawn Point GOVFOR Combat Correspondent
  components:
  - type: SpawnPoint
    job_id: AU14JobGOVFORCombatCorrespondent
  - type: Sprite
    state: syn_spawn

- type: job
  parent: AU14JobGOVFORCombatCorrespondentBase
  id: AU14JobGOVFORCombatCorrespondent
  hidden: false
  setPreference: true
  basePlaytimeTracker: true

- type: roleLoadout
  id: JobAU14JobGOVFORCombatCorrespondent
  points: 7
  groups:
  - CMUAuxiliaryStaffRole
  - MarineBackpack
  - EyewearRMCPVE
  - MasksRMCPVE
  - HeadwearRMCPVE
  - HelmetGarbsRMCPVE
  - PaperworkRMC
  - RecreationalRMC
  - CannedDrinksAU14
  - SmokablesRMC

# Auxiliary staff pick what work they do in their loadout. The job keeps its combat correspondent IDs so players
# keep their preferences and playtime.
- type: loadoutGroup
  id: CMUAuxiliaryStaffRole
  name: cmu-loadout-group-auxiliary-staff
  minLimit: 1
  maxLimit: 1
  loadouts:
  - CMUAuxiliaryStaffCombatCorrespondent
  - CMUAuxiliaryStaffChaplain
  - CMUAuxiliaryStaffMessTechnician

- type: loadout
  id: CMUAuxiliaryStaffCombatCorrespondent
  dummyEntity: CMUAuxiliaryStaffDummyCombatCorrespondent
  inhand:
  - CMUKitAuxiliaryStaffCombatCorrespondent
  effects:
  - !type:CMUAuxiliaryStaffLoadoutEffect
    title: cmu-auxiliary-staff-combat-correspondent
    prefix: au14-job-prefix-govforcombatcorrespondent

- type: loadout
  id: CMUAuxiliaryStaffChaplain
  dummyEntity: CMUAuxiliaryStaffDummyChaplain
  inhand:
  - CMUKitAuxiliaryStaffChaplain
  effects:
  - !type:CMUAuxiliaryStaffLoadoutEffect
    title: cmu-auxiliary-staff-chaplain
    prefix: cmu-auxiliary-staff-prefix-chaplain
    requiresReligion: true
    holyBook: true

- type: loadout
  id: CMUAuxiliaryStaffMessTechnician
  dummyEntity: CMUAuxiliaryStaffDummyMessTechnician
  inhand:
  - CMUKitAuxiliaryStaffMessTechnician
  effects:
  - !type:CMUAuxiliaryStaffLoadoutEffect
    title: cmu-auxiliary-staff-mess-technician
    prefix: cmu-auxiliary-staff-prefix-mess-technician
    access:
    - CMUAccessKitchen

# Each role's gear comes in a kit.
- type: entity
  abstract: true
  parent: RMCKitBase
  id: CMUKitAuxiliaryStaffBase
  components:
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,3,1
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
  - type: Icon
    sprite: _RMC14/Objects/Storage/procase_mini.rsi

- type: entity
  parent: CMUKitAuxiliaryStaffBase
  id: CMUKitAuxiliaryStaffCombatCorrespondent
  name: combat correspondent kit
  description: A case holding a combat correspondent's broadcasting camera, microphone, boom mic and photo camera.
  components:
  - type: Storage
    maxItemSize: Ginormous
    grid:
    - 0,0,6,1
  - type: StorageFill
    contents:
    - id: RMCCameraBroadcasting
    - id: RMCCorrespondentMicrophone
    - id: CMUBoomMic
    - id: CMUPhotoCamera
    - id: CMUCameraFilm
      amount: 2

- type: entity
  parent: CMUKitAuxiliaryStaffBase
  id: CMUKitAuxiliaryStaffChaplain
  name: chaplain kit
  description: A case holding a chaplain's helmet patch and the holy book of their faith.
  components:
  - type: StorageFill
    contents:
    - id: RMCHelmetGarbChaplainPatch

- type: entity
  parent: CMUKitAuxiliaryStaffBase
  id: CMUKitAuxiliaryStaffMessTechnician
  name: mess technician kit
  description: A case holding a mess technician's chef's apron and hat.
  components:
  - type: StorageFill
    contents:
    - id: RMCChefApron
    - id: ClothingHeadHatChef

# What each choice shows as in the character menu.
- type: entity
  id: CMUAuxiliaryStaffDummyCombatCorrespondent
  name: Combat Correspondent
  description: Embed with the unit and get the story, with a broadcasting camera and a microphone.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/broadcasting_camera.rsi
    state: icon

- type: entity
  id: CMUAuxiliaryStaffDummyChaplain
  name: Chaplain
  description: See to the unit's spirits. Needs a religion other than atheism.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Bibles/bible.rsi
    state: icon

- type: entity
  id: CMUAuxiliaryStaffDummyMessTechnician
  name: Mess Technician
  description: Run the DEFAC. Opens the kitchen shutters for business.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Labcoats/medicalapron.rsi
    state: icon

- type: job
  parent: AU14JobGOVFORCombatCorrespondentBase
  id: AU14JobOPFORCombatCorrespondent
  roundSide: Opfor
  roundForce: OPFOR
  icon: "AU14JobIconOPFORRifleman"
  spawnMenuRoleName: cmu-spawn-role-auxiliary-staff-opfor
  supervisors: au14-job-supervisors-opfor
  startingGear: AU14GearOPFORCombatCorrespondent
  dummyStartingGear: AU14GearOPFORCombatCorrespondentDummy
  accessGroups:
  - AU14OpforSquad
  useLoadoutOfJob: AU14JobGOVFORCombatCorrespondent

- type: startingGear
  id: AU14GearOPFORCombatCorrespondent
  equipment:
    id: AU14IDCardOPFORCombatCorrespondent
    ears: AU14HeadsetOpforCommand

- type: startingGear
  id: AU14GearOPFORCombatCorrespondentDummy
  equipment:
    outerClothing: RMCOuterClothingExternalWebbing
    shoes: AU14BootsJungle
    head: AU14JunglePatrolCap
    jumpsuit: AU14JungleFatigues
    ears: AU14HeadsetOpforCommand

- type: entity
  parent: CMSpawnPointJobBase
  id: AU14SpawnPointOPFORCombatCorrespondent
  name: Spawn Point OPFOR Combat Correspondent
  components:
  - type: SpawnPoint
    job_id: AU14JobOPFORCombatCorrespondent
  - type: Sprite
    state: syn_spawn
