    preset: AU14SkillPresetPlatoonRifleman
  - type: JobPrefix
    prefix: au14-job-prefix-govforcombatcorrespondent
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/au14govforjobicons.rsi
      state: rifleman
  roundForceComponents:
    OPFOR:
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/CMU14/Interface/au14opforjobicons.rsi
        state: rifleman

  requirements:
  - !type:TraitsRequirement
    inverted: true
    traits:
    - Epilepsy
    - NoEnglish
    - CMUProstheticLeftArm
    - CMUProstheticRightArm
    - CMUProstheticLeftLeg
    - CMUProstheticRightLeg
    - SlowRunner
    - Anemic
    - Asthmatic
  ranks:
    RMCRankCivilian: []
  chevrons:
    RMCRankStaffSergeant:
      entity: AU14ChevronUSCMStaffSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: AU14JobGOVFORCombatCorrespondent
        time: 86400 # 24 hours
    RMCRankSergeant:
      entity: AU14ChevronUSCMSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: AU14JobGOVFORCombatCorrespondent
        time: 36000 # 10 hours
    RMCRankCorporal:
      entity: AU14ChevronUSCMCorporal
      requirements: []

