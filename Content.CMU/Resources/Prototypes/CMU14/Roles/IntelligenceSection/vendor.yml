# Section wardrobe: suits for the office and plain civilian clothes for cover work.
# Only Intelligence Section jobs can use it; its picks are counted apart from the civilian wardrobe.
- type: entity
  parent: ColMarTechBase
  id: CMUIntelSectionClothingVendor
  name: Intelligence Section Wardrobe
  description: A wardrobe holding suits and ordinary colony clothes for the Intelligence Section.
  suffix: Intelligence Section
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/corp_wardrobe.rsi
    layers:
    - state: "base"
      map: [ "enum.VendingMachineVisualLayers.BaseUnshaded", "enum.VendingMachineVisualLayers.Base" ]
  - type: CMAutomatedVendor
    jobs:
    - CMUJobIntelCaseOfficer
    - CMUJobIntelParamilitaryOfficer
