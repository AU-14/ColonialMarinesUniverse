# Same protection and weight as the stock UH7. Unlike it, it goes on without UPP fatigues,
# so the team can wear it over whatever cover clothes they arrived in.
# Its Altyn stays stowed in the armor and is raised or lowered with the armor's helmet action,
# the way a pressure suit's helmet is. Taking the armor off pulls the Altyn back in.
- type: entity
  parent: RMCArmorSPPHeavy
  id: CMUIntelGRUHeavyArmor
  name: UH7 GRU armor
  description: >-
    Issued to GRU spetsnaz after a year of field trials, this UH7 variant trades the standard fatigue mounts for a
    universal harness, so it can be worn over civilian dress during covert insertions. The trial teams asked for more
    mobility; the Union gave them a faster fit, but not a lighter plate.
  suffix: Intelligence Section, GRU
  components:
  - type: RemoveComponents
    components:
    - type: ClothingRequireEquipped
  - type: ToggleableClothing
    clothingPrototype: CMUIntelGRUAltyn
    action: ActionToggleSuitPiece
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      toggleable-clothing: !type:ContainerSlot
        ent: null

- type: entity
  parent: AU14Altyn
  id: CMUIntelGRUAltyn
  categories: [ HideSpawnMenu ]
  suffix: Intelligence Section, GRU
  description: An old earth design initially created for special forces and internal security to use in close quarters combat. This one is clipped to a UH7 GRU armor's harness and stows on its back when not worn.

# The GRU snatch sedative. It keeps the target asleep for as long as any of it is in the blood:
# a 10u dose wears off after about 40 seconds. It does no damage, so a second dose only lengthens the sleep.
- type: reagent
  parent: CMReagent
  id: CMUIntelGRUSedative
  name: reagent-name-cmu-intel-gru-sedative
  desc: reagent-desc-cmu-intel-gru-sedative
  physicalDesc: reagent-physical-desc-nondescript
  color: "#3B3B7A"
  flavor: bitter
  unknown: true
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:GenericStatusEffect
        key: Unconscious
        component: RMCUnconscious
        type: Update
        time: 3

# One jab puts the target to sleep long enough to be cuffed and carried off.
- type: entity
  parent: CMAutoInjector
  id: CMUIntelGRUSedativeInjector
  name: sedative autoinjector
  description: An unmarked autoinjector holding a single dose of a fast-acting sedative.
  suffix: Intelligence Section, GRU
  components:
  - type: Hypospray
    transferAmount: 10
    injectSound: /Audio/_RMC14/Medical/air_release.ogg
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: CMUIntelGRUSedative
          Quantity: 10
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
  - type: MedicallyUnskilledDoAfter
    min: 0
    doAfter: 0

