# The GRU heavy set. The UH7 carries a tag the Altyn checks for, the same way the
# scout cloak checks for scout armor; stock UPP pieces stay unpaired.
- type: Tag
  id: CMUIntelGRUHeavyArmor

# Same protection and weight as the stock UH7. Unlike it, it goes on without UPP fatigues,
# so the team can wear it over whatever cover clothes they arrived in.
- type: entity
  parent: RMCArmorSPPHeavy
  id: CMUIntelGRUHeavyArmor
  name: UH7 GRU armor
  description: >-
    Issued to GRU spetsnaz after a year of field trials, this UH7 variant trades the standard fatigue mounts for a
    universal harness, so it can be worn over civilian dress during covert insertions. The trial teams asked for more
    mobility; the Union gave them a faster fit, but not a lighter plate.
  suffix: Intelligence Section, GRU
  components:
  - type: RemoveComponents
    components:
    - type: ClothingRequireEquipped
  - type: Tag
    tags:
    - WhitelistChameleon # inherited from the stock UH7; listing tags replaces the parent's
    - CMUIntelGRUHeavyArmor

- type: entity
  parent: AU14Altyn
  id: CMUIntelGRUAltyn
  suffix: Intelligence Section, GRU
  components:
  - type: ClothingRequireEquipped
    autoUnequip: true
    whitelist:
      tags:
      - CMUIntelGRUHeavyArmor
    denyReason: cmu-intel-gru-altyn-needs-heavy-armor

# One quick jab leaves the target slow and drowsy long enough to be cuffed and carried off.
# Chloral hydrate slows and drowses the target; it does not knock anyone out on its own.
- type: entity
  parent: CMAutoInjector
  id: CMUIntelGRUSedativeInjector
  name: sedative autoinjector
  description: An unmarked autoinjector holding a single dose of a fast-acting sedative.
  suffix: Intelligence Section, GRU
  components:
  - type: Hypospray
    transferAmount: 10
    injectSound: /Audio/_RMC14/Medical/air_release.ogg
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: ChloralHydrate
          Quantity: 10
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
  - type: MedicallyUnskilledDoAfter
    min: 0
    doAfter: 0

