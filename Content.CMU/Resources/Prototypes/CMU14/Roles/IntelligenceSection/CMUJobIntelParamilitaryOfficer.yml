# Paramilitary Officer: leads an agency's armed element. Each agency below has its own job with its own
# name, ranks and equipment rack; they share skills and play time through this base.
- type: job
  abstract: true
  parent: CMUJobIntelBase
  id: CMUJobIntelParamilitaryOfficer
  displayWeight: 24
  roundRole: IntelParamilitaryOfficer
  roundComponents:
  - type: Skills
    skills:
      RMCSkillCqc: 2
      RMCSkillEndurance: 2
      RMCSkillFirearms: 2
      RMCSkillFireman: 2
      RMCSkillConstruction: 2
      RMCSkillEngineer: 2
      RMCSkillIntel: 1
      RMCSkillLeadership: 2
      RMCSkillOverwatch: 1
      RMCSkillPolice: 2
      RMCSkillVehicles: 1
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_lead
  playTimeTracker: CMUJobIntelParamilitaryOfficer
  icon: "RMCJobIconPMCGoonLead"
  roleWeight: 0.25

- type: playTimeTracker
  id: CMUJobIntelParamilitaryOfficer
  isHumanoid: true

