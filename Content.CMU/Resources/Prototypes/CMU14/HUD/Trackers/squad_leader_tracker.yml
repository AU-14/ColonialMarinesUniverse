# Second, always-on squad leader tracker shown above the normal squad tracker for GOVFOR/OPFOR
# squads. Its own category lets it show alongside the SquadTracker alert, which then defaults to
# the fireteam leader. Driven by CMUSquadLeaderTrackerSystem.

- type: alertCategory
  id: CMUSquadLeaderTracker

- type: alert
  parent: SquadTracker
  id: CMUSquadLeaderTracker
  category: CMUSquadLeaderTracker
  name: Squad Leader Tracker
  description: Always tracks your Squad Leader.

