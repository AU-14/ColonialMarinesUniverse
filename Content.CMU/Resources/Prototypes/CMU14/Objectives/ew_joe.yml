# Early Warning Joe objectives (phase E1).
# Design: Docs/GraphAudit-EarlyWarnings-Report.md §6.2 (upstream mind pipeline, D8: three offered, two
# required) and Docs/GraphAudit-EarlyWarningsBalance-Report.md H-6 (what "obtain" may ask for).
# Per-level pools are weightedRandom-of-weightedRandom, exactly as the traitor pools are, and are
# consumed by EWJoeObjectiveSystem.PickFromPool on each level-up (the traitor walk, minus prototypes
# already on offer).

- type: objectiveIssuer
  id: GrandMachine
  name: objective-issuer-grand-machine

# Every EW objective requires the EW mind role, so a stood-down Joe (D10) can never be offered one.
- type: entity
  abstract: true
  parent: BaseObjective
  id: CMUEWJoeBaseObjective
  components:
  - type: Objective
    issuer: GrandMachine
    difficulty: 1
  - type: RoleRequirement
    roles:
    - EWJoeRole

# Murder X person: a living organic player; never a synthetic, a threat, a xeno, a Yautja or a drone.
# The target must actually die (requireDead); evac marooning means nothing on a colony.
- type: entity
  parent: [ CMUEWJoeBaseObjective, BaseKillRandomObjective ]
  id: CMUEWJoeKillPersonObjective
  description: The signal has chosen. Make sure they stop.
  components:
  - type: Objective
    difficulty: 1
    unique: false
  - type: TargetObjective
    title: cmu-ew-joe-objective-kill-person-title
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      blacklist:
        components:
        - Synth
        - Threat
        - Xeno
        - Yautja
        - CMUDroneAndroid
  - type: KillPersonCondition
    requireDead: true

# Murder N people: any organic kill that resolves to the Joe (melee, a fired projectile, a thrown
# weapon in its hand). EWJoeObjectiveSystem increments the counter.
- type: entity
  parent: [ CMUEWJoeBaseObjective, BaseCounterObjective ]
  id: CMUEWJoeKillCountObjective
  components:
  - type: Objective
    difficulty: 1.5
    unique: false
    icon:
      sprite: Objects/Weapons/Guns/Pistols/viper.rsi
      state: icon
  - type: NumberObjective
    min: 2
    max: 3
    title: cmu-ew-joe-objective-kill-count-title
    description: cmu-ew-joe-objective-kill-count-description
  - type: EWJoeKillCounter

# Obtain N items. Three flavours so repeats across levels stay possible without double-counting
# the same loot (collect objectives are unique per prototype).
- type: entity
  abstract: true
  parent: CMUEWJoeBaseObjective
  id: CMUEWJoeBaseCollectObjective
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Objects/Misc/folders.rsi
      state: folder-colormap

- type: entity
  parent: CMUEWJoeBaseCollectObjective
  id: CMUEWJoeCollectFirearmsObjective
  components:
  - type: Objective
    icon:
      sprite: _RMC14/Objects/Weapons/Guns/Pistols/m44.rsi
      state: icon
  - type: EWJoeCollectCondition
    min: 2
    max: 3
    title: cmu-ew-joe-objective-collect-firearms-title
    description: cmu-ew-joe-objective-collect-firearms-description
    whitelist:
      components:
      - Gun

- type: entity
  parent: CMUEWJoeBaseCollectObjective
  id: CMUEWJoeCollectIntelObjective
  components:
  - type: Objective
    icon:
      sprite: CMU14/Items/laptop.rsi
      state: laptop_off_objective
  - type: EWJoeCollectCondition
    min: 1
    max: 2
    title: cmu-ew-joe-objective-collect-intel-title
    description: cmu-ew-joe-objective-collect-intel-description
    whitelist:
      components:
      - IntelDetectorTracked

- type: entity
  parent: CMUEWJoeBaseCollectObjective
  id: CMUEWJoeCollectDisksObjective
  components:
  - type: Objective
    icon:
      sprite: _RMC14/Objects/Misc/computer_disks.rsi
      state: disk3
  - type: EWJoeCollectCondition
    min: 1
    max: 2
    title: cmu-ew-joe-objective-collect-disks-title
    description: cmu-ew-joe-objective-collect-disks-description
    whitelist:
      tags:
      - CMUIntelDisk

# Assimilate a console (D6 + D12). The condition pins one console on the Joe's map; the assimilation
# action and console effects arrive in phase E2.
- type: entity
  parent: CMUEWJoeBaseObjective
  id: CMUEWJoeAssimilateConsoleObjective
  components:
  - type: Objective
    difficulty: 2
    unique: false
    icon:
      sprite: _RMC14/Structures/Machines/computer.rsi
      state: terminal
  - type: EWJoeAssimilateCondition
    title: cmu-ew-joe-objective-assimilate-title
    description: cmu-ew-joe-objective-assimilate-description
    whitelist:
      components:
      - BudgetConsole
      - CorporateConsole
      - ResearchDataTerminal
      - DepartmentConsole
      - ColonyCommsConsole

# Pools. PickFromPool picks a group, then an objective inside it, and skips anything whose
# requirements or target search fail (no valid victim, no firearms on the planet, every console taken).

- type: weightedRandom
  id: CMUEWJoeObjectiveGroupKill
  weights:
    CMUEWJoeKillPersonObjective: 1
    CMUEWJoeKillCountObjective: 0.5

- type: weightedRandom
  id: CMUEWJoeObjectiveGroupCollect
  weights:
    CMUEWJoeCollectFirearmsObjective: 1
    CMUEWJoeCollectIntelObjective: 1
    CMUEWJoeCollectDisksObjective: 0.5

- type: weightedRandom
  id: CMUEWJoeObjectiveGroupConsole
  weights:
    CMUEWJoeAssimilateConsoleObjective: 1

# Dormant -> UNDERTOW: quiet work only.
- type: weightedRandom
  id: CMUEWJoeObjectivesLevel0
  weights:
    CMUEWJoeObjectiveGroupKill: 1
    CMUEWJoeObjectiveGroupCollect: 1

# UNDERTOW -> MURMUR: consoles enter the pool.
- type: weightedRandom
  id: CMUEWJoeObjectivesLevel1
  weights:
    CMUEWJoeObjectiveGroupKill: 1
    CMUEWJoeObjectiveGroupCollect: 1
    CMUEWJoeObjectiveGroupConsole: 0.5

# MURMUR -> CHORUS
- type: weightedRandom
  id: CMUEWJoeObjectivesLevel2
  weights:
    CMUEWJoeObjectiveGroupKill: 1
    CMUEWJoeObjectiveGroupCollect: 1
    CMUEWJoeObjectiveGroupConsole: 1

# CHORUS -> ATTENTION
- type: weightedRandom
  id: CMUEWJoeObjectivesLevel3
  weights:
    CMUEWJoeObjectiveGroupKill: 1
    CMUEWJoeObjectiveGroupCollect: 0.5
    CMUEWJoeObjectiveGroupConsole: 1

# ATTENTION -> MELDING: the level table forces a console objective into this offer (D8).
- type: weightedRandom
  id: CMUEWJoeObjectivesLevel4
  weights:
    CMUEWJoeObjectiveGroupKill: 1
    CMUEWJoeObjectiveGroupCollect: 0.5
    CMUEWJoeObjectiveGroupConsole: 1
