- type: entity
  id: RUMCHighBush
  name: "high bush"
  description: "Very tall and dense thickets. Perhaps someone is watching you from them."
  components:
  - type: Clickable
  - type: Sprite
    noRot: true
    sprite: CMU14/Flora/Structures/high_bush.rsi
    drawdepth: Mobs
    offset: 0,0.3
    layers:
    - state: grass_high_bush1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        grass_high_bush1: ""
        grass_high_bush2: ""
        grass_high_bush3: ""
        grass_high_bush4: ""
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: Inorganic
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/Footsteps/grass1.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/Footsteps/grass1.ogg
          params:
            volume: 5
            variation: 0.05
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Flamability
    chance: 1.0
    rate: 0.4
    range: 0.8
    spread: 0.8
    destroyAnyway: true
  - type: FarmGatherable
    toolWhitelist:
      tags:
      - Knife
    gatherDelay: 3
    deleteAfterHarvest: true
    loot:
      All: !type:AllSelector
        children:
        - id: RUMCPlantFiber1
        - id: RUMCPlantFiber1
        - id: RUMCPlantFiber1

- type: entity
  id: RUMCRandomBushOffsetSpawner
  name: "random bush offset spawner"
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: CMU14/Flora/Structures/high_bush.rsi
      state: grass_high_bush1
  - type: RandomSpawner
    prototypes:
    - RUMCHighBush
    chance: 1
    offset: 0.35
