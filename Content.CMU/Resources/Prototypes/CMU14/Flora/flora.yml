# The wild plants taken from the repository of crystall-punk-14 and adapted: they are gathered with a knife or a hatchet. Generated by gen_flora.py.

- type: Tag
  id: RUMCHerbalGathering

# What every plant that is gathered has: it is on the floor, can be picked with a knife or a hatchet, and cut down.
- type: entity
  abstract: true
  id: RUMCGatherableBase
  components:
  - type: Transform
  - type: Sprite
    snapCardinals: true
    drawdepth: FloorObjects
  - type: InteractionOutline
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Damageable
  - type: Injurable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FarmGatherable
    toolWhitelist:
      tags:
      - Knife
      - BotanyHatchet
      - RUMCHerbalGathering
  - type: Appearance

- type: entity
  abstract: true
  parent: BaseItem
  id: RUMCHerbBase
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    noRot: true
  - type: Flamability
    chance: 1.0
    rate: 0.4
    range: 0.8
    spread: 0.8
    destroyAnyway: true

- type: entity
  id: RUMCWildBloodFlower
  parent: RUMCGatherableBase
  name: "blood rose"
  description: "Scarlet flowers growing where blood has been spilled."
  suffix: Gatherable
  components:
  - type: Sprite
    sprite: CMU14/Flora/Structures/Wild/blood_flower.rsi
    layers:
    - state: world1
      map: ["random"]
  - type: RandomSprite
    available:
    - random:
        world1: ""
        world2: ""
        world3: ""
  - type: FarmGatherable
    deleteAfterHarvest: true
    loot:
      All: !type:GroupSelector
        children:
        - id: RUMCHerbBloodFlower

