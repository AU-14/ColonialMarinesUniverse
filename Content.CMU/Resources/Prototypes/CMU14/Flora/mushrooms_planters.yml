# The mushrooms (the sprites are the sheet of the user) and the place where they grow, and the planters made of boards. Generated by gen_mushrooms_planters.py.

- type: entity
  id: RUMCMushroomSpawner
  name: mushroom ground
  description: A patch of ground where mushrooms grow of themselves, one after another, as long as there is room for them.
  suffix: Spawner
  components:
  - type: Transform
  - type: Sprite
    sprite: CMU14/Flora/Mushrooms/redcap.rsi
    state: mushroom
    drawdepth: FloorObjects
  - type: PeriodicSpawner
    interval: 180
    radius: 3
    maxNearby: 6
    chance: 0.75
    prototypes:
    - RUMCMushroomCaveSprouts
    - RUMCMushroomRedCap
    - RUMCMushroomBrownBunch
    - RUMCMushroomOrangeCap
    - RUMCMushroomBloodCap
    - RUMCMushroomBlueCap
    - RUMCMushroomTanCap

- type: entity
  id: RUMCMushroomCaveSprouts
  parent: RUMCGatherableBase
  name: "cave sprouts"
  description: "Pale green sprouts that grow in the damp dark of the caves."
  suffix: Gatherable
  components:
  - type: Sprite
    sprite: CMU14/Flora/Mushrooms/sprout.rsi
    state: mushroom
  - type: FarmGatherable
    deleteAfterHarvest: true
    loot:
      All: !type:GroupSelector
        children:
        - id: RUMCMushroomItemCaveSprouts

- type: entity
  id: RUMCMushroomItemCaveSprouts
