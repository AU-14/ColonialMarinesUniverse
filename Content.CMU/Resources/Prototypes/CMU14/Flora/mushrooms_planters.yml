# ---------------------------------------------------------------- the planters
- type: entity
  abstract: true
  id: RUMCPlanterBase
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: CollideOnAnchor
  - type: Sprite
    noRot: true
    drawdepth: FloorObjects
  - type: Appearance
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Flamability
    chance: 0.8
    rate: 0.4
    range: 0.8
    spread: 0.8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPlankWood1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  abstract: true
  parent: RUMCPlanterBase
  id: RUMCPlanterSolidBase
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 120
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Physics
    bodyType: Static
    canCollide: true

- type: entity
  parent: RUMCPlanterBase
  id: RUMCPlanterPlot
  name: "plank bed"
  description: "A flat bed of boards for the earth. It is empty: put a shovel to it, and it takes the earth."
  suffix: Empty
  components:
  - type: Sprite
    sprite: CMU14/Structures/Planters/plot_empty.rsi
    state: planter
  - type: FarmPlanterSoil
    filled: false
    swap: RUMCPlanterPlotFilled

- type: entity
  parent: RUMCPlanterBase
  id: RUMCPlanterPlotFilled
  name: "plank bed"
  description: "A flat bed of boards for the earth. It holds earth: plant seeds in it, and water them."
  suffix: Filled
  components:
  - type: Sprite
    sprite: CMU14/Structures/Planters/plot_filled.rsi
    state: planter
  - type: FarmPlanterSoil
    filled: true
    swap: RUMCPlanterPlot
  - type: PlantTray
    drawWarnings: false
  - type: Solution
    id: soil
    solution:
      maxVol: 200
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil


