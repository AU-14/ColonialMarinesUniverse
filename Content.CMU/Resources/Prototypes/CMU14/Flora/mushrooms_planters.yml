# ---------------------------------------------------------------- crafts: boards make the planters
- type: craftRecipe
  id: RUMCCraftPlanterPlot
  name: au14-craft-recipe-planter-plot
  output: RUMCPlanterPlot
  time: 8
  tools:
  - Hammering
  consumables:
  - stack: RMCWood
    amount: 3

- type: craftRecipe
  id: RUMCCraftPlanterTub
  name: au14-craft-recipe-planter-tub
