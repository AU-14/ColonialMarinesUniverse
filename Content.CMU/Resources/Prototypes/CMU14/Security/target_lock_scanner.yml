# Brand New M3A4 Multi Visor - Prototype: the old M1 multi-spectrum visor with a target lock. Clip it onto a helmet,
# flip it down, and the wearer gets "Lock on": pick someone and after 3 seconds it takes their picture and reads their
# records, health and whether they are armed.
- type: entity
  parent: RMCHelmetGarbNightVisionPVE
  id: CMUTargetLockVisor
  name: Brand New M3A4 Multi Visor - Prototype
  description: The next generation of the M1 multi-spectrum visor. Clip it onto a helmet and flip it down, then use Lock on to hold the view on someone for three seconds. It takes their picture and reads their records, health and whether they are armed.
  components:
  - type: CMUTargetLock

- type: entity
  id: ActionCMUTargetLock
  parent: ActionMarineBase
  name: Lock on
  description: Hold the visor on someone for three seconds to take their picture and read their records, health and whether they are armed.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_actions.rsi
      state: focus
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: EntityTargetAction
    event: !type:Content.Shared.CMU14.TargetLock.CMUTargetLockActionEvent
