# Veins of ore. Every vein is a wall with an overlay in the colour of its ore (Structures/ore_veins.rsi) and an
# ore that drops when it is mined, built the way the vanilla veins are. The metals and most of the crystals lie in
# the stone layer; the gold and silver lie there rarely, and also in the black stone layer, which holds the
# titanium, the platinum, the uranium and the gems.

- type: entity
  abstract: true
  id: RUMCBaseVeinIron
  suffix: Iron
  description: An ore vein rich with iron.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: RUMCOreIron
  - type: Sprite
    layers:
    - state: ore_iron
      sprite: CMU14/Structures/ore_veins.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

