# A pool in the stone layer: shallow water that slows whoever wades through it and is never read as an open cavern.
- type: entity
  parent: FloorWaterEntity
  id: RUMCCaveWater
  name: underground water
  description: Cold, still water that has gathered in the rock.
  components:
  - type: ZLoadBearingTerrain

# A lake of lava in the black stone layer. It burns whoever steps in, and like the pools it is never read as an open cavern.
- type: entity
  parent: FloorLavaEntity
  id: RUMCCaveLava
  name: lava
  description: Molten rock welling up from far below. Do not step in it.
  components:
  - type: ZLoadBearingTerrain

# The floor of the black stone layer: the basalt of the stone layer, darkened.
- type: tile
  parent: BaseFloorPlanet
  id: RUMCFloorBlackBasalt
  name: tiles-au14-black-basalt-floor
  sprite: /Textures/CMU14/Production/Tiles/BlackBasalt/cave.png
  edgeSpritePriority: 5
  edgeSprites:
    SouthEast: /Textures/CMU14/Production/Tiles/BlackBasalt/single_edge_SE.png
    NorthEast: /Textures/CMU14/Production/Tiles/BlackBasalt/single_edge_NE.png
    NorthWest: /Textures/CMU14/Production/Tiles/BlackBasalt/single_edge_NW.png
    SouthWest: /Textures/CMU14/Production/Tiles/BlackBasalt/single_edge_SW.png
    South: /Textures/CMU14/Production/Tiles/BlackBasalt/double_edge_S.png
    East: /Textures/CMU14/Production/Tiles/BlackBasalt/double_edge_E.png
    North: /Textures/CMU14/Production/Tiles/BlackBasalt/double_edge_N.png
    West: /Textures/CMU14/Production/Tiles/BlackBasalt/double_edge_W.png

