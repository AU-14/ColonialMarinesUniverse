# Coking coal: a vein of the coal that gives coke straight from the rock, so that the first coke of the electric stage does not wait for a pyrolysis oven (which needs a circuit, which needs a resistor, which needs coke).
- type: ore
  id: RUMCOreCokeCoal
  oreEntity: RUMCCokeCoal1
  minOreYield: 1
  maxOreYield: 3

- type: entity
  abstract: true
  id: RUMCBaseVeinCokeCoal
  suffix: Coking coal
  description: An ore vein rich with coking coal.
  components:
  - type: OreVein
