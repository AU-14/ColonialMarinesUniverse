# Building overhaul (z-level): the construction graphs of the z-level staircases (the stair entities in z_stairs.yml point at them).
# There are no recipes for them any more: the stairs are not built from the menu, they come with the maps and with the steps of a pit.

- type: constructionGraph
  id: AU14ZStairUpGraph
  start: start
  graph:
  - node: start
    edges:
    - to: stair
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 50
        doAfter: 8
      - material: CMPlasteel
        amount: 50
        doAfter: 8
  - node: stair
    entity: AU14ZStairUp

- type: constructionGraph
  id: AU14ZStairDownGraph
  start: start
  graph:
  - node: start
    edges:
    - to: stair
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 50
        doAfter: 8
      - material: CMPlasteel
        amount: 50
        doAfter: 8
  - node: stair
    entity: AU14ZStairDown
