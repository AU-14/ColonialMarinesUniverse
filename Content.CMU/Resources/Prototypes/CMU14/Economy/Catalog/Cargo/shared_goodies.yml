# Shared ASRS category abstracts - parent these into any RequisitionsComputer catalog:
# Categories carry AlwaysPushInheritance, so they append onto a child catalog's own list.
- type: entity
  abstract: true
  id: CMUASRSResearchGoodies
  components:
  - type: RequisitionsComputer
    categories:
    - name: Research
      entries:
      - cost: 1000
        crate: RMCCrateInflatableBarriers
      - cost: 100
        crate: CMUCrateResearchTerminal
      - cost: 900
        crate: CMUCrateSim
      - cost: 4000
        crate: CMUMonkeyCubeCrate
        maxStock: 1
        stockReplenishDelay: 1800
      - cost: 8000
        crate: CMUExoticCubeCrate
        maxStock: 1
        stockReplenishDelay: 1800
      - cost: 250
        crate: CMUCrateChemGlasses
      - cost: 400
        crate: CMUCrateBiosuitScientist
      - cost: 4500
        crate: CMUCratePreciousMetals
      - cost: 700
        crate: CMUCrateHazardGear
      - cost: 500
        crate: CMUCrateEngineeringWiring

