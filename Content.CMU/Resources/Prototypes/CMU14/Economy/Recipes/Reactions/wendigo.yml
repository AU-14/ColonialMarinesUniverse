- type: reaction
  id: CMUStabilizedMutagen
  quantized: true
  maxTemp: 270 # only below 270 K: chill it first (chemistry chiller or ice brine)
  conserveEnergy: false # do not self-heat past the gate
  requiredMixerCategories: # only reacts when mixed (lid-closed Mix verb or a detonating payload)
  - CMUMix
  reactants:
    CMDylovene:
      amount: 10
    RMCUranium:
      amount: 5
    RMCGold:
      amount: 1
    CMUUnstableMutagen:
      amount: 5
  products:
    CMUStabilizedMutagen: 15

