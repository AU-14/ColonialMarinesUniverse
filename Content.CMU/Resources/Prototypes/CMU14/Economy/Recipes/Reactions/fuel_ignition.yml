# CMU14 FLOW-22: stock flamer fuels ignite when heated, like generated fuels' {ID}Ignition reactions.
# The fire is the Container fire spec of the whole reacting solution (CMUSolutionTileFire adds the burnt fuel back),
# a circle of sqrt(units) radius: the same intensity and duration the fuel has in a non-specialist flamer.
# minTemp 500 K is far above room temperature and above every hand-authored synthesis that makes these fuels.
# Priority -2 sits below hand-authored (>= 0) and generated (-1) reactions, so a heated mixing or synthesis
# reaction always takes its reactants first. conserveEnergy: false keeps burning from heating what is left.
# RMCCLF3 and RMCMethane are not fuels on their own (negative duration/intensity) and get no reaction.

- type: reaction
  id: RMCNapalmIgnition
  priority: -2
  minTemp: 500
  conserveEnergy: false
  impact: High
  reactants:
    RMCNapalm:
      amount: 1
  effects:
  - !type:CMUSolutionTileFire
    reagent: RMCNapalm

