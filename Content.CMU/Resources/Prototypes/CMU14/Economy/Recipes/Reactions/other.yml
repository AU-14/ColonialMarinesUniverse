- type: reaction
  id: CMUFormaldehyde
  conserveEnergy: false # CMU14: the chain must not heat itself past its own heat gate; any outside heat (hotplate, hot reagent) counts
  reactants:
    RMCMethane:
      amount: 1
    RMCOxygen:
      amount: 1
# it's haunted
    RMCPhoron:
      amount: 1
    RMCSilver:
      amount: 5
      catalyst: true
  products:
    CMUFormaldehyde: 3

# Endothermic in CM13; modelled as a 374 K heat gate (above a microwave's 373 K); any heat source works.
- type: reaction
  id: CMUPhenolFormaldehyde
  conserveEnergy: false # CMU14: the chain must not heat itself past its own heat gate; any outside heat (hotplate, hot reagent) counts
  minTemp: 374
  reactants:
    CMUFormaldehyde:
      amount: 2
    CMUPhenol:
      amount: 1
    RMCMethane:
      amount: 5
      catalyst: true
  products:
    CMUPhenolFormaldehyde: 1

