# CMU versions of the cryogenic medicine recipes using available ingredients.
# Marine Cryoxadone is made by the existing CMCryoxadone reaction.
# CMU14: Keep the former CMU reaction ID for downstream recipes while producing Marine Cryoxadone.
- type: reaction
  id: CMUCryoxadone
  reactants:
    CMDexalin:
      amount: 1
    Water:
      amount: 1
    RMCOxygen:
      amount: 1
  products:
    CMCryoxadone: 3

- type: reaction
  id: CMUAloxadone
  impact: Medium
  reactants:
    CMCryoxadone:
      amount: 2
    Aloe:
      amount: 1
    CMLeporazine:
      amount: 2
  products:
    Aloxadone: 4

- type: reaction
  id: CMUTraumoxadone
  reactants:
    CMCryoxadone:
      amount: 1
    CMUPhenol:
      amount: 1
    RMCLipozine:
      amount: 1
  products:
    Traumoxadone: 2

- type: reaction
  id: CMUUrishoxadone
  reactants:
    CMCryoxadone:
      amount: 3
    CMUUrishiol:
      amount: 5
    CMArithrazine:
      amount: 2
  products:
    Urishoxadone: 5

- type: reaction
  id: CMUDoxarubixadone
  reactants:
    CMCryoxadone:
      amount: 1
    CMUUnstableMutagen:
      amount: 1
  products:
    Doxarubixadone: 2

- type: reaction
  id: CMUNecrosol
  impact: Medium
  minTemp: 370
  reactants:
    CMUCardiocaine:
      amount: 3
    RMCMindbreakerToxin:
      amount: 1
    CMCryoxadone:
      amount: 2
  products:
    Necrosol: 2

- type: reaction
  id: CMUOpporozidone
  minTemp: 400
  reactants:
    RMCMindbreakerToxin:
      amount: 1
    RMCPhoron:
      amount: 1
    Doxarubixadone:
      amount: 1
  products:
    Opporozidone: 3
