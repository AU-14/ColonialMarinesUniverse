# Base chemistry for custom chemical grenades (RMCCustomGrenade casing + upstream ChemicalPayload).
# The payload merges its two beakers on trigger and any reaction below fires in place. Smoke and foam carry
# every other reagent in the payload with them and apply it by touch/inhalation, so research chemicals
# (including procedurally generated ones) can be delivered this way without further code.
#
# Upstream already defines Foam (Fluorosurfactant + Water), Smoke, MetalFoam and the RMC metal foams; the
# upstream recipes for the intermediates use upstream element ids that RMC dispensers do not stock, so the
# intermediates are re-derived here from RMC elements.

- type: reaction
  id: CMUFluorosurfactant
  impact: Low
  reactants:
    RMCCarbon:
      amount: 2
    RMCFluorine:
      amount: 2
    RMCSulphuricAcid:
      amount: 1
  products:
    Fluorosurfactant: 5

- type: reaction
  id: CMUFoamingAgent
  impact: Low
  reactants:
    RMCLithium:
      amount: 1
    RMCHydrogen:
      amount: 1
  products:
    FoamingAgent: 2

# Reagent-driven smoke. Unlike RMCSmoke this is not gated behind black goo.
- type: reaction
  id: CMUSmoke
  impact: Medium
  priority: 1
  reactants:
    RMCPhosphorus:
      amount: 1
    RMCPotassium:
      amount: 1
    RMCSugar:
      amount: 1
  effects:
    - !type:AreaReactionEffect
      duration: 20
      prototypeId: RMCSmokeChemical
      sound:
        path: /Audio/Effects/smoke.ogg

# Hand-authored tear gas agent; carries the Irritating property so it behaves like the canister grenade
# when delivered through CMUSmoke.
- type: reaction
  id: CMUTearGas
  impact: Medium
  reactants:
    RMCChlorine:
      amount: 1
    RMCCarbon:
      amount: 1
    RMCOxygen:
      amount: 1
  products:
    CMUTearGas: 3
