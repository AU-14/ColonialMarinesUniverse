# C-UGVs can build a finished wall with the same sandbag cost as this graph.
# HESCO kits remain available for the ordinary staged placement and filling workflow.
- type: constructionGraph
  parent: RMC
  id: AU14HESCOGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity
    edges:
    - to: nodeFilled
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSandbagFull
        amount: 25
        doAfter: 25

  - node: nodeFilled
    entity: AU14HESCOBarrier
    edges:
    - to: start
      completed:
      - !type:ConditionalAction
        condition:
          !type:MinHealth
          threshold: 1
          byProportion: true
        action:
          !type:SpawnPrototype
          prototype: CMSandbagFull
          amount: 50
        else:
          !type:ConditionalAction
          condition:
            !type:MinHealth
            threshold: 0.75
            byProportion: true
          action:
            !type:SpawnPrototype
            prototype: CMSandbagFull
            amount: 35
          else:
            !type:ConditionalAction
            condition:
              !type:MinHealth
              threshold: 0.5
              byProportion: true
            action:
              !type:SpawnPrototype
              prototype: CMSandbagFull
              amount: 20
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Prying
        doAfter: 2

- type: construction
  id: AU14HescoUGVRecipe
  name: HESCO wall
  description: A fully raised and packed HESCO wall.
  graph: AU14HESCOGraph
  startNode: start
  targetNode: nodeFilled
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  isCM: true
  spawnlist: AU14
  conditions:
  - !type:TileNotBlocked
  - !type:TileBarricadeClear
