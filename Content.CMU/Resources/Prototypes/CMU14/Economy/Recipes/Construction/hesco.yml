# No construction menu recipe: HESCOs are only built from HESCO kits. The graph stays for taking a finished wall
# (and the submerged barricades that share it) apart.
- type: constructionGraph
  parent: RMC
  id: AU14HESCOGraph
  start: start
  graph:
  - node: start
    actions:
    - !type:DeleteEntity
    edges:
    - to: nodeFilled
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSandbagFull
        amount: 25
        doAfter: 25

  - node: nodeFilled
    entity: AU14HESCOBarrier
    edges:
    - to: start
      completed:
      - !type:ConditionalAction
        condition:
          !type:MinHealth
          threshold: 1
          byProportion: true
        action:
          !type:SpawnPrototype
          prototype: CMSandbagFull
          amount: 50
        else:
          !type:ConditionalAction
          condition:
            !type:MinHealth
            threshold: 0.75
            byProportion: true
          action:
            !type:SpawnPrototype
            prototype: CMSandbagFull
            amount: 35
          else:
            !type:ConditionalAction
            condition:
              !type:MinHealth
              threshold: 0.5
              byProportion: true
            action:
              !type:SpawnPrototype
              prototype: CMSandbagFull
              amount: 20
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Prying
        doAfter: 2
