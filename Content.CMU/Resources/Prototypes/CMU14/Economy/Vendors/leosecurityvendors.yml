- type: entity
  parent: ColMarTechBase
  id: AU14CMBequipmentvendor
  name: CMB equipment vendor
  description: >-
    An automated dispenser rack, hooked up to a small storage of Colonial Marshall Bureau equipment.
    Stocked with apparel and law enforcement field gear for rapid deployment.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/requisitions_ammo.rsi
  - type: CMAutomatedVendor
    jobs: [ AU14JobLEOLeaderBase, AU14JobLEOBase, AU14JobCivilianCMBDeputy, AU14JobCivilianCMBDetective, AU14JobCivilianCMBMarshal, AU14JobCivilianCWPSRanger, AU14JobCivilianCWPSMarshal, AU14JobCivilianNSPAConstable, AU14JobCivilianNSPAInspector ]
    sections:
    - name: Rail Attachments
      entries:
      - id: CMUAttachmentNightVisionScope
        amount: 3
      - id: AU14AttachmentTwoPointSling
        amount: 5
      - id: RMCAttachmentRailFlashlight
        amount: 8
    - name: Clothes
      takeAll: CMUCMBEssentialEquipmentClothes
      entries:
      - id: AU14CMBUniform
      - id: RMCHeadCapBureau
      - id: RMCBootsPMCFilled
      - id: CMGlassesSecurity
    - name: Outerwear
      choices: { CMUCMBDutyJacket: 1 }
      entries:
      - id: AU14CMBDeputyWindbreaker
      - id: CMUCoatCMBDeputyParka
    - name: Belt
      takeAll: CMUCMBEssentialEquipmentBelt
      entries:
      - id: CMBeltSecurityMarshalFilled
    - name: Holster
      choices: { CMUCMBDutyHolster: 1 }
      entries:
      - id: AU14BeltHolsterPistolBlack
      - id: RMCBeltHolsterRevolver
    - name: Bag
      choices: { CMUCMBDutyStorageBag: 1 }
      entries:
      - id: CMSatchelSecurity
      - id: AU14SlingSatchelBlack
      - id: RMCSatchelTSEPA
    - name: Webbing
      choices: { CMUCMBDutyStorageWebbing: 1 }
      entries:
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
      - id: RMCWebbingLegPouchBlack
    - name: Pouches
      choices: { CMUCMBDutyPouches: 2 }
      entries:
      - id: AU14PouchIFAKFill
      - id: RMCPouchRadio
      - id: RMCPouchGeneralMedium
      - id: RMCPouchPistol
      - id: RMCPouchMagazinePistol
    - name: Equipment
      takeAll: CMUCMBEssentialEquipment
      entries:
      - id: RMCBinocularsCivPVE
      - id: RMCHandcuffs
      - id: RMCRadioHandheldColonyOff
      - id: CMUTeleBatonLawEnforcement
    - name: Duty Weapons
      choices: { CMUCMBDutyWeapons: 1 }
      entries:
      - id: AU14GunCasePistolHG45
      - id: RMCGunCasePistolM1984
      - id: CMUGunCasePistolTPR9Civilian
      - id: AU14GunCasePistolM44Civ
    - name: Long Arms
      choices: { CMUCMBLongArms: 1 }
      entries:
      - id: CMUKitWeaponHG3712LEO
      - id: CMUKitWeaponKramerEnforcerLEO
      - id: CMUKitWeaponMP5LEO
      - id: CMUKitWeaponM20A2LEO
    - name: Less-Lethal Ammunition
      entries:
      - id: CMU14MagazinePistolMK45Rubber
        amount: 6
      - id: CMU14MagazinePistolM1984Rubber
        amount: 6
    - name: Restraining Gear
      entries:
      - id: CMUPepperSpray
        amount: 10
      - id: CMUPepperSprayAntidote
        amount: 10
      - id: RMCHandcuffs
        amount: 10
      - id: RMCZipties
        amount: 30
    - name: Investigation
      entries:
      - id: BoxEvidenceMarkers
        amount: 4
      - id: ForensicScanner
        amount: 2
      - id: ClothingHandsGlovesNitrile
        amount: 10
    - name: Vehicle Equipment
      entries:
      - id: CMUDashCamera
        amount: 3
    - name: Inmate Clothing
      entries:
      - id: AU14CivilianPrisonJumpsuit
        amount: 40
      - id: RMCShoesBlack
        amount: 40

