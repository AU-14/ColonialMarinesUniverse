# Money each character starts with in their ID card's bank account, by pay tier.
# The highest priority tier that lists the job (or one of its departments) is used. Anything unlisted gets the default tier.

# Synthetics and Working Joes are not paid.
- type: cmuStartingFunds
  id: CMUStartingFundsNone
  min: 0
  max: 0
  priority: 60
  jobs:
  - AU14JobCivilianColonySynthetic
  - AU14JobColonyWorkingJoe
  - AU14JobGOVFORAuxSupportSynth
  - AU14JobGOVFORWorkingJoe
  - AU14JobOPFORAuxSupportSynth
  - AU14JobOPFORWorkingJoe

