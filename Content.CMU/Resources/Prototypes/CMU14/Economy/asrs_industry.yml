- type: entity
  parent: AppraisalTool
  id: CMUASRSAppraisalTool
  name: ASRS appraisal tool
  description: Reads the exact ASRS sale value of marked industrial products. It refuses anything the ASRS will not buy.
  components:
  - type: PriceGun
    onlyASRSSellable: true

- type: entity
  parent: OreBox
  id: RUMCMachineMagneticOreBox
  name: RUMC magnetic ore box
  description: A high-capacity ore box that magnetically collects RUMC ores and crystals.
  components:
  - type: Storage
    grid:
    - 0,0,19,15
    maxItemSize: Normal
    whitelist:
      tags:
      - Ore
      - RUMCCrystal
  - type: MagnetPickup
    slotFlags: null
    requireActiveHand: false
    range: 3

- type: entity
  parent: BaseItem
  id: CMUASRSSellableDebugTool
  name: ASRS sellability marker
  description: A debug tool that permanently marks any targeted entity as sellable through an ASRS platform.
  suffix: DEBUG, CMU
  categories: [ Debug ]
  components:
  - type: Sprite
    sprite: Objects/Tools/appraisal-tool.rsi
    state: icon
    color: "#ff6b6b"
  - type: Item
    sprite: Objects/Tools/appraisal-tool.rsi
    size: Small
  - type: Clothing
    sprite: Objects/Tools/appraisal-tool.rsi
    quickEquip: false
    slots:
    - Belt
  - type: ASRSSellableDebugTool
