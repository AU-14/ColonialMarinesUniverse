- type: entity
  parent: BaseItem
  id: RUMCCrucible
  name: crucible
  description: A heavy clay crucible for melting metal. Drop ore or scrap in, set it in a lit fire, and once it's glowing hot pour it out into a mold.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Smelting/crucible.rsi
    noRot: true
    layers:
    - state: crucible
      map: ["base"]
    - state: crucible_full
      map: ["active"]
      visible: false
  - type: Item
    size: Large
  - type: Forge
    capacity: 40
    ingredients:
    # Copper, glass (sand), zinc and iron are melted in the crucible; the quartz is not. Iron melts at 1538: only the stone smeltery gets the crucible that hot.
    - input: RUMCCopperOre
      reagent: Copper
      reagentPerUnit: 10
    - input: RUMCSand
      reagent: RUMCSiliconMelt
      reagentPerUnit: 10
    # One copper ore and one zinc ore together are the melt of two brass ingots.
    - input: RUMCZincOre
      reagent: RUMCZincMelt
      reagentPerUnit: 10
    # One iron ore is the melt of one iron ingot. So is one sheet of metal (scrap melts down into iron).
    - input: RUMCIronOre
      reagent: RUMCIronMelt
      reagentPerUnit: 10
    - input: CMSteel
      reagent: RUMCIronMelt
      reagentPerUnit: 10
  - type: Forgeable
    # The stone smeltery heats to 2000, and the silicon in the crucible melts at 1800.
    maxTemperature: 2000
    burnDamage:
      types:
        Heat: 15
  - type: Solution
    id: melt
    solution:
      maxVol: 40
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ForgeableVisuals.Active:
        active:
          True: { visible: true }
          False: { visible: false }
  - type: EmitSoundOnLand
    sound:
      collection: MetalThud
      params:
        volume: 2
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseItem
  id: RUMCIngotMold
  name: ingot mold
  description: A simple sand mold. Pour molten copper, zinc, iron or glass from a crucible into it and give it a moment to cool, and it casts a copper ingot, a zinc ingot, an iron ingot or a sheet of glass. Copper and zinc melted together, equal parts of each, cast a brass ingot. Iron is only hot enough in the crucible of a stone smeltery.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Smelting/mold.rsi
    noRot: true
    layers:
    - state: mold
      map: ["base"]
    - state: mold_hot
      map: ["hot"]
      visible: false
    - state: mold_full
      map: ["full"]
      visible: false
  - type: Item
    size: Normal
  - type: Mold
    capacity: 60
    recipes:
    - ingredients:
        Copper: 10
      output: RUMCCopperIngot
      outputCount: 1
      coolTime: 6
      name: copper ingot
    - ingredients:
        RUMCSiliconMelt: 40
      output: CMSheetGlass1
      outputCount: 1
      coolTime: 6
      name: glass sheet
    - ingredients:
        RUMCZincMelt: 10
      output: RUMCZincIngot
      outputCount: 1
      coolTime: 6
      name: zinc ingot
    - ingredients:
        Copper: 5
        RUMCZincMelt: 5
      output: RUMCBrassIngot
      outputCount: 1
      coolTime: 6
      name: brass ingot
    - ingredients:
        RUMCIronMelt: 10
      output: RUMCIronIngot
      outputCount: 1
      coolTime: 8
      name: iron ingot
  - type: Solution
    id: cast
    solution:
      maxVol: 60
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MoldVisuals.State:
        base:
          Empty: { visible: true }
          Cooling: { visible: false }
          Ready: { visible: false }
        hot:
          Empty: { visible: false }
          Cooling: { visible: true }
          Ready: { visible: false }
        full:
          Empty: { visible: false }
          Cooling: { visible: false }
          Ready: { visible: true }
  - type: EmitSoundOnLand
    sound:
      collection: MetalThud
      params:
        volume: 2
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

