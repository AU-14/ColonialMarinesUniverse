# The stone tools: rough versions of the forge tongs and the smithing hammer, made of stone fragments. They give out after
# five uses.
- type: entity
  parent: RUMCForgeTongs
  id: RUMCStoneTongs
  name: stone tongs
  description: Tongs of rough stone for handling a hot crucible or ingot. They will not last, and are gone after five uses.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Smelting/stone_tongs.rsi
    state: tongs
  - type: BreaksAfterUses
    usesLeft: 5

- type: entity
  parent: RUMCForgeHammer
  id: RUMCStoneHammer
  name: stone hammer
  description: A hammer with a head of rough stone, for working hot metal on an anvil. It will not last, and is gone after five uses.
  components:
