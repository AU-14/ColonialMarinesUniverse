  description: A furnace of baked clay built to take a crucible. Feed it fuel and light it, then work it with forge tongs. It heats up to 1500 degrees.
  components:
  - type: Sprite
    noRot: true
    sprite: CMU14/Production/Smelting/smeltery.rsi
    state: smeltery
  - type: Smeltery
    maxTemperature: 1500
  - type: PortableStructure
  - type: Campfire
    fuel: 5
  - type: PointLight
    enabled: false
    radius: 8
    energy: 3
    color: "#FF8C1A"
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
