- type: material
  id: RUMCIron
  stackEntity: RUMCIronIngot
  name: iron ingot
  unit: materials-unit-bar
  icon: { sprite: CMU14/Objects/Materials/iron_ingot.rsi, state: ingot }
  price: 0.00133

- type: entity
  parent: BaseItem
  id: RUMCIronIngot
  name: iron ingot
  description: A rough ingot of cast iron, still warm from the mold.
  components:
  - type: Sprite
    noRot: true
    sprite: CMU14/Objects/Materials/iron_ingot.rsi
    layers:
    - state: ingot
      map: ["base"]
    - state: ingot_hot
      map: ["hot"]
      visible: false
  - type: Item
    size: Small
  - type: Stack
    stackType: RUMCIronIngot
    count: 1
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      RUMCIron: 100
  - type: Forgeable
    burnDamage:
      types:
        Heat: 12
  - type: AnvilWorkpiece
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ForgeableVisuals.Active:
        base:
          True: { visible: false }
          False: { visible: true }
        hot:
          True: { visible: true }
          False: { visible: false }
  - type: Tag
    tags:
    - Metal

