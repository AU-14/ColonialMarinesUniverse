  outputCount: 1
  ingot: RUMCBrassIngot
  steps:
  - Hammering
  - Hammering
  - Hammering
  - Hammering

# Everything of steel is forged at the anvil: a heated ingot, worked with the hammer and the chisel. (The steel is the iron ingot, as it is for the drill head.)
