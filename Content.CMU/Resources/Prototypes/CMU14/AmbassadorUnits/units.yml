# The units that an ambassador calls in by the points of influence (see world_mother_offers.yml): nameless mercenaries (one look for all the ambassadors, but they belong to the faction that
# called them and have its headset and its IFF), and the unarmed medics and engineers of the three great factions. Made by tools; the look of the mercenaries is that of the freelancers,
# the medics and the engineers have the look of their faction and no weapon.

- type: entity
  parent: AU14HeadsetGovforMarine
  id: RUMCHeadsetUnitUPP
