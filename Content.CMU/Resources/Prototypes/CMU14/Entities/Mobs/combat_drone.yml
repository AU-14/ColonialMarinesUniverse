- type: damageContainer
  id: CMUCombatDrone
  supportedGroups:
  - Brute
  - Burn

- type: entity
  abstract: true
  parent: BaseMob
  id: CMUBaseCombatDrone
  components:
  - type: CMUDroneAndroid
    supportsModules: false
  - type: CMUCombatDrone
    fireArcDegrees: 180
    repairAmount: 30
    repairDelay: 5
    repairWireCost: 5
    weldFuel: 5
  - type: Damageable
  - type: Injurable
    damageContainer: CMUCombatDrone
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    allowRevives: true
    thresholds:
      0: Alive
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: NoRotateOnMove
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask: [MobMask]
        layer: [MobLayer]
  - type: Pullable
  - type: NoSlip
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: RMCImmuneToFireTileDamage
  - type: CombatMode
    isInCombatMode: true
    toggleMouseRotator: false
  - type: Gun
    useKey: false
    cameraRecoilScalar: 0.2
    fireRate: 4
    selectedMode: FullAuto
    availableModes: [FullAuto]
    soundGunshot:
      collection: AU14M41FireSound
  - type: GunIFF
    intrinsic: true
    enabled: true
    preventFriendlyFire: true
  - type: UserIFF
    factions: [GOVFOR]
  - type: EntityIFF
  - type: NpcFactionMember
    factions: [GOVFOR]
  # RMC acid sprays target combatants carrying Marine or Xeno, including synthetics.
  - type: Marine
  - type: Skills
    skills:
      RMCSkillFirearms: 1
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: HTN
    rootTask:
      task: CMUDroneFollowCompound
    enabled: false
  - type: Tag
    tags: [DoorBumpOpener]

- type: entity
  parent: CMUBaseCombatDrone
  id: CMUCombatDrone
  name: gun UGV
  description: A remotely operated tracked UGV with an IFF-equipped pulse gun and a 180-degree forward firing arc. Weld dents in the frame and replace damaged wiring with cable.
  suffix: CMU14, Unloaded
  components:
  - type: CMUCombatDrone
    turretVisualPrototype: CMUCombatDroneTurretVisual
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    noRot: true
    layers:
    - state: healthy-hull
      map: [hull]
  - type: GenericVisualizer
    visuals:
      enum.CMUCombatDroneVisuals.DamageState:
        hull:
          Healthy: {state: healthy-hull}
          Damaged: {state: damaged-hull}
          Destroyed: {state: destroyed}
  - type: RMCSelectiveFire
    baseFireModes: [FullAuto]
    baseFireRate: 4
    recoilWielded: 0.2
    recoilUnwielded: 0.2
    scatterWielded: 6
    scatterUnwielded: 6
    burstScatterMult: 1
    modifiers:
      FullAuto:
        maxScatterModifier: 12
        unwieldedScatterMultiplier: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.3
    accuracyMultiplierUnwielded: 1.3
  - type: GunDamageModifier
    multiplier: 1.1
  - type: MagazineAmmoProvider
    autoEject: true
    ejectToHand: false
  - type: ItemSlots
    slots:
      gun_magazine:
        name: cmu-combat-drone-ammo-slot
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        whitelist:
          components: [CMUCombatDroneAmmoBox]

- type: entity
  id: CMUCombatDroneTurretVisual
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    noRot: true
    drawdepth: Mobs
    layers:
    - state: healthy-turret
      map: [turret]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMUCombatDroneVisuals.Wrecked:
        turret:
          True: {visible: false}
          False: {visible: true}
      enum.CMUCombatDroneVisuals.DamageState:
        turret:
          Healthy: {state: healthy-turret}
          Damaged: {state: damaged-turret}
  - type: Tag
    tags: [HideContextMenu]
