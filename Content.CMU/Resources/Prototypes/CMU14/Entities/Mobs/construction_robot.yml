- type: entity
  id: CMUConstructionRobot
  parent: BaseMob
  name: construction UGV
  description: An autonomous construction UGV with room for 20 stacks of materials and 1000 units of welding fuel.
  suffix: CMU14
  components:
  - type: RMCNightVisionVisible
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    noRot: true
    layers:
    - state: healthy-hull
  - type: Damageable
  - type: Injurable
    damageContainer: CMUCombatDrone
  - type: Destructible
    generateOverkillThreshold: false # Always release the material cargo and leave the chassis.
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          CMUConstructionRobotWreck: { min: 1, max: 1 }
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: NoRotateOnMove
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask: [MobMask]
        layer: [MobLayer]
  - type: Pullable
  - type: Puller
    needsHands: false
  - type: Hands
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,7
    whitelist:
      components:
      - Stack
  - type: FixedItemSizeStorage
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: NoSlip
  - type: RMCImmuneToFireTileDamage
  - type: Skills
    skills:
      RMCSkillConstruction: 4
  - type: HTN
    rootTask:
      task: CMUDroneFollowCompound
    enabled: false
  - type: CMUConstructionRobot
    weldingFuel: 1000
    fuelCapacity: 1000
    materialPickupRadius: 5
    refuelDelay: 15
  - type: Tag
    tags: [DoorBumpOpener]

- type: entity
  id: CMUConstructionRobotWreck
  parent: BaseStructureDynamic
  name: wrecked construction UGV
  description: A burnt-out construction UGV chassis.
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    state: destroyed

- type: entity
  id: CMUConstructionRobotKit
  parent: BaseItem
  name: construction UGV kit
  description: Contains a construction UGV deployment unit and a smart-welding visor.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Storage/procase_mini.rsi
    state: closed
  - type: Item
    size: Normal
  - type: CMUConstructionRobotPackage

- type: entity
  id: CMUConstructionRobotDeployer
  parent: BaseItem
  name: construction UGV deployment unit
  description: Deploy this unit to release a construction UGV.
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    state: healthy-hull
  - type: Item
    size: Normal
  - type: CMUConstructionRobotKit

- type: entity
  parent: CMUConstructionRobot
  id: CMUConstructionRobotVendor
  suffix: Vendor, Full
  components:
  - type: StorageFill
    contents:
    - id: CMSheetMetal50
      amount: 5
    - id: CMSheetPlasteel50
      amount: 5
    - id: RMCPlankWood
      amount: 5
    - id: CMSheetGlass
      amount: 5

- type: entity
  parent: CMUConstructionRobotKit
  id: CMUConstructionRobotVendorKit
  suffix: Vendor, Full
  components:
  - type: CMUConstructionRobotPackage
    deployerPrototype: CMUConstructionRobotVendorDeployer

- type: entity
  parent: CMUConstructionRobotDeployer
  id: CMUConstructionRobotVendorDeployer
  suffix: Vendor, Full
  components:
  - type: CMUConstructionRobotKit
    robotPrototype: CMUConstructionRobotVendor

- type: entity
  parent: RMCWeldingGoggles
  id: CMUSmartWeldingVisor
  name: smart-welding visor
  description: Welding goggles with a construction UGV status display and camera link.
  components:
  - type: CMUSmartWeldingVisor
  - type: ActionGrant
    actions:
    - CMUActionConstructionRobotStatus
    - CMUActionConstructionRobotHold
  - type: ItemActionGrant
    activeIfWorn: true
  - type: UserInterface
    interfaces:
      enum.CMUConstructionRobotUiKey.Key:
        type: CMUConstructionRobotBui

- type: entity
  parent: BaseAction
  id: CMUActionConstructionRobotStatus
  name: Construction UGV status
  description: Open the smart-welding visor's UGV status and controls.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Eyes/Glasses/welding_goggles.rsi
    layers:
    - state: icon
      map: [ "enum.ActionVisuals.Icon" ]
  - type: InstantAction
    event: !type:CMUConstructionRobotStatusActionEvent

- type: entity
  parent: BaseAction
  id: CMUActionConstructionRobotHold
  name: Order UGV to position
  description: Select where the chosen construction UGV should wait while idle.
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    layers:
    - state: healthy-hull
      map: [ "enum.ActionVisuals.Icon" ]
  - type: TargetAction
    range: 0
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CMUConstructionRobotHoldActionEvent
