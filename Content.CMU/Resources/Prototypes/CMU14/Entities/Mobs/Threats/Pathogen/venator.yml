- type: entity
  abstract: true
  parent: CMU14XenoPathogenMatureBase
  id: CMU14XenoVenatorBase
  name: Venator
  description: A wandering ball of death.
  components:
  - type: GhostRole
    name: cmu-job-name-pathogen-venator
  - type: Sprite
    sprite: CMU14/Mobs/Xenonids/Pathogen/Venator/venator.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      650: Critical
      750: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: Xeno
    role: CMU14JobPathogenVenator
    tier: 3
    hudOffset: -0.1, 0.25
    emoteSounds: Pathogen
    actionIds:
    - CMU14ActionXenoPathogenRest
    - CMU14ActionXenoPathogenWatch
    - CMU14ActionXenoPathogenTailStab
    - CMU14ActionXenoPathogenImpale
    - CMU14ActionXenoPathogenAbduct
    - CMU14ActionXenoPathogenParalyzingSlash
    - CMU14ActionXenoPathogenScissorCut
    - CMU14ActionXenoPathogenEvolve
    - CMU14ActionXenoPathogenDevolve
    - CMU14ActionXenoPathogenRegurgitate
  - type: XenoScissorCut
    damage:
      types:
        Slash: 75
  - type: XenoEvolution
    actionId: CMU14ActionXenoPathogenEvolve
    strains:
    - CMU14XenoVenatorBloodletter
  - type: XenoHook
  - type: XenoHeavy
  - type: XenoDevour
  - type: XenoTailSeize
  - type: XenoAbduct
  - type: XenoImpale
  - type: XenoRegen
    healOffWeeds: true
    restHealMultiplier: 1.4
  - type: XenoPlasma
    plasma: 300
    maxPlasma: 300
    plasmaRegenOnWeeds: 8
  - type: XenoDevolve
    devolvesTo:
    - CMU14XenoBlight
    canBeDevolvedByOther: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 120
        mask:
        - MobMask
        - BarbedBarricade
        - BarricadeImpassable
        layer:
        - MobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 120
        layer:
        - BulletImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.0
    baseSprintSpeed: 6.0
  - type: RMCSize
    size: Big
  - type: MeleeWeapon
    attackRate: 2.2
    damage:
      types:
        Blunt: 15
        Slash: 15
        Piercing: 15
  - type: CMArmor
    explosionArmor: 20
    xenoArmor: 30
  - type: XenoClaws
    clawType: VerySharp
  - type: Tackle
    min: 2
    max: 5
    chance: 0.45
    stunMin: 3
    stunMax: 4
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: venator
    background:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: background_pathogen
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: VentCrawler
    ventCrawlIcon: praetorian
  - type: RMCActionOrder
    id: CMU14XenoVenator
  - type: FixedIdentity
    name: cmu-job-name-pathogen-venator
  - type: Speech
    speechSounds: Pathogen

 
- type: entity
  parent: CMU14XenoVenatorBase
  id: CMU14XenoVenator
  name: Venator
  components:  
  actionIds:
  - CMU14ActionXenoPathogenRest
  - CMU14ActionXenoPathogenWatch
  - CMU14ActionXenoPathogenTailStab
  - CMU14ActionXenoPathogenImpale
  - CMU14ActionXenoPathogenAbduct
  - CMU14ActionXenoPathogenParalyzingSlash
  - CMU14ActionXenoPathogenScissorCut
  - CMU14ActionXenoPathogenEvolve
  - CMU14ActionXenoPathogenDevolve
  - CMU14ActionXenoPathogenRegurgitate
  - type: XenoEvolution  
    actionId: CMU14ActionXenoPathogenEvolve
    strains:
    - CMU14XenoVenatorBloodletter
  - type: RMCGibOnDeath
    gibChance: 0.1
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenVenator


- type: entity 
  parent: CMU14XenoVenatorBase
  id: CMU14XenoVenatorBloodletter
  suffix: Bloodletter
  components:
  - type: Sprite
    sprite: CMU14/Mobs/Xenonids/Pathogen/Venator/bloodletter_venator.rsi
  - type: Xeno
    actionIds:
    - CMU14ActionXenoPathogenRest
    - CMU14ActionXenoPathogenWatch
    - CMU14ActionXenoPathogenTailStab
    - CMU14ActionXenoPathogenImpaleBloodletter
    - CMU14ActionXenoPathogenScissorCutBloodletter
    - CMU14ActionXenoPathogenHeadbiteBloodletter
    - CMU14ActionXenoPathogenDevolve
    - CMU14ActionXenoPathogenRegurgitate
  - type: MobThresholds
    thresholds:
      0: Alive
      750: Critical
      850: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 6.5
  - type: MeleeWeapon
    attackRate: 2.0
    damage:
      types:
        Slash: 40
  - type: XenoClawBloodloss
    bloodloss: 10
  - type: XenoScissorCut
    damage:
      types:
        Slash: 40
    bloodloss: 18
    alwaysSlows: true
  - type: XenoTailStab
    tailDamage:
      types:
        Slash: 10
        Blunt: 10
        Piercing: 10
    bloodloss: 35
  - type: XenoImpale  
    damage:  
      types:
        Slash: 35
    bloodloss: 40
  - type: XenoHeadbite
    damage:
      types:
        Slash: 20
        Blunt: 20
        Piercing: 20
    bloodloss: 100
  - type: CMArmor
    explosionArmor: 20
    xenoArmor: 25
  - type: XenoLifesteal  
    basePercentage: 0.065  
    maxPercentage: 0.085  
    minHeal: 30  
    maxHeal: 60
  - type: RMCGibOnDeath
    gibChance: 0.1
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenVenator
  - type: XenoStrain
    name: rmc-xeno-bloodletter-name
    description: rmc-xeno-bloodletter-description
    popup: rmc-xeno-bloodletter-popup
  - type: XenoHidden  
  - type: RMCActionOrder  
    id: CMU14XenoVenatorBloodletter
    
