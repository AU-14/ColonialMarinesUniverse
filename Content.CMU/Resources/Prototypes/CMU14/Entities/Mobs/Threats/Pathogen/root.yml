- type: entity
  abstract: true
  parent: CMU14XenoPathogenMatureBase
  id: CMU14XenoRootBase
  name: Root
  description: A huge, looming beast of the Confluence, wreathed in writhing tentacles.
  components:
  - type: GhostRole
    name: cmu-job-name-pathogen-root
  - type: Sprite
    sprite: CMU14/Mobs/Xenonids/Pathogen/root.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
      1100: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: Xeno
    role: CMU14JobPathogenRoot
    tier: 3
    hudOffset: -0.15, 0.16
    emoteSounds: Pathogen
    actionIds:
    - CMU14ActionXenoPathogenRest
    - CMU14ActionXenoPathogenWatch
    - CMU14ActionXenoPathogenTailStab
    - CMU14ActionXenoPathogenGuardianSweep
    - CMU14ActionXenoPathogenPheromones
    - CMU14ActionXenoPathogenGuardianLink
    - CMU14ActionXenoPathogenDevolve
    - CMU14ActionXenoPathogenRegurgitate
    - CMU14ActionXenoPathogenGuardianFling
  - type: XenoHeavy
  - type: XenoDevolve
    devolvesTo:
    - CMU14XenoNeomorph
    - CMU14XenoBlight
  - type: XenoPlasma
    plasma: 800
    maxPlasma: 800
    plasmaRegenOnWeeds: 3
  - type: XenoRegen  
    restHealMultiplier: 2.0 
  - type: CMArmor
    xenoArmor: 30
    explosionArmor: 60
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 13.33
        Slash: 13.33
        Piercing: 13.34
  - type: XenoTailStab
    tailDamage:
      types:
        Blunt: 16
        Slash: 16
        Piercing: 16
  - type: Tackle
    chance: 0.45
    stunMin: 5
    stunMax: 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        mask:
        - MobMask
        - BarbedBarricade
        - BarricadeImpassable
        layer:
        - MobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 185
        layer:
        - BulletImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 4.5
  - type: SlowOnPull
    slowdowns:
    - multiplier: 0.64
      whitelist:
        components:
        - Marine
    - multiplier: 1.0
      whitelist:
        components:
        - XenoLight
    - multiplier: 1.0
      whitelist:
        components:
        - XenoHeavy
  - type: XenoGuardianSweep
    damage:
      types:
        Blunt: 30
  - type: XenoFling
    range: 5
    healAmount: 125
    paralyzeTime: 3
    slowTime: 5
    dazeTime: 4
    throwSpeed: 12
    damage:  
      types:  
        Blunt: 50
  - type: XenoGuardian
    linkDuration: 10
  - type: GuardianCritSave
  - type: RMCSize
    size: Big
  - type: RMCXenoDamageVisuals
    prefix: root
  - type: XenoClaws
    clawType: VerySharp
  - type: XenoDevour
  - type: XenoPheromones
    pheromonesMultiplier: 3
    pheroSuffix: strong
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: harbinger
    background:
      sprite: /Textures/CMU14/Interface/neo_blips.rsi
      state: background_pathogen
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: VentCrawler
    ventCrawlIcon: praetorian
  - type: FixedIdentity
    name: cmu-job-name-pathogen-root
  - type: Speech
    speechSounds: Pathogen

- type: entity
  parent: CMU14XenoRootBase
  id: CMU14XenoRoot
  name: Root
  components:
  - type: RMCActionOrder
    id: CMU14XenoRoot
  - type: RMCGibOnDeath
    gibChance: 0.1
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenRoot
