# Underwear that follows the map's camouflage. The editor shows the jungle version; on spawn it is
# swapped for the standalone marking listed for the map's camo (CMUCamoMarkingSystem).

- type: marking
  id: CMUUnderwearBoxersCamo
  bodyPart: UndergarmentBottom
  forcedColoring: true
  RMCFollowSkinColor: false
  groupWhitelist: [Human, Felinid, Arachnid, Reptilian, Diona, Moth, Slime, Avali, Vulpkanin, Rodentia, Feroxi, Skrell]
  sprites:
  - sprite: _RMC14/Mobs/Customization/underwear.rsi
    state: j_boxers

- type: cmuCamoMarking
  id: CMUUnderwearBoxersCamo
  variants:
    Classic: RMCUnderwearBoxers
    Desert: RMCUnderwearBoxersBlue
    Jungle: RMCUnderwearBoxersJungle
    Snow: RMCUnderwearBoxersSnow
    Urban: RMCUnderwearBoxersUrban

