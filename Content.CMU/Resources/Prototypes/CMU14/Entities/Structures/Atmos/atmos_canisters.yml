- type: entity
  parent: StorageCanister
  id: CMUCanisterEmpty
  name: empty canister
  description: A canister that can contain any type of gas. This one contains none of them yet, which is rather the point. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    layers:
    - state: grey
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        connectedToPort:
          False: { state: can-connector, visible: false }
          True: { state: can-connector, visible: true }
      enum.GasCanisterVisuals.TankInserted:
        tankInserted:
          False: { state: can-open, visible: false }
          True: { state: can-open, visible: true }
      enum.GasCanisterVisuals.PressureState:
        pressureLight:
          0: { state: can-o0, shader: "unshaded" }
          1: { state: can-o1, shader: "unshaded" }
          2: { state: can-o2, shader: "unshaded" }
          3: { state: can-o3, shader: "unshaded" }
  - type: AccessReader
    access: [["CMAccessCombatTechPrep"], ["CMAccessEngineering"], ["CMAccessColonyEngineering"], ["AU14AccessGovforEngineering"], ["AU14AccessOpforEngineering"], ["AU14AccessColonyHeadEngineer"]]

