  description: A canister that can contain any type of gas. This one is supposed to contain refined phoron. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    layers:
    - state: yellow
  - type: GenericVisualizer
    visuals:
      enum.LockVisuals.Locked:
        locked:
          False: { sprite: Structures/Storage/canister.rsi }
          True: { sprite: Structures/Storage/canister.rsi }
  - type: GasCanister
    air:
      volume: 1500
      moles:
        Phoron: 2769.36
      temperature: 293.15
