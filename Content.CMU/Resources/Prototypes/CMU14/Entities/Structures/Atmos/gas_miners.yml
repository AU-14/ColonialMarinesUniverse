- type: entity
  parent: GasMinerOxygen
  id: CMUGasMinerOxygenPortable
  name: OM-2 portable oxygen miner
  suffix: Portable, Permanent, 150kPa
  description: A trailer-sized atmospheric extractor. Trickles out breathable-pressure oxygen while powered - the colony breathes through it, so its power bill is never late.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
    flags: None
  - type: GasMiner
    maxExternalPressure: 150
    spawnAmount: 40
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: RMCPowerReceiver
    idleLoad: 1500
    activeLoad: 1500
    channel: Environment

- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerNitrogenPortable
  name: NM-2 portable nitrogen miner
  suffix: Portable, Permanent, 150kPa
  description: 'A trailer-sized atmospheric extractor. Trickles out breathable-pressure nitrogen while powered, for blending air, not filling tanks. The name is honest: that is mostly what nitrogen is.'
  components:
  - type: GasMiner
    spawnGas: Nitrogen

# These variants are deliberately absent from cargo, construction, vendors, and maps.
# They are available only through administrator spawning.
- type: entity
  parent: CMUGasMinerOxygenPortable
  id: CMUGasMinerPlasmaPortableAdmin
  name: PM-2 portable plasma miner
  suffix: Admin Only, Permanent, 150kPa
  description: An administrator-only atmospheric extractor that produces plasma while powered.
  components:
  - type: GasMiner
    spawnGas: Plasma

