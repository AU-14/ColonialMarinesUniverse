    graph: RMCTinyFanGraph
    node: built
  - type: RadiationBlocker
    resistance: 5

# NOTE: Temporary workaround to spacing
- type: entity
  parent: AtmosDeviceFanDirectional
  id: RMCDirectionalFan
  name: '"Doorstop" DF-1 directional fan'
  description: A slim fan that seals one side of a doorway while leaving the lane open for foot traffic. Field crews call it the Doorstop; point it at the draft and it minds the gap all shift.
  components:
  - type: Construction
    graph: RMCDirectionalFanGraph
    node: built
  - type: RadiationBlocker
    resistance: 5

- type: constructionGraph
  id: RMCTinyFanGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2
  - node: built
    entity: RMCTinyFan
