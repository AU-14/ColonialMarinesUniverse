- type: entity
  parent: PortableScrubber
  id: RMCAirScrubberPortable
  name: '"Maid" SC-3 portable air scrubber'
  description: A boxy scrubber that inhales a room's problems and traps them inside. Field crews call it the Maid; leave it in a room, come back to breathable air.
  components:
  - type: Transform
    noRot: false # maps rotate it, inherited noRot aborts map loads
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: pscrubber_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: pscrubber_0
    runningState: pscrubber_1
    readyState: pscrubber_0
    fullState: pscrubber_0
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCAirScrubberPortable
  id: RMCAirScrubberStationary
  name: '"Maid" SC-3S stationary air scrubber'
  description: The bolted-down model of the Maid line. Same appetite as the portable, none of the wandering.
  components:
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: scrubber_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: scrubber_0
    runningState: scrubber_1
    readyState: scrubber_0
    fullState: scrubber_0

- type: entity
  parent: RMCAirScrubberPortable
  id: RMCAirPumpPortable
  name: '"Straw" AP-4 portable air pump'
  description: Siphons a room's air out and bottles it in its tank. Field crews call it the Straw, usually while standing in the room it is draining.
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: psiphon_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: psiphon_0
    runningState: psiphon_1
    readyState: psiphon_0
    fullState: psiphon_0
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_pump.ogg

- type: entity
  parent: RMCAirPumpPortable
  id: RMCAirPumpStationary
  name: '"Straw" AP-4S stationary air pump'
  description: The stationary model. Large, securely attached, and every bit as thirsty as the portable.
  components:
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: siphon_0
      map: [ "enum.PortableScrubberVisualLayers.IsRunning" ]
  - type: PortableScrubberVisuals
    idleState: siphon_0
    runningState: siphon_1
    readyState: siphon_0
    fullState: siphon_0

- type: entity
  parent: SpaceHeater
  id: RMCSpaceHeater
  name: '"Toaster" SH-6 space heater'
  description: An electric space heater that warms the room by radiation. Two settings, off and on; the manual spends a full page on the difference.
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: sheater0
      map: [ "enum.SpaceHeaterVisualLayers.Main" ]
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        enum.SpaceHeaterVisualLayers.Main:
          Off: { state: sheater0 }
          StandBy: { state: sheater1 }
          Heating: { state: sheater1 }
          Cooling: { state: sheater1 }
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.5
    color: orange
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: SpaceHeater
  id: RMCRadiator
  name: '"Kettle" RD-2 radiator'
  description: A hot-water radiator. Heats the room by convection and announces every cycle with a clank audible three decks away.
  components:
  - type: Transform
    noRot: false
  - type: Physics
    bodyType: static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: radiator
      map: [ "enum.SpaceHeaterVisualLayers.Main" ]
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        enum.SpaceHeaterVisualLayers.Main:
          Off: { state: radiator }
          StandBy: { state: radiator }
          Heating: { state: radiator }
          Cooling: { state: radiator }
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Corrodible
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCRadiator
  id: RMCRadiatorRed
  name: '"Kettle" RD-2R radiator'
  description: A hot-water radiator like any other, except the handle is red. Nobody at the depot remembers what the red handle does.
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _RMC14/Structures/atmos.rsi
    noRot: true
    layers:
    - state: radiator-r
      map: [ "enum.SpaceHeaterVisualLayers.Main" ]
  - type: GenericVisualizer
    visuals:
      enum.SpaceHeaterVisuals.State:
        enum.SpaceHeaterVisualLayers.Main:
          Off: { state: radiator-r }
          StandBy: { state: radiator-r }
          Heating: { state: radiator-r }
          Cooling: { state: radiator-r }

# NOTE: Temporary workaround to spacing
- type: entity
  parent: AtmosDeviceFanTiny
  id: RMCTinyFan
  name: '"Zephyr" TF-2 tiny fan'
  description: A low fan that holds a room's air in while letting people walk through it. Field crews call it the Zephyr. The breeze is decorative, the seal is not.
  components:
  - type: Construction
    graph: RMCTinyFanGraph
    node: built

# NOTE: Temporary workaround to spacing
- type: entity
  parent: AtmosDeviceFanDirectional
  id: RMCDirectionalFan
  name: '"Doorstop" DF-1 directional fan'
  description: A slim fan that seals one side of a doorway while leaving the lane open for foot traffic. Field crews call it the Doorstop; point it at the draft and it minds the gap all shift.
  components:
  - type: Construction
    graph: RMCDirectionalFanGraph
    node: built

- type: constructionGraph
  id: RMCTinyFanGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2
  - node: built
    entity: RMCTinyFan
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 3

- type: constructionGraph
  id: RMCDirectionalFanGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2
  - node: built
    entity: RMCDirectionalFan
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 3

- type: construction
  id: RMCTinyFanRecipe
  name: tiny fan
  description: A walk-through plug for leaking doorways and hull breaches.
  graph: RMCTinyFanGraph
  startNode: start
  targetNode: built
  category: construction-category-atmospherics
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  isCM: true
  conditions:
  - !type:TileNotBlocked

- type: construction
  id: RMCDirectionalFanRecipe
  name: directional fan
  description: Seals one side of a gap against gases while leaving the other open.
  graph: RMCDirectionalFanGraph
  startNode: start
  targetNode: built
  category: construction-category-atmospherics
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: true
  isCM: true
  conditions:
  - !type:TileNotBlocked

# Pairs with the Salamander firesuit; its FireProtection is what counts as head
# coverage for the suits' CMUFireCoverage rule.
- type: entity
  parent: ClothingHeadBase
  id: CMUFireHelmet
  name: '"Salamander" FH-2 fire helmet'
  description: A brimmed firefighting helmet rated for reentry into a burning compartment. The brim keeps embers off your collar and the ratings keep the paperwork happy.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Head/Helmets/firefighter.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _RMC14/Objects/Clothing/Head/Helmets/firefighter.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: CMArmor
    melee: 20
    bio: 10
    explosionArmor: 10
  - type: FireProtection
    reduction: 0.15
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.2

# One burst reclaims what a pile of air grenades could not: kills tile fires,
# hotspots and burning mobs in range, while the cold flood chokes the reaction.
# Frezon *pending* is the coolant, which means the room comes out slightly N2O.
- type: entity
  parent: [ BaseEngineeringContraband, VolatileGrenadeBase, TimerGrenadeBase ]
  id: CMUFireSuppressantGrenade
  name: '"Salamander" FS-4 fire suppression grenade'
  description: A chemical burst grenade that fights fire with a flood of freezing coolant. Clear the room, pull the pin, walk away. The atmos techs will find the nitrous oxide later.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/airboom.rsi
    color: '#4E7FBD'
  - type: EmitSoundOnTrigger
    keysIn:
    - timer
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Items/smoke_grenade_prime.ogg
  - type: TimerTrigger
    delay: 3
  - type: CMUFireSuppressantOnTrigger
    radius: 4.5
  - type: ReleaseGasOnTrigger
    keysIn:
    - timer
    removeFraction: 0.2
    air:
      volume: 1000
      moles:
        Nitrogen: 2800
        Frezon: 200
      temperature: 90
  - type: GenericVisualizer
    visuals:
      enum.ReleaseGasOnTriggerVisuals.Key:
        enabled:
          True: { state: active }
          False: { state: spent }
  - type: RemoveComponentsOnTrigger
    keysIn:
    - timer
    triggerOnce: true
    components:
    - type: TriggerOnUse
    - type: TimerTrigger

- type: entity
  parent: [RMCAllowSuitStorageClothingChefApron, ClothingOuterBase]
  id: CMUSuitFirefighter
  name: '"Salamander" F-2 firesuit'
  description: A canvas firesuit rated against fire and heat. Named after the salamander, which also does not sweat.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/OuterClothing/Misc/firesuit.rsi
  - type: Item
    size: Large
  - type: RMCArmorSpeedTier
    speedTier: heavy
  - type: ClothingSpeedModifier
    walkModifier: 0.62
    sprintModifier: 0.62
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.3
  - type: RMCImmuneToIgnition
    immuneToDirectHits: false
  - type: FireProtection
    reduction: 0.9
  - type: CMUFireCoverage
    uncoveredHeadPenalty: 0.6
  - type: AllowSuitStorage
    whitelist:
      components:
      - GasTank
      tags:
      - Knife
      - Pen
      - Crowbar
      - Radio
      - DiscreteHealthAnalyzer
      - Flashlight

