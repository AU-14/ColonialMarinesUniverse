- type: entity
  parent: CMUArmorFirefighter
  id: CMUArmorFirefighterUPP
  name: T-20 fire response coat
  description: A rugged, no-frills fire-resistant overcoat for UPP industrial and emergency crews, built on the PyroTex LT pattern with cheaper domestically produced materials. The heat protection survived the substitution; the comfort did not.
  components:
