# Passive equalizer: no pump, no power. Each half sits on its deck at the
# opening; the pair moves gas by pressure difference, capped per tick.
# Crowbar flips direction. Screwdriver toggles open/closed.
# Multitool opens the service panel; with the panel open, crowbar deconstructs.
- type: entity
  parent: ConstructibleMachine
  id: CMUOpeningVentDown
  name: OV1-DG Opening Vent, Down
  suffix: CMU, MultiZ
  description: "Static Direction: Looks at deck below. Crowbar flips direction. Screwdriver opens/closes. Multitool opens the panel; pry to deconstruct."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Construction
    graph: CMUOpeningVentGraph
    node: built
  - type: Machine
    board: CMUOpeningVentMachineCircuitboard
  - type: AtmosDevice
  - type: CMUOpeningVent
  - type: CMUZPaired
    offset: -1
    pairKind: vent
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _RMC14/Structures/Piping/Atmospherics/vent_pump.rsi
    layers:
    - state: off

- type: entity
  parent: ConstructibleMachine
  id: CMUOpeningVentUp
  name: OV1-UG Opening Vent, Up
  suffix: CMU, MultiZ
  description: "Static Direction: Looks at deck above. Crowbar flips direction. Screwdriver opens/closes. Multitool opens the panel; pry to deconstruct."
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Clickable
  - type: InteractionOutline
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Construction
    graph: CMUOpeningVentGraph
    node: built
  - type: Machine
    board: CMUOpeningVentMachineCircuitboard
  - type: AtmosDevice
  - type: CMUOpeningVent
  - type: CMUZPaired
    offset: 1
    pairKind: vent
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _RMC14/Structures/Piping/Atmospherics/vent_pump.rsi
    layers:
    - state: off

# Direct build instead of the generic machine-frame flow: the construction menu
# only lists isCM recipes, and the vent board has no crafting source anyway.
# The Machine component still auto-stocks board and parts on spawn.
- type: constructionGraph
  id: CMUOpeningVentGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2.5
  - node: built
    entity: CMUOpeningVentDown
    edges:
    - to: start
      conditions:
      - !type:WirePanel
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: construction
  id: CMUOpeningVentRecipe
  name: opening vent
  description: A passive grate that equalizes air with the deck below or above. Crowbar flips direction, screwdriver opens and closes it.
  graph: CMUOpeningVentGraph
  startNode: start
  targetNode: built
  category: construction-category-atmospherics
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  isCM: true
  conditions:
  - !type:TileNotBlocked
