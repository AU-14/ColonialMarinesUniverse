# Used by CMUWideAirtightSystem to fix the leaks on multi-tile entities (doors).
# Engine airtightness only covers the anchored tile.
- type: entity
  id: CMUAirtightSeal
  name: airtight seal
  description: A structural membrane sealing the hull. It should never be visible.
  suffix: CMU
  components:
  - type: Transform
  - type: Airtight
    fixVacuum: true
    noAirWhenFullyAirBlocked: false

# An airtight heavy hull that has no visual or physical obstruction.
- type: entity
  parent: CMWallReinforcedHeavyAlmayer
  id: CMUSpaceAirtightSeal
  suffix: CMU, Space
  components:
  - !Remove type: Sprite
  - !Remove type: IconSmooth
  - !Remove type: Occluder
  - !Remove type: Physics
  - !Remove type: Fixtures
  - !Remove type: IsRoof
  - !Remove type: SunShadowCast
  - !Remove type: MinimapColor
  - !Remove type: RMCDropshipBlocked
  - !Remove type: PlacementReplacement
  - !Remove type: Clickable
  - !Remove type: CMUWallLeanable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
