# Used by CMUWideAirtightSystem to fix the leaks on multi-tile entities (doors).
# Engine airtightness only covers the anchored tile.
- type: entity
  id: CMUAirtightSeal
  name: airtight seal
  description: A structural membrane sealing the hull. It should never be visible.
  suffix: CMU
  components:
  - type: Transform
  - type: Airtight
    fixVacuum: true
    noAirWhenFullyAirBlocked: false

# An airtight heavy hull that has no visual or physical obstruction.
- type: entity
  parent: CMWallReinforcedHeavyAlmayer
  id: CMUSpaceAirtightSeal
  suffix: CMU, Space
  components:
  - type: RemoveComponents
    components:
    - type: Sprite
    - type: IconSmooth
    - type: Occluder
    - type: Physics
    - type: Fixtures
    - type: IsRoof
    - type: SunShadowCast
    - type: MinimapColor
    - type: RMCDropshipBlocked
    - type: PlacementReplacement
    - type: Clickable
    - type: CMUWallLeanable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
