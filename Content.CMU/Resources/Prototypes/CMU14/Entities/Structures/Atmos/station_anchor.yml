# 1x1 copy of StationAnchorIndestructible (2x2)
- type: entity
  id: CMUAnchorIndestructible
  parent: StationAnchorIndestructible
  suffix: CMU, Indestructible, Unpowered
  components:
  - type: Sprite
    layers:
    - state: station_anchor
      map: ["base"]
      scale: "0.5, 0.5"
    - state: station_anchor_unlit
      shader: unshaded
      map: ["unlit"]
      scale: "0.5, 0.5"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - LargeMobMask
        layer:
        - WallLayer
