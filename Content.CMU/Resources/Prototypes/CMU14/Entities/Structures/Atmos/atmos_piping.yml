# ├──[ Sensors and manifolds (GasPipeSensor / GasPipeSpecial graphs) ]─┤
- type: entity
  parent: GasPipeSensor
  id: !type:CreateVariants
    values: [ CMUGasPipeSensor, CMUGasPipeSensorAlt1, CMUGasPipeSensorAlt2 ]
  name: PS-1 gas pipe sensor
  description: Bolts onto a pipe and reports everything moving through it to the nearest console. Discretion not included.
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ]
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi

- type: entity
  parent: GasPipeManifold
  id: !type:CreateVariants
    values: [ CMUGasPipeManifold, CMUGasPipeManifoldAlt1, CMUGasPipeManifoldAlt2 ]
  name: PM-1 gas pipe manifold
  description: Joins pipes of different configurations at one junction. Everyone gets through, eventually.
  categories: !type:CreateVariants
    sequences: [ [ ], [ HideSpawnMenu ], [ HideSpawnMenu ] ]
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: AtmosPipeLayers
    pipeLayer: !type:CreateVariants
      values: [ 0, 1, 2 ]
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: Structures/Piping/Atmospherics/pipe.rsi
        Secondary: Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: Structures/Piping/Atmospherics/pipe_alt2.rsi
