- type: entity
  parent: SurveillanceCameraAssembly
  id: CMUSurveillanceCameraAssembly
  categories: [ HideSpawnMenu ]

- type: entity
  parent: SurveillanceCameraBase
  id: CMUSurveillanceCameraColonyGOVFOR
  name: colony-grade camera
  suffix: Colony, Govfor
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Transform
    anchored: true
  - type: ApcPowerReceiver
    needsPower: false
  - type: SurveillanceCamera
    networkSet: false
    setupAvailableNetworks:
    - CMUSurveillanceCameraColonyCMB
    - CMUSurveillanceCameraColonyGOVFOR
    - CMUSurveillanceCameraColonyWEYU
  - type: RMCCamera
  - type: CameraMapMarker
  - type: CameraNetworkMember
    networks: [CMUSurveillanceCameraColonyGOVFOR]
    sourceKinds: Rmc

