# Invisible anchor a C4 or breaching charge is planted on when placed on a destroyable tile.
- type: entity
  id: CMUTileChargeAnchor
  name: planted charge
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: RMCWallExplosionDeletable
  - type: CMUTileChargeAnchor
