# The ship's two orbital batteries. Either one fires any mission. Every shot burns out the battery, and the crew have to
# work through its eight repair steps, each with its own tool, before it can fire again.
- type: entity
  abstract: true
  parent: RMCRailgunProp
  id: CMUShipWeaponGunBase
  description: A ship-mounted orbital support battery. Each fire mission burns it out, and it has to be repaired step by step before it can fire again. Examine it to see the next step.
  components:
  - type: InteractionOutline
  - type: GuideHelp
    guides:
    - CMUGuideShipWeapons
  - type: CMUShipWeaponGun
    weapons:
    - CMUGatlingBarrage
    - CMUWalkingBarrage
    - CMU120mmHEBarrage
    - CMU380mmHEBarrage
    - CMUGasStrike
    - CMUEMSStrike
    - CMUSmokeStrike
    - CMUAirburstStrike
    - CMUPrecisionStrike
    - CMURailcannonStrike
    repairSteps:
    - quality: Prying
      delay: 3
      hint: cmu-ship-weapons-repair-hatch-hint
      done: cmu-ship-weapons-repair-hatch-done
    - quality: Screwing
      delay: 3
      hint: cmu-ship-weapons-repair-housing-hint
      done: cmu-ship-weapons-repair-housing-done
    - quality: Anchoring
      delay: 4
      hint: cmu-ship-weapons-repair-unbolt-hint
      done: cmu-ship-weapons-repair-unbolt-done
    - quality: Cutting
      delay: 3
      hint: cmu-ship-weapons-repair-wiring-hint
      done: cmu-ship-weapons-repair-wiring-done
    - quality: Welding
      delay: 5
      fuel: 5
      hint: cmu-ship-weapons-repair-weld-hint
      done: cmu-ship-weapons-repair-weld-done
    - quality: Anchoring
      delay: 4
      hint: cmu-ship-weapons-repair-bolt-hint
      done: cmu-ship-weapons-repair-bolt-done
    - quality: Pulsing
      delay: 4
      hint: cmu-ship-weapons-repair-calibrate-hint
      done: cmu-ship-weapons-repair-calibrate-done
    - quality: Screwing
      delay: 3
      hint: cmu-ship-weapons-repair-secure-hint
      done: cmu-ship-weapons-repair-secure-done

