  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      cloud:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        mask:
        - MobMask
        layer:
        - MidImpassable
  - type: Occluder
  - type: Sprite
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke2
    color: "#adadad"
  - type: TimedDespawn
    lifetime: 30
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: CMUShipWeaponSmoke
  id: CMUShipWeaponGas
  name: orbital toxic gas
  components:
