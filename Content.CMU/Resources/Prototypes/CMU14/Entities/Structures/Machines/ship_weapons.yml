- type: entity
  parent: RMCCommunicationsConsoleBase
  id: CMUShipWeaponsTerminal
  name: ship weapons arming terminal
  description: Selects orbital support weapons for this ship. The terminal displays the selection limit and shared fire missions. Confirmed selections cannot be changed during the operation.
  components:
  # The black sensor computer (RMCBlackSensorComputer2).
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _RMC14/Structures/hybrisa_computer_props.rsi
    state: blacksensor_comp2
  - type: EmitSoundOnUIOpen
    sound: null
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: CMUShipWeaponsTerminal
    maxSelections: 2
    uses: 2
  - type: GuideHelp
    guides:
    - CMUGuideShipWeapons
  - type: ActivatableUI
    key: enum.CMUShipWeaponsUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CMUShipWeaponsUiKey.Key:
        type: CMUShipWeaponsBui
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["RMCAccessCommand"], ["AU14AccessGovforCommand"], ["AU14AccessOpforCommand"]]

- type: entity
  parent: CMUShipWeaponsTerminal
  id: CMUShipWeaponsTerminalGovfor
  suffix: GOVFOR
  components:
  - type: CMUShipWeaponsTerminal
    maxSelections: 2
    faction: govfor
  - type: AccessReader
    access: [["AU14AccessGovforCommand"]]

- type: entity
  parent: CMUShipWeaponsTerminal
  id: CMUShipWeaponsTerminalOpfor
  suffix: OPFOR
  components:
  - type: CMUShipWeaponsTerminal
    maxSelections: 2
    faction: opfor
  - type: AccessReader
    access: [["AU14AccessOpforCommand"]]

- type: entity
