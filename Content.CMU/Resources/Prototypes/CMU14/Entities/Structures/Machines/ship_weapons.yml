    color: "#75963c"
  - type: DamageOverTime
    acidic: false
    affectsDead: true
    damage:
      types:
        Poison: 15
    whitelist:
      components:
      - MobState
    multipliers:
    - multiplier: 0
      whitelist:
        components:
        - Xeno
  - type: GasMaskFilterDamage
    damage: 5
    neurotoxin: false
    orbitalGas: true
