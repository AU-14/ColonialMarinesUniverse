# Ambassador Consoles - Used by third parties for diplomatic functions
# These consoles allow factions to call in third party support

# Base Ambassador Console
- type: entity
  abstract: true
  parent: RMCCommunicationsConsoleBase
  id: AU14AmbassadorConsoleBase
  name: ambassador console
  description: A console for diplomatic functions and third party communication.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ActivatableUI
    key: enum.AmbassadorConsoleUi.Key
  - type: AmbassadorConsole
    budget: 500
    replenishAmount: 10
    replenishInterval: 60
  - type: UserInterface
    interfaces:
      enum.AmbassadorConsoleUi.Key:
        type: AmbassadorConsoleBui
      enum.AmbassadorThirdPartyUi.Key:
        type: AmbassadorThirdPartyBui
  - type: ItemSlots
    slots:
      CashSlot:
        whitelist:
          tags:
          - Currency
  - type: ContainerContainer
    containers:
      CashSlot: !type:ContainerSlot {}
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["AU14AccessColonyAmbassador"]]

# UPP Ambassador Console - Can call in GROM and BEAR
- type: entity
  id: AU14AmbassadorConsoleUPP
  parent: AU14AmbassadorConsoleBase
  name: UPP diplomatic console
  description: A Union of Progressive Peoples diplomatic console. Can request GROM special forces or BEAR PMC support.
  suffix: UPP, GROM, BEAR
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  # Only the UPP ambassador can use it.
  - type: AccessReader
    access: [["AU14AccessAmbassadorUPP"]]
  - type: AmbassadorConsole
    factionName: UPP
    budget: 500
    replenishAmount: 10
    replenishInterval: 60
    callableParties:
      UPPGROM: 11000
      UPPGROMAlt: 9000
      UPPGROMAlt2: 7000
      CHTORM_PMC_BEAR: 11000
      GROZA_PMC_BEAR: 9000
      SKALA_PMC_BEAR: 7000
      Liquidators: 7000 #only flamethrowers
      Migrant_UPP: 1000 #They don’t speak English.


