# Ambassador Consoles - Used by third parties for diplomatic functions
# These consoles allow factions to call in third party support

# Base Ambassador Console
- type: entity
  abstract: true
  parent: RMCCommunicationsConsoleBase
  id: AU14AmbassadorConsoleBase
  name: ambassador console
  description: A console for diplomatic functions and third party communication.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: ActivatableUI
    key: enum.AmbassadorConsoleUi.Key
  - type: AmbassadorConsole
    budget: 1000
    replenishAmount: 0 # no passive income: budget comes from city income, missions and cash
    replenishInterval: 60
  - type: UserInterface
    interfaces:
      enum.AmbassadorConsoleUi.Key:
        type: AmbassadorConsoleBui
      enum.AmbassadorThirdPartyUi.Key:
        type: AmbassadorThirdPartyBui
      enum.AmbassadorWorldMapUi.Key: # RUMC: the window of the world map
        type: AmbassadorWorldMapBui
      enum.AmbassadorMotherUi.Key: # RUMC: the window of the exchange with the mother faction
        type: AmbassadorMotherBui
  - type: ItemSlots
    slots:
      CashSlot:
        whitelist:
          tags:
          - Currency
  - type: ContainerContainer
    containers:
      CashSlot: !type:ContainerSlot {}
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["AU14AccessColonyAmbassador"]]

# UPP Ambassador Console - Can call in GROM and BEAR
- type: entity
  id: AU14AmbassadorConsoleUPP
  parent: AU14AmbassadorConsoleBase
  name: UPP diplomatic console
  description: A Union of Progressive Peoples diplomatic console. Can request MSS, Militsiya or migrant support.
  suffix: UPP, GROM, BEAR
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  # Only the UPP ambassador can use it.
  - type: AccessReader
    access: [["AU14AccessAmbassadorUPP"]]
  - type: AmbassadorConsole
    factionName: UPP
    languages: # the faction's own; callers' parties that speak their caller's language learn these
    - Mandarin
    - Russian
    budget: 1000
    replenishAmount: 0 # no passive income: budget comes from city income, missions and cash
    replenishInterval: 60
    callableParties:
      MSSOperationalGroup: 7000
      CMUUPPMilitsiya: 4950 # same as the CMB investigation party on the colony admin console
      Migrant_UPP: 1000 #They don’t speak English.
      CMUEmbassyStaff: 2000
      CMUUnionOrganisers: 2000


