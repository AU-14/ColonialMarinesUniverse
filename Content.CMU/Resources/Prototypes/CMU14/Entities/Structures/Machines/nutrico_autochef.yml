# Platoon menus for the NutriCo AutoChef. The mess food vendor marker (CMUVMarkerShipMessFood) picks one of these, or
# the default RMCNutriCoVendor, from the platoon's vendor set. Every menu adds the festive meals for all of December.

# SPP meals, for UPP and BEAR platoons.
- type: entity
  parent: RMCNutriCoVendor
  id: CMUNutriCoVendorSPP
  suffix: SPP Meals
  components:
  - type: CMAutomatedVendor
    hackable: true
    sections:
    - name: Holiday Meals
      holidays:
      - FestiveSeason
      entries:
      - id: RMCMarinePreparedMealCookies
        amount: 25
      - id: RMCMarinePreparedMealGingerbread
        amount: 25
      - id: RMCMarinePreparedMealFruitcake
        amount: 25
    - name: Prepared Meals
      entries:
      - id: RMCMarinePreparedMealSPPBanush
        amount: 30
      - id: RMCMarinePreparedMealSPPChowMein
        amount: 30
      - id: RMCMarinePreparedMealSPPCuban
        amount: 30
      - id: RMCMarinePreparedMealSPPFrankfurter
        amount: 30
      - id: RMCMarinePreparedMealSPPJiaozi
        amount: 30
      - id: RMCMarinePreparedMealSPPLuncheon
        amount: 30
      - id: RMCMarinePreparedMealSPPMeatballs
        amount: 30
      - id: RMCMarinePreparedMealSPPShrimp
        amount: 30
      - id: RMCMarinePreparedMealSPPWursts
        amount: 30
    - name: Utensils
      entries:
      - id: RMCForkPlastic
        amount: 50
      - id: RMCSpoonPlastic
        amount: 50
      - id: RMCKitchenKnifePlastic
        amount: 50

