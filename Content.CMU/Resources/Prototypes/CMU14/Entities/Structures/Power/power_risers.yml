# HV Grid risers (tile power).
# Screwdriver toggles Role (Source/Sink).
# Crowbar toggles Direction (Up/Down).
# Multitool opens the service panel; with the panel open, crowbar deconstructs.
- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: CMUPowerRiserDown
  name: PR2-DE Power Riser, Down
  suffix: CMU, MultiZ
  description: "Static Direction: Looks at deck below. Crowbar flips direction. Screwdriver toggles role. Multitool opens the panel; pry to deconstruct."
  placement:
    mode: SnapgridCenter
  components:
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: RMCPowerReceiver
    idleLoad: 0
    activeLoad: 50
    channel: Environment
  - type: CMUPowerRiser
    source: true
  - type: Construction
    graph: CMUPowerRiserGraph
    node: built
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Machine
    board: CMUPowerRiserMachineCircuitboard
  - type: CMUZPaired
    offset: -1
    pairKind: power
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRate: 30000
    enabled: false
  - type: Sprite
    sprite: Structures/Power/substation.rsi
    layers:
    - state: substation

- type: entity
  parent: [BaseMachinePowered, ConstructibleMachine]
  id: CMUPowerRiserUp
  name: PR2-UE Power Riser, Up
  suffix: CMU, MultiZ
  description: "Static Direction: Looks at deck above. Crowbar flips direction. Screwdriver toggles role. Multitool opens the panel; pry to deconstruct."
  placement:
    mode: SnapgridCenter
  components:
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: RMCPowerReceiver
    idleLoad: 0
    activeLoad: 50
    channel: Environment
  - type: CMUPowerRiser
  - type: Construction
    graph: CMUPowerRiserGraph
    node: built
  - type: WiresPanel
    openingTool: Pulsing
    examineTextClosed: cmu-zlevel-panel-closed
    examineTextOpen: cmu-zlevel-panel-open
  - type: Machine
    board: CMUPowerRiserMachineCircuitboard
  - type: CMUZPaired
    offset: 1
    pairKind: power
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRate: 30000
    enabled: false
  - type: Sprite
    sprite: Structures/Power/substation.rsi
    layers:
    - state: substation_static

# Direct build like the pipe riser: the menu only lists isCM recipes and the
# riser board has no crafting source. Machine still auto-stocks on spawn.
- type: constructionGraph
  id: CMUPowerRiserGraph
  start: start
  graph:
  - node: start
    edges:
    - to: built
      completed:
      - !type:SnapToGrid
      steps:
      - material: CMSteel
        amount: 5
        doAfter: 2.5
  - node: built
    entity: CMUPowerRiserUp
    edges:
    - to: start
      conditions:
      - !type:WirePanel
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Prying
        doAfter: 2

- type: construction
  id: CMUPowerRiserRecipe
  name: power riser
  description: An HV bridge linking this deck's power grid to the one above or below. Crowbar flips direction, screwdriver toggles source or sink.
  graph: CMUPowerRiserGraph
  startNode: start
  targetNode: built
  category: construction-category-utilities
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false
  canBuildInImpassable: true
  isCM: true
