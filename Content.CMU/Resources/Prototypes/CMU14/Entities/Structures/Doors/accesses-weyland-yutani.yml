# Weyland-Yutani access variants for placeable human-operated door appearances.
# Inherit the original prototype to retain its sprite and door behavior.
# CM/RMC doors only: vanilla station doors are a different art style, and shutters, pod doors and
# firelocks are worked by buttons, not ID access, so none of those get presets.

