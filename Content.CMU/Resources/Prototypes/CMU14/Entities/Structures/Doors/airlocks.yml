# A normal airlock in the black evacuation-airlock style. It's an ordinary door, so evacuation doesn't lock or unlock it.
- type: entity
  parent: CMAirlock
  id: CMUAirlockEvacuationStyleBlack
  name: airlock
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Airlocks/escape_pod_door_black.rsi

# secure airlock look on a shuttle door, opens without a power grid like CMAirlockShuttle (the colony rotation transport has none)
- type: entity
  parent: CMAirlockShuttle
  id: CMUAirlockShuttleSecure
  name: secure airlock
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Doors/Airlocks/secure_door.rsi
