- type: entity
  parent: BaseStructure
  id: CMULaundryHamper
  name: laundry hamper
  description: A mobile canvas hamper for dirty uniforms and armor. Click it with clothing to load it, or pull it to the laundry room. Drag its sprite onto a washer to transfer laundry over three seconds.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 40
        hard: false
        mask:
        - MachineMask
        layer:
        - LowImpassable
  - type: Sprite
    sprite: CMU14/Structures/laundry_hamper.rsi
    scale: "0.85,0.85"
    noRot: true
    snapCardinals: false
    layers:
    - state: idle
      map: [ "enum.CMULaundryHamperVisuals.Body" ]
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: CMULaundryHamper
  - type: Storage
    clickInsert: true
    maxItemSize: Huge
    grid:
    - 0,0,11,7
    blacklist:
      components:
      - Gun
      - MeleeWeapon
      - AmmoProvider
    whitelist:
      components:
      - Clothing
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMULaundryHamperVisuals.Fill:
        enum.CMULaundryHamperVisuals.Body:
          0: { state: idle }
          1: { state: partial }
          2: { state: full }
