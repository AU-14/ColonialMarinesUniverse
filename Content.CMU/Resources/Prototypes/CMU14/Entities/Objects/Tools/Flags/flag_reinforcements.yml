# The third parties and intel reinforcements each nation's flags rally on top of that nation's platoon. A flag with
# one of these lists never rallies any other third party, so a UPP flag won't buff UA reinforcements and a UA flag
# won't buff UPP ones. Set on a flag with CMUFlagAllegiance's reinforcements.

# UA: the colonial guard, Dutch's Dozen, FORECON, the LACN, CCAF, US Army, USASF, CMB, FEMA, USCM, CWPS and every
# other UA third party.
- type: cmuFlagReinforcements
  id: CMUFlagReinforcementsUA
  thirdParties:
  # Colonial guard, including the lost riflemen
  - CMUUACGPatrol
  - CMUUACGPlatoon
  - UACGLostTeam
  # Dutch's Dozen
  - CMUDutchsDozen
  - CMUDutchsDozenFull
  # FORECON
  - AU14IntelThirdPartyMarksmanGOVFOR
  - AU14IntelThirdPartySniperGOVFOR
  - FORECONFirstRecon
  - FORECONKillTeam
  - FORECON
  - FORECONAlt
  - FORECONAlt2
  # LACN, including the MASH team
  - CMULACNCommandoTeam
  - CMULACNConstructionTeam
  - CMULACNMASH
  - LACNSniperteam
  - LACNSniperteamIntel
  # CCAF
  - CMUCCAFFireTeam
  # US Army
  - USArmyArmored
  - CMUUSArmyIntelPair
  - USArmyTank
  - USArmy
  - USArmyAlt
  - USArmyAlt2
  - CMUUSArmyReinforcements
  # USASF
  - CMUIntelThirdPartyK9USASF
  # CMB tactical team, investigation party and the rest of the bureau
  - CMUCMBTacticalTeam
  - CMBInvestigationParty
  - CMBInvestigationPartyAlt
  - CMBBureauObserverParty
  - CMBParoleeTransport
  - CMBParoleeTransportBig
  # FEMA
  - CMUFEMAResponseTeam
  # USCM
  - CMUUSCMEngineerTeam
  - CMUUSCMMPFireteam
  - MarineSecurityGuard
  - CMUUSCMPlasmaTeam
  # UA ambassador units
  - RUMCMercsUA
  - RUMCMedicsUA
  - RUMCEngineersUA
  roundForces:
  - UA
  - UACG
  - DutchsDozen
  - FORECON
  - LACN
  - CMUCCAF
  - USARMY
  - USASF
  - USCM
  - CWPS
  # The colony's CMB patrol
  jobs:
  - AU14JobCivilianCMBMarshal
  - AU14JobCivilianCMBDetective
  - AU14JobCivilianCMBDeputy

