# Placeholder sprites: swap Objects/Tanks/Jetpacks/blue.rsi for the CMU jump pack RSI once it exists.
- type: entity
  parent: CMGasTankBase
  id: CMUJumpPack
  name: jump pack
  description: A back-mounted thruster pack. Boosts the wearer along a set heading, hops a level up, or hovers above the ground for a short time. Automatically burns gas to slow falls while worn. Refuel it from a gas canister like any other tank. It can hold 5 L of gas.
  components:
  - type: Sprite
    sprite: Objects/Tanks/Jetpacks/blue.rsi
  - type: Item
    size: Huge
    sprite: Objects/Tanks/Jetpacks/blue.rsi
  - type: Clothing
    sprite: Objects/Tanks/Jetpacks/blue.rsi
    quickEquip: false
    slots:
    - Back
  - type: GasTank
    releasePressure: 21.3
    air:
      volume: 5
      temperature: 293.15
  - type: CMUJumpPack
    # Set false to run without a GasTank or while empty; no gas is burned.
    requiresFuel: true
    # Directional boost: tiles travelled per boost, and the cooldown shared with the z-level jump.
    boostDistance: 6
    boostCooldown: 7
    # Hover: seconds held one level up, and its cooldown counted from when the hover started.
    hoverDuration: 20
    hoverCooldown: 35
    # Z-level jump: peak height in z-levels above the starting floor. Must be above 1 to reach the level above.
    jumpHeight: 1.8
    landingFuelPerSecond: 0.0068379
  - type: StaticPrice
    price: 150

- type: entity
  parent: CMUJumpPack
  id: CMUJumpPackFilled
  suffix: Filled
  components:
  - type: GasTank
    releasePressure: 21.3
    air:
      # Five minutes of hovering, or a boost every cooldown for five minutes.
      volume: 5
      moles:
      - 2.051379050 # oxygen
      temperature: 293.15
