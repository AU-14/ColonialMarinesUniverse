        [bold]TRANSMISSION DETAILS :[/bold]  [bold]Form: [/bold][color=#134975]AEG-SOD-PRD[/color]
        [bold]Classification:[/bold] [color=#E41B1B][bold]RESTRICTED | EYES ONLY[/bold][/color]

        [mono]This transmission constitutes a priority recovery order issued under the contract authority of the [bold][color=#134975]AEGIS Armaments Strategic Operations Division[/color][/bold]. All custody, retrieval, and deployment protocols governing strategic assets must log compliance with these parameters.[/mono]
        [color=#134975]▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬[/color]
        [bold]To:[/bold] [italic]Authorized Command Personnel[/italic]
        [bold]From:[/bold] [bold]AEGIS Armaments[/bold] || [bolditalic][color=#134975]Strategic Operations Division[/color][/bolditalic]
        [mono][color=#134975]‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾‾[/color][/mono]

        [head=2][color=goldenrod]Priority Recovery Directive[/color][/head]

        Command Personnel,

        • A classified [color=#134975][bold]strategic weapons platform[/bold][/color] was covertly loaded aboard your vessel prior to departure. Its presence was intentionally withheld from all crew except those with direct operational need.

        • The container remains secured somewhere within the ship. Tracking telemetry confirms its location, and its transponder signature has been linked to your tactical network for retrieval.

        • High Command has authorized the asset's deployment in response to the current tactical situation. Your objectives are as follows:

        [bullet] [bold]Locate[/bold] the AEGIS weapons platform container.
        [bullet] [bold]Recover[/bold] the security authorization key required to access the asset. It is believed to remain with transport personnel; tracking assistance has been configured through your command systems.
        [bullet] [bold]Prevent[/bold] unauthorized access, capture, or destruction of the platform. The container is designed to withstand extreme conditions.

        • Specialized recovery equipment and operational documentation have been dispatched through your logistics network.

        [color=#E41B1B][bold]WARNING:[/bold] The platform represents a significant advancement in strategic weapons technology. Loss or destruction of this asset is unacceptable. Deployment authorization is granted following successful recovery, and all operational telemetry will be collected and transmitted to AEGIS Armaments for evaluation.[/color]

        Exercise extreme caution. AEGIS Armaments appreciates your cooperation.

        [bold]Signed,[/bold]
        [color=#dfc189][bolditalic]AEGIS Strategic Operations Division[/bolditalic][/color]
        [color=#134975]==================================================[/color]

        [color=#134975]⬢ [mono]Notice.[/mono] ⬢[/color]

        [color=#134975]Property of AEGIS Armaments. Unauthorized disclosure, duplication, or diversion of this directive from designated channels constitutes a violation of the operative contract.[/color]

