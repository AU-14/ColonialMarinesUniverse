      Sheriff,

      • Colonial Marshals Bureau has confirmed that a [color=DarkRed][bold]malfunctioning synthetic infiltrator[/bold][/color] is operating within your jurisdiction. No prints or biometric data are on file; assume no identity is genuine.

      • A bounty of [bolditalic][color=OliveDrab]$2,600[/color][/bolditalic] has been authorized for the unit's capture or destruction. The case file is available on your Records Console.

      [bold]Signed,[/bold]
      [color=#dfc189][bolditalic]Regional HQ  [color=black]|[/color][/bolditalic]
