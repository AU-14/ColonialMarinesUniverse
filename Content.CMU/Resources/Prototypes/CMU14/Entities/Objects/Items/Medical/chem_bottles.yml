# Raw chemistry bottles for the drug dealer's cooking kit. Not stocked in any vendor;
# they only spawn inside AU14DrugDealerChemKit.
- type: entity
  parent: CMBottleFilled
  id: CMUBottleWater
  name: water bottle
  suffix: CMU
  description: A small bottle. Contains purified water.
  components:
  - type: Solution
    id: drink
    solution:
      maxVol: 60
      reagents:
      - ReagentId: Water
        Quantity: 60
  - type: CMRefillableSolution
    reagents:
      Water: 60

