# Medical oxygen tank: the anesthetic tank's body, filled with pure oxygen for patients on internals.
- type: entity
  parent: CMAnestheticTank
  id: CMUMedicalOxygenTank
  name: medical oxygen tank
  description: A tank of pure medical oxygen. Put a patient on it through a breath mask to help them recover from suffocation.

