- type: entity
  parent: CMBackpackMarine
  id: CMUCombatDroneOperatorPackFilled
  name: gun UGV operator field pack
  description: A tracked combat drone kit containing a hull, pulse turret, standard and AP ammunition boxes, controller, and repair supplies.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/tech/jungle-desert-classic.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,29,2
  - type: StorageFill
    contents:
    - id: CMUDroneControlTablet
    - id: CMUCombatDroneHull
    - id: CMUCombatDroneTurretAssembly
    - id: CMUCombatDroneAmmoBox
    - id: CMUCombatDroneAmmoBoxAP
    - id: CMWelder
    - id: RMCCableCoil30

- type: entity
  parent: BaseItem
  id: CMUCombatDroneHull
  name: gun UGV hull
  description: A folded tracked chassis. Place it on the ground, install its pulse turret, then load a standard or AP ammunition box to bring it online.
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    layers:
    - state: healthy-hull
      map: ["enum.CMUCombatDroneVisuals.Turret"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMUCombatDroneVisuals.Turret:
        enum.CMUCombatDroneVisuals.Turret:
          True: {state: healthy}
          False: {state: healthy-hull}
  - type: Item
    size: Normal
  - type: CMUCombatDroneHull

- type: entity
  parent: BaseItem
  id: CMUCombatDroneTurretAssembly
  name: combat drone pulse turret
  description: A compact M41A-pattern pulse turret with a fixed IFF interlock and a 180-degree forward firing arc. Install it on a combat drone hull.
  components:
  - type: Sprite
    sprite: CMU14/Mobs/CombatDrone/ugv.rsi
    state: healthy-turret
  - type: Item
    size: Normal
  - type: CMUCombatDroneTurretAssembly

- type: entity
  parent: CMMagazineRifleBase
  id: CMUCombatDroneAmmoBox
  name: combat drone ammunition box (10x24mm)
  description: A 200-round box of standard M41A ammunition for a combat drone pulse turret.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/un571c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal
  - type: CMUCombatDroneAmmoBox
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags: [CMCartridgeRifle10x24mm]
    proto: CMCartridgeRifle10x24mm
    capacity: 200
  - type: Tag
    tags: [CMUCombatDroneAmmoBox]

- type: entity
  parent: CMUCombatDroneAmmoBox
  id: CMUCombatDroneAmmoBoxAP
  name: combat drone AP ammunition box (10x24mm)
  description: A 200-round box of armor-piercing M41A ammunition for a combat drone pulse turret.
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags: [CMCartridgeRifle10x24mmAP]
    proto: CMCartridgeRifle10x24mmAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
      color: "#85b085"
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: Tag
  id: CMUCombatDroneAmmoBox
