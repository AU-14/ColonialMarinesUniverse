- type: entity
  parent: CMUMRESpreadBase
  id: CMUMRESpreadCheese
  name: "spread packet (cheese)"
  description: "A creamy and cheesy spread, made out of a processed cheese, combines well with tortillas and other snacks."
  components:
  - type: Sprite
    sprite: CMU14/Objects/Consumable/MRE/mre_uscm.rsi
    layers:
    - state: spread
      map: ["enum.OpenableVisuals.Layer"]
    - state: cheese_spread
  - type: Solution
    solution:
      maxVol: 6
      reagents:
      - ReagentId: CMUCheese
        Quantity: 4
      - ReagentId: TableSalt
        Quantity: 2

