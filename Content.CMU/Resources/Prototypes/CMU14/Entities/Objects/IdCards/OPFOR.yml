- type: entity
  id: OPFOR
  categories: [ HideSpawnMenu ]
  components:
  - type: IFFFaction
  - type: FactionFrequencies
    channels:
    - radioOpforAlpha
    - radioOpforBravo
    - radioOpforCharlie
    - radioOpforCommand
    - radioOpforIntel
    - radioOpforVictor
    - radioOpforJTAC
    - radioOpforMILP

- type: entity
  abstract: true
  parent: CMIDCardBase
  id: AU14IDCardOPFOR
  name: opfor identification card
  description: An ID Card used by OPFOR personnel for identification and access control. You cannot tell who or what it belongs to.
  components:
  - type: ItemIFF
    factions:
    - OPFOR

- type: entity
  abstract: true
  parent: CMIDCardSilver
  id: CMUIDCardSilverOPFOR
  name: opfor identification card
  description: A silver ID Card used by OPFOR personnel for identification and access control of officers. You cannot tell who or what it belongs to.
  components:
  - type: ItemIFF
    factions:
    - OPFOR

- type: entity
  abstract: true
  parent: CMIDCardGold
  id: CMUIDCardGoldOPFOR
  name: opfor identification card
  description: A gold ID Card used by OPFOR personnel for identification and access control of high-ranking officers. You cannot tell who or what it belongs to.
  components:
  - type: ItemIFF
    factions:
    - OPFOR


- type: entity
  abstract: true
  parent: CMIDCardBase
  id: CMUDogTagsOPFOR
  name: opfor dog tags
  description: Dog tags used by OPFOR personnel for identification and access control.
  components: 
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
    state: dogtag
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
  - type: TakeableTags
  - type: IdCard  
    nameLocId: cm-access-dogtags-component-owner-name-job-title-text
    fullNameLocId: cm-access-dogtags-component-owner-full-name-job-title-text
    canMicrowave: false
  - type: ItemIFF
    factions:
    - OPFOR

