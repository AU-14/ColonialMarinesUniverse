- type: entity
  abstract: true
  parent: CMIDCardBase
  id: CMUDogTagsGOVFOR
  name: govfor dog tags
  description: Dog tags used by GOVFOR personnel for identification and access control.
  components: 
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
    state: dogtag
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/dogtags.rsi
  - type: TakeableTags
  - type: IdCard  
    nameLocId: cm-access-dogtags-component-owner-name-job-title-text
    fullNameLocId: cm-access-dogtags-component-owner-full-name-job-title-text
    canMicrowave: false
  - type: ItemIFF
    factions:
    - GOVFOR

