- type: entity
  id: GOVFOR
  categories: [ HideSpawnMenu ]
  components:
  - type: IFFFaction
  - type: FactionFrequencies
    channels:
    - radioGovforAlpha
    - radioGovforBravo
    - radioGovforCharlie
    - radioGovforCommand
    - radioGovforIntel
    - radioGovforFoxtrot
    - radioGovforJTAC
    - radioGovforMILP

- type: entity
  abstract: true
  parent: CMIDCardBase
  id: AU14IDCardGOVFOR
  name: govfor identification card
  description: An ID Card used by GOVFOR personnel for identification and access control. You cannot tell who or what it belongs to.
  components:
  - type: ItemIFF
    factions:
    - GOVFOR

- type: entity
  abstract: true
  parent: CMIDCardSilver
  id: CMUIDCardSilverGOVFOR
