# CMU14: Hand-loaded dropship cannon ammunition.
# The 40mm BOFORS magazines and 105mm Howitzer shells are grabbed BY HAND and
# then manually loaded into the weapon: click the weapon's attach point with the
# round in hand to load it, click again with an empty hand to unload it.
# Whole ammo trays and shell racks are too heavy to carry by hand - they can be
# dragged or moved with a powerloader, and their contents are pulled out and
# stowed by hand.

- type: Tag
  id: CMUBOFORSMagHE

- type: Tag
  id: CMUBOFORSMagAP

- type: Tag
  id: CMUBOFORSMagAirburst

- type: Tag
  id: CMUBOFORSMagHEAT

- type: Tag
  id: CMUBOFORSMagIncendiary

- type: Tag
  id: CMUHowitzerShell

# region Hand-loadable ammo base

- type: entity
  abstract: true
  parent: BaseItem
  id: CMUDropshipAmmoHandLoadable
  components:
  - type: Item
    size: Huge
  # Heavy round: needs both hands free, no in-hand world sprite.
  - type: MultiHandedItem
  - type: DropshipHandLoadedAmmo
  - type: DropshipAmmo
    rounds: 1
    maxRounds: 1
    roundsPerShot: 1
    deleteOnEmpty: true

# endregion

# region 40mm BOFORS magazines (20 rounds, 5 shots per trigger pull)

- type: entity
  parent: CMUDropshipAmmoHandLoadable
  id: CMUDropshipAmmoBOFORSMagHE
  name: 40mm BOFORS HE magazine
  description: A 20-round magazine of 40mm high-explosive BOFORS shells. Loaded by hand into the L/60 40mm BOFORS Autocannon.
