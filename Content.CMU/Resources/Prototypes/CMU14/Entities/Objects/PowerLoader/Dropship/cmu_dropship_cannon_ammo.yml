  - type: Sprite
    sprite: _RMC14/Objects/dropship_ammo.rsi
    layers:
    - state: bofors_40mm_tray_1
      visible: false
  - type: Icon
    sprite: _RMC14/Objects/dropship_ammo.rsi
    state: bofors_40mm_tray_1
  - type: Tag
    tags:
    - CMUBOFORSMagHE
  - type: DropshipAmmo
    ammoType: bofors_40mm_he
    rounds: 20
    maxRounds: 20
    roundsPerShot: 5
    targetSpread: 2
    bulletSpread: 3
    travelTime: 3
    fireMissionDelay: 1
    zLevelPenetration: 1
    applyEffectsOnPenetrationLevels: false
    weapon: CMUDropshipAttachmentBOFORS
    damage:
      types:
        Blunt: 45
        Slash: 45
        Piercing: 45
    explosion:
      total: 120
      slope: 10
      max: 12
    soundCockpit: /Audio/_RMC14/Dropship/gau_incockpit.ogg
