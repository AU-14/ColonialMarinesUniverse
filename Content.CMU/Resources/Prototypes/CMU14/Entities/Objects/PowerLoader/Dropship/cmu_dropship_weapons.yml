- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: CMUDropshipAttachmentBOFORS
  name: L/60 40mm BOFORS Autocannon
  description: A 40mm BOFORS autocannon capable of sustained fire on a position. It is fed from 20-round trays loaded by hand. Fits on both the external weapon and crew compartment attach points of dropships.
  components:
  - type: Sprite
    layers:
    - state: boforsnew2
      offset: 0.5, 0.5
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: bofors_cannon_interior_unloaded
  - type: DropshipWeapon
    abbreviation: ATC
    fireDelay: 5
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: bofors_cannon_loaded
      offset: 0.5, 0.5
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: bofors_cannon_unloaded
      offset: 0.5, 0.5
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: bofors_cannon_loaded
      offset: 0.5, 0.5
    utilityAmmoAttachedSprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: bofors_cannon_interior_loaded
  - type: DropshipFabricatorPrintable
    cost: 800
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
    - RMCDropshipWeaponPoint

- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: CMUDropshipAttachmentHowitzer
  name: M137 105mm Howitzer
  description: A 105mm Howitzer, capable of wiping out reinforced positions. This model only holds one round, but can be reloaded in flight if mounted on the interior. Fits on both the external weapon and crew compartment attach points of dropships.
  components:
  - type: Sprite
    layers:
    - state: cas_howitzer_105_uninstalled
      offset: 0.5, 0.5
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: howitzer_cannon_interior_unloaded
  - type: DropshipWeapon
    abbreviation: HWR
    fireDelay: 5
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: cas_howitzer_105_installed_loaded
      offset: 0.5, 0.5
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: cas_howitzer_105_installed_unloaded
      offset: 0.5, 0.5
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: cas_howitzer_105_installed_loaded
      offset: 0.5, 0.5
    utilityAmmoAttachedSprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: howitzer_cannon_interior_loaded
  - type: DropshipFabricatorPrintable
    cost: 600
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
    - RMCDropshipWeaponPoint
