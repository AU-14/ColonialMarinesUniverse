# Rotating alert beacons spawned by CMUWarshipAlertLightsSystem as children of
# warship light fixtures. Pure lights, no sprite: the sweep is the visual.
# castShadows stays false: a shadow-casting light re-renders the scene's occluders
# every frame, and a wall of them starves the per-scene shadow budget real lights need.
- type: entity
  id: CMUWarshipAlertBeaconBlue
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    enabled: true
    radius: 4
    energy: 0.6
    netsync: false
    color: "#3D7BFF"
    lightMask: ConeDouble
    castShadows: false
  - type: RotatingLight
    speed: 15

- type: entity
  id: CMUWarshipAlertBeaconRed
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    enabled: true
    radius: 5
    energy: 1.0
    netsync: false
    color: "#EE0500"
    lightMask: ConeDouble
    castShadows: false
  - type: RotatingLight
    speed: 45

- type: entity
  id: CMUWarshipAlertBeaconBlack
  categories: [ HideSpawnMenu ]
  components:
