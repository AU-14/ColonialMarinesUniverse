# Tile fire spawned by the atmos phoron fire (PhoronFireReaction), so standing
# in burning phoron behaves like any RMC tile fire: ignite, panic, pat or roll.
# Intensity 25 outranks flamer fire (15) but stays under the firesuits' 80
# ignition resistance. The short duration keeps it tied to the burning gas;
# the reaction respawns it every tick while phoron keeps burning.
- type: entity
  parent: RMCTileFire
  id: CMUTileFirePhoron
  components:
  - type: TileFire
    id: CMUTileFirePhoron
    duration: 15
  - type: RMCIgniteOnCollide
    intensity: 25
