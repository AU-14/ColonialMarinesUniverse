# Phase E2 (playtest 2): the corruption shown on an assimilated console is a child effect entity,
# not a layer on the console's own sprite. Placeholder art until the GM set exists.
- type: entity
  id: CMUEWJoeConsoleCorruption
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: Effects/electricity.rsi
    state: electrified
    color: "#9fd3ff"
  - type: Tag
    tags:
    - HideContextMenu

# Phase E5: the Overclock cloud (formerly Smokescreen, A-9). One seed spreads a range-3 diamond of itself (playtest 4: 7 tiles across, was 11); the RMC smoke
# system copies the lifetime and shrinks the range by one per step. Lifetime 12 s against the 10 s of
# the grenade smoke, so a fresh puff every 6 s keeps the cloud whole.
- type: entity
  parent: RMCSmokeExplosionProof
  id: CMUEWJoeSmoke
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 12
  - type: DeleteOnExplosion
  - type: EvenSmoke
    spawn: CMUEWJoeSmoke
    range: 3

# Playtest 4: Saturate's visible wave. A flash on every tile of the cone, and a distortion shockwave
# with an orange flare at the Joe (same shockwave as the warlock's psychic blast).
- type: entity
  id: CMUEWJoeSaturateTile
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: _RMC14/Effects/xeno_telegraph.rsi
    state: xeno_telegraph_base
    color: "#ff8a00c0"
  - type: TimedDespawn
    lifetime: 0.6
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: CMUEWJoeSaturateWave
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: RMCExplosionShockWave
    falloffPower: 25
    sharpness: 12
    width: 0.6
  - type: PointLight
    radius: 6
    energy: 4
    color: "#ff8a00"
  - type: Tag
    tags:
    - HideContextMenu
