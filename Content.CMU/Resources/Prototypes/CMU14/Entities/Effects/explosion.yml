# A.T.G.M. warhead. Fields copied from the RMC type (Resources/Prototypes/_RMC14/explosion.yml) so it looks and
# sounds the same; the Structural share wrecks barricades and machines near the impact. Registered as a
# fragmenting type in SharedCMUShrapnelSystem.
# FLOW-08: Structural 40 keeps the peak-intensity blast on a tank frame (x1.15 Structural) under a stock tank's
# 750 hull, so the blast alone never counts as a catastrophic single hit. Metal barricades (450) still break within
# about 2 tiles and airlocks (500) within 1; RMCExplosiveDelete on the missile breaches walls at the impact.
- type: explosion
  id: CMUATGM
  damagePerIntensity:
    types:
      Blunt: 5
      Heat: 5
      Structural: 40
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 10, 30]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireColor: Transparent
  sound:
    collection: CMExplosion
    params:
      volume: 385
  smallSound:
    collection: CMExplosion
    params:
      volume: 0

