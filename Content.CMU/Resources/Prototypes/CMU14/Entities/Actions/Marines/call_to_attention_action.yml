- type: entity
  parent: ActionMarineBase
  id: ActionMarineCallToAttention
  name: Call to Attention
  description: Orders visible personnel to snap to attention and lower their voices.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    layers:
    - sprite: CMU14/Actions/GOVFOR/call_to_attention.rsi
      state: attention
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:AU14CallToAttentionActionEvent
