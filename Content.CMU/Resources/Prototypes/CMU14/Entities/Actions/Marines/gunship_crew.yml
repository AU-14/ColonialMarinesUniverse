- type: entity
  parent: ActionMarineBase
  id: CMUActionGunshipCrewIFF
  name: Toggle Gunship IFF
  description: Toggle the advanced crew HUD's interlock against firing a door gun into its own gunship.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/iff_toggle_actions.rsi
      state: iff_toggle_off
      map: ["enum.ActionVisuals.Icon"]
    - sprite: _RMC14/Actions/iff_toggle_actions.rsi
      state: iff_toggle_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CMUToggleGunshipCrewIFFActionEvent
