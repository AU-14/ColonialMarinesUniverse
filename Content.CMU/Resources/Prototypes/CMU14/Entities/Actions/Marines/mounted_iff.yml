- type: entity
  parent: ActionMarineBase
  id: CMUActionMountedIFF
  name: Toggle Door Gun IFF
  description: Toggle the door gun's interlock against firing when its predicted shot would hit a friendly IFF target.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/iff_toggle_actions.rsi
      state: iff_toggle_off
      map: ["enum.ActionVisuals.Icon"]
    - sprite: _RMC14/Actions/iff_toggle_actions.rsi
      state: iff_toggle_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CMUToggleMountedIFFActionEvent
