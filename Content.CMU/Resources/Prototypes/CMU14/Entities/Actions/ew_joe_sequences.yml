# ARCH-06 (N13): Early Warning Joe CQC sequences (GraphAudit CqcSequences §5). Every step must land on the same
# target, each within 1.2 s of the last (CMUCqc.maxGap). ARCH-12: sequences are free; they cost no Liturgy stacks
# and rely only on the input. A sequence runs its effect from the CQC effect registry (CMUCqcSystem: Grip is generic;
# the Early Warning effects come from EWJoeCqcEffectsSystem), which calls the same code as the hotbar ability; an
# Exalted Joe (max stacks) plays the empowered version where the effect has one. tier: an Early Warning Joe refuses a
# sequence above its level; a body without EWJoe ignores it. A body knows the sequences its CMUCqc.sequences lists.
# requiresBlade: every Wide step must come from a blade (the machete or a Slash weapon); fists cannot wide-swing.
# Steps: Hit, Wide, Disarm, Grab (a pull; an aggressive grab also counts), AggressiveGrab, Ability (a landed CQC
# hotbar move). hardCc: refused on a target inside its 6 s CC-immunity window, and opens that window.
# RB-14: after any sequence fires, none can fire for 4 s (CMUCqc.sequenceCooldown); inputs still buffer.

- type: cmuCqcSequence
  id: Rebuke
  name: cmu-ew-joe-sequence-rebuke
  hint: cmu-ew-joe-sequence-rebuke-hint
  steps: [ Hit, Hit, Disarm ]
  effect: Sweep
  duration: 1
  tier: 1
  hardCc: true

- type: cmuCqcSequence
  id: Seize
  name: cmu-ew-joe-sequence-seize
  hint: cmu-ew-joe-sequence-seize-hint
  steps: [ Disarm, Grab ]
  effect: Grip
  tier: 2

- type: cmuCqcSequence
  id: Profane
  name: cmu-ew-joe-sequence-profane
  hint: cmu-ew-joe-sequence-profane-hint
  steps: [ Grab, Hit, Hit ]
  effect: Desecrate
  tier: 2
  hardCc: true # RB-15: its obstacle paralyze counts as hard CC

- type: cmuCqcSequence
  id: Penance
  name: cmu-ew-joe-sequence-penance
  hint: cmu-ew-joe-sequence-penance-hint
  steps: [ Hit, Hit, Hit ]
  effect: Slam
  tier: 3
  hardCc: true

- type: cmuCqcSequence
  id: Silence
  name: cmu-ew-joe-sequence-silence
  hint: cmu-ew-joe-sequence-silence-hint
  steps: [ Disarm, Disarm, Hit ]
  effect: ChokeOpen
  tier: 2
  requiresGrab: true

- type: cmuCqcSequence
  id: Unmaking
  name: cmu-ew-joe-sequence-unmaking
  hint: cmu-ew-joe-sequence-unmaking-hint
  steps: [ Hit, Wide, Hit ]
  effect: Unmaking
  duration: 1
  range: 2.5
  coneDegrees: 90
  dazeDuration: 4
  tier: 5
  requiresBlade: true
  hardCc: true
