- type: entity
  parent: ActionXenoBase
  id: ActionApeLeap
  name: Leap
  description: Jump towards a given location and knock down the first enemy hit.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 3
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: pounce
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeLeapActionEvent
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: ActionApeDestroy
  name: Destroy
  description: After a short time, jump to the targeted location, destroying structures and gibbing hostiles within a 3x3 range. Works over barricades and other short barriers.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: charge
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 7
    checkCanAccess: false
    deselectOnMiss: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeDestroyActionEvent

- type: entity
  parent: ActionXenoBase
  id: ActionApeCharge
  name: Charge
  description: Ape-specific charge. Click on a tile to wind up and charge to it, stunning and damaging foes hit.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 14
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: ready_charge
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 9
    checkCanAccess: false
  - type: WorldTargetAction
    # Use ape-specific charge event
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeChargeActionEvent

- type: entity
  parent: ActionXenoFling
  id: ActionApeRam
  name: Ram
  description: Ape-specific ram. Target an enemy to ram them, costing a small amount of plasma.
  components:
  - type: Action
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: fling
      map: ["enum.ActionVisuals.Icon"]
  - type: EntityTargetAction
    # Use ape-specific ram event
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeRamActionEvent
    toggleOutline: false
  # Ape ram does not consume plasma

- type: entity
  parent: ActionXenoBase
  id: ActionApeHeadbite
  name: Headbite
  description: Ape-specific headbite that applies the headbite effect to unconscious targets.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: headbite
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeXenoHeadbiteActionEvent
  - type: ActionBlockIfResting
  - type: XenoOffensiveAction

- type: entity
  parent: ActionXenoBase
  id: ActionApeLimbRip
  name: Rip Limb
  description: Tear a limb off a dead body. Limbs make fine throwing material.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 8
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: gut
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    checkCanAccess: false
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeLimbRipActionEvent
    toggleOutline: false

- type: entity
  parent: ActionXenoBase
  id: ActionApeHurl
  name: Hurl Debris
  description: Rip out a chunk of debris and hurl it at the target. Hits hard, stuns mobs, damages barricades, and reaches the z-level above.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 6
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: xeno_spit
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:Content.Shared.CMU14.Threats.Mobs.Ape.ApeHurlActionEvent

- type: entity
  parent: BaseItem
  id: CMUApeDebrisRock
  name: hurled debris
  description: A hefty chunk of rock, torn from the ground by something very strong.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Decoration/Flora/flora_rockssolid.rsi
    state: rocksolid01
  - type: Item
    size: Normal
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 25
        Structural: 150
