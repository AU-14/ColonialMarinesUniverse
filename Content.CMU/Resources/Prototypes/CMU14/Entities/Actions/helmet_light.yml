- type: entity
  parent: BaseAction
  id: CMUActionToggleHelmetLight
  name: Toggle Helmet Light
  description: Turn the light stored in your helmet on and off.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Attachments/rail.rsi
    layers:
    - state: flashlight
      map: ["enum.ActionVisuals.Icon"]
    - state: flashlight-on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
  - type: InstantAction
    event: !type:CMUToggleHelmetLightActionEvent
