- type: entity
  parent: ActionXenoBase
  id: CMUActionReaperRevive
  name: Reanimate Xeno
  description: Spend 500 flesh to revive a hive sister. Begin within three minutes of death, then channel for two minutes. An accepted reanimation can finish after the freshness window expires. Flesh and the ten-minute cooldown are consumed when charging begins, even if interrupted.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 600
  - type: Sprite
    layers:
    - sprite: _CM13/Actions/xeno_strain_actions.rsi
      state: reaper_carrion_mantle
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:Content.Shared.CMU14.Xenomorphs.Reaper.CMUReaperReviveActionEvent
  - type: ActionBlockIfResting
  - type: ActionInRangeUnobstructed
    range: 1.5
