
- type: entity  
  parent: ActionXenoBase  
  id: CMU14ActionXenoPathogenGuardianLink
  name: Guardian Link (100)  
  description: Link to a nearby ally, absorbing 50% of the damage they take for a short duration.  
  components:  
  - type: Action  
    itemIconStyle: NoItem  
    icon:  
      sprite: _RMC14/Actions/xeno_actions.rsi  
      state: guardian_link  
