# Playtest 3.
# Opens the level and objective panel on the client only; nothing is sent to the server.
- type: entity
  id: CMUActionEWJoeStatus
  parent: ActionMarineBase
  components:
  - type: Action
    itemIconStyle: NoItem
    clientExclusive: true
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: watch_xeno
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:EWJoeOpenStatusActionEvent

# The yautja leap, on the Joe's own component: aim at the level you are looking at (up, down or across).
- type: entity
