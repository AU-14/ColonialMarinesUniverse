- type: entity
  id: CMUActionEWJoeSlam
  parent: ActionMarineBase
  components:
  - type: EWJoeDropsSurrender
  - type: EWJoeAbilityGroup
    group: Hands
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: ram
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 3
    checkCanAccess: false
    deselectOnMiss: false
  # the target is the wall, table, railing or barricade; the victim is whoever the Joe is holding
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EWJoeSlamActionEvent
    # RMC walls carry only the Wall tag (no WallComponent); upstream walls carry the component
    whitelist:
      components:
      - Wall
      - Climbable
      - Barricade
      tags:
      - Wall

