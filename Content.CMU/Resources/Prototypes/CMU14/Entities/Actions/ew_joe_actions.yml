# Offer: a loose firearm an Offer directive asks for is taken in and leaves play (EWJoeOfferSystem).
- type: entity
  id: CMUActionEWJoeOffer
  parent: ActionMarineBase
  components:
  - type: EWJoeAbilityGroup
    group: Machine
  - type: Action
    itemIconStyle: NoItem
    useDelay: 5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: gut
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    checkCanAccess: true
    deselectOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EWJoeOfferActionEvent
    # a carried firearm, not a sentry, FOB gun, drone, attachment or vehicle hardpoint (EWJoeOfferSystem.IsOfferable)
    whitelist:
      requireAll: true
      components:
      - Gun
      - Item
    blacklist:
      components:
      - Sentry
      - MobState
      - Attachable
      - HardpointItem

