# Early Warning Joe actions, every level (granted by the level table in EWJoe.yml).
# Names and descriptions come from ent-<id> locale entries (ew-joe.ftl).

- type: entity
  id: CMUActionEWJoeTestOfFaith
  parent: ActionMarineBase
  components:
  - type: EWJoeDropsSurrender
  - type: EWJoeAbilityGroup
    group: Gaze
  - type: Action
    itemIconStyle: NoItem
    useDelay: 20
  - type: Sprite
    layers:
    - sprite: Objects/Weapons/Melee/flash.rsi
      state: flash
      map: ["enum.ActionVisuals.Icon"]
  # playtest 3: one chosen target, who must be meeting the Joe's gaze
  - type: TargetAction
    range: 6
    checkCanAccess: false
    deselectOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EWJoeTestOfFaithActionEvent
    whitelist:
      components:
      - MobState

- type: entity
  id: CMUActionEWJoeOpticalZoom
  parent: ActionMarineBase
  components:
  - type: EWJoeAbilityGroup
    group: Gaze
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.2
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/xeno_actions.rsi
      state: toggle_long_range
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:EWJoeOpticalZoomActionEvent

- type: entity
  id: CMUActionEWJoeDisrupt
  parent: ActionMarineBase
  components:
  - type: EWJoeDropsSurrender
  - type: EWJoeAbilityGroup
    group: Machine
  - type: Action
    itemIconStyle: NoItem
    useDelay: 45
  - type: Sprite
    layers:
    - sprite: Objects/Weapons/Grenades/empgrenade.rsi
      state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:EWJoeDisruptActionEvent

# E2: entity-target action on the five colony console types; the server validates the same
# whitelist again and runs the 8 s do-after.
- type: entity
  id: CMUActionEWJoeAssimilate
  parent: ActionMarineBase
  components:
  - type: EWJoeAbilityGroup
    group: Machine
  - type: Action
    itemIconStyle: NoItem
    useDelay: 10
  - type: Sprite
    layers:
    - sprite: Structures/Machines/computers.rsi
      state: screen_broken
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    range: 1.5
    checkCanAccess: true
    deselectOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EWJoeAssimilateActionEvent
    whitelist:
      components:
      - BudgetConsole
      - CorporateConsole
      - ResearchDataTerminal
      - DepartmentConsole
      - ColonyCommsConsole

