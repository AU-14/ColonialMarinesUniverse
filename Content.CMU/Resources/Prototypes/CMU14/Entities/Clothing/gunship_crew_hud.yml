- type: entity
  parent: RMCVisorBase
  id: CMUVisorGunshipCrew
  name: Basic gunship crew HUD
  description: A helmet-mounted display linking a door gunner to their gunship's ammunition, hull integrity, and system warnings.
  components:
  - type: Sprite
    state: hud_sight
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: hud_sight_right
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: hud_sight_down
  - type: ComponentToggler
    components:
    - type: CMUGunshipCrewVisor

- type: entity
  parent: CMUVisorGunshipCrew
  id: CMUVisorGunshipCrewAdvanced
  name: Advanced Gunship crew HUD
  description: An aircrew helmet display combining gunship status, medical overlays, and toggleable protection against firing into its own gunship. Requires Aircrew training.
  components:
  - type: Visor
    skillsRequired:
      all:
        CMUSkillAircrew: 1
  - type: ComponentToggler
    components:
    - type: CMUGunshipCrewVisor
    - type: CMUAdvancedGunshipCrewVisor
    - type: ShowHealthBars
      damageContainers:
      - Biological
    - type: HolocardScanner
    - type: ShowHealthIcons
      damageContainers:
      - Biological
