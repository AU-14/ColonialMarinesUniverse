# Corpsman optic: the medical optic and the squad optic in one visor.
# Based on the basic medical optic so it has no medical skill requirement: the advanced optic's skill check made the
# visor cycle skip it for anyone without it, leaving no health bars. It looks like the advanced optic.
- type: entity
  parent: RMCVisorMedical
  id: CMUVisorMedicalSquad
  name: medical squad optic
  description: An insertable visor HUD for a standard helmet, issued to corpsmen. It combines the medical optic's health readouts with the squad optic's squad display, trackers and grenade warnings.
  components:
  - type: Sprite
    state: med_adv_sight
  - type: Visor
    onIcon:
      sprite: _RMC14/Objects/Clothing/helmet_visors.rsi
      state: med_adv_sight_down
  - type: ToggleVisor
    ignoreRedundancy: true
  - type: CMUSquadOptic
  - type: ComponentToggler
    components:
    # Medical optic
    - type: ShowHealthBars
      damageContainers:
      - Biological
    - type: HolocardScanner
    - type: ShowHealthIcons
      damageContainers:
      - Biological
    # Squad optic
    - type: GrantMarineIcons
    - type: CMUSquadVisorActive

- type: entity
  parent: CMUVisorMedicalSquad
  id: CMUVisorMedicalSquadIntegrated
  suffix: Integrated
  components:
  - type: UnremovableVisor
  - type: Visor
    toggledSprite:
      sprite: _RMC14/Objects/Clothing/Head/Helmets/huds.rsi
      state: med_sight_left
