- type: entity
  parent: RMCHelmetGarbBase
  id: CMUHelmetGarbPlatemask
  name: 12 pattern platemask
  description: The complimentary, but not necessary platemask, attachable to Mk10 open combat helmets. Useful against shrapnel or just in the cold enviroment, but with enough force it will easily be ripped off.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/WY_PMC/platemask.rsi
    state: icon
  - type: Item
    sprite: CMU14/Clothing/WY_PMC/platemask.rsi
  - type: HelmetAccessory
    rsi:
      sprite: CMU14/Clothing/WY_PMC/platemask.rsi
      state: helmet

- type: entity
  parent: RMCHelmetGarbBase
  id: CMUHelmetGarbGoggles
  name: 14 pattern goggles
  description: The complimentary, but not necessary googles, attachable to Mk10 open combat helmets. An additional protection to the eyes, be it a cold wind, or a spit from a rioting civilian. It's a true talent to be able to see through them easily, without HUD visor.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/WY_PMC/goggles.rsi
    state: icon
  - type: Item
    sprite: CMU14/Clothing/WY_PMC/goggles.rsi
  - type: HelmetAccessory
    rsi:
      sprite: CMU14/Clothing/WY_PMC/goggles.rsi
      state: helmet

