# Parkas
# The CMB deputy parka, given the same protection as the deputy windbreaker. Kept apart from the RMC parka so the
# other snow parkas don't pick up its armour.
- type: entity
  parent: RMCCoatSnowSurvivorCMBDeputy
  id: CMUCoatCMBDeputyParka
  name: CMB deputy parka
  description: A snow suit tailored to the CMB's needs. It can protect the wearer from extreme cold. The back is enscribed with the powerful letters of 'DEPUTY' representing justice, authority, and protection in the outer rim. Its lining hides kevlar padding to turn aside knife attacks.
  components:
  - type: CMArmor # same protection as the CMB deputy windbreaker
    melee: 30
    bullet: 15
    bio: 10
    explosionArmor: 10
