#Windbreakers
- type: entity
  parent: [RMCAllowSuitStorageClothingHazardVest, RMCBaseJacket]
  id: AU14CMBDeputyWindbreaker
  name: CMB Deputy Windbreaker
  description: A windbreaker made for CMB deputies. Kevlar padding sewn into the lining helps turn aside knife attacks.
  components:
  - type: CMUConcealsHolsters
  - type: Sprite
    sprite: CMU14/Clothing/CMB/cmbdeputywindbreaker.rsi
  - type: Clothing
    sprite: CMU14/Clothing/CMB/cmbdeputywindbreaker.rsi
  - type: CMArmor # same protection as the CMB deputy jacket
    melee: 30
    bullet: 15
    bio: 10
    explosionArmor: 10
  - type: AllowSuitStorage
    whitelist:
      components:
      - Gun
      - CrewMonitoringConsole
      tags:
      - Stunbaton
      - Radio
      - RMCG8Pouch
      - Crowbar
      - Handcuffs
      - Binoculars
      - Knife
      - RMCSmartPistolHolster
      - RMCGeneralPistolHolster
      - RMCGeneralRevolverHolster
      - RMCMatebaHolster
      - RMCBeltHolsterM13
      - Flashlight
      - DiscreteHealthAnalyzer
      - Pen
      - RMCMacheteScabbard
      - RMCScabbardKatana
      - RMCDetector

