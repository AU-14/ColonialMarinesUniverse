- type: entity
  parent: AU14WebbingMagazine
  id: CMULACNWebbingMagazine
  name: LACN magazine webbing
  description: LACN pattern synthcotton webbing with three pockets to hold your magazines.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNmagazinewebbing.rsi
    state: webbing
  - type: Webbing
    playerSprite:
      sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNmagazinewebbing.rsi
      state: equipped

- type: entity
