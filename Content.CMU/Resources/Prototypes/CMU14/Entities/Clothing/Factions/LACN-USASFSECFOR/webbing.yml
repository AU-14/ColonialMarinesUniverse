- type: entity
  parent: CMWebbingBase
  id: CMULACNWebbingShotgun
  name: LACN shotgun shell webbing
  description: LACN pattern webbing lined with loops for shotgun shells.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNshotgunwebbing.rsi
    state: webbing
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,9,1
    whitelist:
      tags:
      - RMCShellShotgun
  - type: FixedItemSizeStorage
  - type: Webbing
    playerSprite:
      sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Webbing/LACNshotgunwebbing.rsi
      state: equipped
    components:
    - type: Storage
      maxItemSize: Small
      grid:
      - 0,0,9,1
      whitelist:
        tags:
        - RMCShellShotgun
    - type: FixedItemSizeStorage
    - type: RMCStorageEjectHand
      state: Open
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: StoreAfterFailedInteract
