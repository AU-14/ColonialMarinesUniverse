- type: entity
  parent: RMCBeltHolsterRevolver
  id: CMULACNBeltHolsterRevolver
  name: LACN revolver holster rig
  description: An LACN load-bearing belt with a holster made for Taurus revolvers, though it fits most others, and six pouches for speedloaders or shotgun shells.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Belts/LACNtaurusbelt.rsi
    layers:
    - state: icon
    - sprite: _RMC14/Objects/Weapons/Guns/gun_underlays.rsi
      state: m44r
      map: [ "enum.CMHolsterLayers.Fill" ]
      visible: false
    - state: half
      map: [ "openLayer" ]
    - state: full
      map: [ "closedLayer" ]
