- type: entity
  parent: CMUBeltCombatSidearmRig
  id: CMULACNBeltStandard
  name: LACN standard load rig
  description: The standard load-bearing belt of the LACN landing forces. It has a holster for a sidearm and pouches for two pistol magazines and three rifle magazines.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Belts/LACNstandardbelt.rsi
  - type: Clothing
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Belts/LACNstandardbelt.rsi
  - type: ItemCamouflage
    camouflageVariations: { }

- type: entity
  parent: CMBeltMarine
  id: CMULACNBeltMagazine
  name: LACN magazine rig
  description: An LACN load-bearing belt fitted with pouches for rifle magazines only.
  components:
  - type: Sprite
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Belts/LACNmagazinebelt.rsi
  - type: Clothing
    sprite: CMU14/Clothing/LACN/LACNRedux/Universal/Belts/LACNmagazinebelt.rsi
