# The eye behind one of an overwatch operator's camera feeds; rides on the watched camera.
- type: entity
  id: CMUOverwatchFeedEye
  categories: [ HideSpawnMenu ]
  name: overwatch camera feed
  components:
  - type: Visibility
    layer: 8 # only the subscribed operator gets it, through their view subscription
  - type: Eye
    drawFov: false
    pvsScale: 0.6 # a feed tile shows far less than the main view

# VHS playback look for the overwatch camera feeds (CMUVhsScreenControl).
- type: shader
  id: CMUOverwatchVhs
  kind: source
  path: "/Textures/Shaders/CMU14/overwatch_vhs.swsl"
  params:
    aspect: 1.0
