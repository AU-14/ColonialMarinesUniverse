      offset: -0.46875, 0.0625 # stock 22,10 - shift 37,8
  - type: Item
    sprite: CMU14/Weapons/Guns/DogWar/type40.rsi
  - type: Clothing
    sprite: CMU14/Weapons/Guns/DogWar/type40.rsi
