- type: entity
  parent: CMUDropshipAttachmentDoorGunM2C
  id: CMUDropshipAttachmentDoorGunUTESC
  name: UTES-C Door Gunner Hardpoint System
  description: A box that deploys a crew-served UTES-C heavy machine gun. Fits on gunship hardpoint attachment points.
  components:
  - type: RMCEquipmentDeployer
    deployPrototype: CMUUTESCDoorGunDropship

- type: entity
  parent: CMUM2CDoorGunDropship
  id: CMUUTESCDoorGunDropship
  name: UTES-C heavy machine gun
  description: A crew-served UTES-C heavy machine gun mounted on a gunship door-gunner hardpoint.
  components:
  - type: CMUDoorGunVisual
    northSouthGunOffset: 0, 0
  - type: Sprite
    sprite: CMU14/Objects/Weapons/Guns/DoorGuns/UTESC/pivot.rsi
    noRot: true
    granularLayersRendering: true
    layers:
    - state: mount
      renderingStrategy: NoRotation
    - sprite: CMU14/Objects/Weapons/Guns/DoorGuns/UTESC/gun.rsi
      state: gun
      renderingStrategy: NoRotation
      rotation: 0
      map: [ "enum.WeaponMountComponentVisualLayers.Mounted" ]
      visible: false
    - sprite: CMU14/Objects/Weapons/Guns/DoorGuns/UTESC/gun.rsi
      state: ammo
      renderingStrategy: NoRotation
      rotation: 0
      map: [ "enum.WeaponMountComponentVisualLayers.MountedAmmo" ]
      visible: false
    - sprite: CMU14/Objects/Weapons/Guns/DoorGuns/UTESC/gun.rsi
      state: heat
      renderingStrategy: NoRotation
      rotation: 0
      map: [ "enum.WeaponMountComponentVisualLayers.Overheated" ]
      visible: false
  - type: WeaponMount
    fixedWeaponPrototype: CMUMachineGunUTESCDropshipLoaded

- type: entity
  parent: RuMCMachineGunUTES-C
  id: CMUMachineGunUTESCDropshipLoaded
  suffix: Dropship, Loaded
  categories: [ HideSpawnMenu ]
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RuMCMagazineUTES-C
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        priority: 2
        whitelist:
          tags:
          - RuMCMagazineUTES-C
          - RuMCMagazineUTES-CTracter
