# CMU14: signature weapon of the A.W. GovFor Veteran.
# A heavier, faster-flying machete that knocks down what it hits. Only he can take it into a hand.
- type: entity
  parent: AU14ToolMachete
  id: CMUVeteranMachete
  name: notched machete
  description: A jungle machete sharpened so many times the edge has gone concave. Notches are filed along the spine, one for each deployment, and a long blank stretch waits below them.
  suffix: Veteran
  components:
  # 70 slash against a 200/275 HP human: two swings leave him standing (140), the third drops him
  # into crit (210). The fourth finishes the job.
  - type: MeleeWeapon
    damage:
      types:
        Slash: 70
  # Nothing he wears should blunt this: 100 piercing strips any human armour value before it resists.
  - type: CMArmorPiercing
    amount: 100
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 20
  - type: ItemThrowRange
    range: 10
  - type: CMUVeteranMachete
  # Wired to him and nobody else: other people cannot take it into a hand, but they can still drag it away.
  - type: WhitelistPickupBy
    whitelist:
      components:
      - CMUVeteranCloak
  - type: Pullable

