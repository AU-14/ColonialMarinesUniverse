- type: entity
  parent: RMCMK80
  id: CMUWeaponPistolAuto9
  name: Auto-9 pistol
  description: An advanced, select-fire machine pistol capable of a blistering three-round burst, fed from a long 50-round 9mm magazine. It takes no attachments. Last seen cleaning up the mean streets of Detroit.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Civilian/auto9.rsi
  - type: Clothing
    sprite: CMU14/Weapons/Guns/Civilian/auto9.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
  - type: Gun
    shotsPerBurst: 3
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/CMU14/Weapons/Guns/Gunshots/auto_9_fire.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    recoilWielded: 1
    recoilUnwielded: 2
    scatterWielded: 6
    scatterUnwielded: 6
    baseFireRate: 7.5 
    burstFireRateMultiplier: 1.5 
    burstScatterMult: 2
    modifiers:
      Burst:
        fireDelay: 0
        maxScatterModifier: 8
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 1.5
        shotsToMaxScatter: 9
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMUMagazinePistolAuto9
        startingItem: CMUMagazinePistolAuto9Tracer
  - type: AttachableHolder
    slots: {}
  - type: AttachableHolderVisuals
    offsets: {}
  - type: Tag
    tags:
    - Sidearm
    - RMCb92fs 
    - CMUWeaponPistolAuto9

- type: entity
  parent: CMUWeaponPistolAuto9
  id: CMUWeaponPistolAuto9Empty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMUMagazinePistolAuto9

# Auto-9 magazines. Each load is colour-coded with a band, using CM13's ammo band colours: AP green, HEAP
# yellow, wall-penetrating steel blue, rubber blue, incendiary red, squash-head orange (as on the MP5's), and
# tracer the M54C's tracer orange-red. Standard 9mm has no band.
- type: entity
  abstract: true
  parent: CMBaseMagazinePistol
  id: CMUMagazinePistolAuto9Base
  description: A long 50-round magazine for the Auto-9 pistol.
  components:
  - type: Tag
    tags:
    - CMMagazinePistol
    - CMUMagazinePistolAuto9
  - type: BallisticAmmoProvider
    mayTransfer: True
    capacity: 50
  - type: MagazineVisuals
    magState: extended
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Civilian/auto9_magazine.rsi
    layers:
    - state: extended
      map: ["enum.GunVisualLayers.Base"]
    - state: extended-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMUMagazinePistolAuto9Base
  id: CMUMagazinePistolAuto9
  name: Auto-9 magazine (9mm)
  description: A long 50-round magazine of standard 9mm for the Auto-9 pistol.
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMCartridgePistol9mm
    proto: CMCartridgePistol9mm
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsPistol9MM

- type: entity
  parent: CMUMagazinePistolAuto9Base
  id: CMUMagazinePistolAuto9AP
  name: Auto-9 AP magazine (9mm)
  description: A long 50-round magazine of armor-piercing 9mm for the Auto-9 pistol. It hits harder on armored targets and softer on unarmored ones.
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMCartridgePistol9mmAP
    proto: CMCartridgePistolM77AP
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsPistol9MMAP
  - type: Sprite
    layers:
    - state: extended
      map: ["enum.GunVisualLayers.Base"]
    - state: extended-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#1F951F"

