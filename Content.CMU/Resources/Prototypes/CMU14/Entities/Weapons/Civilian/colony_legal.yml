# Colony-legal firearms for the colony ASRS: semi-automatic only, and no magazine holds more than 9 rounds.
# The magazines keep the originals' tags, so they also fit the standard guns; the guns start loaded with them.
# Reorganized crates to live in colony.yml, requisitions entries in colony_requisitions_catalog.yml.

# ---- Magazines ----

- type: entity
  parent: RMCMagazineRifleM16
  id: CMUMagazineRifleM16Colony
  name: AR15 Sporter Magazine (5.56x45mm)
  description: "A 5-round 5.56x45mm magazine for the AR15 Sporter, sold for colony use."
  suffix: Colony
  components:
  - type: BallisticAmmoProvider
    capacity: 5

- type: entity
  parent: CMUMagazineRifleAR10
  id: CMUMagazineRifleAR10Colony
