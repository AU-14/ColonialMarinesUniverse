# ---- Guns ----

- type: entity
  parent: AU14WeaponRifleAR10
  id: CMUWeaponRifleAR10Colony
  name: AR10 colony rifle
  suffix: Colony
  components:
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CMUMagazineRifleAR10Colony
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMUMagazineRifleAR10
          - RMCMagazineRifleAR10

