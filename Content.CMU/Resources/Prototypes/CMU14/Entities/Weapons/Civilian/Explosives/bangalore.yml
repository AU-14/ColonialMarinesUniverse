- type: entity
  parent: BaseItem
  id: AU14Bangalore
  name: bangalore demolition charge
  description: A demolition charge used to clear obstacles and breach fortifications. Once placed on the ground it arms itself and detonates after 20 seconds.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Throwable/bangalore.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: CMU14/Weapons/Throwable/bangalore.rsi
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:TriggerBehavior
  - type: CMUBangalore
    placementDelay: 4.3
  - type: RMCExplosiveDelete
    delay: 20
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 4
    initialBeepDelay: 19
    beepInterval: 5
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: CMUBangalore
    totalIntensity: 1783
    intensitySlope: 8
    maxIntensity: 20
    canCreateVacuum: false
  - type: ProjectileGrenade
    fillPrototype: CMProjectileShrapnel
    capacity: 20
  - type: ClusterLimitHits
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container

- type: entity
  parent: AU14Bangalore
  id: CMUDropshipBangaloreProjectile
  name: launched Bangalore charge
  description: A Bangalore demolition charge launched from the M4332 Munition Launcher.
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.15,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        restitution: 0.0
        density: 5
  - type: Projectile
    deleteOnCollide: true
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 20
  - type: DeleteOnTrigger
  - type: TriggerOnCollide
    fixtureID: projectile
