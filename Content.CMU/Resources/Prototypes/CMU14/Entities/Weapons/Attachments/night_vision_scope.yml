- type: entity
  parent: RMCAttachmentS42xTelescopicMiniscope
  id: CMUAttachmentNightVisionScope
  name: 1.5x night vision scope
  description: A rail-mounted night vision optic with fixed 1.5x zoom. Amplifies ambient light while looking through the scope.
  components:
  - type: Sprite
    state: iffbarrel
  - type: AttachableToggleable
    icon:
      sprite: _RMC14/Objects/Weapons/Guns/Attachments/rail.rsi
      state: iffbarrel
    actionName: Look through the Night Vision Scope
    actionDesc: Look through the 1.5x optic with a night vision filter.
  - type: Scope
    zoomLevels:
    - zoom: 1.5
      offset: 13
      allowMovement: true
      doAfter: 0
  - type: NightVisionItem
    actionId: null
    toggleable: false
    enableOnEquip: false
    green: true
    restorePreviousState: true

