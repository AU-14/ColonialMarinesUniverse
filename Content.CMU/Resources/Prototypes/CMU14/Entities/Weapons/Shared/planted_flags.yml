# CMU additions

- type: entity
  parent: CMUPlantedFlag
  id: CMUPlantedFlagUN
  name: UN planted flag
  description: A planted flag with the iconic UN flag plastered all over it, you feel a burst of energy by its mere sight.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Weapons/Sentries/flag.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - map: [ "base" ]
      state: defense_base_off
    - map: [ "flag" ]
      state: un_planted_flag_off
  - type: Icon
    sprite: CMU14/Objects/Weapons/Sentries/flag.rsi
    state: un_planted_flag_handheld
  - type: GenericVisualizer
    visuals:
      enum.CMUFlagLayers.Layer:
        base:
          Item: { state: "", visible: false }
          Off: { state: defense_base_off, visible: true }
          On: { state: defense_base, visible: true }
        flag:
          Item: { state: un_planted_flag_handheld }
          Off: { state: un_planted_flag_off }
          On: { state: un_planted_flag }
  # Only rallies the UNISC and the Red Cross.
  - type: CMUFlagAllegiance
    allegiances: []
    reinforcements: CMUFlagReinforcementsUN
  - type: CMUPlantedFlag
    upgrades: null


# Stopgap for the Royal Marines until a TWE planted flag sprite exists: the extended JIMA flag, rallying the TWE side.
- type: entity
