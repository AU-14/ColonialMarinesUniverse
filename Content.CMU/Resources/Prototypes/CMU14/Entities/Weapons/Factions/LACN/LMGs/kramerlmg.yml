- type: entity
  parent: AU14WeaponRifleKramerAR
  name: Kramer Light Support Weapon
  id: AU14WeaponRifleKramerLSW
  description: Also referred to as the Kramer or KAR, the Kramer Light Support Weapon is an automatic squad support variant of the standard Kramer assault rifle. Manufactured by Kramer Metallarbeiten GmbH, the KAR sees widespread use across United Americas.
  components:
    - type: Sprite
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramermg/kramericon.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Item
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramermg/kramer32x32.rsi
    - type: Clothing
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramermg/kramer32x32.rsi
    - type: Gun
      selectedMode: FullAuto
      availableModes:
        - SemiAuto
        - FullAuto
    - type: RMCSelectiveFire
      baseFireModes:
        - SemiAuto
        - FullAuto
      recoilUnwielded: 5
      scatterWielded: 5
      baseFireRate: 6
      burstScatterMult: 2
      modifiers:
        Burst:
          fireDelay: 0.1665
          maxScatterModifier: 10
          useBurstScatterMult: true
          unwieldedScatterMultiplier: 2
          shotsToMaxScatter: 6
        FullAuto:
          fireDelay: 0
          maxScatterModifier: 26
          useBurstScatterMult: true
          unwieldedScatterMultiplier: 2
          shotsToMaxScatter: 4
    - type: RMCWeaponAccuracy
      accuracyMultiplier: 1
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
          ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
          priority: 2
          whitelist:
            tags:
              - AU14WeaponRifleKramerMagazineLSWStandard
              - AU14WeaponRifleKramerMagazineLSWAP
          startingItem: AU14WeaponRifleKramerMagazineLSWStandard
    - type: GunDamageModifier
      multiplier: 1.05
    - type: AttachableHolder
      slots:
        rmc-aslot-rail:
          whitelist:
            tags:
              - RMCAttachmentRailFlashlight
              - RMCAttachmentMagneticHarness
        rmc-aslot-stock:
          startingAttachable: CMULACNAttachmentKramerStock
          whitelist:
            tags:
              - CMULACNAttachmentKramerStock
        rmc-aslot-underbarrel:
          whitelist:
            tags:
              - RMCAttachmentAngledGrip
              - RMCAttachmentBipod
              - RMCAttachmentVerticalGrip
              - RMCAttachmentFlashlightGrip
              - RMCAttachmentBurstFireAssembly
    - type: AttachableHolderVisuals
      offsets:
        rmc-aslot-rail: -0.2, 0.12
        rmc-aslot-barrel: 0.82, 0.031
        rmc-aslot-stock: -0.59, 0
        rmc-aslot-underbarrel: 0.44, -0.31
    - type: GunRequiresWield
    - type: Corrodible
      isCorrodible: false
    - type: Tag
      tags:
        - AU14WeaponRifleKramerLSW

- type: entity
  parent: AU14WeaponRifleKramerLSW
  id: AU14WeaponRifleKramerLSWAP
  name: Kramer Light Support Weapon (AP)
  components:
    - type: ItemSlots
      slots:
        gun_magazine:
          name: Magazine
          insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
          ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
          priority: 2
          whitelist:
            tags:
              - AU14WeaponRifleKramerMagazineLSWStandard
              - AU14WeaponRifleKramerMagazineLSWAP
          startingItem: AU14WeaponRifleKramerMagazineLSWAP

- type: entity
  parent: CMMagazineRifleBase
  id: AU14WeaponRifleKramerMagazineLSWStandard
  name: "Kramer LSW box magazine (10x24mm)"
  components:
    - type: Tag
      tags:
        - CMMagazineRifle
        - AU14WeaponRifleKramerMagazineLSWStandard
    - type: BallisticAmmoProvider
      mayTransfer: True
      whitelist:
        tags:
          - CMCartridgeRifle10x24mm
      proto: CMCartridgeRifle10x24mm
      capacity: 125
    - type: Sprite
      sprite: CMU14/Weapons/Guns/Ammo/Magazines/kramerbox.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
    - type: Appearance
    - type: RefillableByBulletBox
      bulletType: RMCBoxBulletsRifle

- type: entity
  parent: AU14WeaponRifleKramerMagazineLSWStandard
  id: AU14WeaponRifleKramerMagazineLSWAP
  name: "Kramer LSW AP box magazine (10x24mm)"
  suffix: AP
  components:
    - type: Tag
      tags:
        - CMMagazineRifle
        - AU14WeaponRifleKramerMagazineLSWAP
    - type: BallisticAmmoProvider
      whitelist:
        tags:
          - CMCartridgeRifle10x24mmAP
      proto: CMCartridgeRifle10x24mmAP
    - type: Sprite
      sprite: CMU14/Weapons/Guns/Ammo/Magazines/kramerbox.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-1
          map: ["enum.GunVisualLayers.Mag"]
    - type: RefillableByBulletBox
      bulletType: RMCBoxBulletsRifleAP

- type: entity
  parent: AU14WeaponRifleKramerLSW
  id: CMUWeaponRifleKramerLSWShort
  name: Kramer Mobile Support Weapon
  description: A short-barreled variant of the Kramer Light Support Weapon. Lighter and quicker to bring to bear, at the cost of some accuracy. Takes Kramer LSW box magazines.
  components:
    - type: Sprite
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramermgshort/kramericon.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
        - state: mag-0
          map: ["enum.GunVisualLayers.Mag"]
    - type: Item
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramermgshort/kramer32x32.rsi
    - type: Clothing
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramermgshort/kramer32x32.rsi
    - type: RMCSelectiveFire
      baseFireModes:
        - SemiAuto
        - FullAuto
      recoilUnwielded: 5
      scatterWielded: 6
      scatterUnwielded: 20
      baseFireRate: 5
      burstScatterMult: 2
      modifiers:
        FullAuto:
          fireDelay: 0
          maxScatterModifier: 14
          useBurstScatterMult: true
          unwieldedScatterMultiplier: 2
          shotsToMaxScatter: 30
    - type: RMCWeaponAccuracy
      accuracyMultiplier: 1
      accuracyMultiplierUnwielded: 0.5
    - type: WieldDelay
      baseDelay: 0.5
    - type: Tag
      tags:
        - AU14WeaponRifleKramerLSW
        - CMUWeaponRifleKramerLSWShort

- type: Tag
  id: CMUWeaponRifleKramerLSWShort

