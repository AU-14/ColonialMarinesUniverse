- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: Kramer Assault Rifle
  id: AU14WeaponRifleKramerAR
  description: Alternately referred to as the Kramer or KAR, it is an automatic assault rifle manufactured by Kramer Metallarbeiten GmbH and is used by many military forces across the United Americas.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerrifle/kramericon.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerrifle/kramer32x32.rsi
  - type: Clothing
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/kramerrifle/kramer32x32.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: CMM54CShoot
    shotsPerBurst: 4
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 5
    scatterUnwielded: 20
    baseFireRate: 4
    burstScatterMult: 1
    modifiers:
      Burst:
        fireDelay: 0.1665
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        fireDelay: 0
        maxScatterModifier: 12
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.65
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14WeaponRifleKramerMagazineStandard
          - AU14WeaponRifleKramerMagazineAP
        startingItem: AU14WeaponRifleKramerMagazineStandard
  - type: GunDamageModifier
    multiplier: 1.1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentB8SmartScope
      rmc-aslot-stock:
        startingAttachable: CMULACNAttachmentKramerStock
        whitelist:
          tags:
          - CMULACNAttachmentKramerStock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlamer
          - RMCAttachmentLaserSight
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: -0.0625, -0.0625
      rmc-aslot-barrel: 0.755, 0.031
      rmc-aslot-stock: -0.44, 0
      rmc-aslot-underbarrel: -1.40625, -0.84375

- type: entity
  parent: AU14WeaponRifleKramerAR
  id: AU14WeaponRifleKramerARAP
  name: Kramer Assault Rifle (AP)
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14WeaponRifleKramerMagazineStandard
          - AU14WeaponRifleKramerMagazineAP
        startingItem: AU14WeaponRifleKramerMagazineAP

- type: entity
  parent: CMMagazineRifleBase
  id: AU14WeaponRifleKramerMagazineStandard
  name: "Kramer magazine (10x24mm)"
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - AU14WeaponRifleKramerMagazineStandard
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle10x24mm
    proto: CMCartridgeRifle10x24mm
    capacity: 80
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/kramermag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: entity
  parent: AU14WeaponRifleKramerMagazineStandard
  id: AU14WeaponRifleKramerMagazineAP
  name: "Kramer AP magazine (10x24mm)"
  suffix: AP
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - AU14WeaponRifleKramerMagazineAP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMCartridgeRifle10x24mmAP
    proto: CMCartridgeRifle10x24mmAP
    capacity: 40
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/kramermag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#1F951F"
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifleAP

