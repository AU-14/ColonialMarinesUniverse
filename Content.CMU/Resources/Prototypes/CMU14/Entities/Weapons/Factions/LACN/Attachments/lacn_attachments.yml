- type: entity
  parent: RMCAttachmentBipod
  id: CMULACNAttachmentBipod
  name: LACN bipod
  description: A folding bipod used on LACN support weapons. When deployed, greatly increases accuracy, fire-rate and reduces recoil, but when folded also increases weapon size and slows fire-rate.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/attachments/underbarrel.rsi
    state: bipod
  - type: AttachableVisuals
    suffix: ""
    showActive: true
    offset: -0.0625, 0.219

- type: entity
  parent: RMCAttachmentU1GrenadeLauncher
  id: CMULACNAttachmentUnderbarrelGrenadeLauncher
  name: LACN underbarrel grenade launcher
  description: A weapon-mounted, reloadable grenade launcher used by the LACN landing forces.
  components:
  - type: Sprite
    layers:
    - sprite: CMU14/Weapons/Guns/LACN/LACNRedux/attachments/underbarrel.rsi
      state: ubgl
      map: [ "enum.BreechVisuals.Open" ]
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          True: { state: ubgl }
          False: { state: ubgl }
  - type: AttachableVisuals
    suffix: ""
    offset: 0.0, 0.31
    redrawOnAppearanceChange: true

- type: entity
  parent: RMCAttachmentU7UnderbarrelShotgun
  id: CMULACNAttachmentUnderbarrelShotgun
  name: LACN underbarrel shotgun
  description: A compact underbarrel shotgun used by the LACN landing forces. Only capable of loading up to five buckshot shells. Specialized for breaching into buildings.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/attachments/underbarrel.rsi
    state: ubs
  - type: AttachableVisuals
    suffix: ""
    offset: -0.016, 0.219

