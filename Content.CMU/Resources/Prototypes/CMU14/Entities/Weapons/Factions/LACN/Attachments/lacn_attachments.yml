- type: entity
  parent: RMCAttachmentM54CStockCollapsible
  id: CMULACNAttachmentKarbineStock
  name: Kramer Karbine folding stock
  description: The folding stock of the Kramer Karbine. When extended, reduces recoil and scatter at a small cost to handling.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/attachments/stocks.rsi
    state: karbine-stock
  - type: AttachableVisuals
    suffix: ""
    showActive: true
  - type: Tag
    tags:
    - RMCAttachmentStock
    - CMULACNAttachmentKarbineStock
  - type: AttachableToggleable
    doAfterBreakOnMove: false
    doAfter: 0.5
    icon:
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/attachments/stocks.rsi
      state: karbine-stock
    iconActive:
      sprite: CMU14/Weapons/Guns/LACN/LACNRedux/attachments/stocks.rsi
      state: karbine-stock-on
    actionName: Toggle Kramer Karbine Folding Stock
  - type: ItemCamouflage
    camouflageVariations: { }

