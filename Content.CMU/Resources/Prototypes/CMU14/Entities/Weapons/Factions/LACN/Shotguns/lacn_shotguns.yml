- type: entity
  parent: RMCWeaponShotgunHG3712
  id: CMUWeaponShotgunLACNBreacher
  name: LACN breacher shotgun
  description: A compact pump-action shotgun issued to LACN landing forces for door breaching and close quarters work. Accepts breaching shells.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/breachershotgun.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/breachershotgun.rsi
  - type: BallisticAmmoProvider
    proto: CMShellShotgunBuckshot
    whitelist:
      tags:
      - RMCShellShotgunBuckshot
      - RMCShellShotgunSlugs
      - RMCShellShotgunFlechette
      - RMCShellShotgunIncendiaryBuckshot
      - RMCShellShotgunIncendiary
      - RMCShellShotgunBeanbag
      - RMCShellShotgunBreaching
    capacity: 8
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentRecoilCompensator
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
      rmc-aslot-stock:
        whitelist:
          tags:
          - CMULACNAttachmentBreacherStock
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.78, .02
      rmc-aslot-rail: -0.18, 0.125
      rmc-aslot-stock: -0.5, 0
      rmc-aslot-underbarrel: 0.32, -0.31
  - type: Tag
    tags:
    - RMCWeaponShotgun
    - CMUWeaponShotgunLACNBreacher

