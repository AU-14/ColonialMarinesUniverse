- type: entity
  parent: RMCBaseWeaponShotgun
  id: CMUWeaponRevolverLACNJudge
  name: LACN Judge
  description: A heavy five-shot revolver chambered for 12 gauge shotgun shells. A favourite sidearm of LACN officers for its stopping power at close range.
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/judge.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Item
    size: Normal
  - type: Clothing
    sprite: CMU14/Weapons/Guns/LACN/LACNRedux/LACN/judge.rsi
    slots:
    - suitStorage
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_shotgun_small.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 3
    scatterWielded: 10
    scatterUnwielded: 15
    baseFireRate: 1.25
    burstScatterMult: 5
  - type: BallisticAmmoProvider
    cycleable: false
    whitelist:
      tags:
      - RMCShellShotgun
    capacity: 5
    proto: null
    soundInsert:
      collection: CMShotgunLoad
  - type: Tag
    tags:
    - Sidearm
    - RMCRevolver
    - CMUWeaponRevolverLACNJudge

