- type: entity
  parent: RMCBaseWeaponSniperRifle
  id: CMUSniperRifleTWE
  name: L144 Sniper Rifle
  description: The L144 LRR, adopted by the TWE for use by Royal Marine Commandos snipers. Praised by its users and feared by their targets, the L144 sends 10x28mm rounds downrange at a devastating velocity and with pinpoint accuracy.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleSpecSniper
  - type: Sprite
    sprite: CMU14/Weapons/Guns/RMC/l144.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    size: Large
  - type: Clothing
    sprite: CMU14/Weapons/Guns/RMC/l144.rsi
  - type: Tag
    tags:
    - CMUSniperRifleTWE
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.667
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
  - type: GunDamageModifier
    multiplier: 1.5
  - type: WieldDelay
    baseDelay: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CMUMagazineSniperL144SH
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mar40_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMUMagazineSniperL144
          - CMUMagazineSniperL144SH
  - type: GunUserWhitelist
    whitelist:
      components:
      - SniperWhitelist
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: GunIFF
    enabled: true
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        locked: true
        startingAttachable: RMCM96SIntegratedScope
        whitelist:
          tags:
          - RMCM96SIntegratedScope
      rmc-aslot-barrel:
        locked: true
        startingAttachable: CMUAttachmentSuppressorL144
        whitelist:
          tags:
          - CMUAttachmentSuppressorL144
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBipod
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.42, -0.28
  - type: RMCGunChamber
    enabled: false

- type: entity
  parent: CMMagazineSniperM96S
  id: CMUMagazineSniperL144
  name: "L144 marksman magazine (10x28mm)"
  description: A 15-round magazine of 10x28mm marksman cartridges.
  components:
  - type: Tag
    tags:
    - CMMagazineSniper
    - CMUMagazineSniperL144
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeSniper10x28mm
    proto: CMCartridgeSniper10x28mm
    capacity: 15
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/l114.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: CMUMagazineSniperL144
  id: CMUMagazineSniperL144SH
  name: "L144 squash-head magazine (10x28mm)"
  description: A 15-round magazine of 10x28mm squash-head cartridges.
  components:
  - type: Tag
    tags:
    - CMMagazineSniper
    - CMUMagazineSniperL144SH
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMUCartridgeSniper10x28mmSH
    proto: CMUCartridgeSniper10x28mmSH
    capacity: 15
  - type: Sprite
    sprite: CMU14/Weapons/Guns/Ammo/Magazines/l114.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#DD4242"

- type: entity
  parent: CMCartridgeSniper10x28mm
  id: CMUCartridgeSniper10x28mmSH
  name: squash-head cartridge (10x28mm)
  components:
  - type: CartridgeAmmo
    proto: CMUBulletSniper10x28mmSH
  - type: Tag
    tags:
    - Cartridge
    - CMUCartridgeSniper10x28mmSH

- type: entity
  parent: CMBulletSniper10x28mm
  id: CMUBulletSniper10x28mmSH
  name: squash-head bullet (10x28mm)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 90
  - type: CMArmorPiercing
    amount: 50
  - type: AimedShotEffect
    extraHits: 1
    superSlowDuration: 7.5

- type: entity
  parent: RMCBarrelAttachmentBase
  id: CMUAttachmentSuppressorL144
  name: L144 integrated suppressor
  description: Sod, son! That'll cost a pretty penny to fix...
  components:
  - type: Sprite
    sprite: CMU14/Weapons/Guns/RMC/l144_barrel.rsi
    state: suppressor_l144
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - CMUAttachmentSuppressorL144
  - type: AttachableSilencer
    sound:
      collection: RMCL112Shoot
      params:
        maxDistance: 6

- type: Tag
  id: CMUSniperRifleTWE

- type: Tag
  id: CMUMagazineSniperL144

- type: Tag
  id: CMUMagazineSniperL144SH

- type: Tag
  id: CMUCartridgeSniper10x28mmSH

- type: Tag
  id: CMUAttachmentSuppressorL144
