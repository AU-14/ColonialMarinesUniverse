# Impacts
- type: entity
  id: CMULTBCannonImpactAPFSDS
  name: 86mm M369 APFSDS cannon impact
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: DeleteOnTrigger
  - type: RMCScorchEffect
    radius: 2
    centerRadius: 0

- type: entity
  id: CMULTBCannonImpactHEAT
  name: 86mm M320 HEAT cannon impact
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: DeleteOnTrigger
  - type: CMExplosionEffect
    minShrapnel: 15
    maxShrapnel: 40
    shrapnelSpeed: 8
  - type: RMCScorchEffect
    radius: 3
    centerRadius: 1
  - type: Explosive
    explosionType: RMCLTBCannon
    maxIntensity: 6
    intensitySlope: 2
    totalIntensity: 60
    tileBreakScale: 0
    maxTileBreak: 0

