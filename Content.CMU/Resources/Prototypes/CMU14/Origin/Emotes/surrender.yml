- type: emote
  id: CMUSurrender
  name: cmu-emote-name-surrender
  category: Hands
  icon: CMU14/Interface/Emotes/surrender.png
  whitelist:
    requireAll: true
    components:
    - Hands
    - HumanoidProfile
    - VisualBody
  chatTriggers:
  - surrender
  - raises both hands
  - hands up

- type: displacementData
  id: CMUSurrenderLimbs
  displacement:
    shaderOverride: CMUSurrenderDraw
    shaderOverrideUnshaded: CMUSurrenderDrawUnshaded
    sizeMaps:
      32:
        sprite: CMU14/Mobs/Surrender/pose.rsi
        state: limbs
        copyToShaderParameters:
          layerKey: dummy
          parameterTexture: displacementMap
          parameterUV: displacementUV

