- type: emote
  id: CMUPushups
  name: cmu-emote-name-pushups
  category: Hands
  icon: Interface/Emotes/salute.png
  whitelist:
    requireAll: true
    components:
    - Hands
    - HumanoidProfile
  # No chat message: the pushups popup sends one once a style is picked.
  chatTriggers:
  - pushups
  - push ups
  - push-ups
  - does pushups
  - does push ups
  - starts doing pushups
  - drops and does pushups
  # Knee pushups are picked in the popup pushups opens.
  - knee pushups
  - knee push ups
  - pushups on knees
  - does knee pushups
  - does pushups on their knees

- type: emote
  id: CMUSitups
  name: cmu-emote-name-situps
  category: Hands
  icon: Interface/Emotes/salute.png
  whitelist:
    requireAll: true
    components:
    - Hands
    - HumanoidProfile
  chatMessages: ["cmu-emote-msg-situps"]
  chatTriggers:
  - situps
  - sit ups
  - sit-ups
  - does situps
  - does sit ups
  - starts doing situps
