# Native equipment with server-only AI preferences; no damage, ammunition or wield-delay bonuses.
- type: entity
  parent: CMSatchel
  id: CMUExpeditionFieldPack
  components:
  - type: Storage
    grid:
    - 0,0,20,1

- type: entity
  parent: CMWeaponPistolM1984
  id: CMUExpeditionSidearm
  components:
  - type: CMUExpeditionWeaponRole
    priority: 10
    maximumRange: 9
    closePriority: 12
    burstLimit: 3

- type: entity
  parent: RMCWeaponRifleM54C2
  id: CMUExpeditionAssaultRifle
  components:
  - type: CMUExpeditionWeaponRole

- type: entity
  parent: WeaponSMGM63
  id: CMUExpeditionSMG
  components:
  - type: CMUExpeditionWeaponRole
    maximumRange: 11
    closePriority: 8

- type: entity
  parent: RMCWeaponRifleM54CE2
  id: CMUExpeditionSupportRifle
  components:
  - type: CMUExpeditionWeaponRole
    closePriority: -12
    burstLimit: 7

- type: entity
  parent: WeaponRifleM4SPR
  id: CMUExpeditionMarksmanRifle
  components:
  - type: CMUExpeditionWeaponRole
    closePriority: -15
    burstLimit: 2

- type: entity
  parent: RuMCWeaponLauncherDisposable
  id: CMUExpeditionDisposableLauncher
  components:
  - type: BallisticAmmoProvider
    proto: RMCRocketHJRA12HE
  - type: CMUBackblast
    nearEffect: CMUBackblastSmokeNear
    farEffect: CMUBackblastSmokeFar
  - type: CMUExpeditionWeaponRole
    priority: 45
    rocket: true
    minimumRange: 4.5
    maximumRange: 6
    burstLimit: 1
    blastRadius: 4

- type: startingGear
  id: CMUExpeditionSpecialistGear
  abstract: true
  equipment:
    head: RMCArmorHelmetMercenaryReinforced
    jumpsuit: RMCJumpsuitMercenaryHeavy
    outerClothing: RMCArmorMercenaryHeavy
    gloves: CMHandsBlackMarine
    shoes: RMCShoesBrown
    pocket1: CMUExpeditionFieldDressing
    back: CMUExpeditionFieldPack
    ears: CMUExpeditionHeadset

- type: startingGear
  parent: CMUExpeditionSpecialistGear
  id: CMUExpeditionAssaultGear
  inhand:
  - CMUExpeditionSMG
  storage:
    back:
    - CMMagazineSMGM63
    - CMMagazineSMGM63
    - CMUExpeditionSidearm
    - CMMagazinePistolM1984
    - CMUExpeditionSmokeGrenade
    - CMUExpeditionBlastGrenade
    - RMCShovel

- type: entity
  parent: CMUExpeditionScavenger
  id: CMUExpeditionScavengerAssault
  components:
