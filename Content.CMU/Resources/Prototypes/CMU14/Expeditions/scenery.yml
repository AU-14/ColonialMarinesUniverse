# Expedition-only scenery using existing licensed sprites. Small dressing has no collision or loot.
- type: entity
  id: CMUExpeditionFloorDetail
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Sprite
    drawdepth: FloorObjects
  - type: Clickable

