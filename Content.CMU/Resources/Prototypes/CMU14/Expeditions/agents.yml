    jumpsuit: RMCJumpsuitCLFWebbing
    outerClothing: RMCCoatMilitiaVest
    gloves: CMHandsBlackMarine
    shoes: RMCShoesBrown
    pocket1: CMUExpeditionFieldDressing
    back: CMUExpeditionFieldPack
    belt: CMBeltMarine
    pocket2: RMCPouchGeneralLarge
    ears: CMUExpeditionHeadset
  inhand:
  - WeaponRifleMAR40
  storage:
    back:
    - CMUExpeditionBlastGrenade
    - CMUExpeditionSmokeGrenade
    - CMUExpeditionSidearm
    - CMMagazinePistolM1984
    - RMCShovel
    - CMPackFlare
    belt:
    - RMCMagazineRifleMAR40
    - RMCMagazineRifleMAR40

- type: entity
