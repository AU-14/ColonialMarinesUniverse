  - type: Skills
    skills:
      RMCSkillFirearms: 1
      RMCSkillConstruction: 1
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Loadout
    prototypes: [CMUExpeditionScavengerGear]
  - type: NpcFactionMember
    factions: [CMUExpeditionHostile]
  - type: FixedIdentity
    name: cmu-expedition-scavenger-identity

