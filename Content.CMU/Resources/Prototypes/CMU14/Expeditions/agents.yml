  parent: CMUExpeditionScavenger
  id: CMUExpeditionScavengerScout
  components:
  - type: CMUExpeditionAgent
    combatRole: Flanker
    disposition: Cautious
    aggression: 0.4
    courage: 0.55
    detectionRange: 22
    preferredFireRange: 10
    retreatDamage: 45
    repositionCooldown: 3
  - type: Loadout
    prototypes: [CMUExpeditionScavengerScoutGear]
  - type: FixedIdentity
    name: cmu-expedition-scout-identity

- type: entity
  parent: CMGrenadeHighExplosive
  id: CMUExpeditionBlastGrenade
  components:
  - type: CMUExpeditionGrenade

- type: entity
  parent: CMGrenadeSmoke
  id: CMUExpeditionSmokeGrenade
  components:
  - type: CMUExpeditionGrenade
    smoke: true
    safeRadius: 1

- type: radioChannel
  id: CMUExpedition
  name: cmu-expedition-radio-channel
  keycode: 'j'
  color: '#c4a77d'
  longRange: false
  tower: false
  planet: true

- type: entity
  parent: CMEncryptionKeyColony
  id: CMUExpeditionEncryptionKey
  components:
  - type: EncryptionKey
    channels: [CMUExpedition]
    defaultChannel: CMUExpedition

- type: entity
  parent: RMCHeadsetDistressCLF
  id: CMUExpeditionHeadset
  components:
  - type: CMUExpeditionRadio
  - type: TelecomExempt
  - type: ContainerFill
    containers:
      key_slots: [CMUExpeditionEncryptionKey]

- type: stack
  id: CMUExpeditionFieldDressing
  name: cmu-expedition-field-dressing-stack
  spawn: CMUExpeditionFieldDressing
  maxCount: 3

- type: entity
  parent: CMBaseHealingItem
  id: CMUExpeditionFieldDressing
  components:
  - type: Sprite
    state: gauze
  - type: Item
    heldPrefix: gauze
  - type: Healing
    damage:
      types:
        Blunt: -12
        Slash: -12
        Piercing: -12
        Heat: -12
    bloodlossModifier: -2
    delay: 3
    selfHealPenaltyMultiplier: 1
    healingBeginSound:
      path: /Audio/_RMC14/Medical/bandage.ogg
    healingEndSound:
      path: /Audio/Items/Medical/brutepack_end.ogg
  - type: Stack
    stackType: CMUExpeditionFieldDressing
    count: 3
