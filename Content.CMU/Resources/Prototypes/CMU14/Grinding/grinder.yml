- type: entity
  parent: BaseItem
  id: RUMCShredderBlade
  name: crushing attachment
  description: A heavy-duty crushing attachment for the grinder. It takes two of these, seated together, for the machine to run at all.
  components:
  - type: Sprite
    sprite: CMU14/Objects/Materials/iron_ingot.rsi
    state: drilling_attachment
  - type: Item
    size: Small
  - type: GrinderBlade
    durability: 100
    maxDurability: 100

- type: entity
  abstract: true
  id: RUMCGrinderBase
  components:
  - type: PortableStructure
  - type: Sprite
    sprite: Structures/Machines/seed_extractor.rsi
    state: seedextractor-off
    noRot: true
  - type: ItemSlots
    slots:
      material1: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material2: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material3: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material4: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material5: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material6: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material7: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material8: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      material9: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      blade1:
        whitelist:
          components:
          - GrinderBlade
        insertOnInteract: false
      blade2:
        whitelist:
          components:
          - GrinderBlade
        insertOnInteract: false
      output1: { insertOnInteract: false }
      output2: { insertOnInteract: false }
      output3: { insertOnInteract: false }
      output4: { insertOnInteract: false }
      output5: { insertOnInteract: false }
      output6: { insertOnInteract: false }
      output7: { insertOnInteract: false }
      output8: { insertOnInteract: false }
      output9: { insertOnInteract: false }
      output10: { insertOnInteract: false }
      output11: { insertOnInteract: false }
      output12: { insertOnInteract: false }
      output13: { insertOnInteract: false }
      output14: { insertOnInteract: false }
      output15: { insertOnInteract: false }
      output16: { insertOnInteract: false }
      output17: { insertOnInteract: false }
      output18: { insertOnInteract: false }
  - type: ContainerContainer
    containers:
      material1: !type:ContainerSlot
      material2: !type:ContainerSlot
      material3: !type:ContainerSlot
      material4: !type:ContainerSlot
      material5: !type:ContainerSlot
      material6: !type:ContainerSlot
      material7: !type:ContainerSlot
      material8: !type:ContainerSlot
      material9: !type:ContainerSlot
      blade1: !type:ContainerSlot
      blade2: !type:ContainerSlot
      output1: !type:ContainerSlot
      output2: !type:ContainerSlot
      output3: !type:ContainerSlot
      output4: !type:ContainerSlot
      output5: !type:ContainerSlot
      output6: !type:ContainerSlot
      output7: !type:ContainerSlot
      output8: !type:ContainerSlot
      output9: !type:ContainerSlot
      output10: !type:ContainerSlot
      output11: !type:ContainerSlot
      output12: !type:ContainerSlot
      output13: !type:ContainerSlot
      output14: !type:ContainerSlot
      output15: !type:ContainerSlot
      output16: !type:ContainerSlot
      output17: !type:ContainerSlot
      output18: !type:ContainerSlot
  - type: Grinder
  - type: WindowMachine
    stackSlots:
      - material1
      - material2
      - material3
      - material4
      - material5
      - material6
      - material7
      - material8
      - material9
    outputSlots:
      - output1
      - output2
      - output3
      - output4
      - output5
      - output6
      - output7
      - output8
      - output9
      - output10
      - output11
      - output12
      - output13
      - output14
      - output15
      - output16
      - output17
      - output18
  - type: UserInterface
    interfaces:
      enum.GrinderUiKey.Key:
        type: AU14GrinderBoundUserInterface
  - type: ActivatableUI
    key: enum.GrinderUiKey.Key

- type: entity
  parent: [ RUMCGrinderBase, BaseMachinePowered, BaseMachineDestructible ]
  id: RUMCGrinder
  name: grinder
  description: An automated shredder wired into the grid - needs a pair of blades seated to run, and chews through every slot it can at once.
  components:
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 300
  - type: ActivatableUIRequiresPower

# The grinder that runs on steam instead of the grid: the same slots, blades and rules, fed by a steam pipe.
- type: entity
  parent: [ RUMCGrinderBase, RUMCSteamMachineBase ]
  id: RUMCSteamGrinder
  name: steam grinder
  description: A shredder driven by steam instead of the grid. Join a gas pipe with steam to it and it chews through every slot it can at once.
  components:
  - type: Grinder
    steamPerSecond: 0.3
  - type: NodeContainer
    nodes:
      steam:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
  - type: SteamPort

- type: cmuGrinderRecipe
  id: RUMCGrinderRecipeCrushOre
  input: SteelOre
  inputAmount: 1
  result: Coal
  resultAmount: 1

- type: cmuGrinderRecipe
  id: RUMCGrinderRecipeShredMetal
  input: CMSteel
  inputAmount: 2
  result: CMSteel
  resultAmount: 1

