  material: GunsmithTitanium
  failureStrain: 0.14

- type: armorsmithPlate
  id: ArmorsmithPlatePlastitan
  material: GunsmithPlastitan
  failureStrain: 0.13

- type: armorsmithPlate
  id: ArmorsmithPlateTungsten
  material: GunsmithTungsten
  failureStrain: 0.02

- type: armorsmithPlate
  id: ArmorsmithPlateAluminum
  material: GunsmithAluminum
  failureStrain: 0.10

- type: armorsmithPlate
  id: ArmorsmithPlateBrass
  material: GunsmithBrass
