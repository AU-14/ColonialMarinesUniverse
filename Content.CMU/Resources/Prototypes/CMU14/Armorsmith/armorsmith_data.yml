# The data of the armorer's bench. The strength, the density and the stiffness of a plate are those of the gunsmith's material (the same table);
# what only armor needs is here: how far the metal stretches before it breaks (failureStrain, a share: 0.12 is 12%).
# A tough metal takes the energy of a bullet, a brittle one (tungsten, wood) cracks.

# ---------------------------------------------------------------- plates

- type: armorsmithPlate
  id: ArmorsmithPlateIron
  material: GunsmithIron
  failureStrain: 0.25

- type: armorsmithPlate
  id: ArmorsmithPlateSteel
  material: GunsmithSteel
  failureStrain: 0.12

- type: armorsmithPlate
  id: ArmorsmithPlatePlasteel
  material: GunsmithPlasteel
  failureStrain: 0.10

- type: armorsmithPlate
