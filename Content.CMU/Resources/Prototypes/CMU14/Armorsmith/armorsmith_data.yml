# ---------------------------------------------------------------- the soft backing
# ultimateMpa: strength of the thread; failureStrain: share; densityGcm3; youngGpa; layerKgM2: mass of one layer of the weave; areaPerItemM2: how much one item makes.

- type: armorsmithBacking
  id: ArmorsmithBackingCloth
  name: armorsmith-backing-cloth
  stackType: Cloth
  ultimateMpa: 400
  failureStrain: 0.08
  densityGcm3: 1.5
  youngGpa: 10
  layerKgM2: 0.2
  areaPerItemM2: 0.5

- type: armorsmithBacking
  id: ArmorsmithBackingDurathread
  name: armorsmith-backing-durathread
  stackType: Durathread
  ultimateMpa: 2500
  failureStrain: 0.035
  densityGcm3: 1.44
  youngGpa: 70
  layerKgM2: 0.2
  areaPerItemM2: 0.5
