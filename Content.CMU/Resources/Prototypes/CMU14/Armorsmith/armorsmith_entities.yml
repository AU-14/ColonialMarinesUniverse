# The armorer's bench: a kit that unfolds into a bench where armor and helmets are designed and built, and where armor is painted anew.

- type: entity
  parent: BaseItem
  id: RUMCArmorsmithBenchKit
  name: armorer's bench kit
  suffix: Sapper
  description: A folded armorer's bench. Use it in hand to unfold it where you stand. Only someone trained as a sapper knows how.
  components:
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    state: icon
    scale: 0.5, 0.5
    color: "#4a5a7a"
  - type: Item
    size: Normal
  - type: SapperWorkbenchKit
    workbenchPrototype: RUMCArmorsmithBench

- type: entity
  id: RUMCArmorsmithBench
  name: armorer's bench
  suffix: Sapper
  description: A bench with an anvil, a press, shears and a dyeing vat. Feed it ingots and cloth, design an armor or a helmet, and then paint it any color you want.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
    color: "#4a5a7a"
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable
  - type: Pullable
  - type: Appearance
  - type: ArmorsmithBench
  - type: ContainerContainer
    containers:
      armorsmith_item: !type:ContainerSlot {}
  - type: ActivatableUI
    key: enum.ArmorsmithUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ArmorsmithUiKey.Key:
        type: ArmorsmithBui
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


# ---------------------------------------------------------------- what the pieces are made of
# The look gives the sprites; the protection, the weight and the color are put on at the bench.

- type: entity
  parent: RMCBaseMarineArmorNoAccessory
  id: RUMCCraftedArmorBodyBase
  abstract: true
  name: handmade armor
  components:
  - type: CraftedArmor
  - type: AU14CustomClothingColor

- type: entity
  parent: RMCHelmetBase
  id: RUMCCraftedArmorHeadBase
  abstract: true
  name: handmade helmet
  components:
  - type: CraftedArmor
  - type: AU14CustomClothingColor

# A ghillie suit: light, woven of plant fiber, and it hides the wearer the way the ghillie armor of the game does. The CLF can wear it as the snipers do.
- type: entity
  parent: RMCBaseMarineArmorNoAccessory
  id: RUMCCraftedArmorGhillieBase
  abstract: true
  name: handmade ghillie suit
  components:
  - type: CraftedArmor
  - type: AU14CustomClothingColor
  - type: GhillieSuit
    whitelist:
      components:
      - CLFMember
      - SniperWhitelist
      - SpotterWhitelist
