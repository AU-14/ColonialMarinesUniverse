# LACN MASH team, called in through the UA intel list: a chief medical officer, a doctor and two nurses with the
# LACN medical department kit (the doctor brings a LifePak and a surgical tent), and a rifleman to guard them.

- type: entity
  parent: SquadBase
  id: CMUSquadLACNMASH
  name: LACN MASH
  components:
  - type: SquadTeam
    color: "#2e8b57"
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: UASOF
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_medical
    canSupplyDrop: false
    group: CMULACNMASH
