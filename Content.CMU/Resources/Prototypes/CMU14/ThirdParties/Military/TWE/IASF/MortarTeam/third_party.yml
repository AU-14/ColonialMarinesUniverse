# IASF mortar team, called in through the TWE intel list: a gunner carrying the L53A1 light mortar and a loader.
# The shells are carried on them: a filled mortar pack each, plus L79 mortar rigs with more shells (two WP on the
# gunner) and an L14 sidearm. Their L90s keep the two magazines on their webbing.
- type: job
  parent: AU14IASFRiflemanBase
  id: CMUIASFMortarGunner
  name: cmu-job-name-iasf-mortar-gunner
  spawnMenuRoleName: IASF Mortar Gunner (Mortar Team)
  playTimeTracker: AU14IASFRifleman
  greeting: cmu-job-greeting-iasf-mortar
  startingGear: CMUGearIASFMortarGunner
  basePlaytimeTracker: true
  chevrons:
    IASF_PrivateFirstClass:
      entity: AU14ChevronIASFCorporalFirstClass
      requirements: []
  accessGroups:
  - AU14GovforSquad
  hidden: true

- type: entity
  parent: AU14BaseMobSpeciesOrganicTWEIASF
  id: CMUIASFMortarGunner
  name: IASF Mortar Gunner (Mortar Team)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: AU14SquadIASF
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-ghost-name-iasf-mortar-gunner
    description: cmu-job-description-iasf-mortar
    job: CMUIASFMortarGunner
    rules: au14-job-rules-IASFsurv
    raffle:
      settings: short

