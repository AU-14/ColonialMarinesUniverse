# cmss13 code/modules/gear_presets/dutch.dm and code/datums/skills/dutch.dm
# cmss13 hands the leader, minigun, flamer and medic slots only to volunteers with 5 hours on the matching squad role.

- type: job
  parent: CMJobBase
  id: CMUJobDutchsDozenBase
  abstract: true
  roundSide: ThirdParty
  roundForce: DutchsDozen
  description: cmu-dutchs-dozen-job-description
  supervisors: cmu-dutchs-dozen-supervisors
  greeting: cmu-dutchs-dozen-greeting
  joinNotifyCrew: false
  hidden: true
  canBeAntag: false
  ranks:
    RMCRankCivilian: []
  accessGroups:
  - Colonist

