# Shared pieces for Dutch's Dozen (cmss13 FACTION_DUTCH): faction, IFF, radio, ID cards and the mob base.

- type: npcFaction
  parent: MILITARY
  id: CMUDutchsDozen
  name: Dutch's Dozen

- type: entity
  id: CMUDutchsDozen
  categories: [ HideSpawnMenu ]
  components:
  - type: IFFFaction

# cmss13 DUT_FREQ, the team's own channel
- type: radioChannel
  id: CMUDutchsDozen
  name: cmu-radio-dutchs-dozen
  keycode: "ð"
  frequency: 158.9
  color: "#6b8e23"
  longRange: true
  tower: true

- type: entity
  parent: CMEncryptionKey
  id: CMUEncryptionKeyDutchsDozen
  name: Dutch's Dozen encryption key
  categories: [ HideSpawnMenu ]
  components:
  - type: EncryptionKey
    channels:
    - CMUDutchsDozen
    - Colony
    defaultChannel: CMUDutchsDozen
  - type: Sprite
    state: cap_key

# cmss13 /obj/item/device/radio/headset/distress/dutch
- type: entity
  parent: RMCHeadsetIcons
  id: CMUHeadsetDutchsDozen
  name: Dutch's Dozen headset
  description: A special headset used by small groups of trained operatives. Or terrorists.
  categories: [ HideSpawnMenu ]
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - CMUEncryptionKeyDutchsDozen

- type: entity
  parent: CMIDCardBase
  id: CMUIDCardDutchsDozen
  name: Dutch's Dozen dogtag
  categories: [ HideSpawnMenu ]
  components:
  - type: PresetIdCard
    job: CMUJobDutchsDozenRifleman
