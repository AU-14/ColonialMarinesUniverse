# cmss13 gives Arnold a gold ID
- type: entity
  parent: CMUIDCardDutchsDozen
  id: CMUIDCardDutchsDozenArnold
  name: Arnold's gold ID card
  categories: [ HideSpawnMenu ]
  components:
  - type: PresetIdCard
    job: CMUJobDutchsDozenArnold
