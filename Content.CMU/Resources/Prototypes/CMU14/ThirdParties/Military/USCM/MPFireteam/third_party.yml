# USCM Military Police fireteam, called in through the UA intel list. A team leader and an officer with M39s and
# two officers with M37A1 shotguns, all in MP armour with the MP security belt (taser, flash, baton, cuffs).

- type: entity
  parent: SquadBase
  id: CMUSquadUSCMMP
  name: USCM MP
  components:
  - type: SquadTeam
    color: "#b30000"
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: UASOF
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_forecon
    canSupplyDrop: false
    group: CMUUSCMMP
