# USCM combat engineer team, called in through the UA intel list: a team leader with a sentry and two combat
# engineers, all carrying metal, plasteel, sandbags and explosives to fortify a position fast.

# Camo-matching USCM fatigues with the USCM Engineers patch already on them.
- type: entity
  parent: AU14CamoUSCMFatigues
  id: CMUCamoUSCMFatiguesEngineer
  suffix: CMU, USCM Engineers
  components:
  - type: UniformAccessoryHolder
    startingAccessories:
    - AU14PatchUAFlag
    - AU14PatchUSCM
    - AU14PatchUSCMEngineers

- type: entity
  parent: SquadBase
  id: CMUSquadUSCMEngineers
  name: USCM Engineers
  components:
  - type: SquadTeam
    color: "#d9a400"
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: UASOF
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_forecon
    canSupplyDrop: false
    group: CMUUSCMEngineers
  - type: Tag
    tags:
    - CMUSquadUSCMEngineers

- type: Tag
  id: CMUSquadUSCMEngineers

- type: job
  parent: CMJobBase
  id: CMUJobUSCMEngineerTeamLeader
  roundSide: ThirdParty
  roundProfiles:
  - AU14RoundJobProfileThirdParty
  roundForce: USCM
  roundRole: CMUJobUSCMEngineerTeamLeader
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: engi
  - type: Skills
    skills:
      RMCSkillEngineer: 3
      RMCSkillConstruction: 3
      RMCSkillFirearms: 2
      RMCSkillEndurance: 1
      RMCSkillCqc: 1
      RMCSkillMedical: 1
      RMCSkillFireman: 1
  name: cmu-job-title-uscm-engineer-team-leader
  description: cmu-job-description-uscm-engineer
  playTimeTracker: CMUJobUSCMEngineerTeamLeader
  ranks:
    RMCRankCivilian: []
  chevrons:
    RMCRankSergeant:
      entity: AU14ChevronUSCMSergeant
      requirements: []
  spawnMenuRoleName: USCM Combat Engineer Team Leader (Engineer Team)
  icon: "CMJobIconEmpty"
  startingGear: CMUGearUSCMEngineerTeamLeader
  greeting: cmu-job-greeting-uscm-engineer
  joinNotifyCrew: false
  supervisors: cmu-job-supervisors-uscm-plasma
  accessGroups:
  - AU14GovforSquad
  hidden: true

- type: playTimeTracker
  id: CMUJobUSCMEngineerTeamLeader

- type: entity
  parent: AU14BaseMobSpeciesOrganicFORECON
  suffix: CMU, USCM, Engineer Team
  id: CMUJobUSCMEngineerTeamLeader
  name: USCM Combat Engineer Team Leader (Engineer Team)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: CMUSquadUSCMEngineers
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-ghost-name-uscm-engineer-team-leader
    description: cmu-job-description-uscm-engineer
    reregister: false
    job: CMUJobUSCMEngineerTeamLeader
    raffle:
      settings: short
    rules: cmu-job-rules-uscm-engineer

