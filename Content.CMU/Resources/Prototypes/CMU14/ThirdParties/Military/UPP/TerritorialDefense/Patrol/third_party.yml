# UPP Territorial Defense patrol, bought through intel. Same squad as the lost team with AK-4047 ammunition only;
# the loader carries spare magazines instead of rockets for a launcher the team does not have.

- type: job
  parent: AU14UPPTerritorialDefenseSquadLeader
  id: CMUJobUPPTDPatrolSquadLeader
  startingGear: CMUGearUPPTDPatrolSquadLeader
  description: cmu-upptd-patrol-description
  spawnMenuRoleName: Territorial Defense Squad Leader (Patrol)
  hidden: true

- type: entity
  parent: AU14BaseMobSpeciesOrganicTDThirdparty
  id: CMUJobUPPTDPatrolSquadLeader
  name: Territorial Defense Squad Leader (Patrol)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: AU14SquadTD
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-ghost-name-upptd-patrol-squadleader
    description: cmu-upptd-patrol-description
    reregister: false
    job: CMUJobUPPTDPatrolSquadLeader
    raffle:
      settings: short
    rules: cmu-upptd-patrol-rules

