  startingGear: CMUGearUPPMilitsiyaLead
  greeting: cmu-upp-militsiya-greeting
  joinNotifyCrew: false
  supervisors: cmu-uppline-leader
  accessGroups:
  - AU14GovforSquad
  hidden: true

- type: playTimeTracker
  id: CMUJobUPPMilitsiyaLead

- type: entity
