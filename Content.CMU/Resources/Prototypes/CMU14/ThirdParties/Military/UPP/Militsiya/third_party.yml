  roundForce: UPPLine
  roundRole: CMUJobUPPMilitsiyaLead
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spp_mp
  - type: Skills
    skills:
      RMCSkillEndurance: 1
      RMCSkillFirearms: 2
      RMCSkillCqc: 2
      RMCSkillPolice: 3
      RMCSkillMedical: 1
      RMCSkillLeadership: 1
