# UPP militsiya patrol, called in through the UPP intel list: a senior militsioner and two militsioners in the
# military police kit from the UPP MP vendor, with SMGs, batons and restraints.

- type: entity
  parent: SquadBase
  id: CMUSquadUPPMilitsiya
  name: Militsiya
  components:
  - type: SquadTeam
    color: "#7a1d1d"
    blacklistedSquadArmor:
    - Helmet
    - Goggles
    - Armor
    - Gloves
    radio: Colony
    minimapBackground:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: background_spp
    canSupplyDrop: false
    group: UPPLine
  - type: Tag
    tags:
    - CMUSquadUPPMilitsiya

- type: Tag
  id: CMUSquadUPPMilitsiya

- type: job
