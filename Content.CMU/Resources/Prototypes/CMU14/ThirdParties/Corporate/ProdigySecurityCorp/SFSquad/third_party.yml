# Prodigy Security Forces squad, called in through the Other intel list. Kitted out of the Prodigy platoon vendors:
# a squad leader, two riflemen, a corpsman and a smartgunner.

- type: job
  parent: CMJobBase
  id: CMUJobProdigySFLeader
  roundSide: ThirdParty
  roundProfiles:
  - AU14RoundJobProfileThirdParty
  roundForce: PSC
  roundRole: CMUJobProdigySFLeader
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: pmc_ld
  - type: Skills
    skills:
      RMCSkillEndurance: 2
      RMCSkillFirearms: 2
      RMCSkillCqc: 1
      RMCSkillPolice: 1
      RMCSkillConstruction: 1
      RMCSkillEngineer: 1
      RMCSkillMedical: 1
      RMCSkillLeadership: 2
      RMCSkillJtac: 2
      RMCSkillOverwatch: 1
  - type: MarineOrders
  name: cmu-job-title-prodigy-sf-leader
  description: cmu-prodigy-sf-description
  playTimeTracker: CMUJobProdigySFLeader
  ranks:
    RMCRankCivilian: []
  chevrons:
    AU14RankPrDEnforcerLead:
      entity: AU14ChevronPrDEnforcerLead
      requirements: []
  spawnMenuRoleName: Prodigy SF Squad Leader (SF Squad)
  icon: "CMJobIconEmpty"
  startingGear: CMUGearProdigySFLeader
  greeting: cmu-prodigy-callin-greeting
  joinNotifyCrew: false
  supervisors: cmu-prodigy-callin-supervisors
  accessGroups:
  - auprodigy
  hidden: true

- type: playTimeTracker
  id: CMUJobProdigySFLeader

- type: entity
  parent: AU14BaseMobSpeciesOrganicProdigy
  id: CMUJobProdigySFLeader
  name: Prodigy SF Squad Leader (SF Squad)
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: CMU14SquadProdigy
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: cmu-prodigy-sf-leader-name
    description: cmu-prodigy-sf-description
    reregister: false
    job: CMUJobProdigySFLeader
    raffle:
      settings: short
    rules: cmu-prodigy-callin-rules

