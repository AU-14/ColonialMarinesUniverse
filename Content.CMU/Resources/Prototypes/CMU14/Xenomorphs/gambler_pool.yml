- type: cmuXenoGamblePool
  id: CMUXenoGamblerDefault
  tiers:
  - name: jackpot
    weight: 1
    priority: 4
    overlay: { sprite: CMU14/Actions/Xeno/gambler.rsi, state: won_jackpot }
    stopPop: 1
    stopPopRainbow: true
    sounds:
    - path: /Audio/CMU14/Xeno/Gambler/play_on_actual_win.ogg
      params:
        volume: -6
    rewards:
    - action: ActionXenoDestroy
      icon: { sprite: _RMC14/Actions/xeno_actions.rsi, state: charge }
      consumeOnCooldown: true
      components:
      - type: XenoDestroy
        structureDamage:
          types:
            Blunt: 1000
        mobDamage:
          types:
            Blunt: 1000
        structures:
          tags:
          - Structure
          - Wall
          - Window
          components:
          - Sentry
          - RMCTeslaCoil
          - Barricade
          - Mortar
          - EntityStorage
          - ReagentTank
          - PlaceableSurface
          - ReagentDispenser
          - IVDrip

