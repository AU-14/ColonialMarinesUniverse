# The kits of parts: six boxes that stand in for the small parts (bolts, screws, wire, tubes, motors, pistons and the rest), so that the crafts and the
# machines count a few kinds of things instead of seventeen. One crate sprite (Textures/CMU14/Objects/Electric/kit.rsi), a color for each kit.
# Fasteners: bolts, screws, gears. Wiring: wire and cable. Electronics: boards, tubes, resistors, diodes, transistors, capacitors.
# Drive: motors and conveyors. Hydraulics: pistons and pumps. Heating: coils. Simple circuits: the set that stands in for the first circuit board.

- type: stack
  id: RUMCKitFasteners
  name: fasteners kit
  spawn: RUMCKitFastenersItem
  maxCount: 50

- type: entity
  parent: BaseItem
  id: RUMCKitFastenersItem
  name: fasteners kit
  description: "A box of bolts, screws and gears."
  components:
  - type: Stack
    stackType: RUMCKitFasteners
    count: 1
  - type: Sprite
    sprite: CMU14/Objects/Electric/kit.rsi
    state: icon
    color: "#9aa4ad"
  - type: Item
    size: Small

- type: stack
  id: RUMCKitWiring
