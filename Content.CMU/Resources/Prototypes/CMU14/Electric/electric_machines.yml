# The machines of the electric age. Every one is the same machine (RecipeMachine) of a different kind: what it makes is written in
# electric_recipes.yml. The sprites are taken from the game's own machines (Textures/CMU14/Production/Electric).

- type: entity
  abstract: true
  id: RUMCRecipeMachineBase
  components:
  - type: PortableStructure
  - type: NodeContainer
    examinable: true
    nodes:
      direct:
        !type:CableDeviceNode
        nodeGroupID: Apc
        connection: Direct
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RecipeMachineVisuals.Working:
        on:
          True: { visible: true }
          False: { visible: false }
        off:
          True: { visible: false }
          False: { visible: true }
  - type: ItemSlots
    slots:
      input1: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      input2: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      input3: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      input4: { whitelist: { components: [ Stack ] }, insertOnInteract: false }
      output1: { insertOnInteract: false }
      output2: { insertOnInteract: false }
      output3: { insertOnInteract: false }
      output4: { insertOnInteract: false }
  - type: ContainerContainer
    containers:
      input1: !type:ContainerSlot
      input2: !type:ContainerSlot
      input3: !type:ContainerSlot
      input4: !type:ContainerSlot
      output1: !type:ContainerSlot
      output2: !type:ContainerSlot
      output3: !type:ContainerSlot
      output4: !type:ContainerSlot
  - type: WindowMachine
    stackSlots: [ input1, input2, input3, input4 ]
    outputSlots: [ output1, output2, output3, output4 ]
  - type: AutoPorts
  - type: UserInterface
    interfaces:
      enum.RecipeMachineUiKey.Key:
        type: RecipeMachineBui
  - type: ActivatableUI
    key: enum.RecipeMachineUiKey.Key

- type: entity
  abstract: true
  id: RUMCFluidMachineBase
  components:
  - type: FluidTank
    capacity: 200
  - type: FluidFillable
  - type: FluidPorts
    ports:
    - id: liquid_in
      rate: 8
    - id: liquid_out
      output: true
      rate: 8
  - type: UserInterface
    interfaces:
      enum.FluidPortsUiKey.Key:
        type: FluidPortsBoundUserInterface

