# The tools on a power cell. Each takes a charge from its cell when a job begins; with a flat cell it does nothing. They are built from the parts
# of the electric stage, with a hammer, and each is the quicker kin of a hand tool. The digging ones (shovel, pickaxe) take three charges for a dig.

- type: entity
  parent: BaseItem
  id: RUMCElectricToolBase
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot { }
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
  - type: ElectricTool

- type: entity
  parent: RUMCElectricToolBase
  id: RUMCElectricScrewdriver
  components:
  - type: Sprite
    sprite: CMU14/Objects/Tools/Electric/screwdriver.rsi
    state: icon
  - type: Item
    sprite: CMU14/Objects/Tools/Electric/screwdriver.rsi
    inhandVisuals:
      left: []
      right: []
    size: Normal
  - type: ElectricTool
    chargePerUse: 15
  - type: Tool
    qualities:
    - Screwing
    speedModifier: 2.0
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 9
  - type: Tag
    tags:
    - Screwdriver

