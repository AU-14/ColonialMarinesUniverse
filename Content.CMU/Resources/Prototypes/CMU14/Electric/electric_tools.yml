# The jackhammer: the only tool that takes the black stone, and so the only one that breaks through to the lava layer. It hits the rock with
# structural damage, a blow for a charge of the cell, and digs the pits through the plain stone as a pickaxe does, but much faster.
- type: Tag
  id: Jackhammer

- type: damageModifierSet
  id: RUMCBlackRockWallMod
  coefficients:
    Piercing: 0.05
    Slash: 0.02
    Blunt: 0.02
    Structural: 1

- type: entity
  parent: RUMCElectricToolBase
  id: RUMCJackhammer
  components:
  - type: Sprite
    sprite: CMU14/Objects/Tools/Electric/jackhammer.rsi
    state: icon
  - type: Item
    sprite: CMU14/Objects/Tools/Electric/jackhammer.rsi
    inhandVisuals:
      left: []
      right: []
    size: Large
  - type: ElectricTool
    chargePerUse: 30
    chargePerSwing: 12
  # It strikes the way the mining drill of the game does: straight along, a thrust, not a swing of a sword. 50 of brute damage a blow.
  - type: MeleeWeapon
    attackRate: 2
    angle: 0
    wideAnimationRotation: -90
    damage:
      types:
        Structural: 220
        Piercing: 50
    soundHit:
      collection: MetalThud
  - type: PitDiggingTool
    digTimeMultiplier: 0.35
  - type: Tag
    tags:
    - Pickaxe
    - Jackhammer

