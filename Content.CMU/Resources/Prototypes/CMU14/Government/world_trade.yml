# The trade of the colony with the cities of the world map by the trade shuttle (see ColonyWorldTrade.cs). The logistics console is for the heads; the goods are known by the stack that they are made of.

- type: entity
  id: RUMCLogisticsConsole
  parent: RMCCommunicationsConsoleBase
  name: logistics console
  description: The logistics console. The heads pick a landing zone and a city of the world map here, call the trade shuttle, order goods of the cities and send the shuttle away with what the colonists have put on it.
  suffix: Colony, Heads
  components:
  - type: Sprite
    sprite: CMU14/Government/logistics_console.rsi
    state: console
  - type: Icon
    sprite: CMU14/Government/logistics_console.rsi
    state: console
  - type: ActivatableUI
    key: enum.ForemanUi.Key
  - type: ForemanConsole
  - type: Anchorable
  - type: UserInterface
    interfaces:
      enum.ForemanUi.Key:
        type: ForemanConsoleBui
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [ [ "CMAccessRequisitions" ], [ "CMAccessColonyCommand" ] ]

