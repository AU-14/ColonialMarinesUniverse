# More goods of the world trade (see world_trade.yml and ColonyWorldGoodPrototype): food and seeds, fuel and chemistry, electrics, medicines, luxuries and spare parts. A good is bought by the colony and
# sold to the cities in the same way as the others: a stack is known by what it is made of, anything else by its prototype (what is accepted at the shuttle is `item`, what is brought is `spawn`).
# A good with `soldBy` is for sale only in the cities of those kinds; one with `boughtBy` is paid in full only by those, and the others pay 0.6 of the price; `premium` cities pay a quarter more.

# ---------------------------------------------------------------- Food and seeds: the farm cities sell them; cheap, but the colony needs them all the time

