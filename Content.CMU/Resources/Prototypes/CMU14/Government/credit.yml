# The credit of the city. A lender lends up to a limit that goes with the credit rating (half of its sum at nought, one and a half at a hundred) and is paid back in instalments with the interest
# of the whole term; a lender that asks less wants a better rating.

- type: colonyLender
  id: RUMCLenderCityBank
  name: rumc-lender-city-bank-name
  description: rumc-lender-city-bank-desc
  maxAmount: 6000
  minRating: 0
  interestPercent: 14
  instalments: 6
  cycleSeconds: 300

- type: colonyLender
