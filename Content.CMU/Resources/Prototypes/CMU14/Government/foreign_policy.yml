# The relations of the city with the factions of the ambassadors (see ColonyTreatyPrototype and ColonyPetitionPrototype). The administrator is the mayor of one city, not the master of the colony: what he can do is
# agreements of the city (trade, a mission, advisers on security) and the closing of its market, and what he is asked is a way through the city, medicine, land at its edge, a patrol of it.

# ---------------------------------------------------------------- Agreements: what the mayor can make with the faction of an ambassador

- type: colonyTreaty
  id: RUMCTreatyTrade
  name: rumc-treaty-trade-name
  description: rumc-treaty-trade-desc
  kind: Trade
  moneyCost: 1500
  durationSeconds: 1200
  minAttitude: 15
  incomePerMinute: 80
  dutyCut: 2
  partnerPointsPerMinute: 0.5
  attitudeShift: 5

- type: colonyTreaty
  id: RUMCTreatyPreferences
  name: rumc-treaty-preferences-name
  description: rumc-treaty-preferences-desc
  kind: Trade
  moneyCost: 4000
  durationSeconds: 1800
  minAttitude: 35
  incomePerMinute: 160
  dutyCut: 4
  partnerPointsPerMinute: 1.0
  attitudeShift: 8

- type: colonyTreaty
  id: RUMCTreatyDefense
  name: rumc-treaty-defense-name
  description: rumc-treaty-defense-desc
  kind: Defense
  moneyCost: 2000
  durationSeconds: 1500
  minAttitude: 30
  callDiscountPercent: 15
  partnerPointsPerMinute: 0.5
  attitudeShift: 6

# Closing the market of the city is the other kind: the faction thinks ill of the city, the others think well of it, the ambassador has a harder time with his own mother faction, and the city gets a
# little from the trade that goes elsewhere. It is a thing a city can do; it is not the sanctions of a state, so it is milder.
- type: colonyTreaty
  id: RUMCTreatySanction
  name: rumc-treaty-sanction-name
  description: rumc-treaty-sanction-desc
  kind: Sanction
  moneyCost: 800
  durationSeconds: 900
  incomePerMinute: 40
  attitudeShift: -25
  othersAttitudeShift: 4
  trustShift: -5

