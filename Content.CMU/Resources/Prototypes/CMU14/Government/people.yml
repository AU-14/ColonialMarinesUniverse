# The mayor and the players (see ColonyPeople.cs): the rewards that the mayor gives, the things that he orders from the players, the deals that the notary seals, and the console of the people, where the
# players write to the mayor, vote, take the orders and make the deals. The townsfolk are real players, so nothing here is a mood of a crowd.

# ---------------------------------------------------------------- The console of the people

- type: entity
  id: RUMCCitizenConsole
  parent: RMCCommunicationsConsoleBase
  name: console of the people
  description: "A terminal of the city hall for the townsfolk: write to the mayor, vote, take the orders of the city, and have a deal sealed by the notary."
  suffix: Colony, Citizens
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: ActivatableUI
    key: enum.CitizenConsoleUi.Key
  - type: CitizenConsole
  - type: Anchorable
  - type: UserInterface
    interfaces:
      enum.CitizenConsoleUi.Key:
        type: CitizenConsoleBui

