# The jeep's field manual, left beside every jeep a crate opens into: the jeep drawn from its own art,
# each part picked out by the click map the game uses for it, and a page on what it does, how it
# breaks, how to fix it and how to change it.

- type: entity
  parent: BaseItem
  id: CMUJeepManual
  name: jeep field manual
  description: The field manual for the military jeep, packed in its crate. Every part, what it does and how to fix it.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/Books/Other/book.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Misc/Books/Other/book.rsi
  - type: ActivatableUI
    key: enum.CMUVehicleManualUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.CMUVehicleManualUiKey.Key:
        type: CMUVehicleManualBoundUserInterface
  - type: CMUVehicleManual
    manual: CMUJeepManual

- type: cmuVehicleManual
  id: CMUJeepManual
  title: cmu-jeep-manual-title
  sprite: CMU14/Structures/vehicles/jeep/jeep.rsi
  layers:
  - jeep_base
  - wheels_0
  - engine_0
  - hood_closed
  - fuel_door_closed
  - door_driver_closed
  - door_passenger_closed
  - tailgate_closed
  - spare_0
  - jerrycan_0
  - shovel_0
  - axe_0
  - jack_0
  - extinguisher_0
  - headlight_left_0
  - headlight_right_0
  - turn_signal_left_0
  - turn_signal_right_0
  - taillight_left_0
  - taillight_right_0
  - windshield_up_0
  - searchlight_left_0
  overlayLayers:
  - jeep_overlay
  - wheels_overlay_0
  - hood_closed_overlay
  - fuel_door_closed_overlay
  - door_driver_closed_overlay
  - door_passenger_closed_overlay
  - tailgate_closed_overlay
  - spare_overlay_0
  - jerrycan_overlay_0
  - shovel_overlay_0
  - axe_overlay_0
  - jack_overlay_0
  - extinguisher_overlay_0
  - headlight_left_overlay_0
  - headlight_right_overlay_0
  - turn_signal_left_overlay_0
  - turn_signal_right_overlay_0
  - taillight_left_overlay_0
  - taillight_right_overlay_0
  - windshield_up_overlay_0
  - searchlight_left_overlay_0
  # As the jeep's overlay entity slides its frames (CMUVehicleOverlayVisuals directionOffsets).
  overlayLift:
    South: 1
    North: 0
    East: 16
    West: 16
  openStates:
    hood_closed: hood_open
    hood_closed_overlay: hood_open_overlay
    fuel_door_closed: fuel_door_open
    fuel_door_closed_overlay: fuel_door_open_overlay
    door_driver_closed: door_driver_open
    door_driver_closed_overlay: door_driver_open_overlay
    door_passenger_closed: door_passenger_open
    door_passenger_closed_overlay: door_passenger_open_overlay
    tailgate_closed: tailgate_open
    tailgate_closed_overlay: tailgate_open_overlay
    spare_0: spare_open_0
    spare_overlay_0: spare_open_overlay_0
    jerrycan_0: jerrycan_open_0
    jerrycan_overlay_0: jerrycan_open_overlay_0
    shovel_0: shovel_open_0
    shovel_overlay_0: shovel_open_overlay_0
    axe_0: axe_open_0
    axe_overlay_0: axe_open_overlay_0
    jack_0: jack_open_0
    jack_overlay_0: jack_open_overlay_0
  entries:
  - id: fuel_door
    name: cmu-jeep-manual-fuel-door
    masks: [ click_fuel_door_closed ]
    openMasks: [ click_fuel_door_open ]
    highlight: true
    about: cmu-jeep-manual-fuel-door-about
    use: cmu-jeep-manual-fuel-door-use
    replace: cmu-jeep-manual-fuel-door-replace
  - id: hood
    name: cmu-jeep-manual-hood
    masks: [ click_hood_closed ]
    openMasks: [ click_hood_open ]
