    use: cmu-jeep-manual-hood-use
    damage: cmu-jeep-manual-panel-damage
    repair: cmu-jeep-manual-panel-repair
    replace: cmu-jeep-manual-panel-replace
  - id: engine
    name: cmu-jeep-manual-engine
    openMasks: [ click_engine ]
    about: cmu-jeep-manual-engine-about
    use: cmu-jeep-manual-engine-use
    damage: cmu-jeep-manual-engine-damage
    repair: cmu-jeep-manual-engine-repair
    replace: cmu-jeep-manual-engine-replace
  - id: windshield
    name: cmu-jeep-manual-windshield
