- type: entity
  parent: BaseAction
  id: CMUActionJeepHazards
  name: Hazard lights
  description: Switch the jeep's hazard lights on or off. Both turn signals blink together.
  components:
  - type: InstantAction
    event: !type:CMUVehicleHazardsActionEvent
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.3
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: hazards_off
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: hazards_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

- type: entity
  parent: BaseAction
  id: CMUActionJeepAutoSignals
  name: Automatic turn signals
  description: Switch the turn signals blinking on their own as you steer on or off.
  components:
  - type: InstantAction
    event: !type:CMUVehicleAutoSignalsActionEvent
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.3
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: signals_auto_off
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: signals_auto_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

- type: entity
  parent: BaseAction
  id: CMUActionJeepHorn
  name: Horn
  description: Sound the jeep's horn.
  components:
  - type: InstantAction
    event: !type:CMUVehicleHornActionEvent
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - sprite: Objects/Fun/push_horn.rsi
      state: icon
      map: ["enum.ActionVisuals.Icon"]

# Pulls the key from the ignition into the driver's hand, which stops the engine.
- type: entity
  parent: BaseAction
  id: CMUActionJeepEjectKey
  name: Take out the key
  description: Pull the key from the ignition into your hand. The engine stops without it.
  components:
  - type: InstantAction
    event: !type:CMUVehicleEjectKeyActionEvent
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Misc/vehicle_key.rsi
      state: key
      map: ["enum.ActionVisuals.Icon"]

- type: entity
  parent: BaseAction
  id: CMUActionJeepEngine
  name: Engine
  description: Switch the engine on or off. It keeps running when you get out until you switch it off.
  components:
  - type: InstantAction
    event: !type:CMUVehicleEngineActionEvent
  - type: Action
    itemIconStyle: BigAction
    useDelay: 1
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: engine_off
      map: ["enum.ActionVisuals.Icon"]
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: engine_on
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false

# One switch for the headlights: off, low beam, high beam, off. The icon shows where it is; there
# is no toggled icon layer, which would hide it.
- type: entity
  parent: BaseAction
  id: CMUActionJeepHeadlights
  name: Headlights
  description: Switch the jeep's headlights through off, low beam and high beam.
  components:
  - type: InstantAction
    event: !type:CMUVehicleHeadlightsActionEvent
  - type: Action
    itemIconStyle: BigAction
    useDelay: 0.3
  - type: Sprite
    layers:
    - sprite: CMU14/Structures/vehicles/jeep/actions.rsi
      state: headlights_off
      map: ["enum.ActionVisuals.Icon"]
