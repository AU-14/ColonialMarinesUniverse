# The CLF's jeep: a signal flare wired to a smuggler's beacon. Lit and left burning on open ground,
# it brings a gun jeep crate down by parachute onto the spot.
- type: entity
  parent: CMFlare
  id: CMUFlareJeepDropCLF
  name: jeep drop flare
  description: A signal flare wired to a smuggler's beacon. Light it and throw it on open ground; a gun jeep in its crate comes down by parachute where it burns.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/cas_flares.rsi
    layers:
    - map: [ "enum.ExpendableLightVisualLayers.Base" ]
      state: flare
    - map: [ "enum.ExpendableLightVisualLayers.Glow" ]
      sprite: _RMC14/Objects/Misc/cas_flares.rsi
      state: flare_flame
      color: "#FFD27A"
      visible: false
    - map: [ "enum.ExpendableLightVisualLayers.Overlay" ]
      sprite: _RMC14/Objects/Misc/cas_flares.rsi
      state: overlay
  - type: Icon
    sprite: _RMC14/Objects/Misc/cas_flares.rsi
    state: flare
  - type: PointLight
    color: "#FFE2AA"
  - type: CMUVehicleDropFlare
    crate: CMUCrateJeepGunner
