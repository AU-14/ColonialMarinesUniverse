# A jeep ships whole in a wooden crate a size up from its own, RMC's dense crate stretched to it:
# assembled, key in, on its wheels with the spare in the rear hatch. Unlatched by hand, the walls fall
# flat and the jeep stands there ready to drive. The crate comes up the ASRS lift, parachutes in from a squad's
# supply drop pad like any crate, from a dropship's LAG-14 launcher as a launch-bay round at a laser or
# flare, or onto a CLF jeep drop flare.

- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: CMUCrateJeepBase
  name: jeep crate
  description: A whole jeep in a wooden crate, on its wheels and ready to drive. Unlatch it by hand on clear ground and the walls fall away.
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/jeep/jeep_crate.rsi
    noRot: true
    drawdepth: Objects
    layers:
    - state: closed
  - type: Icon
    sprite: CMU14/Structures/vehicles/jeep/jeep_crate.rsi
    state: closed
  - type: Transform
    noRot: true
  - type: InteractionOutline
  # Its parachute is big enough to show above it while it comes down; without an animation player
  # the client skips the fall and it just turns up.
  - type: ParaDroppable
    parachutePrototype: CMUParachuteJeepCrate
  - type: AnimationPlayer
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.03,-1.38,1.03,1.5"
        density: 500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PlaceableSurface
    isPlaceable: false
  # Comes down like a marine's paradrop, not a pod: four seconds under its chute from the same
  # height, with the parachute's sound. The flare and the dev kit drop it with these too.
  - type: CanBeSupplyDropped
    dropDuration: 4
    arrivingSound: /Audio/_RMC14/Items/fulton.ogg
  - type: CargoSellBlacklist
  - type: StaticPrice
    price: 1500

- type: entity
  parent: CMUCrateJeepBase
  id: CMUCrateJeepCargo
  name: cargo jeep crate
  components:
  - type: CMUVehicleCrate
    vehicle: CMUVehicleJeepCargo

- type: entity
  parent: CMUCrateJeepBase
  id: CMUCrateJeepMedical
  name: medical jeep crate
  components:
  - type: CMUVehicleCrate
    vehicle: CMUVehicleJeepMedical

- type: entity
  parent: CMUCrateJeepBase
  id: CMUCrateJeepTransport
  name: transport jeep crate
  components:
  - type: CMUVehicleCrate
    vehicle: CMUVehicleJeepTransport

- type: entity
  parent: CMUCrateJeepBase
  id: CMUCrateJeepGunner
  name: gun jeep crate
  components:
  - type: CMUVehicleCrate
    vehicle: CMUVehicleJeepGunner

# Colony crates: civilian jeeps on road tyres in a random showroom paint: apple red, navy blue,
# electric yellow, orange or gunmetal. Named civilian so they can't be taken for the platoons'.
- type: entity
  parent: CMUCrateJeepCargo
  id: CMUCrateJeepCargoColony
  name: civilian cargo jeep crate
  description: A civilian cargo jeep in a wooden crate, on road tyres in a showroom paint and ready to drive. Unlatch it by hand on clear ground and the walls fall away.
  suffix: Colony
  components:
  - type: CMUVehicleCrate
    vehicle: CMUVehicleJeepCargo
    wheels: CMUJeepWheelRoad
    paints: [ "#D7262E", "#2E4F8A", "#FFE41A", "#F07A1A", "#6A737B" ]

- type: entity
  parent: CMUCrateJeepMedical
  id: CMUCrateJeepMedicalColony
  name: civilian medical jeep crate
  description: A civilian medical jeep in a wooden crate, on road tyres in a showroom paint and ready to drive. Unlatch it by hand on clear ground and the walls fall away.
  suffix: Colony
  components:
  - type: CMUVehicleCrate
    vehicle: CMUVehicleJeepMedical
    wheels: CMUJeepWheelRoad
    paints: [ "#D7262E", "#2E4F8A", "#FFE41A", "#F07A1A", "#6A737B" ]

# What an opened jeep crate leaves: its floor under the jeep, with the walls lying flat round it once
# they are down. A crowbar breaks it up into planks; left alone it is cleared away after a while.
- type: entity
  id: CMUJeepCrateRemains
  name: jeep crate walls
  description: The floor and walls of an opened jeep crate, lying flat. A crowbar breaks them up into planks.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/jeep/jeep_crate.rsi
    noRot: true
    drawdepth: FloorObjects
    layers:
    - state: floor
      map: [ enum.CMUVehicleCrateVisualLayers.Walls ]
  - type: Transform
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: CMUVehicleCrateRemains
  - type: CrateOpenable
    spawn:
    - id: RMCPlankWood25
    sound: /Audio/Effects/wood_destroy2.ogg
  - type: TimedDespawn
    lifetime: 300

# The walls of an opened jeep crate falling over the jeep; hidden once they are down, gone with the floor.
- type: entity
  id: CMUJeepCrateWalls
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/jeep/jeep_crate.rsi
    noRot: true
    drawdepth: OverMobs
    layers:
    - state: opening
      map: [ enum.CMUVehicleCrateVisualLayers.Walls ]
  - type: Transform
    noRot: true
  - type: CMUVehicleCrateRemains
    falling: true

# A jeep crate's parachute: the deployed parachute made bigger and hung higher, drawn over the crate.
# Its layer offsets are scaled with it: the cables end on the crate's top, the canopy over them as on
# the deployed parachute.
- type: entity
  parent: RMCParachuteDeployed
  id: CMUParachuteJeepCrate
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: Overlays
    sprite: _RMC14/Objects/Clothing/Back/Backpacks/Marines/Parachute/parachute_deployed.rsi
    scale: 1.5, 1.5
    layers:
    - state: cables
      offset: 0.0, 1.5
    - state: chute_animated
      offset: 0.0, 2.1

# LAG-14 launch-bay rounds: a jeep crate rigged with a parachute, launched at a laser or flare.
- type: entity
  abstract: true
  parent: RMCDropshipAttachmentBase
  id: CMUDropshipAttachmentAmmoLaunchableJeepBase
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Crates/densecrate.rsi
    state: base
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
  - type: PowerLoaderDetachable
  - type: Appearance

- type: entity
  parent: CMUDropshipAttachmentAmmoLaunchableJeepBase
  id: CMUDropshipAttachmentAmmoLaunchableJeepCargo
  name: air-droppable cargo jeep
  description: A cargo jeep crate rigged with a parachute. Load it into the LAG-14 Internal Sentry Launcher and launch it at a laser or flare; it lands as a crate to unlatch.
  components:
  - type: RMCOrbitalDeployable
    deployPrototype: CMUCrateJeepCargo
    dropPod: false
    useParachute: true
    dropDuration: 4
    arrivingSound: /Audio/_RMC14/Items/fulton.ogg

- type: entity
  parent: CMUDropshipAttachmentAmmoLaunchableJeepBase
