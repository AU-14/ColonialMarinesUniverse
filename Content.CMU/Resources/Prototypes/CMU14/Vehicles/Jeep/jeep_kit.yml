- type: entity
  parent: RMCCrateGreen
  id: CMUCrateJeepKitCargo
  name: cargo jeep kit crate
  description: A cargo jeep in parts, with the tools and the manual to put it together. Open it on clear ground; the chassis takes the crate's place.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Crates/densecrate.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    # Where the ASRS hangs its invoice.
    - state: invoice
      sprite: _RMC14/Structures/Storage/Crates/labels.rsi
      visible: false
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Icon
    sprite: _RMC14/Structures/Storage/Crates/densecrate.rsi
    state: base
  - type: CMUVehicleKitCrate
    chassis: CMUVehicleJeepCargoChassis
  - type: StorageFill
    contents:
    - id: CMUJeepWheel
    - id: CMUJeepWheel
    - id: CMUJeepWindshield
    - id: CMUJeepHeadlight
    - id: CMUJeepHeadlight
    - id: CMUJeepTurnSignal
    - id: CMUJeepTurnSignal
    - id: CMUJeepTailLight
    - id: CMUJeepTailLight
    - id: CMUJeepHood
    - id: CMUJeepDoor
    - id: CMUJeepDoor
    - id: RMCFuelCan
    - id: RMCFuelCan
    - id: CMEntrenchingTool
    - id: RMCFireAxe
    - id: CMFireExtinguisherPortable
    - id: CMWrench
    - id: CMScrewdriver
    - id: CMUJeepKey
    - id: CMUJeepTailgate
    - id: CMUPaperJeepAssemblyManual
      orGroup: CMUJeepKitManual

- type: entity
  parent: RMCDropshipAttachmentBase
  id: CMUDropshipAttachmentAmmoLaunchableJeepCargo
  name: air-droppable cargo jeep
  description: A cargo jeep kit crate rigged with a parachute. Load it into the LAG-14 Internal Sentry Launcher and launch it at a laser or flare; it lands as a crate to open and put together.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Crates/densecrate.rsi
    state: base
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint
  - type: PowerLoaderDetachable
  - type: Appearance
  - type: RMCOrbitalDeployable
    deployPrototype: CMUCrateJeepKitCargo
    dropPod: false
    useParachute: true

