# A jeep in parts: a kit crate that, opened, leaves the bare chassis with its parts, tools and an
# assembly manual laid out beside it. The crate parachutes in from a squad's supply drop pad like any
# crate, or from a dropship's LAG-14 launcher as a launch-bay round, at a laser or flare.

- type: entity
  parent: CMUVehicleJeepCargo
  id: CMUVehicleJeepCargoChassis
  suffix: Unassembled
  components:
  # Empty tank; the kit's spare fuel can fills it. Its lamps and key come in the crate.
  - type: CMUVehicleFuel
    fuel: 0
  - type: CMUJeepLamps
    fitted: false
  - type: CMUVehicleIgnition
    startWithKey: false
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      jeep-spare: !type:ContainerSlot
      jeep-jerrycan: !type:ContainerSlot
      jeep-shovel: !type:ContainerSlot
      jeep-axe: !type:ContainerSlot
      jeep-windshield: !type:ContainerSlot
      jeep-extinguisher: !type:ContainerSlot
      jeep-headlight-left: !type:ContainerSlot
      jeep-headlight-right: !type:ContainerSlot
      jeep-turn-signal-left: !type:ContainerSlot
      jeep-turn-signal-right: !type:ContainerSlot
      jeep-taillight-left: !type:ContainerSlot
      jeep-taillight-right: !type:ContainerSlot
      jeep-ignition: !type:ContainerSlot
      jeep-hood: !type:ContainerSlot
      jeep-door-driver: !type:ContainerSlot
      jeep-door-passenger: !type:ContainerSlot
      jeep-tailgate: !type:ContainerSlot
  - type: ItemSlots
    slots:
      wheel-1:
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
      jeep-spare:
        name: cmu-jeep-part-spare
        whitelist:
          tags:
          - CMUJeepWheel
      jeep-jerrycan:
        name: cmu-jeep-part-jerrycan
        whitelist:
          tags:
          - CMUJerryCan
      jeep-shovel:
        name: cmu-jeep-part-shovel
        whitelist:
          tags:
          - Shovel
      jeep-axe:
        name: cmu-jeep-part-axe
        whitelist:
          tags:
          - FireAxe
      jeep-windshield:
        name: cmu-jeep-part-windshield
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepWindshield
      jeep-extinguisher:
        name: cmu-jeep-part-extinguisher
        whitelist:
          tags:
          - CMFireExtinguisherPortable
      jeep-hood:
        name: cmu-jeep-part-hood
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepHood
      jeep-door-driver:
        name: cmu-jeep-part-door-driver
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepDoor
      jeep-door-passenger:
        name: cmu-jeep-part-door-passenger
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepDoor
      jeep-tailgate:
        name: cmu-jeep-part-tailgate
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepTailgate

