  parent: CMUVehiclePart
  id: CMUVehicleSeat
  categories: [ HideSpawnMenu ]
  name: seat
  components:
  - type: Sprite
    layers:
    - map: [ mask ]
      state: click_seat_driver
  - type: Strap
    modifyBuckleDrawDepth: false
  # RMC puts a rider one depth above its strap. Pinning the seat at BelowMobs keeps the crew at the
  # overlay's Mobs depth, so the overlay's y-sort draws the doors and dash over them.
  - type: RMCStrapDrawDepth
    unstrappedDepth: BelowMobs
    strappedDepth: BelowMobs
  - type: CMUVehicleSeat

- type: entity
  parent: CMUVehicleSeat
  id: CMUVehicleSeatGunner
  categories: [ HideSpawnMenu ]
  name: gunner's seat
  components:
