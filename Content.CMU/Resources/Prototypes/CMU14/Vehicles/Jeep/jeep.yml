# Resprays a vehicle in any colour: use it in hand to mix the colour, then use it on the vehicle.
- type: entity
  parent: BaseItem
  id: CMUVehicleSprayPainter
  name: vehicle spray painter
  description: A paint gun with a cup of quick-drying vehicle enamel. Use it in hand to mix any colour, or to pick a rim design for a vehicle's wheels; a full respray takes a few charges of paint.
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/jeep/vehicle_spray_painter.rsi
    layers:
    - state: icon
    - state: paint
      map: [ paint ]
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
    size: Normal
  - type: ActivatableUI
    key: enum.CMUVehicleSprayPainterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CMUVehicleSprayPainterUiKey.Key:
        type: CMUVehicleSprayPainterBoundUserInterface
  - type: CMUVehicleSprayPainter
  - type: LimitedCharges
    maxCharges: 30
    lastCharges: 30
  - type: StaticPrice
    price: 60

- type: latheRecipe
  id: CMUVehicleSprayPainter
  result: CMUVehicleSprayPainter
  completetime: 6
  # Five sheets of each.
  materials:
    CMSteel: 18750
    RMCPlastic: 10000

- type: latheRecipePack
  id: CMUVehicleLatheRecipes
  recipes:
  - CMUVehicleSprayPainter

