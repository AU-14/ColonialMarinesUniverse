  categories: [ HideSpawnMenu ]
  name: jeep part
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: CMU14/Structures/vehicles/jeep/jeep.rsi
    layers:
    - map: [ mask ]
      state: click_hood_closed
  - type: Clickable
  - type: CMUVehiclePart

