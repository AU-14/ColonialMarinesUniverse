- type: hardpointVehicleFamily
  id: CMUJeep

- type: Tag
  id: CMUJeepWheel

- type: Tag
  id: CMUJerryCan

- type: Tag
  id: CMUJeepWindshield

- type: Tag
  id: CMUJeepHeadlights

- type: Tag
  id: CMUJeepHood

- type: Tag
  id: CMUJeepDoor

- type: Tag
  id: CMUJeepTailgate

- type: shader
  id: CMUJeepRiderClip
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/rider_clip.swsl
  params:
    clip_enabled: false

- type: shader
  id: CMUJeepPaint
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/paint.swsl

- type: shader
  id: CMUJeepBeam
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/beam.swsl
  params:
    strength: 0.55

# The headlight beams' cones, drawn by the generator: up in the image is the jeep's front.
- type: lightMask
  id: CMUJeepLowBeamMask
  maskPath: /Textures/CMU14/Structures/vehicles/jeep/light_masks/low_beam.png
  lightCones:
  - direction: 0
    innerWidth: 70
    outerWidth: 110

- type: lightMask
  id: CMUJeepHighBeamMask
  maskPath: /Textures/CMU14/Structures/vehicles/jeep/light_masks/high_beam.png
  lightCones:
  - direction: 0
    innerWidth: 20
    outerWidth: 36

- type: entity
  parent: BaseItem
  id: CMUJeepHardpointBase
  abstract: true
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/jeep/hardpoints.rsi
  - type: Item
    size: Large

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepWheel
  name: jeep wheel set
  description: A set of jeep wheels. The spare on the tailgate is the same set.
  components:
  - type: Sprite
    state: tires
  - type: HardpointItem
    hardpointType: Wheel
    vehicleFamily: CMUJeep
    slotType: Wheel
    damageMultiplier: 0.15
    repairRate: 0.0165
  # The wheel set is the cargo and transport jeeps' whole hull; at zero the jeep blows up. Two hard
  # crashes (30 each) wreck it.
  - type: HardpointIntegrity
    maxIntegrity: 60
    integrity: 60
  - type: VehicleWheelItem
  - type: Tag
    tags:
    - CMUJeepWheel

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepWindshield
  name: jeep windshield
  description: A folding windshield frame with its glass. Fitted and taken off with a screwdriver.
  components:
  - type: Sprite
    state: windshield
  - type: CMUJeepPartIntegrity
    integrity: 50
    maxIntegrity: 50
  - type: Tag
    tags:
    - CMUJeepWindshield

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepHeadlights
  name: jeep headlights
  description: A pair of round jeep headlamps. Fitted and taken off with a screwdriver.
  components:
  - type: Sprite
    state: headlights
  - type: Item
    size: Normal
  - type: CMUJeepPartIntegrity
    integrity: 30
    maxIntegrity: 30
  - type: Tag
    tags:
    - CMUJeepHeadlights

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepHood
  name: jeep hood
  description: A jeep's bonnet on its hinges. Comes off by its screws, then its bolts.
  components:
  - type: Sprite
    state: hood
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - CMUJeepHood

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepDoor
  name: jeep door
  description: A jeep's side door. It fits either side; it comes off by its screws, then its bolts.
  components:
  - type: Sprite
    state: door
  - type: Tag
    tags:
    - CMUJeepDoor

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepTailgate
  name: jeep tailgate
  description: The fold-down tailgate of a cargo or gun jeep. Comes off by its screws, then its bolts.
  components:
  - type: Sprite
    state: tailgate
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - CMUJeepTailgate

- type: entity
  abstract: true
  id: CMUJeepBeamBase
  categories: [ HideSpawnMenu ]
  name: headlight beam
  components:
  # Under walls, items and mobs, over the floor.
  - type: Sprite
    drawdepth: HighFloorObjects
    sprite: CMU14/Structures/vehicles/jeep/jeep_beams.rsi
    layers:
    - map: [ beam ]
      state: beam_low
      visible: false
  # On its headlight's lens (forward is -y), turned with the jeep; the client keeps it on the lens
  # the art draws in each direction.
  - type: PointLight
    enabled: false
    autoRot: true
    offset: "0,-1.15"
    castShadows: true
    color: "#FFF1CF"
  - type: CMUVehicleHeadlightBeam

- type: entity
  parent: CMUJeepBeamBase
  id: CMUJeepLowBeam
  components:
  - type: Sprite
    layers:
    - map: [ beam ]
      state: beam_low
      visible: false
  - type: PointLight
    lightMask: CMUJeepLowBeamMask
    radius: 5.5
    energy: 1.8
    softness: 1
    falloff: 3

- type: entity
  parent: CMUJeepBeamBase
  id: CMUJeepHighBeam
  components:
  - type: Sprite
    layers:
    - map: [ beam ]
      state: beam_high
      visible: false
  - type: PointLight
    lightMask: CMUJeepHighBeamMask
    radius: 11
    energy: 2.4
    softness: 1
    falloff: 2

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepMGMount
  name: jeep gun mount
  description: The gun jeep's pedestal mount. It swings through an eighth of a turn either side of the bonnet.
  components:
  - type: Sprite
    state: mgturret
  - type: Item
    size: Huge
  - type: HardpointItem
    hardpointType: Turret
    vehicleFamily: CMUJeep
    slotType: Turret
    damageMultiplier: 0.15
    repairRate: 0.008
  - type: HardpointIntegrity
    maxIntegrity: 30
    integrity: 30
  - type: VehicleTurret
    rotateToCursor: true
    stabilizedRotation: false
    rotationSpeed: 220
    cmuMaxYawDegrees: 45
    showOverlay: true
    useDirectionalOffsets: true
    overlayRsi: CMU14/Structures/vehicles/jeep/jeep_gunner.rsi
    overlayState: mgturret_0
    overlayDamagedState: mgturret_1
    pixelOffsetNorth: "0,-8"
    pixelOffsetEast: "-20,18"
    pixelOffsetSouth: "0,24"
    pixelOffsetWest: "20,18"
  - type: ItemSlots
    slots:
      turret-gun:
        startingItem: CMUJeepMG
        disableEject: true
        whitelist:
          components:
          - HardpointItem
  - type: ContainerContainer
    containers:
      turret-gun: !type:ContainerSlot
  - type: HardpointState
  - type: HardpointSlots
    vehicleFamily: CMUJeep
    slots:
    - id: turret-gun
      hardpointType: Cannon
      slotType: Cannon
      required: false
      insertDelay: 2.0

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepMG
  name: jeep machine gun
  description: A belt-fed machine gun for the gun jeep's pedestal, fed from cupola ammo crates.
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    state: mgturret
  - type: HardpointItem
    hardpointType: Cannon
    vehicleFamily: CMUJeep
    slotType: Cannon
    damageMultiplier: 0.1
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 30
    integrity: 30
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    showOverlay: false
    fireWhileRotatingGraceDegrees: 15
    useBarrelDirectionForShots: true
    maxShotCurvatureDegrees: 10
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_ml66a_2.ogg
    cameraRecoilScalar: 0
  - type: GunIFF
    enabled: true
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
    accuracyMultiplierUnwielded: 3
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeSentry10x50mm
    capacity: 300
  - type: VehicleHardpointAmmo
    magazineSize: 300
    maxStoredMagazines: 2
  - type: GunFireArc
    arc: 100
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxCupola
  - type: GunMuzzleOffset
    offset: "0,-0.6"
    muzzleOffset: "0,0"
    useAimDirection: false
    useContainerOwner: false

- type: entity
  id: CMUVehicleJeepBase
  abstract: true
  name: jeep
  description: A light, open four-by-four. Fast and nimble, but nothing stands between its crew and the bullets.
  components:
  - type: RMCNightVisionVisible
    priority: -2
  - type: Vehicle
    movementKind: Grid
    transferDamage: false
  - type: VehicleOperatorDamage
  - type: CMUVehicleSeats
    seats:
    - id: driver
      name: cmu-vehicle-seat-driver
      offset: 0.3125,0.25
      exit: 0.95,0.25
      door: door_driver
      pixelOffsets:
        South: 10,6
        North: -10,-3
        East: -8,6
        West: 8,-8
      clips:
        South: 3
        North: 4
        East: 2
        West: 2
      driver: true
    - id: passenger
      name: cmu-vehicle-seat-passenger
      offset: -0.3125,0.25
      exit: -0.95,0.25
      door: door_passenger
      pixelOffsets:
        South: -10,6
        North: 10,-3
        East: -8,-8
        West: 8,6
      clips:
        South: 3
        North: 4
        East: 2
        West: 2
  - type: CMUJeep
    parts:
    - id: hood
      name: cmu-jeep-part-hood
      slot: jeep-hood
    - id: windshield
      name: cmu-jeep-part-windshield
      slot: jeep-windshield
    - id: door_driver
      name: cmu-jeep-part-door-driver
      slot: jeep-door-driver
    - id: door_passenger
      name: cmu-jeep-part-door-passenger
      slot: jeep-door-passenger
    # Spawned behind the bed, so it can be reached from behind the jeep.
    - id: tailgate
      name: cmu-jeep-part-tailgate
      slot: jeep-tailgate
      offset: 0,0.9
    - id: fuel_door
      name: cmu-jeep-part-fuel-door
    - id: engine
      name: cmu-jeep-part-engine
    - id: headlights
      name: cmu-jeep-part-headlights
      slot: jeep-headlights
    - id: wheels
      name: cmu-jeep-part-wheels
      slot: wheel-1
    - id: spare
      name: cmu-jeep-part-spare
      slot: jeep-spare
    - id: jerrycan
      name: cmu-jeep-part-jerrycan
      slot: jeep-jerrycan
    - id: shovel
      name: cmu-jeep-part-shovel
      slot: jeep-shovel
    - id: axe
      name: cmu-jeep-part-axe
      slot: jeep-axe
    hoodOpenSound:
      path: /Audio/CMU14/Jeep/jeep_hood_open.wav
      params:
        volume: -2
    hoodCloseSound:
      path: /Audio/CMU14/Jeep/jeep_hood_close.wav
      params:
        volume: -2
    windshieldSound:
      path: /Audio/CMU14/Jeep/jeep_windshield.wav
      params:
        volume: -2
    doorOpenSound:
      path: /Audio/CMU14/Jeep/jeep_hood_open.wav
      params:
        volume: -5
        pitch: 1.15
    doorCloseSound:
      path: /Audio/CMU14/Jeep/jeep_hood_close.wav
      params:
        volume: -5
        pitch: 1.15
    tailgateOpenSound:
      path: /Audio/CMU14/Jeep/jeep_hood_open.wav
      params:
        volume: -4
        pitch: 0.9
    tailgateCloseSound:
      path: /Audio/CMU14/Jeep/jeep_hood_close.wav
      params:
        volume: -4
        pitch: 0.9
  - type: CMUVehicleEngineSound
    startSound:
      path: /Audio/CMU14/Jeep/jeep_engine_start.wav
      params:
        maxDistance: 12
    idleSound:
      path: /Audio/CMU14/Jeep/jeep_engine_idle.wav
      params:
        volume: -2
        maxDistance: 10
    driveSound:
      path: /Audio/CMU14/Jeep/jeep_engine_drive.wav
      params:
        volume: -1
        maxDistance: 12
    roughSound:
      path: /Audio/CMU14/Jeep/jeep_engine_rough.wav
      params:
        volume: -2
        maxDistance: 10
    roughDriveSound:
      path: /Audio/CMU14/Jeep/jeep_engine_rough_drive.wav
      params:
        volume: -1
        maxDistance: 12
    revSound:
      path: /Audio/CMU14/Jeep/jeep_engine_rev.wav
      params:
        maxDistance: 12
    stallSound:
      path: /Audio/CMU14/Jeep/jeep_engine_sputter.wav
      params:
        maxDistance: 12
  - type: Clickable
    bounds:
      south: -0.66,-1.38,0.66,1.25
      north: -0.66,-1.47,0.66,1.16
      east: -1.25,-0.81,1.34,0.78
      west: -1.34,-0.81,1.25,0.78
  - type: CMUVehicleFuel
    fuel: 45
    maxFuel: 60
  - type: CMUVehicleCrayon
    map: /Textures/CMU14/Structures/vehicles/jeep/crayon_maps/jeep.png
  # Dirt from driving, blood from wounded riders and anyone run down; space cleaner, soap or a wet
  # mop takes it off, with the crayon. Reactive lets splashes reach it too.
  - type: CMUVehicleGrime
  - type: Reactive
  # A spray painter resprays the body in its chosen colour; see paint.swsl.
  - type: CMUVehiclePaint
    layers: [ base, damaged_frame, engine, hood, door_driver, door_passenger, tailgate, fuel_door, headlights, windshield, spare, rmc-wheels ]
    overlayLayers: [ body, damaged_frame, door_driver, door_passenger, tailgate, hood, fuel_door, headlights, windshield, spare, wheels ]
  - type: RMCIgnoreGhostInteractionLimits
  - type: RequireProjectileTarget
    alwaysHitWhitelist:
      components: [XenoAcidProjectile, VehicleDamageMultiplier]
  - type: GridVehicleMover
    maxSpeed: 8
    acceleration: 5
    deceleration: 12
    maxRotationSpeedDegrees: 120
    alignmentAssistDegrees: 8
    ignoreLightObstacleDamage: true
    rotationAccelerationDegrees: 240
    rotationDecelerationDegrees: 300
    turnDelay: 0.25
    pushCooldown: 2
    xenoBlockMinimumSize: Xeno
    xenoPushMinimumSize: Immobile
    # Crashes as hard as RMC's van, a little gentler on the hull.
    canSmashWalls: true
    wallSmashMinSpeed: 5
    wallSmashWheelDamage: 0.8
    wallSmashHullDamage: 30
    wallSmashSlowdownMultiplier: 0.75
    wallSmashSlowdownDuration: 0.25
    mobCollisionHullDamage: 8
    speedAtZeroIntegrity: 0.35
    crashImmobileDuration: 8
    crashImmobileMinSpeed: 7.25
    mobCrashImmobileDuration: 4
    mobCrashImmobileMinSpeed: 5
    xenoMobCrashImmobileDuration: 8
    xenoMobCrashImmobileMinSpeed: 5
  - type: VehicleOvercharge
    speedMultiplier: 1.55
    duration: 3
    cooldown: 14
    overchargeSound: /Audio/_RMC14/Vehicle/overdrive_activate.ogg
  # The engine sounds come from CMUVehicleEngineSound, so there is no running sound here.
  - type: VehicleSound
    hornSound: /Audio/_RMC14/Vehicle/sound_vehicles_humvee_horn.ogg
    hornCooldown: 1
    collisionSound: /Audio/_RMC14/Effects/metal_crash.ogg
    collisionSoundCooldown: 1.5
    collisionSoundMinSpeed: 7
    mobCollisionSound: /Audio/_RMC14/Xeno/alien_claw_block.ogg
  # The headlight switch. RMC's spotlight flag (F) follows it and lights the tail and marker lamps;
  # the jeep itself has no light of its own, each beam is a child with a cone-shaped one.
  - type: VehicleSpotlight
    radius: 6
    energy: 2.5
    softness: 2
  - type: CMUVehicleHeadlights
    driverLampAnchors:
      South: 14,-37
      North: -14,33
      East: 39,6
      West: -39,-12
    passengerLampAnchors:
      South: -14,-37
      North: 14,33
      East: 39,-12
      West: -39,6
    switchSound:
      path: /Audio/Machines/lightswitch.ogg
      params:
        volume: -4
  - type: Physics
    bodyType: Dynamic
  - type: CMUZPhysics
  - type: CMUVehicleZTraversal
  - type: CMUZLevelViewer
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.45,-1.05,0.45,1.05
        density: 800
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.45,-1.05,0.45,1.05
        density: 800
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Damageable
    damageModifierSet: VehicleFrameHumvee
  - type: Injurable
    damageContainer: StructuralMarine
  - type: MeleeReceivedMultiplier
    xenoMultiplier: 5
    otherMultiplier: 1
  - type: InteractionOutline
  - type: Sprite
    drawdepth: BelowMobs
    sprite: CMU14/Structures/vehicles/jeep/jeep.rsi
    layers:
    - map: [ base ]
      state: jeep_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ engine ]
      state: engine_0
    - map: [ hood ]
      state: hood_closed
    - map: [ door_driver ]
      state: door_driver_closed
    - map: [ door_passenger ]
      state: door_passenger_closed
    - map: [ tailgate ]
      state: tailgate_closed
    - map: [ fuel_door ]
      state: fuel_door_closed
    - map: [ headlights ]
      state: headlights_0
    - map: [ windshield ]
      state: windshield_up_0
    - map: [ spare ]
      state: spare_0
    - map: [ jerrycan ]
      state: jerrycan_0
    - map: [ shovel ]
      state: shovel_0
    - map: [ axe ]
      state: axe_0
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: CMUVehicleOverlay
    prototype: CMUJeepOverlay
  - type: Corrodible
    isCorrodible: false
  - type: DoAfter
  - type: UserInterface
    interfaces:
      enum.HardpointUiKey.Key:
        type: HardpointBoundUserInterface
      enum.VehicleWeaponsUiKey.Key:
        type: VehicleWeaponsBoundUserInterface
  - type: VehicleWeapons
  - type: InputMover
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      jeep-spare: !type:ContainerSlot
      jeep-jerrycan: !type:ContainerSlot
      jeep-shovel: !type:ContainerSlot
      jeep-axe: !type:ContainerSlot
      jeep-windshield: !type:ContainerSlot
      jeep-headlights: !type:ContainerSlot
      jeep-hood: !type:ContainerSlot
      jeep-door-driver: !type:ContainerSlot
      jeep-door-passenger: !type:ContainerSlot
  - type: ItemSlots
    slots:
      wheel-1:
        startingItem: CMUJeepWheel
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
      jeep-spare:
        name: cmu-jeep-part-spare
        startingItem: CMUJeepWheel
        whitelist:
          tags:
          - CMUJeepWheel
      jeep-jerrycan:
        name: cmu-jeep-part-jerrycan
        startingItem: RMCFuelCan
        whitelist:
          tags:
          - CMUJerryCan
      jeep-shovel:
        name: cmu-jeep-part-shovel
        startingItem: CMEntrenchingTool
        whitelist:
          tags:
          - Shovel
      jeep-axe:
        name: cmu-jeep-part-axe
        startingItem: RMCFireAxe
        whitelist:
          tags:
          - FireAxe
      jeep-windshield:
        name: cmu-jeep-part-windshield
        startingItem: CMUJeepWindshield
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepWindshield
      jeep-headlights:
        name: cmu-jeep-part-headlights
        startingItem: CMUJeepHeadlights
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepHeadlights
      jeep-hood:
        name: cmu-jeep-part-hood
        startingItem: CMUJeepHood
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepHood
      jeep-door-driver:
        name: cmu-jeep-part-door-driver
        startingItem: CMUJeepDoor
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepDoor
      jeep-door-passenger:
        name: cmu-jeep-part-door-passenger
        startingItem: CMUJeepDoor
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepDoor
  - type: HardpointSlots
    vehicleFamily: CMUJeep
    slots:
    - id: wheel-1
      disableEject: true
      hardpointType: Wheel
      slotType: Wheel
      insertDelay: 1.5
  - type: VehicleWheelSlots
    slotCount: 1
    slots:
    - wheel-1
  - type: HardpointIntegrity
    maxIntegrity: 600
    integrity: 600
  - type: HardpointState
  - type: Appearance
  # Goes up when damage takes the hull to zero, leaving a wreck. A light vehicle's blast: a frag grenade's
  # core but a shorter reach, about 2.4 tiles, and roughly half the Bison's a tile out where the crew lands.
  - type: CMUJeepWreck
  - type: Explosive
    explosionType: RMC
    totalIntensity: 60
    intensitySlope: 4
    maxIntensity: 8
    maxTileBreak: 0
    canCreateVacuum: false
  - type: CMExplosionEffect
  - type: RMCScorchEffect
    radius: 2
    centerRadius: 1

- type: entity
  parent: CMUVehicleJeepBase
  id: CMUVehicleJeepCargo
  name: cargo jeep
  description: A light, open two-seater with a crate bed. The fastest of the jeeps, and its crew is fully exposed.
  components:
  - type: GridVehicleMover
    maxSpeed: 9
  - type: CMUVehicleCargo
    whitelist:
      requireAll: true
      components:
      - EntityStorage
      - Pullable
    crateOffsets:
      South: 0,29
      North: 0,-13
      East: -27,7
      West: 27,7
  # Containers and slots replace the parent's instead of merging, so the base jeep's are repeated
  # here with the tailgate's.
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      jeep-spare: !type:ContainerSlot
      jeep-jerrycan: !type:ContainerSlot
      jeep-shovel: !type:ContainerSlot
      jeep-axe: !type:ContainerSlot
      jeep-windshield: !type:ContainerSlot
      jeep-headlights: !type:ContainerSlot
      jeep-hood: !type:ContainerSlot
      jeep-door-driver: !type:ContainerSlot
      jeep-door-passenger: !type:ContainerSlot
      jeep-tailgate: !type:ContainerSlot
  - type: ItemSlots
    slots:
      wheel-1:
        startingItem: CMUJeepWheel
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
      jeep-spare:
        name: cmu-jeep-part-spare
        startingItem: CMUJeepWheel
        whitelist:
