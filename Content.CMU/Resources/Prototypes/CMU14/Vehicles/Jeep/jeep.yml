- type: entity
  id: CMUVehiclePart
  categories: [ HideSpawnMenu ]
  name: jeep part
  components:
  - type: Sprite
    drawdepth: BelowMobs
    sprite: CMU14/Structures/vehicles/jeep/jeep.rsi
    layers:
    - map: [ mask ]
      state: click_hood_closed
  - type: Clickable
  - type: CMUVehiclePart

- type: entity
  parent: CMUVehiclePart
  id: CMUVehicleSeat
  categories: [ HideSpawnMenu ]
  name: seat
  components:
  - type: Sprite
    layers:
    - map: [ mask ]
      state: click_seat_driver
  - type: Strap
    modifyBuckleDrawDepth: false
  # RMC puts a rider one depth above its strap. Pinning the seat at BelowMobs keeps the crew at the
  # overlay's Mobs depth, so the overlay's y-sort draws the doors and dash over them.
  - type: RMCStrapDrawDepth
    unstrappedDepth: BelowMobs
    strappedDepth: BelowMobs
  - type: CMUVehicleSeat

- type: entity
  parent: CMUVehicleSeat
  id: CMUVehicleSeatGunner
  categories: [ HideSpawnMenu ]
  name: gunner's seat
  components:
  - type: VehicleWeaponsSeat
    skills:
      all: {}
    isPrimaryOperatorSeat: true
    allowUiSelection: true
    allowHotbarSelection: true
  - type: UserInterface
    interfaces:
      enum.VehicleWeaponsUiKey.Key:
        type: VehicleWeaponsBoundUserInterface

# The medical jeep's surgical bed. Whoever is buckled to it lies down, which surgery needs, and it
# counts as an operating table. The client draws its patient lying on it.
- type: entity
  parent: CMUVehicleSeat
  id: CMUVehicleSeatSurgicalBed
  categories: [ HideSpawnMenu ]
  name: surgical bed
  components:
  - type: Strap
    modifyBuckleDrawDepth: false
    position: Down
    rotation: -90
    buckleOnInteractHand: false
  - type: CMOperatingTable

# The dim glow a lit tail light, brake light or turn signal throws on the ground around it. The
# client spawns one on each lamp and switches, colours and blinks it with the lamp's lit state.
- type: entity
  id: CMUVehicleLampGlow
  categories: [ HideSpawnMenu ]
  name: lamp glow
  components:
  - type: PointLight
    enabled: false
    radius: 2
    energy: 1
    softness: 1
    color: "#FF2A1A"
    castShadows: false

# The burning engine's flickering glow, on a jeep's engine bay until it goes up or the fire is put out.
- type: entity
  id: CMUVehicleFireLight
  categories: [ HideSpawnMenu ]
  name: engine fire
  components:
  - type: PointLight
    radius: 3.5
    energy: 2.5
    color: "#FF8A2A"
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:RandomizeBehaviour
      id: flicker
      interpolate: Nearest
      minDuration: 0.05
      maxDuration: 0.15
      startValue: 1.8
      endValue: 3.2
      property: Energy
      isLooped: true
      enabled: true

# A burnt-out wreck has nothing left to burn: the fire it leaves under itself doesn't eat it away.
- type: damageModifierSet
  id: CMUJeepWreck
  coefficients:
    Heat: 0
    Shock: 1.2
    Structural: 0.5
  flatReductions:
    Blunt: 10
    Slash: 10
    Piercing: 10
    Structural: 10

- type: entity
  abstract: true
  id: CMUJeepWreckBase
  name: burnt-out jeep
  description: The blackened shell of a jeep. Nothing on it is worth saving.
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    sprite: CMU14/Structures/vehicles/jeep/jeep_wreck.rsi
    state: jeep
  # Static so it can't be pushed or thrown; anchoring would snap it off the spot where the jeep stood.
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: -0.45,-1.05,0.45,1.05
        density: 800
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  # Like the live jeep, shots pass over it unless it is the target.
  - type: RequireProjectileTarget
  - type: Damageable
    damageModifierSet: CMUJeepWreck
  - type: RMCImmuneToFireTileDamage
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Corrodible
    isCorrodible: true
    structure: true
  - type: RMCWallExplosionDeletable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # It is spawned before its own jeep's blast goes off.
  - type: ExplosionResistance
    damageCoefficient: 0

