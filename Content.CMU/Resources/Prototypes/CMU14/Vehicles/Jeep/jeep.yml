    skills:
      all: {}
    isPrimaryOperatorSeat: true
    allowUiSelection: true
    allowHotbarSelection: true
  - type: UserInterface
    interfaces:
      enum.VehicleWeaponsUiKey.Key:
        type: VehicleWeaponsBoundUserInterface

- type: entity
  abstract: true
  id: CMUJeepWreckBase
  name: burnt-out jeep
  description: The blackened shell of a jeep. Nothing on it is worth saving.
  components:
  - type: Transform
    anchored: false
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    sprite: CMU14/Structures/vehicles/jeep/jeep_wreck.rsi
    state: jeep
  # Static so it can't be pushed or thrown; anchoring would snap it off the spot where the jeep stood.
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: -0.45,-1.05,0.45,1.05
        density: 800
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  # Like the live jeep, shots pass over it unless it is the target.
  - type: RequireProjectileTarget
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralMarine
  - type: Corrodible
    isCorrodible: true
    structure: true
  - type: RMCWallExplosionDeletable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # It is spawned before its own jeep's blast goes off.
  - type: ExplosionResistance
    damageCoefficient: 0

