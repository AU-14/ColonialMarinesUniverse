- type: hardpointVehicleFamily
  id: CMUJeep

- type: Tag
  id: CMUJeepWheel

- type: Tag
  id: CMUJerryCan

- type: Tag
  id: CMUJeepWindshield

- type: Tag
  id: CMUJeepHeadlight

- type: Tag
  id: CMUJeepTurnSignal

- type: Tag
  id: CMUJeepTailLight

- type: Tag
  id: CMUJeepKey

- type: Tag
  id: CMUJeepHood

- type: Tag
  id: CMUJeepDoor

- type: Tag
  id: CMUJeepTailgate

- type: shader
  id: CMUVehicleRiderClip
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/rider_clip.swsl
  params:
    clip_enabled: false

- type: shader
  id: CMUVehiclePaint
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/paint.swsl

- type: shader
  id: CMUVehicleRim
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/rim.swsl

- type: shader
  id: CMUVehicleBeam
  kind: source
  path: /Textures/CMU14/Structures/vehicles/jeep/beam.swsl
  params:
    strength: 0.55

# The headlight beams' cones, drawn by the generator: up in the image is the jeep's front.
- type: lightMask
  id: CMUVehicleLowBeamMask
  maskPath: /Textures/CMU14/Structures/vehicles/jeep/light_masks/low_beam.png
  lightCones:
  - direction: 0
    innerWidth: 70
    outerWidth: 110

- type: lightMask
  id: CMUVehicleHighBeamMask
  maskPath: /Textures/CMU14/Structures/vehicles/jeep/light_masks/high_beam.png
  lightCones:
  - direction: 0
    innerWidth: 20
    outerWidth: 36

- type: entity
  parent: BaseItem
  id: CMUJeepHardpointBase
  abstract: true
  components:
  - type: Sprite
    sprite: CMU14/Structures/vehicles/jeep/hardpoints.rsi
  - type: Item
    size: Large

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepWheel
  name: jeep wheel set
  description: A set of jeep wheels. The spare on the tailgate is the same set.
  components:
  - type: Sprite
    state: tires
  # The wheel set is the cargo, transport and medical jeeps' whole hull.
  - type: HardpointItem
    damageRegion: Sides
    hardpointType: Wheel
    vehicleFamily: CMUJeep
    slotType: Wheel
    damageMultiplier: 0.15
    repairRate: 0.0165
  - type: HardpointIntegrity
    maxIntegrity: 250
    integrity: 250
  - type: VehicleWheelItem
  - type: CMUVehicleTyre
    tyre: OffRoad
  # Its paint and rim design, which go wherever the set goes.
  - type: CMUVehicleWheelPaint
  - type: Tag
    tags:
    - CMUJeepWheel

# Road tyres: smooth sidewalls and a ribbed tread. Quick on paving, slow on dirt and sand, and they
# bog down in water. The colony's jeeps come on them.
- type: entity
  parent: CMUJeepWheel
  id: CMUJeepWheelRoad
  name: jeep road wheel set
  description: A set of jeep wheels on road tyres. The spare on the tailgate is the same set.
  components:
  - type: Sprite
    state: road_tires
  - type: CMUVehicleTyre
    tyre: Road

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepWindshield
  name: jeep windshield
  description: A folding windshield frame with its glass. Fitted and taken off with a screwdriver.
  components:
  - type: Sprite
    state: windshield
  - type: CMUVehiclePartIntegrity
    integrity: 50
    maxIntegrity: 50
  - type: Tag
    tags:
    - CMUJeepWindshield

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepHeadlight
  name: jeep headlight
  description: A round jeep headlamp. It fits either side; a screwdriver takes it off, and it goes back on by hand.
  components:
  - type: Sprite
    state: headlight
  - type: Item
    size: Small
  - type: CMUVehiclePartIntegrity
    integrity: 30
    maxIntegrity: 30
    breakSound:
      path: /Audio/CMU14/Jeep/jeep_headlight_shatter.wav
      params:
        volume: -2
  - type: Tag
    tags:
    - CMUJeepHeadlight

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepTurnSignal
  name: jeep turn signal
  description: An amber turn signal lamp for a jeep's front fender. It fits either side; a screwdriver takes it off.
  components:
  - type: Sprite
    state: turn_signal
  - type: Item
    size: Tiny
  - type: CMUVehiclePartIntegrity
    integrity: 15
    maxIntegrity: 15
  - type: Tag
    tags:
    - CMUJeepTurnSignal

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepTailLight
  name: jeep tail light
  description: A jeep's rear lamp cluster, its tail and brake light over the rear turn signal. It fits either side; a screwdriver takes it off.
  components:
  - type: Sprite
    state: taillight
  - type: Item
    size: Small
  - type: CMUVehiclePartIntegrity
    integrity: 20
    maxIntegrity: 20
  - type: Tag
    tags:
    - CMUJeepTailLight

# Any jeep's key fits any jeep. Without one in the ignition the engine won't start, and pulling it out
# stops it.
- type: entity
  parent: BaseItem
  id: CMUJeepKey
  name: jeep key
  description: An ignition key for a military jeep, cut for one jeep alone; without it in the ignition the engine won't start.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/vehicle_key.rsi
    state: key
  - type: Item
    size: Tiny
  - type: CMUVehicleKey
  - type: Tag
    tags:
    - CMUJeepKey

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepHood
  name: jeep hood
  description: A jeep's bonnet on its hinges. Comes off by its screws, then its bolts.
  components:
  - type: Sprite
    state: hood
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - CMUJeepHood

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepDoor
  name: jeep door
  description: A jeep's side door. It fits either side; it comes off by its screws, then its bolts.
  components:
  - type: Sprite
    state: door
  - type: Tag
    tags:
    - CMUJeepDoor

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepTailgate
  name: jeep tailgate
  description: The fold-down tailgate of a cargo, gun or medical jeep. Comes off by its screws, then its bolts.
  components:
  - type: Sprite
    state: tailgate
  - type: Item
    size: Huge
  - type: Tag
    tags:
    - CMUJeepTailgate

- type: entity
  abstract: true
  id: CMUJeepBeamBase
  categories: [ HideSpawnMenu ]
  name: headlight beam
  components:
  # Under walls, items and mobs, over the floor.
  - type: Sprite
    drawdepth: HighFloorObjects
    sprite: CMU14/Structures/vehicles/jeep/jeep_beams.rsi
    layers:
    - map: [ beam ]
      state: beam_low
      visible: false
  # On its headlight's lens (forward is -y), turned with the jeep; the client keeps it on the lens
  # the art draws in each direction.
  - type: PointLight
    enabled: false
    autoRot: true
    offset: "0,-1.15"
    castShadows: true
    color: "#FFF1CF"
  - type: CMUVehicleHeadlightBeam

- type: entity
  parent: CMUJeepBeamBase
  id: CMUVehicleLowBeam
  components:
  - type: Sprite
    layers:
    - map: [ beam ]
      state: beam_low
      visible: false
  - type: PointLight
    lightMask: CMUVehicleLowBeamMask
    radius: 5.5
    energy: 1.8
    softness: 1
    falloff: 3

- type: entity
  parent: CMUJeepBeamBase
  id: CMUVehicleHighBeam
  components:
  - type: Sprite
    layers:
    - map: [ beam ]
      state: beam_high
      visible: false
  - type: PointLight
    lightMask: CMUVehicleHighBeamMask
    radius: 11
    energy: 2.4
    softness: 1
    falloff: 2

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepMGMount
  name: jeep gun mount
  description: The gun jeep's pedestal mount. It swings through an eighth of a turn either side of the bonnet.
  components:
  - type: Sprite
    state: mgturret
  - type: Item
    size: Huge
  - type: HardpointItem
    hardpointType: Turret
    vehicleFamily: CMUJeep
    slotType: Turret
    damageMultiplier: 0.15
    repairRate: 0.008
  - type: HardpointIntegrity
    maxIntegrity: 75
    integrity: 75
  - type: VehicleTurret
    rotateToCursor: true
    stabilizedRotation: false
    rotationSpeed: 220
    cmuMaxYawDegrees: 45
    showOverlay: true
    useDirectionalOffsets: true
    overlayRsi: CMU14/Structures/vehicles/jeep/jeep_gunner.rsi
    overlayState: mgturret_0
    overlayDamagedState: mgturret_1
    pixelOffsetNorth: "0,-8"
    pixelOffsetEast: "-20,18"
    pixelOffsetSouth: "0,24"
    pixelOffsetWest: "20,18"
  - type: ItemSlots
    slots:
      turret-gun:
        startingItem: CMUJeepMG
        disableEject: true
        whitelist:
          components:
          - HardpointItem
  - type: ContainerContainer
    containers:
      turret-gun: !type:ContainerSlot
  - type: HardpointState
  - type: HardpointSlots
    vehicleFamily: CMUJeep
    slots:
    - id: turret-gun
      hardpointType: Cannon
      slotType: Cannon
      required: false
      insertDelay: 2.0

- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepMG
  name: jeep machine gun
  description: A belt-fed machine gun for the gun jeep's pedestal, fed from cupola ammo crates.
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    state: mgturret
  - type: HardpointItem
    hardpointType: Cannon
    vehicleFamily: CMUJeep
    slotType: Cannon
    damageMultiplier: 0.1
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 75
    integrity: 75
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    showOverlay: false
    fireWhileRotatingGraceDegrees: 15
    useBarrelDirectionForShots: true
    maxShotCurvatureDegrees: 10
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: Gun
    fireRate: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/CMU14/Jeep/jeep_mg_close.wav
      params:
        volume: -2
        variation: 0.05
    cameraRecoilScalar: 0
  - type: CMUGunDistantSound
    sound:
      path: /Audio/CMU14/Jeep/jeep_mg_far.wav
      params:
        volume: -3
        variation: 0.05
  - type: GunIFF
    enabled: true
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 3
    accuracyMultiplierUnwielded: 3
  - type: BallisticAmmoProvider
    cycleable: false
    proto: VehicleCartridgeSentry10x50mm
    capacity: 300
  - type: VehicleHardpointAmmo
    magazineSize: 300
    maxStoredMagazines: 2
  - type: GunFireArc
    arc: 100
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxCupola
  # Shots and the muzzle flash start at the gun's pivot on the jeep (the art's MG_PIVOT, 16 voxels
  # behind the middle) out along the aim by the barrel (MG_MUZZLE, 21 px), the same from every camera
  # rotation.
  - type: CMUVehicleGunOrigin
    pivot: "0,0.5"
    barrel: 0.65625

- type: entity
  parent: CMUOpenVehicleBase
  id: CMUVehicleJeepBase
  abstract: true
  name: jeep
  description: A light, open four-by-four. Fast and nimble, but nothing stands between its crew and the bullets.
  components:
  - type: CMUVehicleIgnition
    keySlot:
      name: cmu-jeep-part-ignition
      startingItem: CMUJeepKey
      swap: false
      insertSound: /Audio/Machines/id_insert.ogg
      ejectSound: /Audio/Machines/id_swipe.ogg
      whitelist:
        tags:
        - CMUJeepKey
  - type: CMUVehicleEngineSound
    startSound:
      path: /Audio/CMU14/Jeep/jeep_engine_start.wav
      params:
        maxDistance: 12
    idleSound:
      path: /Audio/CMU14/Jeep/jeep_engine_idle.wav
      params:
        volume: -2
        maxDistance: 10
    driveSound:
      path: /Audio/CMU14/Jeep/jeep_engine_drive.wav
      params:
        volume: -1
        maxDistance: 12
    roughSound:
      path: /Audio/CMU14/Jeep/jeep_engine_rough.wav
      params:
        volume: -2
        maxDistance: 10
    roughDriveSound:
      path: /Audio/CMU14/Jeep/jeep_engine_rough_drive.wav
      params:
        volume: -1
        maxDistance: 12
    revSound:
      path: /Audio/CMU14/Jeep/jeep_engine_rev.wav
      params:
        maxDistance: 12
    stallSound:
      path: /Audio/CMU14/Jeep/jeep_engine_sputter.wav
      params:
        maxDistance: 12
    offSound:
      path: /Audio/CMU14/Jeep/jeep_engine_off.wav
      params:
        maxDistance: 12
  - type: CMUVehicleCrashKnockout
    hornSound:
      path: /Audio/CMU14/Jeep/jeep_horn_long.wav
      params:
        volume: 2
  # The engine sounds come from CMUVehicleEngineSound, so there is no running sound here.
  - type: VehicleSound
    hornSound: /Audio/CMU14/Jeep/jeep_horn.wav
    hornCooldown: 1
    collisionSound: /Audio/_RMC14/Effects/metal_crash.ogg
    collisionSoundCooldown: 1.5
    collisionSoundMinSpeed: 7
    mobCollisionSound: /Audio/_RMC14/Xeno/alien_claw_block.ogg
  - type: CMUVehicleSeats
    seats:
    - id: driver
      name: cmu-vehicle-seat-driver
      offset: 0.3125,0.25
      exit: 0.95,0.25
      door: door_driver
      doorSide: East
      windshield: true
      pixelOffsets:
        South: 10,6
        North: -10,-3
        East: -8,6
        West: 8,-8
      clips:
        South: 3
        North: 4
        East: 2
        West: 2
      driver: true
    - id: passenger
      name: cmu-vehicle-seat-passenger
      offset: -0.3125,0.25
      exit: -0.95,0.25
      door: door_passenger
      doorSide: West
      windshield: true
      pixelOffsets:
        South: -10,6
        North: 10,-3
        East: -8,-8
        West: 8,6
      clips:
        South: 3
        North: 4
        East: 2
        West: 2
  - type: CMUOpenVehicle
    parts:
    - id: hood
      name: cmu-jeep-part-hood
      slot: jeep-hood
      kind: Panel
      exposes: [ engine ]
      raisedLayer: hood_raised
      ajarWhenWrecked: true
      overRiders: [ South ]
      openSound:
        path: /Audio/CMU14/Jeep/jeep_hood_open.wav
        params:
          volume: -2
      closeSound:
        path: /Audio/CMU14/Jeep/jeep_hood_close.wav
        params:
          volume: -2
    - id: windshield
      name: cmu-jeep-part-windshield
      slot: jeep-windshield
      kind: Windshield
      interlock: [ hood ]
      overRiders: [ South ]
    - id: door_driver
      name: cmu-jeep-part-door-driver
      slot: jeep-door-driver
      kind: Panel
      overRiders: [ West ]
      openSound:
        path: /Audio/CMU14/Jeep/jeep_hood_open.wav
        params:
          volume: -5
          pitch: 1.15
      closeSound:
        path: /Audio/CMU14/Jeep/jeep_hood_close.wav
        params:
          volume: -5
          pitch: 1.15
    - id: door_passenger
      name: cmu-jeep-part-door-passenger
      slot: jeep-door-passenger
      kind: Panel
      overRiders: [ East ]
      openSound:
        path: /Audio/CMU14/Jeep/jeep_hood_open.wav
        params:
          volume: -5
          pitch: 1.15
      closeSound:
        path: /Audio/CMU14/Jeep/jeep_hood_close.wav
        params:
          volume: -5
          pitch: 1.15
    # Spawned behind the bed, so it can be reached from behind the jeep.
    - id: tailgate
      name: cmu-jeep-part-tailgate
      slot: jeep-tailgate
      offset: 0,0.9
      kind: Panel
      blocksKitWhileOpen: true
      overRiders: [ North ]
      openSound:
        path: /Audio/CMU14/Jeep/jeep_hood_open.wav
        params:
          volume: -4
          pitch: 0.9
      closeSound:
        path: /Audio/CMU14/Jeep/jeep_hood_close.wav
        params:
          volume: -4
          pitch: 0.9
    - id: fuel_door
      name: cmu-jeep-part-fuel-door
      kind: Panel
      overRiders: [ East ]
    - id: engine
      name: cmu-jeep-part-engine
      kind: Engine
    - id: wheels
      name: cmu-jeep-part-wheels
      slot: wheel-1
      kind: Wheels
      overRiders: [ East, West ]
    - id: spare
      name: cmu-jeep-part-spare
      slot: jeep-spare
      host: tailgate
      overRiders: [ North ]
    - id: jerrycan
      name: cmu-jeep-part-jerrycan
      slot: jeep-jerrycan
      host: tailgate
      maskOnly: true
      overRiders: [ North ]
    - id: shovel
      name: cmu-jeep-part-shovel
      slot: jeep-shovel
      host: door_driver
      overRiders: [ West ]
    - id: axe
      name: cmu-jeep-part-axe
      slot: jeep-axe
      host: door_driver
      overRiders: [ West ]
    - id: jack
      name: cmu-jeep-part-jack
      slot: jeep-jack
      host: door_passenger
      maskOnly: true
      overRiders: [ East ]
    # Strapped to the outside of the cowl, ahead of the passenger door.
    - id: extinguisher
      name: cmu-jeep-part-extinguisher
      slot: jeep-extinguisher
      offset: -0.64,-0.23
      maskOnly: true
      overRiders: [ South, East ]
    windshieldSound:
      path: /Audio/CMU14/Jeep/jeep_windshield.wav
      params:
        volume: -2
  # Each lamp fitted on its own: offsets are where its click mask sits (vehicle space, facing south).
  - type: CMUVehicleLamps
    lamps:
    - id: headlight_left
      name: cmu-jeep-part-headlight-left
      overRiders: [ South ]
      role: Headlight
      side: Left
      litLayer: headlight_left_on
      offset: 0.45,-1
      hitChance: 0.3
      damageShare: 0.5
      slot:
        name: cmu-jeep-part-headlight-left
        startingItem: CMUJeepHeadlight
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepHeadlight
    - id: headlight_right
      name: cmu-jeep-part-headlight-right
      overRiders: [ South ]
      role: Headlight
      side: Right
      litLayer: headlight_right_on
      offset: -0.45,-1
      hitChance: 0.3
      damageShare: 0.5
      slot:
        name: cmu-jeep-part-headlight-right
        startingItem: CMUJeepHeadlight
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepHeadlight
    - id: turn_signal_left
      name: cmu-jeep-part-turn-signal-left
      overRiders: [ South ]
      role: TurnSignal
      side: Left
      signalLayer: signal_front_left
      offset: 0.55,-0.88
      hitChance: 0.25
      damageShare: 0.4
      slot:
        name: cmu-jeep-part-turn-signal-left
        startingItem: CMUJeepTurnSignal
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepTurnSignal
    - id: turn_signal_right
      name: cmu-jeep-part-turn-signal-right
      overRiders: [ South ]
      role: TurnSignal
      side: Right
      signalLayer: signal_front_right
      offset: -0.55,-0.88
      hitChance: 0.25
      damageShare: 0.4
      slot:
        name: cmu-jeep-part-turn-signal-right
        startingItem: CMUJeepTurnSignal
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepTurnSignal
    - id: taillight_left
      name: cmu-jeep-part-taillight-left
      overRiders: [ North ]
      role: TailLight
      side: Left
      litLayer: taillight_left_on
      brakeLayer: brake_left
      signalLayer: signal_rear_left
      offset: 0.55,0.97
      hitChance: 0.25
      damageShare: 0.4
      slot:
        name: cmu-jeep-part-taillight-left
        startingItem: CMUJeepTailLight
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepTailLight
    - id: taillight_right
      name: cmu-jeep-part-taillight-right
      overRiders: [ North ]
      role: TailLight
      side: Right
      litLayer: taillight_right_on
      brakeLayer: brake_right
      signalLayer: signal_rear_right
      offset: -0.55,0.97
      hitChance: 0.25
      damageShare: 0.4
      slot:
        name: cmu-jeep-part-taillight-right
        startingItem: CMUJeepTailLight
        disableEject: true
        swap: false
        whitelist:
          tags:
          - CMUJeepTailLight
  - type: Clickable
    bounds:
      south: -0.66,-1.38,0.66,1.25
      north: -0.66,-1.47,0.66,1.16
      east: -1.25,-0.81,1.34,0.78
      west: -1.34,-0.81,1.25,0.78
  - type: CMUVehicleCrayon
    map: /Textures/CMU14/Structures/vehicles/jeep/crayon_maps/jeep.png
  # A spray painter resprays the body, or the fitted wheel set on its own, in its chosen colour; see
  # paint.swsl. Switched to its rim designs it sprays one on the wheel set, drawn over the rims; see
  # rim.swsl. The spare keeps its own paint and rims.
  - type: CMUVehiclePaint
    layers: [ base, front_dent, damaged_frame, hood, door_driver, door_passenger, tailgate, fuel_door, headlight_left, headlight_right, turn_signal_left, turn_signal_right, taillight_left, taillight_right, extinguisher ]
    overlayLayers: [ body, front_dent, damaged_frame, door_driver, door_passenger, tailgate, taillight_left, taillight_right, hood, hood_raised, fuel_door, headlight_left, headlight_right, turn_signal_left, turn_signal_right, extinguisher ]
    plainLayers: [ engine, windshield ]
    plainOverlayLayers: [ windshield ]
    wheelLayers:
      rmc-wheels: wheel-1
      spare: jeep-spare
    wheelOverlayLayers:
      wheels: wheel-1
      spare: jeep-spare
    rimLayers:
      rims: rmc-wheels
      spare_rims: spare
    rimOverlayLayers:
      rims: wheels
      spare_rims: spare
  - type: CMUVehicleFrontDamage
    closedHoodState: hood_closed_dent
  - type: CMUVehicleHeadlights
    driverLampAnchors:
      South: 14,-37
      North: -14,33
      East: 39,6
      West: -39,-12
    passengerLampAnchors:
      South: -14,-37
      North: 14,33
      East: 39,-12
      West: -39,6
    switchSound:
      path: /Audio/Machines/lightswitch.ogg
      params:
        volume: -4
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.45,-1.05,0.45,1.05
        density: 800
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
