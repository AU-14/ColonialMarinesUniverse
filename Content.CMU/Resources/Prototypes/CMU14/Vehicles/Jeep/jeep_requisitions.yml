# Jeep crates on the platoons' ASRS catalogs, which list this among their parents; a catalog's
# categories add up through its parents. A platoon's account opens a round at 20,000: the cheapest
# jeep takes most of it, the gun jeep all of it.
- type: entity
  abstract: true
  id: CMUASRSJeepKits
  components:
  - type: RequisitionsComputer
    categories:
    - name: Vehicles
      entries:
      - cost: 12000
        crate: CMUCrateJeepCargo
      - cost: 15000
        crate: CMUCrateJeepMedical
      - cost: 17500
        crate: CMUCrateJeepTransport
      - cost: 20000
        crate: CMUCrateJeepGunner

# The colony's ASRS console only gets the cargo and medical jeeps.
- type: entity
  abstract: true
  id: CMUASRSColonyJeepKits
  components:
  - type: RequisitionsComputer
    categories:
    - name: Vehicles
      entries:
      - cost: 12000
        crate: CMUCrateJeepCargoColony
      - cost: 15000
        crate: CMUCrateJeepMedicalColony
