# Rim designs the vehicle spray painter puts on a vehicle's wheels; see CMURimDesignPrototype and
# rim.swsl. A rim is 11 pixels across. Nuts and lip bolts come in multiples of the count, so a
# turning wheel's four frame loop is seamless.

- type: cmuRimDesign
  id: CMURimFactory
  name: cmu-rim-design-factory
  order: 0
  factory: true
  pattern: Dish
  count: 4
  nuts: 4
  regions: [ ]

