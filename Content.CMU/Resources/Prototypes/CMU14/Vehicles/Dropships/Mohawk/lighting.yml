- type: entity
  abstract: true
  parent: CMUMohawkLight
  id: CMUMohawkDoubleLight
  components:
  - type: Sprite
    sprite: CMU14/Dropships/Mohawk/obj/items/lighting.rsi
    layers:
    - state: ptube1
      map: ["enum.PoweredLightLayers.Base"]
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: ptube-empty
      Off: ptube0
      On: ptube1
      Broken: ptube-broken
      Burned: ptube-burned

- type: entity
