    - state: bptube1
      map: ["enum.PoweredLightLayers.Base"]
  - type: PointLight
    color: '#D2E3EC'
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: bptube-empty
      Off: bptube0
      On: bptube1
