    offset: -0.5,0.5

- type: entity
  parent: CMUMohawkWeaponPortFore
  id: CMUMohawkM90Point
  name: Midway chin gun mount
  components:
  - type: MohawkChinGun
  - type: GunshipDirectFirePoint
    lateralOffset: 1.5
    forwardOffset: 1
  - type: SentryTargeting
  - type: DropshipWeaponPoint
    dirOffset: None
    fixedWeapon: true
    secondAmmoContainerSlotId: cmu_m90_second_ammo
  - type: Sprite
    layers:
    - state: equip_base_front
      visible: false
    - map: ["enum.DropshipWeaponPointLayers.Layer"]
      # BYOND's 96px bottom-left origin plus the source deployer's 16px X shift.
      offset: 1.5,1
  - type: ContainerContainer
    containers:
      rmc_dropship_weapon_point_weapon_container_slot: !type:ContainerSlot
      rmc_dropship_weapon_point_ammo_container_slot: !type:ContainerSlot
      cmu_m90_second_ammo: !type:ContainerSlot
  - type: ContainerFill
    containers:
      rmc_dropship_weapon_point_weapon_container_slot: [CMUMohawkM90]

- type: entity
  parent: RMCDropshipAttachmentGau21Cannon
  id: CMUMohawkM90
  name: twin-linked M90 90mm chin guns
  description: The Midway's dual-feed twin 90mm turret fires three shells per second. Supports four M90 ammunition types, selected or alternating feeds, a landed 180-degree forward arc and 30-tile range, and delayed flare-assisted bombardment during CAS flybys. Unmanned landed close defense engages IFF hostiles within four tiles.
  components:
  - type: Sprite
    sprite: CMU14/Dropships/Mohawk/obj/structures/machinery/midway/misc_96x96.rsi
    layers:
    - state: m90_minigun
  - type: DropshipWeapon
    abbreviation: M90
    ammoSpriteThresholds: []
    gunneryOnly: true
    fireDelay: 0.3333333
    fireInTransport: false
    weaponAttachedSprite:
      sprite: CMU14/Dropships/Mohawk/obj/structures/machinery/midway/misc_96x96.rsi
      state: m90_minigun
    ammoEmptyAttachedSprite:
      sprite: CMU14/Dropships/Mohawk/obj/structures/machinery/midway/misc_96x96.rsi
      state: m90_minigun
    ammoAttachedSprite:
      sprite: CMU14/Dropships/Mohawk/obj/structures/machinery/midway/misc_96x96.rsi
      state: m90_minigun
  - type: GunshipDirectFireWeapon
    projectile: CMUMohawkM90HEAP
    ammoPrototype: CMUMohawkM90Ammo
    gimbalDegrees: 180
    roundsPerProjectile: 1
  - type: Gun
    projectileSpeed: 40
    fireRate: 3
    minAngle: 0
    maxAngle: 0
    angleIncrease: 0
    selectedMode: FullAuto
    availableModes: [FullAuto]
    soundGunshot: /Audio/_RMC14/Dropship/gau_incockpit.ogg
    cameraRecoilScalar: 0
  - type: GunIgnorePrediction
  - type: RemoveComponents
    components:
    - type: PowerLoaderDetachable
    - type: DropshipFabricatorPrintable

- type: entity
  parent: RMCDropshipAttachmentAmmoGAU
  id: CMUMohawkM90Ammo
  name: PGU-420 HEAP 90mm ammunition crate
  description: Four hundred high-explosive armor-piercing rounds for the Midway's dual-feed M90 guns. Fires individual groundside shells or delayed explosive impacts near a signal flare during CAS flybys.
  components:
  - type: RMCGenericExamine
    message: It can penetrate 3 z-levels.
  - type: DropshipAmmo
    rounds: 400
    maxRounds: 400
    roundsPerShot: 1
    roundsPerSprite: 40
    fireMissionDelay: 2
    travelTime: 2
    targetSpread: 1
    bulletSpread: 2
    armorPiercing: 60
    zLevelPenetration: 3
    applyEffectsOnPenetrationLevels: true
    damage:
      types:
        Piercing: 145
        Heat: 20
    explosion:
      total: 20
      slope: 6
      max: 10
    weapon: CMUMohawkM90
    directFireProjectile: CMUMohawkM90HEAP
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 275

- type: entity
  parent: CMUMohawkM90Ammo
  id: CMUMohawkM90AmmoScatter
  name: PGU-425 'Gale' 90mm scatter ammunition crate
  description: Four hundred low-yield 90mm shells. Wide dispersion provides inexpensive suppressive coverage at the cost of direct damage and armor penetration.
  components:
  - type: RMCGenericExamine
    message: Scatter rounds cannot penetrate overhead cover.
  - type: DropshipAmmo
    ammoType: m90_scatter
    ammoSpriteType: 30mm_crate
    targetSpread: 4
    bulletSpread: 5
    armorPiercing: 10
    zLevelPenetration: 0
    directFireProjectile: CMUMohawkM90Scatter
    directFireSpreadDegrees: 10
    damage:
      types:
        Piercing: 50
        Heat: 10
    explosion:
      total: 10
      slope: 6
      max: 4
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 350

- type: entity
  parent: CMUMohawkM90Ammo
  id: CMUMohawkM90AmmoIncendiary
  name: PGU-430 'Ember' 90mm incendiary ammunition crate
  description: Four hundred incendiary 90mm shells. Direct hits ignite flammable targets; flyby bombardment scatters burning impact sites. Reduced penetration compared with HEAP.
  components:
  - type: RMCGenericExamine
    message: Incendiary rounds cannot penetrate overhead cover.
  - type: DropshipAmmo
    ammoType: m90_incendiary
    ammoSpriteType: 30mm_crate
    targetSpread: 2
    bulletSpread: 3
    armorPiercing: 15
    zLevelPenetration: 0
    directFireProjectile: CMUMohawkM90Incendiary
    directFireSpreadDegrees: 2
    friendlyImpactRadius: 3
    damage:
      types:
        Piercing: 70
        Heat: 60
    explosion:
      total: 12
      slope: 6
      max: 6
    fire:
      type: RMCTileFireMiniMike
      range: 0
      cardinalRange: 0
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 600

- type: entity
  parent: CMUMohawkM90Ammo
  id: CMUMohawkM90AmmoDevastator
  name: PGU-440 'Tempest' 90mm devastator ammunition crate
  description: Four hundred premium high-yield 90mm shells. Wide dispersion and heavy explosive damage saturate exposed targets. Extremely expensive and unsuitable near friendly troops.
  components:
  - type: RMCGenericExamine
    message: It can penetrate 1 z-level.
  - type: DropshipAmmo
