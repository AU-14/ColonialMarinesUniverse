- type: entity
  parent: RMCElectronicSystemAttachPoint
  id: CMUMohawkElectronics
  name: Mohawk electronic system mount
  components:
  - type: Transform
    anchored: true
    gridTraversal: false
  - type: Sprite
    sprite: _RMC14/Structures/Machines/dropship_attachment_points.rsi
    layers:
    - state: equip_base_front
      map: ["enum.DropshipPointVisualsLayers.AttachedUtility"]
    - state: equip_base_front
