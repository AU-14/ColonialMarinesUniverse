    armorPiercing: 40
    zLevelPenetration: 1
    directFireProjectile: CMUMohawkM90Devastator
    directFireSpreadDegrees: 12
    friendlyImpactRadius: 4
    damage:
      types:
        Piercing: 220
        Heat: 80
    explosion:
      total: 60
      slope: 6
      max: 12
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 2000

