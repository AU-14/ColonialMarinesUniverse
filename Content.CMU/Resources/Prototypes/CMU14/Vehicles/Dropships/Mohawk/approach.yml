- type: entity
  parent: CMUMohawkApproachShadow
  id: CMUMohawkMidwayApproachShadow
  components:
  - type: Sprite
    sprite: CMU14/Dropships/Mohawk/turf/midway/belly.rsi

- type: entity
  id: CMUMohawkApproachBeacon
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    gridTraversal: false
  - type: PointLight
    color: "#33D9FF"
    radius: 6
    energy: 3
    softness: 1
    falloff: 2
    castShadows: true
