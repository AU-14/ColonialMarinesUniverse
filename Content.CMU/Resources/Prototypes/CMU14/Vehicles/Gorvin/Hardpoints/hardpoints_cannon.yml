- type: entity
  parent: VehicleTankHardpointBaseGorvin
  id: VehicleTankTwinLTBCannon
  name: Twin 86mm LTB cannon
  description: A heavy tank cannon hardpoint.
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    sprite: _RMC14/Structures/vehicles/hardpoints/tank.rsi
    state: ltb_cannon
  - type: HardpointItem
    hardpointType: Cannon
    vehicleFamily: Tank
    slotType: Cannon
    damageMultiplier: 0.125
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 600
    integrity: 600
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    useBarrelDirectionForShots: true
    fireWhileRotatingGraceDegrees: 180
    offsetRotatesWithTurret: true
    useDirectionalOffsets: true
    pixelOffsetNorth: "10,15"
    pixelOffsetEast: "0,0"
    pixelOffsetSouth: "-2,-5"
    pixelOffsetWest: "0,0"
    showOverlay: true
    overlayRsi: CMU14/Vehicles/Gorvin_TWE.rsi
    overlayState: Gorvin_autocannon_0
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: ShootAtFixedPoint
  - type: Gun
    fireRate: 0.0525
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/CMU14/Weapons/vehicle/tankgun.ogg
    cameraRecoilScalar: 0
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 5
    accuracyMultiplierUnwielded: 5
  - type: BallisticAmmoProvider
    cycleable: false
    proto: CMUCartridgeLTBCannonHEAT
    capacity: 2
  - type: VehicleHardpointAmmo
    magazineSize: 2
    maxStoredMagazines: 2
  - type: GunFireArc
    arc: 120
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxLTBCannon
  - type: GunMuzzleOffset
    useDirectionalOffsets: true
    rotateDirectionalOffsets: true
    offsetNorth: "0,-1.5"
    offsetEast: "0.4,-1.9"
    offsetSouth: "0,-1"
    offsetWest: "-0.4,-1.9"
    useAimDirection: true
  - type: HardpointVisual
    vehicleState: Gorvin_autocannon_0
    damagedVehicleState: Gorvin_autocannon_1



