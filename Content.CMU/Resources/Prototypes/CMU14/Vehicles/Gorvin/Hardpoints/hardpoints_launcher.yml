    sprite: CMU14/Structures/vehicles/fv150/icons.rsi
    state: mounted_cupola
  - type: HardpointItem
    hardpointType: Secondary
    vehicleFamily: Tank
    slotType: Launcher
    damageMultiplier: 0.0
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 350
    integrity: 350
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    useBarrelDirectionForShots: true
    fireWhileRotatingGraceDegrees: 180
    offsetRotatesWithTurret: false
    useDirectionalOffsets: false
    pixelOffsetNorth: "0,0"
    pixelOffsetEast: "0,0"
    pixelOffsetSouth: "0,0"
    pixelOffsetWest: "0,0"
    showOverlay: true
    overlayRsi: CMU14/Vehicles/Gorvin_TWE.rsi
    overlayState: front_autocanon_0
  - type: GunUseGunOrigin
