
- type: entity
  parent: VehicleTankHardpointBaseGorvin
  id: VehicleTankCupolaGorvin
  name: 30mm Hull Frontal Cannon
  description: Imperial implementation of a hull autocannon gun in a powered cupola. Compact with integrated liquid cooling, and armored hull proofed to small arms. However, its angle of horizontal traverse is limited to the front arc, and its vertical no more than 23 degrees. The mounted weapon is a heavy barreled variant of the regular autocannon. It is built under license from Armat by Weyland Yutani.
