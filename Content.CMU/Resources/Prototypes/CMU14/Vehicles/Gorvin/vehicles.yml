- type: entity
  parent: VehicleTankBase
  id: VehicleTankTWEHeavy
  name: FV4143 Gorvin HCT
  description: The FV4143 Gorvin Light Cavalry Tank is a 6m long, 6m wide, 8m tall support vehicle for the RMC. Originally procured for the Special Air Service operations as an Airborne tank, this model has been made into a support vehicle for the Royal Marines thanks to a change of symbol and technological design. Entrance at the back.
  components:
  - type: CMUTankBlastProfile # CMU14: FLOW-09 per-explosion tank blast damage.
  - type: TankCookOff # CMU14
    turretSprite:
      sprite: CMU14/Vehicles/Gorvin_TWE.rsi
      state: tank_turret_0_duo
  - type: HardpointState
  - type: ContainerContainer
    containers:
      primary: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      secondary: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      support: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      wheel-1: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
      armor: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: HardpointIntegrity
    integrity: 1000
  - type: VehicleWheelSlots
    slots:
    - wheel-1
  - type: VehicleHardpointVisuals
    layers:
    - state: ""
      layer: primary
    - state: ""
      layer: secondary
    - state: ""
      layer: support
  - type: PointLight
    radius: 8
  - type: VehicleEnter
    interiorPath: /Maps/_RMC14/Vehicles/tank_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 4
    maxXenos: 2
    entryPoints:
    - offset: 0,2
      radius: 1
      interiorCoords: 0.5,-1
  - type: GridVehicleMover
    maxSpeed: 8
    acceleration: 1.556
    deceleration: 8
    maxReverseSpeed: 4
    reverseAcceleration: 1.556
    turnDelay: 0.7
    turnInPlace: true
    turnInPlaceMaxSpeed: 1
    pushCooldown: 2
    canPushVehicles: true
    blockingMobBypassNudgeLimit: 2
    xenoBlockMinimumSize: Immobile
    canXenosPush: false
    canSmashWalls: true
    wallSmashMinSpeed: 1.5
    wallSmashWheelDamage: 0.6
    wallSmashHullDamage: 12
    wallSmashSlowdownMultiplier: 0.2
    wallSmashSlowdownDuration: 1.5
    speedAtZeroIntegrity: 1
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -1.6,-1.9,1.6,1.9
        density: 1500
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -1.6,-1.9,1.6,1.9
        density: 1500
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Sprite
    sprite: CMU14/Vehicles/Gorvin_TWE.rsi
    layers:
    - map: [ base ]
      state: tank_base
    - map: [ primary ]
      state: tank_turret_0_duo
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: ItemSlots
    slots:
      primary:
        startingItem: VehicleTankTurretGorvin
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      secondary:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      support:
        disableEject: true
        whitelist:
          components:
          - HardpointItem
      wheel-1:
        startingItem: VehicleTankTreadsGorvin
        disableEject: true
        whitelist:
          components:
          - VehicleWheelItem
  - type: HardpointSlots
    vehicleFamily: Tank
    slots:
    - id: armor
      hardpointType: Armor
      slotType: Armor

      visualLayer: armor
      insertDelay: 2.5
      required: false
    - id: primary
      hardpointType: Turret
      slotType: Turret

      visualLayer: primary
      insertDelay: 3.0
      required: false
    - id: secondary
      hardpointType: Secondary

      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: Support
      slotType: SupportAttachment

      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: Wheel
      slotType: Treads
      insertDelay: 2.0

