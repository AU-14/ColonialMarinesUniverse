# The industrial versions of the brass machines of the steam age: the same machines in steel, built of two machine hulls (the casing parts that the
# electric machines are made on, which are beaten of sheets of metal) with a smithing hammer and no brass in them. The industrial steam extractor is with the other recipes of the extractor (Electric/electric_recipes.yml).

- type: craftRecipe
  id: RUMCCraftIndustrialSteelBoiler
  name: au14-craft-recipe-industrial-boiler
  output: RUMCSteelBoiler
  time: 18
  tools:
  - Hammering
  consumables:
  - stack: RUMCMachineHull
    amount: 2
  - stack: RMCWood
    amount: 4

