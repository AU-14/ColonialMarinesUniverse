# Recipes of the crafting radial menu (right-click yourself -> Craft).
# The menu only lists the recipes whose skills you have and whose consumables you carry; picking one crafts it on its own.
# skills: skill and the level it needs.
# tools: tool qualities you must carry; they are never used up.
# consumables: an entity ("item") or an amount of a stack type ("stack"); they are used up when the craft is done.

- type: craftRecipe
  id: RUMCCraftStonePowder
  name: au14-craft-recipe-stone-powder
  output: RUMCStonePowderItem
  outputCount: 1
  time: 4
  tools:
  - Hammering
  consumables:
  - stack: RUMCStone
    amount: 1

- type: craftRecipe
  id: RUMCCraftBlackStonePowder
  name: au14-craft-recipe-black-stone-powder
  output: RUMCBlackStonePowderItem
  outputCount: 1
  time: 4
  tools:
  - Hammering
  consumables:
  - stack: RUMCBlackStone
    amount: 1

- type: craftRecipe
  id: RUMCCraftSand
  name: au14-craft-recipe-sand
  output: RUMCSandItem
  outputCount: 4
  time: 3
  skills:
    RMCSkillConstruction: 1
  tools:
  - Hammering
  consumables:
  - stack: RUMCStonePowder
    amount: 4

