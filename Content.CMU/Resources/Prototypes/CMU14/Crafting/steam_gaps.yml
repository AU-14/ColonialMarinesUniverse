# The holes of the steam stage that nothing could be made of: the anvil and the smith's tools, the mold of sand, the solid-fuel press, the steam
# grinder. The tools and the anvil are made of the iron sheets the steam press makes (the iron ingot and the steel
# are forged at the anvil, never put in the menu).

