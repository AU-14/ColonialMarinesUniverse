- type: announcementPreset
  id: SelfDestructAnnouncement
  name: "Emergency Destruct System"
  description: "MU/TH/UR 6000 terminal readout for the self-destruct countdown"
  target: All
  visibleInSettings: false
  showSprite: false
  style:
    animation:
      animation: Typewriter
      printSpeed: 0.022
      holdDuration: 10
      flickerChance: 0.04
      glitchChance: 0.05
      animationEnhancements:
        enableCRT: true
    layout:
      position: TopLeft
      spritePosition: Left
      spriteDisplayMode: FullSprite
      uIScale: 2
      titlePosition: Above
    background:
      showBackground: true
      backgroundAlpha: 0.72
      backgroundColor: "#0d0505"
    text:
      primaryColor: "#b9e6c9"
      fontSize: 24
      lineHeight: 46
      showSpeakerName: false
    sprite:
      showSpriteBox: false
      spriteScale: 1
    title:
      title: "EMERGENCY DESTRUCT SYSTEM"
      titleColor: "#ff3838"
      titleFontSize: 28
      titleFont: "DefaultBold"
  priority: 9
  canInterrupt: true
  canBeInterrupted: true

