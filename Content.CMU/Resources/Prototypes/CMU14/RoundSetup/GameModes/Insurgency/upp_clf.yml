  definition:
    metadata:
      title: Colonial Liberation Front [UPP]
      description: Standard CLF gameplay but with the added twist of UPP backing. Though you are expected to not go after
        nor harm the UPP nor their allies. (Ambassadors of the UPP, UPP 3rd parties, UPP personnel, etc, though you may
        attack them if they prove to be agaisnt your faction.)
      roleplayText: |-
        Standard CLF Gameplay. Do not attack the UPP nor their allies.

        Your main objective is same as vanilla CLF, though you are encouraged to repesent eastern type ideals (Communism, Socialism, Etc. Though do not stoop into modern politics).
      recruitedMessage: You have been recruited by an Pro-UPP Cell, do not harm any UPP nor their allies. (Ambassadors
        of the UPP, UPP 3rd parties, UPP personnel, etc, though you may attack them if they prove to be agaisnt your
        faction.)
      opposedGovforFactions:
      - WEYU
      - VAIPO
      - HAZOPS
      - USCM
      - RMC
      - LACN
      - CMBCIU
