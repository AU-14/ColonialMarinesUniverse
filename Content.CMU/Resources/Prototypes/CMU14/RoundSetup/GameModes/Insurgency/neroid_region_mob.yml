- type: cmuInsurgencyFaction
  id: CMUInsforNeroidRegionMob
  ballotId: 10
  definition:
    metadata:
      title: Neroid Region Mob
      description: |-
        The Neroid Mob is the largest crime family in the sector. Even rivaling some INSFOR cells, though they are considered the smallest cell yet. With funding from friends within the CLF and the black market trade the NRM, for whatever reason has formed into a insurgent-like cell, reministic of old-earth southern american cartels.

        Gameplay: You are a Cartel/Mob, you can work to obtain drugs and narcotics for a large sum of points, alongside this you can grow/produce some drugs for point reward. Your capacity to recruit is existent but your sucess will hinge on your capability to produce. Difficulty is very punishing unexperienced cell leads.
      roleplayText: "The local law enforcement has ramped up their operations, to the extent where you gotta retilate\
        \ back and teach them a lesson. Maintain good relations with the colony, you are not there to terrorise them\
        \ nor rob them; they are your recruitment pool and soon-to be buisness partners. Get rid of local security and\
        \ teach them a lesson, espically their pesky commander, make an example out of him. \n\n[INSURGENCY-INSURGENT\
        \ RULES STILL APPLY]\n\nYou are to pursue either regular cell goals or seek to produce illicit substances or\
        \ rob high valuable items for more funding."
      recruitedMessage: You for whatever reason joined the NRM, as apart of the NRM you are to listen to the Mob Boss
        (Cell lead) his order is religion, that or you go swimming with the carps.
      statusIcon: SyndicateFaction
      recruitStatusIcon: SyndicateFaction
