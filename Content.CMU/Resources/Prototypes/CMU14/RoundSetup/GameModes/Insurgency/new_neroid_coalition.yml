- type: cmuInsurgencyFaction
  id: CMUInsforNewNeroidCoalition
  ballotId: 6
  definition:
    metadata:
      title: New Neroid Coalition
      description: |-
        The New Neroid Coalition are a group of self proclaimed freedom fighters that are in pursuit of a free Neroid Sector with it's own independent government.
        To some they are a bunch of idiot extremists no better than the CLF and to others they are heroes here to free the Neroid Sector.
        There are also rumors that the NNC are supplied by Weyland-Yutani.

        Gameplay: Built to be better at slug fests with GOVFOR, more suited for upfront fighting than ambush-style warfare.
      roleplayText: "The NNC are a paramilitary group with a more structured chain of command and supply chains however\
        \ they tend to go out of their way to avoid damage to whaterver colony they intent to liberate. \nHowever, they\
        \ have little to no mercy for the people that stand in their way.\n\nThey are a Pro Weyland-Yutani Insurgency,\
        \ and their end goal is to create a pro We-Yu colony."
      recruitedMessage: |-
        Welcome to the NNC (New Neroid Coalition)!
        We fight the oppressors of the current regime so we may one day live in a free and fair society!
        For the Coropration! For the People!
      flagEntity: OrganSkeletonPersonHead
      statusIcon: RevolutionaryFaction
      jobStatusIcons:
      - role: AU14JobCLFCellLeader
        icon: HeadRevolutionaryFaction
