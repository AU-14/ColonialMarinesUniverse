- type: cmuInsurgencyFaction
  id: CMUInsforATNR
  ballotId: 8
  definition:
    metadata:
      title: ATNR (UA-INSFOR)
      description: Standard INSFOR Gameplay although you have more conventional weapons, among them old Dog War era equipment.
        You are a UA funded cell and you are expected to act like it and roleplay accordingly. Ambassadors, Third Parties,
        and Soldiers of UA factions cannot be harmed without them first trying to destroy your faction. Additionally
        you are expected to RP more friendly to CMB although you may still fight them as they are a local UA institution,
        this does not apply to PAP or NSPA.
      roleplayText: You are a member of the Army of Trans-National Resistance, a clandestine organization that started
        as UPP deserters and political parties advocating for independent Liberal Democracies formed out of the European
        sections of the Union of Progressive People, though in recent years they have been increasingly been funded by
        the Central Intelligence Agency, resulting in Anti-Communists from any nation being let into the organization.
        The ATNR primarily acts as an agent for covert American opposition to the UPP, though they occasionally are used
        to take over TWE colonies as well. In principle most fighters of the ATNR fight for the independence of their
        own nations, colonies, and the establishment of Liberal Republics, but there are smaller sections of the organization
        that fight for Anti-Communist Authoritarian Dictatorship or Admission into the United Americas as a constituent
        country, though both of these are fringe. The largest sections of the ATNR are from Polish, German & Romanian
        colonies within the UPP and UA colonies taken over by the TWE or UPP.
      recruitedMessage: Standard INSFOR Gameplay although you have more conventional weapons, among them old Dog War
        era equipment. You are a UA funded cell and you are expected to act like it and roleplay accordingly. Ambassadors,
        Third Parties, and Soldiers of UA factions cannot be harmed without them first trying to destroy your faction.
        Additionally you are expected to RP more friendly to CMB although you may still fight them as they are a local
        UA institution, this does not apply to PAP or NSPA.
