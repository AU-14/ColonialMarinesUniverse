- type: cmuInsurgencyFaction
  id: CMUInsforAnarchists
  ballotId: 17
  definition:
    metadata:
      title: The Anarchist's.
      description: |-
        The Anarchist's are a broad spectrum of violent radicals, most commonly found in highly corporatised and enslaved colony societies. Your own goal is liberation and chaos.

        Liberate yourself of the shackles of modern society.

        [INSURGENCY RULES STILL APPLY]

        Gameplay: Quantity over quality, you have barely to no weapons, though your progression is short-sited, you will need a good loot pool to source from the GOVFOR or colony, no faction will see a alliance with you beneficial, make sure you have a plentiful colonist pool to recruit from.
      roleplayText: "In the fringe sectors of Neroid there are many forms of government, corporate mining colonies, typical\
        \ police-state city colonies and all the inbetween. You despite it all.  The colony government, the GOVFOR and\
        \ colonial society as it is known must fall. \n\n[INSURGENCY RULES STILL APPLY]"
      recruitedMessage: |-
        You have joined the ranks of chaos, your leadership is the only law you follow.


        [INSURGENCY RULES STILL APPLY]
