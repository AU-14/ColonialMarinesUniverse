- type: cmuInsurgencyFaction
  id: CMUInsforNeroidFreelancerGuild
  ballotId: 12
  definition:
    metadata:
      title: Neroid Freelancer Guild
      description: "In the fringes of Neroid colonies ara heavily argued over things, either be it a company, group of\
        \ interest or nation, you and your posse of freelancers have been paid to take the colony. The colony must remain\
        \ in contact and their inhabitants unharmed.\n\nYour ideology, religion, lifestyle is not important, the only\
        \ thing you and your band want is to get paid. \n\nGameplay:  You cannot recruitment new members, gameplay is\
        \ intended to be challenging for people not familiar with guerilla warfare. Your weapons and equipment are mostly\
        \ already paid for but expect to break some of your backs to earn better gear."
      roleplayText: |-
        In the fringes of Neroid colonies ara heavily argued over things, either be it a company, group of interest or nation, you and your posse of freelancers have been paid to take the colony. The colony must remain in contact and their inhabitants unharmed.

        Your ideology, religion, lifestyle is not important, the only thing you and your band want is to get paid. Get the job done.
      recruitedMessage: You've somehow been recruited by the Freelancer Guild of Neroid, do what their boss says and
        you'll probably be fine.
