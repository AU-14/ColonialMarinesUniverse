- type: cmuInsurgencyFaction
  id: CMUInsforBlackCandle
  ballotId: 18
  definition:
    metadata:
      title: Black Candle. "Damned Delta."
      description: |-
        The Black Candle is a rouge United States Colonial Marine ship and crew. Their warship, renamed to the Black Candle from the USS Nixon, has been classed as missing, though sometimes there are whispers of it resting on some backwater planet. Taking their name from the same ship, the entire Black Candle detachment are rouge marines. But why?

        It is because of the United Americas Provost. For years, the USS Nixon fell deep into disrepair. It had been spaceborne for years. This particular platoon was sent to deal with the less than glamorous tasks the UA needed done. Quelling mutinies, clearing hostile xenofauna for colonists, long distance protection. With the crew’s begging for constant updates and fixes, the command of the ship took the reins as their pleads fell on deaf ears. He went behind the United America’s back. Contact was cut from High Command, and the USS Nixon disappeared, reappearing on their radar a month later, in better shape. The Commander refused to tell High Comm where he had went or what they did. The crew didn’t speak. So Provost was dispatched.

        The marines did not take kindly to that.

        After years of begging for help, when they finally decided to get it, albeit by dubious means, their own Commander was cuffed. They wouldn’t stand for it

        The UA shortly after declared the entire ship and crew hostile. So the Black Candle went off the radar, disappearing into the far reaches of space.

        GAMEPLAY: You are a rogue USCM/HAZOP's detachment, you are now practically a warlord's band.
      roleplayText: |-
        You are a soldier of the Black Candle, for weather you was a specialist HAZOP soldier, USCM grunt or somewhere inbetween you are rogue, you no longer answer to the UA. The colony is yours to liberate and control, ensure the local platoon doesn't carry out your execution order signed off by Provost.

        A ICSC contact promises you independence and new identities when this is all over.
      recruitedMessage: |-
        You've enlisted into the forces of Black Candle, you are to listen to the cell lead and your superiors over everything else, you are loyal to the cause, you are not content to live out your life as a colonist anymore.

        Provost and the MP's will execute you, there is no capture, only death. You will not make it to see a GOVFOR cell.

        A ICSC contact promises you freedom if you liberate the colony and fight off the GOVFOR, they'll handle the politics, you'll handle the provost's grunts.
