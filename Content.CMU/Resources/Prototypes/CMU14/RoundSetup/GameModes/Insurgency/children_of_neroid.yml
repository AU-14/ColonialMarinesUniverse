- type: cmuInsurgencyFaction
  id: CMUInsforChildrenOfNeroid
  ballotId: 11
  definition:
    metadata:
      title: Children of Neroid.
      description: |-
        The Children of Neroid are a extremeist ideology of cultist like factions across the sector, mostly consistent of fringe radicals, they typically don't resort to out-right insurgency though in the more fringe areas of Neroid their numbers tend to swell out of control.

        Gameplay: You can still convert money to points but you have the ability to convert most foot soldier GOVFOR IDs to points, alongside this command IDs are worth more tenfold. You are to still follow insurgency rules. You have unlimited recruiting potential, though your weaponry n' gear are lacking, use your numbers as advantage. Difficulty is extremely high, it is advised you choose this if you have experience within the cell lead role alongside having a numerous colonist pool.
      roleplayText: "The Children of Neroid are a Cultist faction within the Neroid sector, you wish for nothing but\
        \ the total eradication of the hainous GOVFOR, they bring satanic plague to your lands and should be exterminated.\
        \ Take their IDs and redeem them for your rewards from the holy mother. \n\nYou as a cultist/cult leader believe\
        \ that GOVFOR and general colonisation of planets is unnatural and that all must return to the wild the construction\
        \ colonies and the destruction of wild life is hainous, and the tampering and mutilation of planets even worst.\
        \ \n\nIt is your duty to convert and free the colony from the oppressive reign of the corporations and facist\
        \ governments. For those who wish not to join are simply mis-informed, do not harm any colonist that refuses\
        \ to join, they need protecting for when you can truely teach them the way of oh gracious mother.\n\n\n[INSURGENCY-INSURGENT\
        \ RULES STILL APPLY]"
      recruitedMessage: You've been indoctrinated into the Children of Neroid, you are a full-believer of the religion
        of the cult.
