- type: cmuInsurgencyFaction
  id: CMUInsforTrueCLF
  ballotId: 14
  definition:
    metadata:
      title: True Colonial Liberation Front
      description: "Formed from colonial militia's, contractors, mercenaries, the true CLF cell is considered the \"\
        True\" CLF cell within neroid, your backers in the greater movement have given you proper funding and supplies,\
        \ though your backing  from the ISCSC and your upper-cell are.. sub-par. \n\nGameplay: Long-term plays regarding\
        \ economy are rewarded with exclusive gear and general supplies. Your recruitment is free but not numerous. Alot\
        \ of this is like \"The Good Ol Days\""
      roleplayText: Regular CLF Style, you side with no government, no company, only indepedence. Alliances with the
        companies, nations and conquers of Neroid is forbidden, the only allies are yourself and the colony.
      recruitedMessage: You've been recruited to the True CLF, follow what the boss says and you'll be fine.
