# Presence-based zone objective for Force on Force. The strongest alive force inside the
# rectangular zone scores each tick into the faction win-point pool, scaled by team size so
# a minority side earns more per head. Relocates to a fresh objective marker after scoring
# ticks to keep both teams moving.
- type: entity
  id: CMUHotspotObjective
  name: Hotspot
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: CMUObjective
    id: CMUHotspotObjective
    factionNeutral: true
    allowedPresets:
    - ForceOnForce
    factions:
    - govfor
    - opfor
    objectiveLevel: 3
    rollAnyway: true
    objectiveWeight: 2
    objectiveDescription: "Hold the hotspot. The strongest force inside it scores over time."
  - type: HotspotObjective
    catalog: true
    halfWidth: 7
    tickSeconds: 10
    pointsPerTick: 1
    normalizeByTeamSize: true
    feedWinPoints: true
    relocateAfterTicks: 5
    zoneColorHex: "#FFB300"
  - type: NavMapBeacon
    text: Hotspot
  - type: Sprite
    drawdepth: Overdoors
    sprite: _RMC14/Markers/gm_tacmap_marks.rsi
    state: star
  - type: WarpPoint
    location: cmu-warp-location-hotspot
