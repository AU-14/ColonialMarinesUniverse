- type: entity
  parent: RMCIntelTechTree
  id: CMUIntelTechTree_CLF
  name: intel tech tree (CLF)
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
# ├──[ Tier 0 ]──────────────────────────────────────────────────────┤
      -
        - name: cmu-tech-tier-one
          description: cmu-tech-tier-unlock-desc
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 1: Cell support & reinforcements ]───────────────────────┤
      -
        - name: cmu-tech-clf-req-budget
          description: cmu-tech-clf-req-budget-desc
          cost: 6
          increase: 2
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
        - name: cmu-tech-clf-reinforcements
          description: cmu-tech-clf-reinforcements-desc
          cost: 25
          increase: 6
          repurchasable: true
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CLFCellReinforcementsIntel
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: cmu-tech-clf-machine-gunner
          description: cmu-tech-clf-machine-gunner-desc
          cost: 8
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CLFCellReinforcementsIntelMachineGunner
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: cmu-tech-clf-vaiso
          description: cmu-tech-clf-vaiso-desc
          cost: 50
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: VAISO
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: cmu-tech-clf-commandos
          description: cmu-tech-clf-commandos-desc
          cost: 50
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: CLFCellCommandosIntel
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
        - name: cmu-tech-clf-prodigy-yankee
          description: cmu-tech-clf-prodigy-yankee-desc
          cost: 45
          repurchasable: false
          events:
          - !type:TechPartySpawnEvent
            thirdPartyId: ProdigyPARTY
          - !type:TechAnnounceEvent
            author: cmu-tech-author-intel-operations
            message: cmu-tech-clf-prodigy-yankee-announce
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: beacon
