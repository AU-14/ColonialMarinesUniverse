- type: entity
  parent: RMCIntelTechTree
  id: CMUIntelTechTree_OPFOR # TODO
  name: intel tech tree (OpFor)
  categories: [ HideSpawnMenu ]
  components:
  - type: IntelTechTree
    tree:
      options:
# ├──[ Tier 0 ]──────────────────────────────────────────────────────┤
      -
        - name: cmu-tech-tier-one
          description: cmu-tech-tier-unlock-desc
          cost: 0
          events:
          - !type:TechUnlockTierEvent
            tier: 1
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: upgrade
# ├──[ Tier 1: Requisition budget ]──────────────────────────────────┤
      -
        - name: cmu-tech-opfor-req-budget
          description: cmu-tech-opfor-req-budget-desc
          cost: 12
          increase: 3
          repurchasable: true
          events:
          - !type:TechRequisitionsBudgetEvent
            amount: 5000
          - !type:TechAnnounceEvent
            author: cmu-tech-author-special-assets
            message: cmu-tech-opfor-req-budget-announce
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: budget_req
        - name: cmu-tech-opfor-disk-smoke
          description: cmu-tech-opfor-disk-smoke-desc
          cost: 8
          increase: 4
          repurchasable: true
          maxPurchases: 3
          events:
          - !type:CMUTechShipWeaponMissionEvent
            weapon: CMUSmokeStrike
          - !type:TechAnnounceEvent
            author: cmu-tech-author-special-assets
            message: cmu-tech-opfor-disk-announce
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: ob_cluster
        - name: cmu-tech-opfor-disk-railcannon
          description: cmu-tech-opfor-disk-railcannon-desc
          cost: 60
          events:
          - !type:CMUTechShipWeaponMissionEvent
            weapon: CMURailcannonStrike
          - !type:TechAnnounceEvent
            author: cmu-tech-author-special-assets
            message: cmu-tech-opfor-disk-announce
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: railgun
        - name: cmu-tech-opfor-disk-ems
          description: cmu-tech-opfor-disk-ems-desc
          cost: 45
          events:
          - !type:CMUTechShipWeaponMissionEvent
            weapon: CMUEMSStrike
          - !type:TechAnnounceEvent
            author: cmu-tech-author-special-assets
            message: cmu-tech-opfor-disk-announce
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: ob_incend
        - name: cmu-tech-opfor-disk-gatling
          description: cmu-tech-opfor-disk-gatling-desc
          cost: 50
          events:
          - !type:CMUTechShipWeaponMissionEvent
            weapon: CMUGatlingBarrage
          - !type:TechAnnounceEvent
            author: cmu-tech-author-special-assets
            message: cmu-tech-opfor-disk-announce
          icon:
            sprite: _RMC14/Interface/tech_tree.rsi
            state: ob_he
