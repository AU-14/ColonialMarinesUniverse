# Union of Progressive Peoples: UPP and BEAR.
# Every faction list shares the budgets, ship fire missions and ICRC relief; keep those entries the same across the lists.
# K9 teams: USASF on UA, militsiya MP dogs on UPP, S&R on Other, none on TWE.
- type: entity
