# ├──[ GOVFOR ]──────────────────────────────────────────────────────┤
- type: entity
  parent: RMCCommunicationsConsoleBase
  id: RMCTechTreeConsoleGovfor
  name: govfor tech tree console
  description: A GovFor tech console used to make tech purchases for GovFor.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: techweb
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.TechControlConsoleUI.Key
  - type: UserInterface
    interfaces:
      enum.TechControlConsoleUI.Key:
        type: TechControlConsoleBui
  - type: TechControlConsole
    team: govfor
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno

