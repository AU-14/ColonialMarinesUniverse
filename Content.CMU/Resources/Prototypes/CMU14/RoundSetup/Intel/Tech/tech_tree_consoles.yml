# ├──[ CLF ]─────────────────────────────────────────────────────────┤
- type: entity
  parent: RMCCommunicationsConsoleBase
  id: RMCTechTreeConsoleCLF
  name: CLF tech tree console
  description: A CLF tech console used to make tech purchases for CLF.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: techweb
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.TechControlConsoleUI.Key
  - type: UserInterface
    interfaces:
      enum.TechControlConsoleUI.Key:
        type: TechControlConsoleBui
  - type: TechControlConsole
    team: clf
  # dynamic so the cell can drag it, which also let IED blasts fling it out of the camp for the round
  - type: CMUExplosionImmovable
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
