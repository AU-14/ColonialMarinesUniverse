# LACN versions of the support roles' starting gear, used in place of the standard sets when LACN is the platoon
# (platoon startingGearJobOverrides). Clothing matches what the LACN engineering, requisitions and medical racks hand
# out; everything else (ID, headset, stamps, medical kit) is the same as the standard set.

# Engineering technician
- type: startingGear
  id: CMUGearLACNGOVFOREngineeringTech
  equipment:
    id: AU14IDCardGOVFOREngineeringTech
    ears: CMUHeadsetGovforMarineAuxiliary
    ears2: RMCM5CameraGear
    jumpsuit: CMULACNEngineerJumpsuit
    head: CMULACNHelmetEngineer
    outerClothing: CMULACNLogisticsVest
    gloves: CMULACNGlovesWhite
    shoes: CMULACNBootsWhiteFilled

- type: startingGear
  id: CMUGearLACNOPFOREngineeringTech
  equipment:
    id: AU14IDCardOPFOREngineeringTech
    ears: CMUHeadsetOpforMarineAuxiliary
    ears2: RMCM5CameraGear
    jumpsuit: CMULACNEngineerJumpsuit
    head: CMULACNHelmetEngineer
    outerClothing: CMULACNLogisticsVest
    gloves: CMULACNGlovesWhite
    shoes: CMULACNBootsWhiteFilled

# Auxiliary (logistics) technician: requisitions gear
