# The powder of the grinder (and of the electric ore line) is smelted too: eight powders make an ingot, so one ore, which gives three
# powders, comes to three eighths of an ingot where raw ore gives a quarter. The electric blast furnace does it in six.

- type: cmuSteamSmeltRecipe
  id: RUMCSteamSmeltPowderIron
  shape: ingots
  inputs:
    RUMCIronPowder: 24
  result: RUMCIronIngot
  resultAmount: 3
  duration: 12
  slag: 15

