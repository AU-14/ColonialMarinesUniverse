# What the steam smelter makes. It has no recipes of its own: ore for three ingots (four pieces of ore to an ingot, as in the crucible),
# a mold for three ingots in the mold slot, and it makes three ingots and leaves fifteen of slag.

- type: cmuSteamSmeltRecipe
  id: RUMCSteamSmeltIron
  shape: ingots
  inputs:
    RUMCIronOre: 12
  result: RUMCIronIngot
  resultAmount: 3
  duration: 12
  slag: 15

