    the unused biomass_turbine-on resource has three .1-second frames, but no active machinery state or animation
    is implemented here. Original source design and pixel crops are CC-BY-SA-3.0, cmss13 commit 0525b5ada7da1afcd9b260e76d5fea01500d9c8d
