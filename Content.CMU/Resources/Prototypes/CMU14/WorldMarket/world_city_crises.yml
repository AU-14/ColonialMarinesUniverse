# The troubles that a city of the world map can fall into (see WorldCrisisPrototype). Every faction loses some of its favour in the city if one ends with nothing done; what is done against
# them is in world_city_actions.yml.

- type: worldCityCrisis
  id: RUMCCrisisEpidemic
  name: rumc-crisis-epidemic-name
  description: rumc-crisis-epidemic-desc
  durationSeconds: 300
  weight: 1.2
  penalty: 6

