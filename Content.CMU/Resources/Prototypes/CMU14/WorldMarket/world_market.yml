- type: tradeContract
  id: RUMCTradeContractArms
  company: rumc-trade-company-arms
  category: rumc-trade-category-munitions
  description: rumc-trade-contract-arms-desc
  color: "#c0584a"
  levelPoints:
  - 250
  - 1200
  goods:
  - stack: RUMCSaltpeterPowder
    sell: 3
  - stack: RUMCSulfurPowder
    sell: 3
  - stack: RUMCPhosphorusPowder
    sell: 4
  - stack: RUMCLeadIngot
    sell: 5
  - stack: CMSteel
    buy: 360
    count: 10
    level: 1
  - stack: RUMCIronRod
    buy: 240
    count: 20
    level: 2

- type: entity
  parent: BaseItem
  id: RUMCTradeContractArms
  name: arms contract
  description: A contract with the arms house for powder and metal. Put it into a trade platform to sell it saltpeter, sulfur, phosphorus and lead, and to buy steel and rods of it.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      color: "#c0584a"
    - state: paper_words
  - type: Item
    size: Tiny
  - type: TradeContract
    contract: RUMCTradeContractArms
