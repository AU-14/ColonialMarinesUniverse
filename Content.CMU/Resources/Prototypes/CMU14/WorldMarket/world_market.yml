# The world outside the colony: the indices of the prices, and the events that shake them.
# Everything here is a table; the numbers are shaken by the system of the world market (Server/WorldMarket).

- type: worldMarketCategory
  id: metals
  name: rumc-world-index-metals
  color: "#9aa3ad"
  volatility: 1.3
  contracts:
  - RUMCTradeContractMetals
  - RUMCTradeContractSheets

- type: worldMarketCategory
  id: fuel
  name: rumc-world-index-fuel
  color: "#e0a050"
  volatility: 1.6
  contracts:
  - RUMCTradeContractFuel

- type: worldMarketCategory
  id: gems
  name: rumc-world-index-gems
  color: "#7ac4e0"
  volatility: 1.8
  contracts:
  - RUMCTradeContractGems

- type: worldMarketCategory
  id: weapons
  name: rumc-world-index-weapons
  color: "#d9503f"
  volatility: 1.5
  contracts:
  - RUMCTradeContractArms

- type: worldMarketEvent
  id: RUMCEventMineClosed
  headline: rumc-world-event-MineClosed
  weight: 1.0
  durationSeconds: 240
  shifts:
    metals: 12
    gems: 6

