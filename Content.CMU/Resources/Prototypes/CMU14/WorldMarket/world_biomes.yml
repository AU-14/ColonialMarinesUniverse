# The biomes of the world map (see WorldBiomePrototype). The globe cuts the surface into cells, and every cell is of one of these; the colour is how the cell is painted, the description
# is what the console says when the cell is picked. Which cell is which is decided in the drawing of the globe (GlobeControl.Classify): by the latitude, the moisture and the height.

