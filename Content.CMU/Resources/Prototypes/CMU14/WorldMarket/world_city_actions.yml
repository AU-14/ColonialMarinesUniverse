# What an ambassador can do for a city of the world map (see WorldCityActionPrototype), paid from the budget of the console. minInfluence is the favour of the faction in the city that it
# takes; buildSeconds is how long it is built, effectSeconds how long it stands afterwards (nothing: for good); incomePerMinute is what it brings to the budget of the faction.

# ---- the favour that anybody can win

- type: worldCityAction
  id: RUMCActionFestival
  name: rumc-action-festival-name
  description: rumc-action-festival-desc
  order: 10
  cost: 120
  influence: 4
  effectSeconds: 300

- type: worldCityAction
  id: RUMCActionWater
  name: rumc-action-water-name
  description: rumc-action-water-desc
  order: 20
  cost: 300
  influence: 8
  buildSeconds: 60
  effectSeconds: 1200
  protects:
  - RUMCCrisisEpidemic
  - RUMCCrisisDrought
  resolves:
  - RUMCCrisisDrought

