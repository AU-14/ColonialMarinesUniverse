# The other objects of the world map besides the cities (see WorldCityPrototype, site): a few of them are taken at random in every round and put on the land. The factions win the favour of
# them, build on them and do harm to one another in them like in the cities; a site is joined to the nearest city by a trail. A deposit makes what is built on it bring in twice as much.

- type: worldCity
  id: RUMCSiteDeepMine
  site: true
  name: rumc-site-deepmine-name
  description: rumc-site-deepmine-desc
  color: "#e0a050"
  capabilities:
  - Deposit
  giftCost: 250

