#box flare

- type: entity
  abstract: true
  parent: BaseItem
  id: RuMCPackFlareBase
  name: RSP flare pack
  description: A packet of eight RSP signal flares. Standard for UPP.
  components:
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - RuMCFlarePack
  - type: CMItemSlots
    count: 8
    slot:
      name: Flare
      whitelist:
        tags:
        - RuMCFlare
  - type: Sprite
    sprite: _RuMC14/Objects/Misc/flares.rsi
    layers:
    - state: rsp_open
      map: [ "emptyLayer" ]
    - state: rsp
      map: [ "fullLayer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CMItemSlotsLayers.Fill:
        fullLayer:
          Empty: { visible: false }
          Low: { visible: true }
          Medium: { visible: true }
          High: { visible: true }
          Full: { visible: true }
        emptyLayer:
          Empty: { visible: true }
          Low: { visible: false }
          Medium: { visible: false }
          High: { visible: false }
          Full: { visible: false }

- type: entity
  parent: RuMCPackFlareBase
  id: RuMCPackFlareWhite
  name: RSP white flare pack
  description: A packet of eight RSP signal flares. Standard for UPP.
  suffix: White, Filled
  components:
  - type: Tag
    tags:
    - RuMCFlarePack
    - RuMCPackFlareWhite
  - type: CMItemSlots
    startingItem: RuMCFlareWhite

- type: entity
  parent: RuMCPackFlareBase
  id: RuMCPackFlareRed
  name: GRACH flare pack
  description: A pack of eight GRACH flares. The flyer resembles an RSP in shape, but is made of metal parts. Standard for UPP.
  suffix: Red, Filled
  components:
  - type: Tag
    tags:
    - RuMCFlarePack
    - RuMCPackFlareRed
  - type: Sprite
    sprite: _RuMC14/Objects/Misc/flares.rsi
    layers:
    - state: rsp_open
      map: [ "emptyLayer" ]
    - state: cas_rsp
      map: [ "fullLayer" ]
  - type: CMItemSlots
    startingItem: RuMCFlareRedCAS

- type: entity
  parent: RuMCPackFlareBase
  id: RuMCPackFlareGreen
  suffix: Green, Filled
  components:
  - type: Tag
    tags:
    - RuMCFlarePack
    - RuMCPackFlareGreen
  - type: CMItemSlots
    startingItem: RuMCFlareGreen

