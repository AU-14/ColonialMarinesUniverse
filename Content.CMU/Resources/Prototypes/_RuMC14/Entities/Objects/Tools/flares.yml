- type: entity
  parent: CMFlare
  id: RuMCFlareWhite
  name: RSP-1 signal flare
  description: A standard-issue UPP signal flare. Pull the cord, and it burns with a bright white light. Used for illumination and marking positions.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 1.0
        friction: 0.2
  - type: Tag
    tags:
    - RuMCFlare
    - RuMCFlareWhite
  - type: ExpendableLight
    spentName: spent RSP-1 flare
    spentDesc: A used signal flare. The casing is still warm.
    glowDuration: 550
    fadeOutDuration: 30
    iconStateSpent: flare_spent
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    litSound:
      path: /Audio/_RMC14/Machines/flare_activate_2.ogg
      params:
        variation: 0.08
    loopedSound: /Audio/Items/Flare/flare_burn.ogg
  - type: Sprite
    sprite: _RuMC14/Objects/Misc/flares.rsi
    layers:
      - map: [ "enum.ExpendableLightVisualLayers.Base" ]
        state: flare
      - map: [ "enum.ExpendableLightVisualLayers.Glow" ]
        state: flare_flame
        color: "#F5E6C8"
        visible: false
      - map: [ "enum.ExpendableLightVisualLayers.Overlay" ]
        state: overlay
  - type: Icon
    sprite: _RuMC14/Objects/Misc/flares.rsi
    state: icon
  - type: Item
    size: Small
    heldPrefix: unlit
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#FDF5E6"
    radius: 1.5
    energy: 6.0
    netsync: false
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: turn_on
        maxDuration: 5.0
        startValue: 2.5
        endValue: 8.0
      - !type:FadeBehaviour
        id: fade_out
        maxDuration: 520
        startValue: 8.0
        endValue: 1.0
  - type: CartridgeAmmo
    deleteOnSpawn: true
    proto: RuMCFlareWhiteBullet
  - type: RMCAirProjectile
    prototype: RuMCAirFlareWhite

- type: entity
  parent: RuMCFlareWhite
  id: RuMCFlareRedCAS
  name: RSP-17 signal flare
  description: A UPP signal flare with a bright red flame. Used to indicate targets or request support. Visible from long distances.
  components:
  - type: Tag
    tags:
    - RuMCFlare
    - RuMCFlareRedCAS
  - type: Sprite
    sprite: _RuMC14/Objects/Misc/flares.rsi
    layers:
      - map: [ "enum.ExpendableLightVisualLayers.Base" ]
        state: cas_flare
      - map: [ "enum.ExpendableLightVisualLayers.Glow" ]
        state: cas_flare_flame
        color: "#FFA7A7"
        visible: false
      - map: [ "enum.ExpendableLightVisualLayers.Overlay" ]
        state: cas_overlay
  - type: Icon
    sprite: _RuMC14/Objects/Misc/flares.rsi
    state: flare
    inhandVisuals:
      left:
      - state: cas_inhand-left
      right:
      - state: cas_inhand-right
  - type: PointLight
    color: "#FFCCCC"
  - type: FlareSignal
  - type: ExpendableLight
    spentName: spent RSP-17 flare
    spentDesc: A used signal flare. The casing is still warm.
    iconStateSpent: cas_flare_spent
    glowDuration: 180
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour # faster then base flares
      id: turn_on
      maxDuration: 5.0
      startValue: 2.5
      endValue: 7.0
    - !type:FadeBehaviour # burns out slower
      id: fade_out
      maxDuration: 150
      startValue: 7.0
      endValue: 1.0
  - type: CartridgeAmmo
    proto: RuMCFlareRedCASBullet
  - type: RMCAirProjectile
    prototype: RuMCAirFlareRedCAS
  - type: RMCStaticZoomLevel
  - type: Eye
    zoom: 0.5, 0.5
    drawFov: false

  #_RuMC14/Objects/Misc/flares.rsi
  #FFA7A7
  #FFCCCC

