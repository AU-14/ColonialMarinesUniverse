- type: entity
  name: hardtack biscuit
  parent: CMFoodBase
  id: RuMCFoodGallet
  description: A dense, dry biscuit that could outlast any war. Best soaked in tea or water before consumption.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: gallet
  - type: Edible
    transferAmount: 3
  - type: Solution
    id: food
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 7
  - type: FlavorProfile
    flavors:
    - bread

- type: entity
  name: salted fish
  parent: CMFoodBase
  id: RuMCFoodFish
  description: It's stone-like to the touch. Knead it before use, or risk breaking a tooth.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: fish
  - type: Edible
    transferAmount: 1
  - type: Solution
    id: food
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: Protein
        Quantity: 10
  - type: FlavorProfile
    flavors:
    - garlic
    - fishy
    - salty

- type: entity
  name: meat pie
  parent: CMFoodBase
  id: RuMCFoodPie
  description: A simple proletarian pie filled with meat and vegetables. Nothing fancy, but it fills the stomach.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: pie
  - type: Edible
    transferAmount: 5
  - type: Solution
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Protein
        Quantity: 5
  - type: FlavorProfile
    flavors:
    - bread
    - vegetables
    - meaty
    - garlic
    - salty

- type: entity
  name: canned chicken
  parent: CMFoodBase
  id: RuMCFoodChicken
  description: Tender canned chicken in its own broth. Not bad for field rations, though the texture leaves something to be desired.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: chicken
  - type: Edible
    transferAmount: 5
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Protein
        Quantity: 10
  - type: FlavorProfile
    flavors:
    - garlic
    - chicken
    - salty

- type: entity
  name: mashed potatoes
  parent: CMFoodBase
  id: RuMCFoodMashedPotatoes
  description: Instant mashed potatoes. Add water, stir, and enjoy the taste of the frontline.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: mashed_potatoes
  - type: Edible
    transferAmount: 5
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Nutriment
        Quantity: 19
      - ReagentId: Protein
        Quantity: 1
  - type: FlavorProfile
    flavors:
    - potatoes
    - salty

