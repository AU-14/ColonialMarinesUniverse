- type: entity
  name: hematogen bar
  parent: CMFoodBase
  id: RuMCFoodHematogen
  description: A nutrient-rich bar based on bovine blood. An acquired taste, but excellent for restoring strength in the field.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/irp_contents.rsi
    state: hematogen
  - type: Edible
    transferAmount: 6
  - type: Solution
    id: food
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 12
      - ReagentId: RMCPeanutButter
        Quantity: 1
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 7
  - type: FlavorProfile
    flavors:
    - nutty
    - sweet
    - chocolate
