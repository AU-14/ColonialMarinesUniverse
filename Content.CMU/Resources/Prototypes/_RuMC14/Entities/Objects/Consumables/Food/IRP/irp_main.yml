- type: entity
  abstract: true
  parent: FoodTinBase
  id: RuMCFoodTinIRP
  name: тушёнка
  description: Обычная тушёнка, наиболее любимый и распространённый консервированный продукт среди военных и обычных гражданских.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/Tin/2condensed_milk.rsi
  - type: Openable
    openableByHand: false
  - type: FlavorProfile
    flavors:
    - nutty
    - bread
    - rice
    - bacon
    - vegetables
    - meaty
    - tomato
    - cheesy
    - chocolate
    - sweet
    - creamy
    - garlic
    - fishy
    - egg
    - bitter
    - chicken
    - potatoes
    - salty
    - fruity
  - type: Solution
    id: food
    solution:
      maxVol: 30
      reagents:
      - ReagentId: Nutriment
        Quantity: 15
      - ReagentId: Protein
        Quantity: 10
  - type: Edible
    transferAmount: 10
    trash:
    - RuMCFoodTinIRPTrash


- type: entity
  abstract: true
  parent: FoodTinBaseTrash
  id: RuMCFoodTinIRPTrash
  name: empty
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Consulable/Food/Tin/2condensed_milk.rsi

