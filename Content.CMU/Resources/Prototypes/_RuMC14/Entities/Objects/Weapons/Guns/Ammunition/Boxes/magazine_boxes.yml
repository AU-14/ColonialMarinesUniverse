- type: entity
  abstract: true
  parent: RMCBoxMagazineRifleBase
  id: RuMCBoxMagazineRifleBase
  name: generic magazine box (? x ?)
  components:
  - type: Construction
    graph: RMCBoxMagazine
    node: RuMCBoxMagazineRifleAK4047Empty
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Boxes/modular_boxes.rsi
    layers:
    - state: rifle_box
      color: "#6d7b56"
    - state: rifle_ammo_full_mags_base
      map: [ "enum.CMItemSlotsLayers.Fill" ]
    - state: rifle_ammo_full_mags_color
      map: [ "enum.CMItemSlotsLayers2.Fill" ]
      color: "#ffc000"
    - state: rifle_box_47
      sprite: _RuMC14/Objects/Weapons/Guns/Ammunition/Boxes/UPP_Boxes.rsi
      color: "#f5e6a3"
    - state: star #Star.
      sprite: _RuMC14/Objects/Weapons/Guns/Ammunition/Boxes/UPP_Boxes.rsi
      color: "#c62828"
    - state: rifle_box_marking
      sprite: _RuMC14/Objects/Weapons/Guns/Ammunition/Boxes/UPP_Boxes.rsi
      color: "#8a9ba8"
    - state: rifle_lid
      map: [ "lid" ]
      color: "#6d7b56"
    - state: rifle_lid_marking
      map: [ "lid_marking" ]
      color: "#8a9ba8"

