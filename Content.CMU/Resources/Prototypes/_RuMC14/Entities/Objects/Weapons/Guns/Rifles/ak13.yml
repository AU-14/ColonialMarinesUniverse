- type: entity
  parent: RMCWeaponRifleAK4047
  name: AK-13 assault rifle
  id: RuMCWeaponRifleAK13
  description: The UPP assault rifle was developed for advanced assault units. Many U.S. Marines dislike it because it is superior to the M41A models.
  components:
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
  - type: ItemMapper
    mapLayers:
      mag-0:
        whitelist:
          tags:
          - RMCMagazineRifleAK4047
          - RMCMagazineRifleAK4047AP
          - RMCMagazineRifleAK4047Incendiary
          - RMCMagazineRifleAK4047HEAP
      mag-1:
        whitelist:
          tags:
          - RuMCMagazineRifleAK4047bakelite
          - RuMCMagazineRifleAK4047APbakelite
      mag-2:
        whitelist:
          tags:
          - RuMCMagazineRifleAK4047buben
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AK13.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    shotsPerBurst: 3
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m60.ogg
      params:
        volume: -4
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 20
    baseFireRate: 3.75
    burstScatterMult: 1
    modifiers:
      Burst:
        fireDelay: 0.065
        maxScatterModifier: 17
        useBurstScatterMult: true
        shotsToMaxScatter: 3
      FullAuto:
        maxScatterModifier: 15
        useBurstScatterMult: true
        shotsToMaxScatter: 4
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.3
    accuracyMultiplierUnwielded: 0.6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleAK4047
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleAK4047
          - RMCMagazineRifleAK4047AP
          - RMCMagazineRifleAK4047Incendiary
          - RMCMagazineRifleAK4047HEAP
          - RuMCMagazineRifleAK4047bakelite
          - RuMCMagazineRifleAK4047APbakelite
          - RuMCMagazineRifleAK4047buben
  - type: GunDamageModifier
    multiplier: 1.1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        locked: true
        startingAttachable: RuMCAttachmentAK13StockCollapsible
        whitelist:
          tags:
          - RuMCAttachmentPP13MStockCollapsible
          - RuMCAttachmentAK13StockCollapsible
          - RuMCAttachmentPKPStockCollapsible
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentVerticalGrip
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlamer
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.7, 0
      rmc-aslot-rail: -0.3, 0.09
      rmc-aslot-stock: -0.5655, -0.04
      rmc-aslot-underbarrel: 0.25, -0.33
  - type: Tag
    tags:
    - RMCWeaponRifleAK4047
    - RuMCWeaponRifleAK13
  - type: WieldDelay
    baseDelay: 0.35


