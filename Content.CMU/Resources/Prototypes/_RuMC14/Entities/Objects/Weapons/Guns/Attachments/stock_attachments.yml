- type: entity
  parent: RMCAttachmentM54CStockCollapsible
  id: RuMCAttachmentAK13StockCollapsible
  name: AK13 folding stock
  description: The standard back end of any gun starting with 'AK'.
  components:
  - type: AttachableVisuals
    suffix: ""
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Attachments/Stock/rumc_NewK_stock.rsi
    state: stock_Light
  - type: AttachableToggleable
    active: true
    doAfterBreakOnMove: false
    doAfter: 0.5
    icon:
      sprite: _RuMC14/Objects/Weapons/Guns/Attachments/Stock/rumc_NewK_stock.rsi
      state: stock_Light
    iconActive:
      sprite: _RuMC14/Objects/Weapons/Guns/Attachments/Stock/rumc_NewK_stock.rsi
      state: stock_Light-on
    actionName: Toggle AK13 Folding Stock
  - type: Tag
    tags:
    - RMCAttachmentStock
    - RuMCAttachmentAK13StockCollapsible

