- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: PKP-MS "SIBIR"
  id: RuMCMachineGunPKP_MS
  description: Effective at all distances, but requires the right stance.
  components:
  - type: Item
    size: Huge
  - type: Appearance
  - type: Corrodible
    isCorrodible: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/PKP_inhands.rsi
    layers:
    - state: base
      sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/PKP.rsi
    - state: bolt-open
      sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/PKP.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/PKP.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/PKP_inhands.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m60.ogg
      params:
        volume: -4
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - FullAuto
    recoilUnwielded: 5
    scatterWielded: 10
    scatterUnwielded: 22
    baseFireRate: 5
    modifiers:
      FullAuto:
        maxScatterModifier: 15
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 25
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RuMCMagazinePKP_MS
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RuMCMagazinePKP_MS
  - type: GunDamageModifier
    multiplier: 1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        locked: true
        startingAttachable: RuMCAttachmentPKPStockCollapsible
        whitelist:
          tags:
          - RuMCAttachmentPP13MStockCollapsible
          - RuMCAttachmentAK13StockCollapsible
          - RuMCAttachmentPKPStockCollapsible
      rmc-aslot-underbarrel:
        #startingAttachable: RMCAttachmentBipod
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentVerticalGrip
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlamer
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0
      rmc-aslot-rail: -0.42, 0.12
      rmc-aslot-stock: -0.65, 0
      rmc-aslot-underbarrel: 0.15, -0.29
  - type: Tag
    tags:
    - RuMCWeaponLMGPKP_MS
    - RMCWeaponLMGQYJ72
  - type: WieldDelay
    baseDelay: 1.9
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: GunRequiresWield

