# Magazines

- type: entity
  parent: CMMagazineRifleBase
  id: RuMCMagazinePKP_MS
  name: PKP-MS box magazine (7.62x54R)
  description: A 150-round belt-fed box magazine for the PKP-MS general-purpose machine gun.
  components:
  - type: Tag
    tags:
    - RuMCMagazinePKP_MS
    - RMCMagazineLMGQYJ72
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RuMCCartridge762x54R
    proto: RuMCCartridge762x54R
    capacity: 200
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    #- state: ammo_band
    #  color: "#e5b13c"
  - type: Clothing
    slots:
    - suitStorage
  - type: Item
    size: Large

- type: entity
  parent: RuMCMagazinePKP_MS
  id: RuMCMagazinePKP_MSTracer
  name: PKP-MS box magazine (7.62x54R Tracer)
  description: A 150-round belt-fed tracer box magazine for the PKP-MS general-purpose machine gun.
  components:
  - type: Tag
    tags:
    - RuMCMagazinePKP_MS
    - RMCMagazineLMGQYJ72
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RuMCCartridge762x54RTracer
      - RuMCCartridge762x54R
    proto: RuMCCartridge762x54RTracer
    capacity: 200
    deleteWhenEmpty: false
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/LMGs/PKP-MS/mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#1F951F"
  - type: Clothing
    slots:
    - suitStorage
  - type: Item
    size: Large

#ammo
- type: entity
  parent: RMCCartridgeRifleAR10
  id: RuMCCartridge762x54R
  name: cartridge (7.62x54mmR)
  description: A 7.62x54mmR cartridge
  components:
  - type: Tag
    tags:
    - Cartridge
    - RuMCCartridge762x54R
  - type: CartridgeAmmo
    proto: RMCBulletLMGQYJ72

- type: entity
  parent: RMCBaseBullet
  id: RuMCBullet762x54R
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
  - type: CMArmorPiercing
    amount: 15
  - type: RMCProjectileAccuracy
    accuracy: 95
    thresholds:
    - range: 14
      falloff: 10

