- type: entity
  abstract: true
  parent: RMCBoxBulletsBase
  id: RuMCBoxBulletsBase
  name: rifle ammunition box (???)
  description: An unknown ammunition box. It comes with a leather strap allowing someone to wear it on their back.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Boxes/modular_boxes.rsi
    layers:
    - state: rifle_box
      color: "#6d7b56"
    - state: rifle_box_marking
      color: "#8a9ba8"
    - state: rifle_box_generic
      color: "#f5e6a3"
    - state: rifle_ammo_full_rounds_base
      map: [ "enum.BulletBoxLayers.Fill" ]
    - state: rifle_ammo_full_rounds_color
      map: [ "enum.BulletBoxLayers2.Fill" ]
      color: "#0000ff"
    - state: star #Star.
      sprite: _RuMC14/Objects/Weapons/Guns/Ammunition/Boxes/UPP_Boxes.rsi
      color: "#c62828"
    - type: Appearance
  - type: RMCUnfoldCardboard
    spawns:
    - id: RMCSheetCardboard1
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Clothing
    quickEquip: false
    slots:
    - Back
  - type: DropOnUseInHand
  - type: BulletBox
  - type: DeployableItem
    leftClickPickup: true
  - type: Tag
    tags:
    - RMCAmmoBox



