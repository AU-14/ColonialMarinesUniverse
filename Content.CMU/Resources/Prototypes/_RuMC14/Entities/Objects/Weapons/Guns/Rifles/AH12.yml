- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: AH-12
  id: RuMCRifleAH12
  description: This is not just a machine gun. It is a tool for those who are used to ending conversations before they begin. Massive, rough, designed for the unique 12.7×55 cartridge, it does not require a queue. One shot breaks through a door. A second shot demolishes a wall.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AH12/AH12_inhands.rsi
    layers:
    - state: base
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AH12/AH12.rsi
    - state: bolt-open
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AH12/AH12.rsi
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AH12/AH12.rsi
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RuMC14/Objects/Weapons/Guns/Rifles/AH12/AH12_inhands.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/_RuMC14/Weapons/Guns/Gunshots/gun_UTES-C.ogg
      params:
        volume: -1
        variation: 0.05
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 4
    scatterUnwielded: 11
    baseFireRate: 4
    modifiers:
      FullAuto:
        maxScatterModifier: 15
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 5
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
    accuracyMultiplierUnwielded: 0.5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RuMCMagazineAH12Large
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RuMCMagazineAH12
  - type: GunDamageModifier
    multiplier: 1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        locked: true
        startingAttachable: RuMCAttachmentSuppressorAH12
        whitelist:
          tags:
          - RuMCAttachmentSuppressorAH
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentVerticalGrip
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0, 0.1
      rmc-aslot-underbarrel: 0.28, -0.3
      rmc-aslot-barrel: 0.4355, 0.0345931415
      rmc-aslot-stock: 0.2, -0.2
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: Tag
    tags:
    - RuMCRifleAH12
  - type: Wieldable
  - type: WieldableSpeedModifiers
    base: 0.75
    light: 0.75
    medium: 0.8
    heavy: 0.75
  - type: WieldDelay
    baseDelay: 0.5
  - type: GunRequiresWield

- type: entity
  parent: RuMCRifleAH12
  id: RuMCRifleAH12Tactical
  suffix: Tactical
  components:
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        locked: true
        startingAttachable: RuMCAttachmentSuppressorAH12
        whitelist:
          tags:
          - RuMCAttachmentSuppressorAH
      rmc-aslot-rail:
        startingAttachable: AU14AttachmentTwoPointSling
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        startingAttachable: RMCAttachmentAngledGrip
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentVerticalGrip

