  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/belt/revolver.rsi
    layers:
    - state: icon
    - sprite: _RMC14/Objects/Weapons/Guns/gun_underlays.rsi
      state: webley # TODO RMC14 per-gun underlay
      map: [ "enum.CMHolsterLayers.Fill" ]
      visible: false
    - sprite: _RuMC14/Clothing/UPP/belt/revolver.rsi
      state: icon-front
    - state: half
      map: [ "openLayer" ]
    - state: full
      map: [ "closedLayer" ]
  - type: Clothing
    sprite: _RuMC14/Clothing/UPP/belt/revolver.rsi
    slots:
    - suitStorage
    - belt
  - type: Storage # holds up to 6 mags plus gun
