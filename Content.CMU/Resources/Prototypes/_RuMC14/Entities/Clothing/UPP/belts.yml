- type: entity
  parent: CMBeltMarine
  id: RuMCUPPNavalInfantryBeltRevolver
  name: RD-44-Revolver
  description: This bag, designed for military police and UPP officers, contains quick-loading devices and a revolver. It allows for quick reloading of weapons in stressful situations where every second counts.
