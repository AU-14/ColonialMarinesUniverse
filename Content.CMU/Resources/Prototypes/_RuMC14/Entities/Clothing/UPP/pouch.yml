- type: entity
  parent: RMCPouchMagazine
  id: RuMCUPPPouchMagazine
  name: PM-74-Magazine
  description: A compact, reinforced pouch for standard assault rifle magazines. Designed for quick access and reliable retention during high-mobility operations. Standard issue for all UPP riflemen.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/medium_ammo_mag.rsi

- type: entity
  parent: RuMCUPPPouchMagazine
  id: RuMCUPPPouchMagazineLarge
  name: PM-74-Magazine modified
  description: An extended variant of the PM-74. Carries a heavy combat load of rifle magazines. Used by automatic riflemen and troops expecting prolonged engagements.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_ammo_mag.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,1

- type: entity
  parent: RMCPouchConstruction
  id: RuMCUPPPouchConstruction
  name: PM-18-Construction
  description: The engineer's universal bag. It is equipped with loops and pockets for glass sheets, metal rods, barbed wire, cable coils, and empty sandbags. It also has two external hooks for trench tools or interchangeable lighting devices.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/construction.rsi

- type: entity
  parent: RMCPouchBayonet
  id: RuMCUPPPouchBayonet
  name: PM-6-Bayonet
  description: A secure mount for a bayonet or large combat knife. Provides access to the blade while securely holding it in place, ensuring that it does not get lost during movement. The command still does not understand why troops need these pouches.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/bayonet.rsi

- type: entity
  parent: RMCPouchFuelTank
  id: RuMCUPPPouchFuelTank
  name: PM-12-Fuel
  description: A specialized harness with two ring straps designed to securely carry a napalm tank. Handle with care. A single leak could turn a soldier into a torch.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/fueltank.rsi

- type: entity
  parent: RMCPouchGeneralLarge
  id: RuMCUPPPouchGeneralLarge
  name: PM-47-General
  description: A large, general-purpose pouch. Used for carrying a variety of different-sized items, from medical supplies to extra rations. Not designed for a specific role, but useful for almost any.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_drop.rsi

- type: entity
  parent: RMCPouchExplosive
  id: RuMCUPPPouchExplosive
  name: PM-54-Explosive
  description: A robust pouch with reinforced stitching and a secure flap. Designed to safely carry grenades, plastic explosives, and mine components. The universal choice for sappers and demolition experts.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_explosive.rsi

- type: entity
  parent: RMCPouchMagazinePistolLarge
  id: RuMCUPPPouchMagazinePistolLarge
  name: PM-18-Pistol modified
  description: An oversized pistol magazine pouch, often used by special forces for high-capacity sidearms or to carry additional speedloaders for heavy revolvers. Bulky but effective.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_pistol_mag.rsi

- type: entity
  parent: RMCPouchMagazinePistol
  id: RuMCUPPPouchMagazinePistol
  name: PM-18-Pistol
  description: A lightweight pouch for sidearm magazines and revolver speedloaders. Preferred by officers, vehicle crews, and anyone who values having a backup weapon fully loaded. Keeps its contents secure without unnecessary bulk.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/medium_pistol_mag.rsi

- type: entity
  parent: RMCPouchShotgunLarge
  id: RuMCUPPPouchShotgunLarge
  name: PM-23-Shotgun modified
  description: An expanded shotgun shell pouch. Carries a significant ammunition load for sustained close-quarters combat. Essential for those clearing rooms or holding tight corners.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/large_shotshells.rsi

- type: entity
  parent: RMCPouchShotgun
  id: RuMCUPPPouchShotgun
  name: PM-23-Shotgun
  description: Designed for 12-gauge and 23mm shotgun shells. Holds enough rounds for a few intense exchanges at close quarters. A must-have for breachers and pointmen.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/medium_shotshells.rsi
    layers:
    - state: icon
    - state: half
      visible: false
    - state: full
      visible: false

- type: entity
  parent: RMCPouchTools
  id: RuMCUPPPouchTools
  name: PM-66-Tools
  description: A dedicated pouch for maintenance tools. Designed to hold screwdrivers, wrenches, cable coils, and a detachable hook for a light replacer. The mark of a field engineer.
  components:
  - type: Sprite
    sprite: _RuMC14/Clothing/UPP/pouches/tools.rsi

- type: entity
  parent: RMCPouchDrumPMC
  id: RuMCUPPPouchDrum
  name: PM-27-Drum
  description: A heavy, reinforced pouch specifically designed to carry bulky drum magazines. Provides secure transport for large-capacity magazines, preventing them from clattering or catching on obstacles.
  components:
  - type: Tag
