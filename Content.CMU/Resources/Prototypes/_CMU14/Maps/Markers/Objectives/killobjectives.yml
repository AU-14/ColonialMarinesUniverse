- type: entity
  name: Kill enemies Objective
  parent: MarkerBase
  id: killteamobjective
  components:
  - type: Sprite
    state: red
  - type: CMUObjective
    id: killteamobjbasic
    factionNeutral: true
    allowedPresets:
    - ForceOnForce
    factions:
    - opfor
    - govfor
    repeating: true
    objectiveLevel: 1
    customPoints: 3
    maxRepeatable: 1
    objectiveDescription: "Kill the enemy"
    nextTierObjective: destroy_mineable_solaris_steel
  - type: KillObjective
    factionToKill: govfor
    killCount: 2

