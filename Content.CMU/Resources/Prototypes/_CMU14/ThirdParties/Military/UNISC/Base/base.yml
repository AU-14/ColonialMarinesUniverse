# Equipment

- type: entity
  parent: [RMCMarineUniformBase, RMCAlternateFoldableUniformBase]
  id: AU14UNISCFatigues
  name: UNISC fatigues
  description: Standard-issue UNISC fatigues. They have shards of light Kevlar to help protect against stabbing weapons and bullets.
  components:
  - type: Sprite
    sprite: _AU14/Clothing/UNISC/uniscjumpsuit.rsi
  - type: UniformAccessoryHolder
    startingAccessories:
    - AU14UNISCArmband

- type: entity
  parent: RMCMarineHelmetBase
  id: AU14UNISCM11Helmet
  name: UNISC M11 Helmet
  description: A slightly fancier helmet for UNISC leadership. This one contains a small built-in camera and has cushioning to project your fragile brain.
  components:
  - type: Sprite
    sprite: _AU14/Clothing/UNISC/m11helmet.rsi
  - type: Clothing
    sprite: _AU14/Clothing/UNISC/m11helmet.rsi

- type: entity
  parent: RMCMarineHelmetBase
  id: AU14UNISCM10Helmet
  name: UNISC M10 Helmet
  description: Standard Issue Helmet used by UNISC. Provides modest protection from bullet and melee attacks at the head. It also has an inbuilt camera allowing for command staff to observe the squad's actions.
  components:
