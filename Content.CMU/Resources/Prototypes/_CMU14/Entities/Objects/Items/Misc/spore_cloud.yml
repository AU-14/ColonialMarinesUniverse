- type: entity
  id: CMUPathogenSporeCloud
  name: spore cloud
  description: A billowing cloud of infectious spores.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - MobMask
        layer:
        - MidImpassable
  - type: Sprite
    sprite: _CMU14/Effects/spore_cloud.rsi
    state: smoke
    color: "#8fbf5f"
  - type: TimedDespawn
    lifetime: 10
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: MycotoxinInjector
    mycotoxinPerSecond: 10
    timeBetweenInjects: 0.5
    embryoSpawn: CMU14XenoBloodburster
  - type: DeleteOnExplosion
