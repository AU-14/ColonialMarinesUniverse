- type: entity
  parent: RMCCrateExplosives
  id: RMCCrateM6HBruteRockets
  name: M6H-BRUTE breaching rocket crate (x6)
  components:
  - type: StorageFill
    contents:
    - id: RMCRocketM5510Brute
      amount: 6

- type: entity
  parent: CMBackpack
  id: RMCM271A2BruteLauncherRig
  name: M271A2 pattern launcher rig
  description: A specialized back harness for carrying the M6H-BRUTE breaching launcher and M5510 rockets.
  components:
  - type: Sprite
    sprite: _CMU14/Objects/Clothing/Back/Backpacks/Marines/brute_rig.rsi
    layers:
    - state: icon
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: Clothing
    sprite: _CMU14/Objects/Clothing/Back/Backpacks/Marines/brute_rig.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,15,1
    whitelist:
      tags:
      - RMCWeaponLauncherM6HBrute
      - RMCRocketAmmoM5510Brute
  - type: FixedItemSizeStorage
  - type: CMHolster
    whitelist:
      tags:
      - RMCWeaponLauncherM6HBrute
  - type: Item
    size: Large
  - type: Tag
    tags:
    - RMCM271A2BruteLauncherRig

- type: entity
  parent: RMCM271A2BruteLauncherRig
  id: RMCM271A2BruteLauncherRigFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: RMCWeaponLauncherM6HBrute
    - id: RMCRocketM5510Brute
      amount: 3

- type: entity
  parent: [ BaseWeaponLauncher, CMBaseWeaponGun, RMCBaseAttachableHolder ]
  id: RMCWeaponLauncherM6HBrute
  name: M6H-BRUTE
  description: A laser-guided breaching launcher designed to rip open walls and hardened structures with focused shockwaves.
  components:
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Guns/RocketLaunchers/m6h/m6h_inhands.rsi
    layers:
    - state: base
      sprite: _CMU14/Objects/Weapons/Guns/RocketLaunchers/m6h/m6h_icon.rsi
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    quickEquip: true
    slots:
    - suitStorage
    sprite: _CMU14/Objects/Weapons/Guns/RocketLaunchers/m6h/m6h_inhands.rsi
  - type: Gun
    fireRate: 0.83
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_rocketlauncher.ogg
    resetOnHandSelected: false
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - RMCRocketAmmoM5510Brute
    capacity: 1
    cycleable: true
    mayTransfer: false
    insertDelay: 6.0
    cycleDelay: 6.0
    proto: RMCRocketM5510Brute
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Cock/m5_ammo.ogg
  - type: Corrodible
    isCorrodible: false
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: Wieldable
  - type: GunRequiresWield
  - type: GunRequiresSkills
    skills:
      RMCSkillEngineer: 3
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: ShootAtFixedPoint
    shootArcProj: false
  - type: GunIFF
    enabled: true
  - type: RMCBruteLauncher
  - type: RMCBackblastOnShoot
  - type: TargetingLaser
    rsiPath: /Textures/_CMU14/Effects/beam_brute.rsi
    laserState: laser_beam_guided
    laserAlpha: 0.5
    gradualAlpha: true
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: WieldDelay
    baseDelay: 1.2
    preventFiring: true
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 15
  - type: IgnorePredictionHide
  - type: GunIgnorePrediction
  - type: AssistedReloadWeapon
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/explosive_mouse.rsi
      state: all
  - type: Item
    size: Huge
    storedSprite:
      sprite: _CMU14/Objects/Weapons/Guns/RocketLaunchers/m6h/m6h_icon.rsi
      state: icon
  - type: Tag
    tags:
    - RMCWeaponLauncherM6HBrute
  - type: RMCMagneticItem

- type: entity
  parent: BaseItem
  id: RMCRocketM5510Brute
  name: M5510 laser-guided rocket
  description: A breaching rocket tube compatible with the M6H-BRUTE launcher.
  components:
  - type: Tag
    tags:
    - RMCRocketAmmoM5510Brute
  - type: CartridgeAmmo
    proto: RMCProjectileM5510Brute
    deleteOnSpawn: true
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Guns/Ammunition/Explosives/m5510_brute.rsi
    layers:
    - state: brute_rocket
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Item
    size: Normal
  - type: Appearance
  - type: IgnorePredictionHide
  - type: AssistedReloadAmmo

- type: entity
  parent: RMCBaseProjectileRocket84mm
  id: RMCProjectileM5510Brute
  name: M5510 laser-guided rocket
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    deleteOnCollide: false
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 15
    maxFixedRange: 6
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Guns/Ammunition/Projectiles/m5510_brute.rsi
    layers:
    - state: brute
  - type: RMCProjectileAccuracy
    accuracy: 95
    thresholds:
    - range: 7
      falloff: 10
  - type: RMCBruteProjectile
  - type: RMCProjectileSkipXenos
  - type: IgnorePredictionHide

- type: entity
  parent: EffectSparks
  id: RMCBruteSparks
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: [ "enum.EffectLayers.Unshaded" ]
      sprite: _RMC14/Effects/effects.rsi
      state: sparks

- type: entity
  id: RMCBruteSmoke
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: [ "enum.EffectLayers.Unshaded" ]
      sprite: _RMC14/Effects/effects.rsi
      state: smoke
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer

- type: entity
  parent: RMCTileFire
  id: RMCTileFireBrute
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: green_4
  - type: PointLight
    color: "#069420"
  - type: RMCIgniteOnCollide
    maxStacks: 1
    intensity: 10
    duration: 1
    tileDamage:
      types:
        Heat: 0.5
    burnColor: "#00FF00"
  - type: TileFire
    id: RMCTileFireBrute
    duration: 1
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: green_1 }
          Two: { state: green_2 }
          Three: { state: green_3 }
          Four: { state: green_4 }

- type: Tag
  id: RMCM271A2BruteLauncherRig

- type: Tag
  id: RMCWeaponLauncherM6HBrute

- type: Tag
  id: RMCRocketAmmoM5510Brute
