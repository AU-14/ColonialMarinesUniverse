- type: entity
  parent: [ RMCBaseBreechloader, RMCBaseAttachableHolder ]
  name: Olympiets break action shotgun
  id: CMUWeaponShotgunOlympiets
  description: A limited production copy of the MOU53, this one can safely fire buckshot shells.
  components:
  - type: Sprite
    sprite: _AU14/Weapons/Guns/UPP/olympiets.rsi
  - type: Clothing
    sprite: _AU14/Weapons/Guns/UPP/olympiets.rsi
  - type: Tag
    tags:
    - CMUWeaponShotgunOlympiets
    - RMCWeaponShotgun
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_mou53.ogg
    shotsPerBurst: 1
  - type: Appearance
  - type: ShootUseDelay
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 9
    scatterUnwielded: 18
    baseFireRate: 4
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.5
  - type: BallisticAmmoProvider
    cycleable: true
    whitelist:
      tags:
      - RMCShellShotgunHeavyBuckshot
      - RMCShellShotgunHeavySlugs
      - RMCShellShotgunHeavyFlechette
      - RMCShellShotgunIncendiaryHeavyBuckshot
      - RMCShellShotgunHeavyBeanbag
    proto: RMCShellShotgunHeavyBuckshot
    capacity: 3 #It's a lovely triple barrel
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Reload/gun_mou_reload.ogg
  - type: RMCAmmoEject
    containerID: ballistic-ammo
    ejectSound:
      path: /Audio/_RMC14/Weapons/Guns/Reload/gun_mou_reload.ogg
  - type: UseDelay
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
    toggleDelay: 1.1
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-stock:
        whitelist:
          tags:
          - RMCAttachmentMOU53Stock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentLaserSight
          - RMCAttachmentExtinguisher
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.8, 0.06
      rmc-aslot-rail: -0.02, 0.15
      rmc-aslot-stock: -0.65, -0.18
      rmc-aslot-underbarrel: 0.5, -0.25

- type: Tag
  id: CMUWeaponShotgunOlympiets
