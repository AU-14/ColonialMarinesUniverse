- type: entity
  abstract: true
  parent: CMU14XenoPathogenBase
  id: CMU14XenoOvermindBase
  name: Overmind
  description: The mind that connects the Confluence. You are everywhere and nowhere.
  components:
  - type: GhostRole
    name: cmu-job-name-pathogen-overmind
  - type: Sprite
    sprite: _CMU14/Mobs/Xenonids/Pathogen/overmind.rsi
    noRot: true
    # Layer 0 - base body (incorporeal eye or manifested form)
    state: overmind_eye
    layers:
    - map: [ "enum.OvermindVisualLayers.Base" ]
      state: overmind_eye
    # Layer 1 - one-shot transition animation (appear / disappear)
    - map: [ "enum.OvermindVisualLayers.Transition" ]
      state: overmind_appear
      visible: false
    # Layer 2 - eye glow overlay (shown only in incorporeal mode)
    - map: [ "enum.OvermindVisualLayers.EyeGlow" ]
      state: overmind_eye
      visible: false
      shader: unshaded # keeps the glow bright regardless of lighting
    # Layer 3 - strengthened aura (shown only when manifested + strengthened)
    - map: [ "enum.OvermindVisualLayers.Strengthen" ]
      state: overmind_manifested
      visible: false
      shader: unshaded
  # Appearance component needed for the visualizer pipeline
  - type: Appearance
  # The new appearance-state tracker
  - type: CMUXenoOvermindAppearance
  - type: MobThresholds
    thresholds:
      0: Alive
      600: Critical
      700: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: Xeno
    role: CMU14JobPathogenOvermind
    tier: 3
    hudOffset: -0.1, 0.25
    emoteSounds: Pathogen
    actionIds:
    - CMU14ActionXenoPathogenRest
    - CMU14ActionXenoPathogenWatch
    - CMU14ActionXenoPathogenPheromones
    - CMU14ActionXenoPathogenHeal
    - CMU14ActionXenoPathogenWordQueen
    - CMU14ActionXenoPathogenParalyzingSlash
    - CMU14ActionXenoPathogenOvermindChangeForm
    - CMU14ActionXenoPathogenOrderConstruction
    - CMU14ActionXenoPathogenChooseStructure
    - CMU14ActionXenoPathogenSecreteStructure
    - CMU14ActionXenoPathogenPlantWeeds
    - CMU14ActionXenoPathogenExpandWeeds
  - type: XenoRegen
    healOffWeeds: true
    restHealMultiplier: 2.0
  - type: XenoPlasma
    plasma: 2000
    maxPlasma: 2000
    plasmaRegenOnWeeds: 12
  - type: XenoEvolution
    actionId: CMU14ActionXenoPathogenEvolve
    canEvolveWithoutGranter: false
    evolvesTo: []
  - type: XenoDevolve
    devolvesTo: []
    canBeDevolvedByOther: false
  - type: XenoPheromones
  - type: CMUXenoOvermind
  - type: XenoWordQueen
  - type: XenoPsychicCommunication
  - type: ManageHive
  - type: HiveLeaderGranter
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - MobMask
        - BarbedBarricade
        - BarricadeImpassable
        layer:
        - MobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 150
        layer:
        - BulletImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 6.5
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      groups:
        Brute: 30
  - type: CMArmor
    explosionArmor: 25
    xenoArmor: 15
  - type: XenoConstruction
    buildDelay: 1
    canBuild:
    - CMU14XenoMyceliumWall
    - CMU14XenoThickMyceliumWall
    - CMU14XenoMyceliumMembrane
    - CMU14XenoThickMyceliumMembrane
    - CMU14XenoMyceliumDoor
    - CMU14XenoThickMyceliumDoor
    canOrderConstruction:
    - CMU14PathogenBlightCoreConstructionNode
    - CMU14PathogenClusterConstructionNode
    - CMU14PathogenPlasmaTreeConstructionNode
    - CMU14PathogenRecoveryNodeConstructionNode
    - CMU14PathogenSporecasterConstructionNode
  - type: Tackle
    min: 2
    max: 5
    chance: 0.35
    stunMin: 3
    stunMax: 4
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_CMU14/Interface/neo_blips.rsi
      state: archon
    background:
      sprite: /Textures/_CMU14/Interface/neo_blips.rsi
      state: background_pathogen
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: VentCrawler
    ventCrawlIcon: queen
  - type: RMCActionOrder
    id: CMU14XenoOvermind
  - type: FixedIdentity
    name: cmu-job-name-pathogen-overmind
  - type: Speech
    speechSounds: Pathogen
  - type: Physics
    canCollide: false
  - type: XenoEvolutionGranter
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Hivemind
    - MyceliumLink
  - type: ActiveRadio
    channels:
    - Hivemind
    - MyceliumLink
    receiveAllChannels: false
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_CMU14/Xeno/Pathogen/announce_screech.ogg
      params:
        volume: -8
  - type: XenoAnnounceDeath
    message: cmu-xeno-death-overmind
    color: "#8a8c50"

- type: entity
  parent: CMU14XenoOvermindBase
  id: CMU14XenoOvermind
  name: Overmind
  components:
  - type: RMCGibOnDeath
    gibChance: 0.1
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenOvermind

- type: entity
  parent: StationAiHolo
  id: CMU14XenoOvermindEye
  name: overmind eye
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Sprite
    sprite: _CMU14/Mobs/Xenonids/Pathogen/overmind.rsi
    layers:
    - state: overmind_eye
  - type: Eye
    drawFov: false
  - type: Visibility
    layer: 32770
