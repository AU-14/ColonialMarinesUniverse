- type: entity
  abstract: true
  parent: CMU14XenoPathogenBase
  id: CMU14XenoBlightBase
  name: Blight
  description: A sleek and stealthy hunter, always watching.
  components:
  - type: GhostRole
    name: cmu-job-name-pathogen-blight
  - type: Sprite
    sprite: _CMU14/Mobs/Xenonids/Pathogen/blight.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      410: Critical
      510: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: Xeno
    role: CMU14JobPathogenBlight
    tier: 2
    hudOffset: -0.1, 0.25
    emoteSounds: Warrior
    actionIds:
    - ActionXenoRest
    - ActionXenoWatch
    - ActionXenoLeap
    - ActionXenoTailStab
    - ActionXenoTurnInvisible
  - type: XenoRegen
    healOffWeeds: true
    restHealMultiplier: 1.2
  - type: XenoPlasma
    plasma: 150
    maxPlasma: 150
    plasmaRegenOnWeeds: 8
  - type: XenoEvolution
    canEvolveWithoutGranter: true
    requiresGranter: false
    max: 400
    evolvesTo:
    - CMU14XenoVenator
    - CMU14XenoHarbinger
  - type: XenoDevolve
    devolvesTo:
    - CMU14XenoSprinter
    canBeDevolvedByOther: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 100
        mask:
        - MobMask
        - BarbedBarricade
        - BarricadeImpassable
        layer:
        - MobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        layer:
        - BulletImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.8
    baseSprintSpeed: 9.0
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      groups:
        Brute: 28
  - type: CMArmor
    explosionArmor: 10
    armor: 5
  - type: Tackle
    min: 2
    max: 6
    chance: 0.35
    stunMin: 3
    stunMax: 4
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: lurker
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: VentCrawler
    ventCrawlIcon: lurker
  - type: RMCActionOrder
    id: CMU14XenoBlight
  - type: FixedIdentity
    name: cmu-job-name-pathogen-blight
  - type: Speech
    speechSounds: Xenonid


- type: entity
  parent: CMU14XenoBlightBase
  id: CMU14XenoBlight
  name: Blight
