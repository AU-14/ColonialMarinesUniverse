# CMU14 Pathogen - Mycelium Weeds
# RSI: Resources/Textures/_CMU14/Structures/Xeno/Pathogen/pathogen_weeds.rsi

# ── Base mycelium weed tile ───────────────────────────────────────────────────

- type: entity
  parent: XenoWeeds
  id: CMU14XenoMyceliumWeeds
  name: mycelium weeds
  description: Pale fibrous mycelium threads spreading across the floor. They feel spongy underfoot.
  components:
  - type: Sprite
    sprite: _CMU14/Structures/Xeno/Pathogen/pathogen_weeds.rsi
    drawdepth: FloorTiles
    layers:
    - state: weed0
  - type: IconSmooth
    key: cm_xeno_weeds
    base: weed_dir
    mode: CardinalFlags
  - type: IconSmoothRandom
    overrides:
    - weed_dir0
    - weed_dir15
  - type: RandomSprite
    available:
    - 0:
        weed0: ""
    - 0:
        weed1: ""
    - 0:
        weed2: ""
    - 0:
        weed3: ""
    - 0:
        weed4: ""
    - 0:
        weed5: ""
    - 0:
        weed6: ""
    - 0:
        weed7: ""
    - 0:
        weed8: ""
    - 0:
        weed9: ""
    - 0:
        weed10: ""
    - 0:
        weed11: ""
    - 0:
        weed12: ""
    - 0:
        weed13: ""
    - 0:
        weed14: ""
    - 0:
        weed15: ""
  - type: XenoWeeds
    level: 1
    spawns: CMU14XenoMyceliumWeeds

# ── Weed node (weed source) ───────────────────────────────────────────────────

- type: entity
  parent: CMU14XenoMyceliumWeeds
  id: CMU14XenoMyceliumWeedsSource
  name: mycelium node
  description: A pulsating knot of mycelium threads. It slowly spreads spores across the floor.
  components:
  - type: Sprite
    sprite: _CMU14/Structures/Xeno/Pathogen/pathogen_weeds.rsi
    drawdepth: FloorTiles
    layers:
    - state: weed0
    - state: constructionnode
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 11
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: XenoConstructionPlasmaCost
    plasma: 200
  - type: RMCDeleteAnchoredOnInit
    enabled: true
    whitelist:
      tags:
      - XenoWeedNode
      - XenoWeedTile
  - type: QueenEyeVision
  - type: Damageable
    damage:
      groups:
        Brute: 6
  - type: XenoWeeds
    spawns: CMU14XenoMyceliumWeeds
    healOnStopSpreading:
      groups:
        Brute: -6
  - type: Tag
    tags:
    - XenoWeedNode

- type: entity
  parent: CMU14XenoMyceliumWeeds
  id: CMU14XenoMyceliumWeedsSourceHidden
  suffix: Hidden Node
  components:
  - type: Sprite
    layers:
    - state: weed0
    - sprite: _RMC14/Markers/landmarks.rsi
      state: weednode
      map: ["enum.RMCGhostVisibleOnlyVisualLayers.Base"]
  - type: RMCDeleteAnchoredOnInit
    enabled: true
    whitelist:
      tags:
      - XenoWeedNode
      - XenoWeedTile
  - type: QueenEyeVision
  - type: Tag
    tags:
    - XenoWeedNode
    - XenoWeedTile
  - type: RMCVisibleToGhostsOnly

# ── Hive-tier mycelium weeds (denser, spread by Overmind-tier) ───────────────

- type: entity
  parent: CMU14XenoMyceliumWeeds
  id: CMU14XenoMyceliumHiveWeeds
  name: dense mycelium weeds
  components:
  - type: Sprite
    sprite: _CMU14/Structures/Xeno/Pathogen/pathogen_weeds.rsi
    drawdepth: FloorTiles
    layers:
    - state: hive_weed0
  - type: IconSmooth
    key: cm_xeno_weeds
    base: hive_weed
    mode: CardinalFlags
  - type: IconSmoothRandom
    overrides:
    - hive_weed0
    - hive_weed15
  - type: RandomSprite
    available:
    - 0:
        hive_weed0: ""
    - 0:
        hive_weed1: ""
    - 0:
        hive_weed2: ""
    - 0:
        hive_weed3: ""
    - 0:
        hive_weed4: ""
    - 0:
        hive_weed5: ""
    - 0:
        hive_weed6: ""
    - 0:
        hive_weed7: ""
    - 0:
        hive_weed8: ""
    - 0:
        hive_weed9: ""
    - 0:
        hive_weed10: ""
    - 0:
        hive_weed11: ""
    - 0:
        hive_weed12: ""
    - 0:
        hive_weed13: ""
    - 0:
        hive_weed14: ""
    - 0:
        hive_weed15: ""
  - type: XenoWeeds
    range: 7
    spawns: CMU14XenoMyceliumHiveWeeds
    level: 3
    speedMultiplierOutsider: 0.338
    speedMultiplierOutsiderArmor: 0.4856
    blockOtherWeeds: true
    spreadsOnSemiWeedable: true
  - type: HiveWeeds
  - type: XenoWeedsSpreading
    spreadDelay: 1.25
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Flamability
    chance: 0.3
    rate: 1.0
    spread: 0.5
    range: 0.8
    scatterFireChance: 0.005
    destroyAnyway: true
    burnDurationMin: 4
    burnDurationMax: 8

