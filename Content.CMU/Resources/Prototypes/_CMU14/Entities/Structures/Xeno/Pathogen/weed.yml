# ── Wall-surface weed overlay ─────────────────────────────────────────────────

- type: entity
  id: CMU14XenoMyceliumWeedsWall
  name: mycelium weeds
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Appearance
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - WallLayer
        density: 1000
        hard: false
  - type: Clickable
  - type: Sprite
    sprite: _CMU14/Structures/Xeno/Pathogen/pathogen_weeds.rsi
    drawdepth: Objects
  - type: IconSmooth
    key: cm_xeno_weeds_walls
    base: weedwall
    mode: Corners
  - type: XenoNestSurface
    nest: CMU14XenoMyceliumNest
  - type: HiveMember
  - type: XenoFriendly
  - type: Damageable
    damageContainer: StructuralXeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: ImmuneToUnarmed
  - type: WallMount
    arc: 360
  - type: RMCNightVisionVisible
    priority: -1
    transparency: 0.2