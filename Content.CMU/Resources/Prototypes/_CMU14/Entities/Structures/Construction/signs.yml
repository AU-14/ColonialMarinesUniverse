  name: mines
  suffix: Prop
  description: danger of mines and death...
  components:
  - type: Sprite
    sprite: _CMU14/N14content/world.rsi
    state: mine_sign
  - type: Construction
    graph: AU14SignGraph
    node: sign_mines

# ├──[ CONSTRUCTION MENU ]───────────────────────────────────────────┤
- type: construction
  parent: RMC
  name: con-a-u14-construction-sign-mines
  id: AU14ConstructionSignMines
  graph: AU14SignGraph
  startNode: start
  targetNode: sign_mines
  category: construction-category-cm-furniture
  description: con-a-u14-construction-sign-mines-desc
  objectType: Structure
  canBuildInImpassable: false
  conditions:
    - !type:TileNotBlocked

