- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicCrush
  name: Psychic Crush
  description: Channel psychic pressure at a location, then crush enemies in the expanding area.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_crush
    iconOn:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_crush_activate
    useDelay: 0.25
  # SharedActionsSystem gate is intentionally looser than the ability's true range so a click
  # anywhere on a tile the range overlay highlights (7-tile closest-point-of-tile check) reaches
  # the handler. The handler snaps to the tile centre and enforces the real 7-tile initiation
  # range via CMUXenoWarlockComponent.PsychicCrushInitRange. Worst-case click distance on a
  # highlighted boundary tile is 7 + tile diagonal ≈ 8.41, rounded up to 9.
  - type: TargetAction
    range: 9
    checkCanAccess: true
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicCrushActionEvent
  # Marker used by SetPsychicCrushActionMode to swap the crush action between WorldTargetAction
  # (idle / windup) and InstantAction (channeling, early-detonate on next press). See
  # CMUXenoWarlockSystem.SetPsychicCrushActionMode for the swap logic.
  - type: CMUXenoPsychicCrushActionMarker
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicBlast
  name: Psychic Blast
  description: Detonate psychic force at a location, damaging and slowing nearby enemies.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_blast
    useDelay: 8
  # See CMUActionXenoPsychicCrush above for why the gate range exceeds the true 7-tile range.
  - type: TargetAction
    range: 9
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicBlastActionEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicShield
  name: Psychic Shield
  description: Raise a psychic shield facing the clicked direction that catches projectiles. Click again with the shield up to detonate.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_shield
    iconOn:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_shield_reflect
    useDelay: 0.25
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicShieldActionEvent
  - type: CMUXenoPsychicShieldActionMarker
  - type: ActionBlockIfResting
  - type: RMCDazeableAction
