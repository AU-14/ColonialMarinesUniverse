- files:
  - flight.ogg
  license: Custom
  copyright: >-
    Edited loop mixing "plasma engine fx" by Insu (Freesound), used under the
    Pixabay Content License (https://pixabay.com/service/terms/), with
    "Rustbound Reactor 02 (Loop)" by TommasoMotteran (CC0-1.0,
    https://freesound.org/people/TommasoMotteran/sounds/851916/).
    Plasma is trimmed and crossfaded; reactor is layered 12 dB below it.
    Downmixed to mono and normalized. See Tools/mohawk/flight_audio.json.
  source: https://pixabay.com/sound-effects/film-special-effects-plasma-engine-fx-33559/
- files:
  - landing.ogg
  license: CC0-1.0
  copyright: >-
    "spaceship takeoff.wav" by pointparkcinema (previewed as "Extended spaceship
    lift-off"), released under CC0.
    Uses 15 to 25 seconds of the source for the ten-second landing approach.
    Downmixed to mono, normalized and faded at both edges.
    See Tools/mohawk/landing_audio.json for source hash and edit timings.
  source: https://freesound.org/people/pointparkcinema/sounds/407253/
