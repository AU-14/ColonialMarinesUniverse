- files:
  - flight.ogg
  license: Custom
  copyright: >-
    Edited loop mixing "plasma engine fx" by Insu (Freesound), used under the
    Pixabay Content License (https://pixabay.com/service/terms/), with
    "Rustbound Reactor 02 (Loop)" by TommasoMotteran (CC0-1.0,
    https://freesound.org/people/TommasoMotteran/sounds/851916/).
    Plasma is trimmed and crossfaded; reactor is layered 12 dB below it.
    Downmixed to mono and normalized. See Tools/mohawk/flight_audio.json.
  source: https://pixabay.com/sound-effects/film-special-effects-plasma-engine-fx-33559/
- files:
  - landing.ogg
  license: Custom
  copyright: >-
    Edited ten-second landing mix. Starts at 6 seconds of "super specific landing"
    by Vospi (CC0-1.0, https://freesound.org/people/Vospi/sounds/439546/),
    crossfading into "Creaky Thunderous SciFi SpaceShip Landing" by Kalpesh Ajugia
    (kalsstockmedia), used under the Pixabay Content License
    (https://pixabay.com/service/terms/). Downmixed to mono; fades and gain adjusted.
    See Tools/mohawk/landing_audio.json for the source hashes and edit timings.
  source: https://pixabay.com/sound-effects/film-special-effects-creaky-thunderous-scifi-spaceship-landing-341621/
