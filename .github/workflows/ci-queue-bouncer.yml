name: CI Queue Bouncer

# CMU14: per-PR supersession and cleanup for the ci.yml fleet gate. the gate itself must
# never cancel-in-progress (it would kill innocent holders mid-run), so a new push's stale
# runs die here instead: every queued or running ci.yml run of this PR on an older
# SHA is cancelled within seconds of the push, freeing its queue slot and the fleet.
# `closed` cleans up a merged or abandoned PR's queued runs: nothing else ever cancels
# them, and they would each burn a full fleet turn on a PR that no longer exists.
# pull_request_target on purpose: fork PR tokens are read-only, and this script comes
# from the base branch, never from the PR.

on:
  pull_request_target:
    types: [synchronize, closed]

permissions:
  actions: write

concurrency:
  group: ci-bouncer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  supersede:
    name: Cancel superseded CI runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const headRef = context.payload.pull_request.head.ref;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            // on close every run of this PR is dead work, including one on the final
            // SHA pushed minutes before the merge
            const closed = context.payload.action === 'closed';
            let cancelled = 0;
            for (const status of ['queued', 'in_progress']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                status,
                per_page: 100,
              });
              for (const run of runs) {
                if (!closed && run.head_sha === sha)
                  continue;
                // pull_requests is empty on fork PR runs, so match the head ref and
                // repository. same branch open against two bases is fine: a push
                // supersedes both PRs' runs, and the two bouncer runs race to cancel
                // the same targets harmlessly
                if (run.head_branch !== headRef || run.head_repository?.full_name !== headRepo)
                  continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    ...context.repo,
                    run_id: run.id,
                  });
                  cancelled++;
                } catch (err) {
                  // 409: already cancelled, or the run finished between listing and
                  // cancelling. both are success for supersession
                  if (err.status !== 409)
                    throw err;
                }
              }
            }
            core.info(`cancelled ${cancelled} superseded CI run(s) for PR #${pr}`);
