name: CI Queue Bouncer

# CMU14: cancel work for closed or drafted PRs. CI's per-PR concurrency handles new revisions.
# pull_request_target on purpose: fork PR tokens are read-only, and this script comes
# from the base branch, never from the PR.

on:
  pull_request_target:
    types: [closed, converted_to_draft] # CMU14: native CI concurrency handles synchronize.

permissions:
  actions: write
  pull-requests: read # CMU14: resolve fork runs whose PR metadata is empty.

concurrency:
  group: ci-bouncer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  supersede:
    name: Cancel superseded CI runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const eventPR = context.payload.pull_request;
            const pr = eventPR.number;
            const headRef = eventPR.head.ref;
            const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr });
            if (current.state === 'open' && !current.draft)
              return;
            // CMU14: branch identity is only a safe fallback when it has a single PR.
            const head = eventPR.head.repo;
            const matching = head ? await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'all', head: `${head.owner.login}:${headRef}`, per_page: 100,
            }) : [];
            const sameHead = matching.filter(candidate => candidate.head.repo?.id === head.id);
            const uniqueHead = sameHead.length === 1 && sameHead[0].number === pr;
            // every workflow that fires on PR events, paired with the event name it
            // actually records, so the listing matches
            const targets = [
              { workflow: 'ci.yml', event: 'pull_request' },
              { workflow: 'check-pr.yml', event: 'pull_request_target' },
              { workflow: 'labels.yml', event: 'pull_request_target' },
              { workflow: 'rsi-diff.yml', event: 'pull_request_target' },
              { workflow: 'mapchecker.yml', event: 'pull_request' },
            ];
            let cancelled = 0;
            for (const target of targets) {
              // CMU14: runs waiting on a concurrency queue report status "pending",
              // not "queued"; without it supersession never sees the queue and
              // dead-SHA runs hold fleet slots until they execute for real
              for (const status of ['queued', 'pending', 'in_progress']) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo,
                  workflow_id: target.workflow,
                  event: target.event,
                  status,
                  per_page: 100,
                });
                for (const run of runs) {
                  // CMU14: a delayed close/draft event can race a reopen.
                  if (Date.parse(run.created_at) > Date.parse(eventPR.updated_at))
                    continue;
                  const belongsToPR = run.pull_requests?.length
                    ? run.pull_requests.some(match => match.number === pr)
                    : uniqueHead && run.head_branch === headRef && run.head_repository?.id === head.id;
                  if (!belongsToPR)
                    continue;
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      ...context.repo,
                      run_id: run.id,
                    });
                    cancelled++;
                  } catch (err) {
                    // 409: already cancelled, or the run finished between listing and
                    // cancelling. both are success for supersession
                    if (err.status !== 409)
                      throw err;
                  }
                }
              }
            }
            core.info(`cancelled ${cancelled} workflow run(s) for PR #${pr} on ${context.payload.action}`);
