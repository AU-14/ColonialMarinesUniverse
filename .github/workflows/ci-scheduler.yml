name: CI Scheduler

# CMU14: fleet admission arbiter for the ~20-runner hosted pool. github offers no runner
# reservation and no job priority, so builds and shard waves wait on protected environments
# (ci-build, ci-shards-a, ci-shards-b) that hold jobs runner-less and un-billed, and this
# workflow decides who gets in:
#   build lanes: at most 3 concurrent Build jobs fleet-wide, keeping ~3 runners' worth of
#     capacity for builds, labels, check-pr, mapchecker, master pushes and unit/yaml jobs.
#     queued PRs build ahead of the shard waves, so the 25-minute build leaves every PR's
#     critical path after the first
#   shard lanes: one wave (one environment of one run, ~16 legs) admitted only while
#     outstanding shard legs sit at the low-water mark. sustained shard concurrency lands
#     ~17-18; helper jobs stay minutes from a runner instead of behind a 30-minute shard
#   priority: class 0 = master pushes and merge queue (merge evidence), class 1 = OWNER and
#     MEMBER pull requests (they also get a deeper low-water mark, so they enter while
#     standard work still drains), class 2 = everyone else, class 3 = the nightly full suite.
#     FIFO within each class
# the workflow_run and pull_request_target triggers carry the reaction time; the schedule
# is only the backstop that guarantees progress on a quiet fleet. one shard wave is
# admitted per pass so the low-water arithmetic
# stays honest; the next tick recounts from the live job list.
#
# setup (both one-time, admin):
#   1. create environments ci-build, ci-shards-a, ci-shards-b, each with exactly one
#      required reviewer: the CI_SCHEDULER_TOKEN owner. no wait timer, no branch policy,
#      "prevent self-review" OFF (the PAT holder must be approvable on their own pushes)
#   2. mint that PAT (classic, repo scope) and store it as the CI_SCHEDULER_TOKEN secret
# GITHUB_TOKEN cannot review protected environments; reads below use it, approvals use the
# PAT. without the PAT approvals fail loudly; without the environments the fleet silently
# reverts to ungated FIFO (which this workflow also detects and fails loudly, so the
# reservation never disappears quietly).

on:
  schedule:
    # CMU14: the backstop. github coalesces schedules finer than 5 minutes, and under
    # load even 5 can stretch; the workflow_run and pull_request_target triggers above
    # carry the real reaction time, this only guarantees progress on a quiet fleet
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [CI, Build & Test Debug]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # CMU14: single-flight. only the freshest evaluation matters, and a cancelled pass just
  # re-evaluates on the next tick; approvals already granted are not undone
  group: ci-scheduler
  cancel-in-progress: true

jobs:
  admit:
    name: Admit pending waves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9.0.0
        env:
          CI_SCHEDULER_TOKEN: ${{ secrets.CI_SCHEDULER_TOKEN }}
        with:
          script: |
            const repo = context.repo;
            const CI = 'ci.yml';
            const NIGHTLY = 'build-test-debug.yml';
            const ENVS = new Set(['ci-build', 'ci-shards-a', 'ci-shards-b']);
            const BUILD_LANES = 3;
            const LOW_WATER = 2;
            const PRIORITY_LOW_WATER = 8;
            const pat = process.env.CI_SCHEDULER_TOKEN;

            // live fleet state: every queued or running run of both workflows
            const runs = [];
            let ciActive = false;
            for (const file of [CI, NIGHTLY]) {
              for (const status of ['queued', 'in_progress']) {
                const page = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...repo, workflow_id: file, status, per_page: 100,
                });
                for (const run of page) {
                  ciActive ||= file === CI;
                  runs.push({ ...run, file });
                }
              }
            }

            // an unprotected (or missing) environment sends waves straight to the runner
            // market and the whole reservation silently reverts to FIFO. fail loudly while
            // CI work exists, so the gates can never quietly disappear
            let unprotected = false;
            if (ciActive) {
              const { data: envPage } = await github.rest.repos.getAllEnvironments({
                ...repo, per_page: 100,
              });
              for (const name of ENVS) {
                const env = envPage.environments.find(e => e.name === name);
                if (!env || !env.protection_rules?.some(r => r.type === 'required_reviewers')) {
                  core.setFailed(`${name} environment is missing or has no required reviewer; waves bypass admission.`);
                  unprotected = true;
                }
              }
            }
            if (unprotected)
              return;

            // outstanding demand plus everything waiting on our environments
            let builds = 0;
            let shards = 0;
            const pending = [];
            for (const run of runs) {
              if (run.status === 'in_progress') {
                let pend = [];
                try {
                  ({ data: pend } = await github.rest.actions.getPendingDeploymentsForRun({
                    ...repo, run_id: run.id,
                  }));
                } catch (err) {
                  // 404/422: run finished or was reviewed between listing and probing
                  if (err.status !== 404 && err.status !== 422)
                    throw err;
                }
                for (const p of pend)
                  if (ENVS.has(p.environment.name))
                    pending.push({ run, env: p.environment });
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, per_page: 100,
              });
              for (const job of jobs) {
                if (job.status !== 'queued' && job.status !== 'in_progress')
                  continue;
                if (job.name === 'Build')
                  builds++;
                else if (job.name.startsWith('Testcases / ') || job.name.startsWith('Debug / '))
                  shards++;
              }
            }

            if (pending.length === 0) {
              core.info(`fleet: ${builds} build(s), ${shards} shard leg(s) outstanding, nothing waiting.`);
              return;
            }
            if (!pat) {
              core.setFailed('waves are waiting but CI_SCHEDULER_TOKEN is not set; they would hold forever.');
              return;
            }

            async function prFor(run) {
              if (run.pull_requests?.length)
                return run.pull_requests[0];
              const headRepo = run.head_repository?.full_name ?? `${repo.owner}/${repo.repo}`;
              const { data } = await github.rest.pulls.list({
                ...repo, head: `${headRepo.split('/')[0]}:${run.head_branch}`, per_page: 5,
              });
              return data.find(p => p.head.repo?.full_name === headRepo) ?? data[0];
            }

            const classes = [];
            for (const p of pending) {
              let cls = 2;
              if (p.run.file === NIGHTLY)
                cls = 3;
              else if (p.run.event === 'push' || p.run.event === 'merge_group')
                cls = 0;
              else {
                const pr = await prFor(p.run);
                if (!pr) {
                  core.info(`run ${p.run.id}: no PR found, skipping.`);
                  continue;
                }
                // stale head: ci-queue-bouncer.yml is about to cancel this run
                if (pr.head?.sha !== p.run.head_sha) {
                  core.info(`run ${p.run.id}: stale head, skipping.`);
                  continue;
                }
                if (pr.author_association === 'OWNER' || pr.author_association === 'MEMBER')
                  cls = 1;
              }
              classes.push({ ...p, cls, created: Date.parse(p.run.created_at) });
            }
            classes.sort((x, y) => x.cls - y.cls || x.created - y.created);

            async function approve(p, why) {
              const res = await fetch(
                `https://api.github.com/repos/${repo.owner}/${repo.repo}/actions/runs/${p.run.id}/pending_deployments`,
                {
                  method: 'POST',
                  headers: {
                    authorization: `Bearer ${pat}`,
                    accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                  },
                  body: JSON.stringify({ environment_ids: [p.env.id], state: 'approved', comment: why }),
                });
              if (res.status === 204 || res.ok) {
                core.info(`admitted ${p.env.name} for run ${p.run.id} (${p.run.head_branch}): ${why}`);
                return true;
              }
              if (res.status === 422)
                return false; // already reviewed or the run moved on
              if (res.status === 401 || res.status === 403)
                core.setFailed(`approval rejected (${res.status}): is the CI_SCHEDULER_TOKEN owner a required reviewer of ${p.env.name}?`);
              else
                core.warning(`approve run ${p.run.id} ${p.env.name}: HTTP ${res.status}`);
              return false;
            }

            let shardWaveAdmitted = false;
            for (const p of classes) {
              if (p.env.name === 'ci-build') {
                if (builds < BUILD_LANES && await approve(p, `build lane ${builds + 1}/${BUILD_LANES}, class ${p.cls}`))
                  builds++;
              } else if (!shardWaveAdmitted) {
                const low = p.cls <= 1 ? PRIORITY_LOW_WATER : LOW_WATER;
                if (shards <= low && await approve(p, `shard wave at ${shards} outstanding, class ${p.cls}`))
                  shardWaveAdmitted = true;
              }
            }
            core.info(`fleet: ${builds} build(s), ${shards} shard leg(s) outstanding, ${classes.length} wave(s) waiting.`);
