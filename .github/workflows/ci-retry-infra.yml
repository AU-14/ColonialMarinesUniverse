# CMU14: one retry for runner shutdowns and artifact service outages; tests and execution timeouts need attention.
name: Retry interrupted CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  pull-requests: read # CMU14: a retry must still belong to a live PR revision.

concurrency:
  group: ci-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    # CMU14: some runner interruptions are reported as cancellation.
    if: contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This runs with write permission even for fork PRs. Read GitHub metadata and
      # logs only; never check out or execute code/artifacts from the triggering run.
      - name: Retry after CI has finished
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const triggered = context.payload.workflow_run;
            const repo = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: triggered.id,
            });
            if (run.status !== 'completed' || run.conclusion !== triggered.conclusion ||
                run.run_attempt !== triggered.run_attempt || run.run_attempt >= 2) {
              core.info('Run has already changed or exhausted its retries.');
              return;
            }

            // CMU14: a closed, drafted or superseded PR must never be revived by an automatic retry.
            let pr;
            if (run.event === 'pull_request') {
              const head = run.head_repository;
              if (!head?.owner?.login)
                return;
              const candidates = await github.paginate(github.rest.pulls.list, {
                ...repo, state: 'all', head: `${head.owner.login}:${run.head_branch}`, per_page: 100,
              });
              const matches = candidates.filter(candidate => candidate.head.repo?.id === head.id &&
                ['master', 'staging', 'stable'].includes(candidate.base.ref) &&
                (!run.pull_requests?.length || run.pull_requests.some(match => match.number === candidate.number)));
              if (matches.length !== 1 || matches[0].state !== 'open' || matches[0].draft ||
                  matches[0].head.sha !== run.head_sha)
                return;
              [pr] = matches;
            }

            const { data: recent } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: run.workflow_id,
              branch: run.head_branch, event: run.event, per_page: 100,
            });
            if (recent.workflow_runs.some(other => other.id > run.id &&
                other.head_repository?.id === run.head_repository?.id &&
                (!pr || !other.pull_requests?.length || other.pull_requests.some(match => match.number === pr.number)))) {
              core.info('A newer CI run has superseded this run.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100,
            });
            // CMU14: a canceled workflow needs a failed verdict and an affirmative runner error in each interrupted lane.
            if (run.conclusion === 'cancelled' && !jobs.some(job =>
                job.name === 'Required Checks' && job.conclusion === 'failure'))
              return;
            const failed = jobs.filter(job => ['failure', 'cancelled'].includes(job.conclusion) &&
              job.name !== 'Required Checks');
            if (failed.length === 0)
              return;

            for (const job of failed) {
              // CMU14: matrix values are appended to the display name; match the lane family by prefix
              if (!job.name.startsWith('Tests (')) {
                core.info('A failure outside integration tests requires attention.');
                return;
              }

              const { data } = await github.rest.actions.downloadJobLogsForWorkflowRun({
                ...repo, job_id: job.id,
              }).catch(error => {
                if (error.status === 404 || error.status === 410)
                  return { data: '' };
                throw error;
              });
              const log = typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
              const shutdown = /Z\s+##\[error\]The runner has received a shutdown signal\./m;
              // CMU14: an upload error is retryable only if gameplay itself passed.
              const gameplayPassed = job.steps?.some(step =>
                step.name === 'Run gameplay groups' && step.conclusion === 'success');
              const artifactOutage = gameplayPassed && /Z\s+##\[error\]Failed to (?:Create|Finalize)Artifact: /m.test(log);
              // CMU14: test timeouts are actionable failures, never infrastructure retries.
              const testFailure = /Z\s+(?:\|\s*)?Failed .+ \[|Failed:\s*[1-9]|wall-clock timeout|execution budget exhausted|exceeded.*(?:timeout|time limit)/i;
              if (!(shutdown.test(log) || artifactOutage) || testFailure.test(log)) {
                core.info('A test failed or no infrastructure failure signature was found.');
                return;
              }
            }

            // The source workflow is completed now, so GitHub accepts the retry.
            // Successful jobs stay completed; Required Checks runs again afterwards.
            await github.rest.actions.reRunWorkflowFailedJobs({ ...repo, run_id: run.id });
            core.info(`Requested retry ${run.run_attempt + 1} for CI run ${run.id}.`);
