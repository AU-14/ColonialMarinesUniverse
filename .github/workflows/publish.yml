name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
  # schedule:
  # - cron: '0 10 * * *'
    inputs:
      use_changelog:
        description: Update changelog using default settings? (don't overdo)
        type: boolean
        default: false

      # CMU14: exercise the full build path without changing the live CDN release.
      dry_run:
        description: Build and verify packages without publishing
        type: boolean
        default: false

      # CMU14: a clean publish ends every test merge unless this is ticked.
      keep_test_merges:
        description: Keep test merges? On = master plus every PR labelled "Test Merge". Off = clean master, test merges end. Ignored on a dry run.
        type: boolean
        default: false

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  AUDIO_REPO_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}

jobs:
  changelog:
    uses: ./.github/workflows/update-changelog.yml
    if: inputs.use_changelog == true
    secrets: inherit
    permissions:
      contents: write

  # CMU14: keep_test_merges builds master plus the labelled PRs through the test merge workflow instead.
  test_merge:
    needs: changelog
    if: >-
      always() &&
      inputs.keep_test_merges && !inputs.dry_run &&
      (needs.changelog.result == 'success' || needs.changelog.result == 'skipped')
    uses: ./.github/workflows/publish-test-merge.yml
    with:
      allow_empty: true
      nested: true
    secrets: inherit
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write

  publish_start:
    name: Prepare publish
    # CMU14: Resolve metadata without creating a partial CDN transaction during the build.
    if: inputs.dry_run || !inputs.keep_test_merges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      already-published: ${{ steps.start.outputs.already-published }}
      engine-version: ${{ steps.start.outputs.engine-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: false
          sparse-checkout: |
            RobustToolbox
            Tools

      - name: Checkout RobustToolbox
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth=1 RobustToolbox
          cd RobustToolbox
          git fetch --unshallow --tags origin

      - name: Check published version
        id: start
        run: python3 Tools/publish_multi_request.py check

  # CMU14: Build artifacts independently; upload retries must not rerun these jobs.
  package:
    name: Package ${{ matrix.name }}
    # CMU14: Packaging can proceed while changelogs are still being generated.
    needs: publish_start
    if: >-
      always() &&
      needs.publish_start.result == 'success' &&
      (inputs.dry_run || needs.publish_start.outputs.already-published != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            command: client
            restore: |
              dotnet restore Content.Packaging/Content.Packaging.csproj
              dotnet restore Content.Client/Content.Client.csproj
          - name: server-win-x64
            platform: win-x64
            command: server --platform win-x64
            restore: dotnet restore Content.Server/Content.Server.csproj --runtime win-x64 /p:TargetOs=Windows
          - name: server-linux-x64
            platform: linux-x64
            command: server --platform linux-x64
            restore: dotnet restore Content.Server/Content.Server.csproj --runtime linux-x64 /p:TargetOs=Linux

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: false

      - name: Checkout submodules
        if: matrix.name == 'client'
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --depth=1

      - name: Checkout ColonialMarinesAudio
        if: ${{ matrix.name == 'client' && env.AUDIO_REPO_TOKEN != '' }}
        uses: actions/checkout@v7
        with:
          repository: AU-14/ColonialMarinesAudio
          token: ${{ env.AUDIO_REPO_TOKEN }}
          path: __audio-overlay

      - name: Rsync CMAudio into Resources
        if: ${{ matrix.name == 'client' && env.AUDIO_REPO_TOKEN != '' }}
        run: |
          mkdir -p Content.CMU/Resources/Audio/CMU14/Private/
          rsync -a --delete \
            __audio-overlay/Resources/Audio/_CMU14/Private/ \
            Content.CMU/Resources/Audio/CMU14/Private/
          du -sh Content.CMU/Resources/Audio/CMU14/Private/
          rm -rf __audio-overlay

      - uses: actions/setup-dotnet@v6.1.0
        if: matrix.name == 'client'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json

      - name: Restore dependencies
        if: matrix.name == 'client'
        run: ${{ matrix.restore }}

      - name: Build Packaging
        if: matrix.name == 'client'
        run: dotnet build Content.Packaging --configuration ${{ env.CONFIGURATION }} --no-restore /m

      - name: Package ${{ matrix.name }}
        if: matrix.name == 'client'
        run: dotnet run --project Content.Packaging --configuration ${{ env.CONFIGURATION }} --no-build --no-restore -- ${{ matrix.command }} --no-restore

      # CMU14: Server source and detailed logs remain in the private build repository.
      - name: Request verified server package
        if: matrix.name != 'client'
        env:
          CMU_PRIVATE_BUILD_TOKEN: ${{ secrets.CMU_PRIVATE_BUILD_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          audio_args=()
          if [ -n "$AUDIO_REPO_TOKEN" ]; then audio_args+=(--require-audio); fi
          python3 Tools/request_private_package.py --source-sha "$SOURCE_SHA" --platform "$PLATFORM" "${audio_args[@]}"

      - name: Upload ${{ matrix.name }} package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # CMU14: A failed CDN transaction retries only this job using immutable build artifacts.
  publish_finish:
    name: Publish verified packages
    if: >-
      always() &&
      (needs.changelog.result == 'success' || needs.changelog.result == 'skipped') &&
      needs.publish_start.result == 'success' &&
      (inputs.dry_run || needs.publish_start.outputs.already-published != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changelog, publish_start, package]
    permissions:
      contents: read
      actions: read
      issues: write # CMU14: test merge labels
      pull-requests: write # CMU14
    steps:
      - name: Require all packages
        if: needs.package.result != 'success'
        run: |
          echo '::error::Required packages failed; the release was not published.'
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            Tools
            .github/scripts

      # CMU14: matrix job retries can leave multiple artifacts with the same name.
      - name: Select latest verified packages
        id: artifacts
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const ids = ['client', 'server-linux-x64', 'server-win-x64'].map(platform => {
              const candidates = artifacts.filter(artifact =>
                artifact.name === `release-${platform}` && !artifact.expired &&
                artifact.workflow_run?.head_sha === context.sha);
              candidates.sort((a, b) => b.id - a.id);
              if (!candidates.length) throw new Error(`Missing verified ${platform} artifact`);
              return candidates[0].id;
            });
            core.setOutput('ids', ids.join(','));

      - name: Download verified packages
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: release
          merge-multiple: true

      - name: Publish version
        if: ${{ !inputs.dry_run }}
        run: python3 Tools/publish_multi_request.py --upload-workers 1
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_ENGINE_VERSION: ${{ needs.publish_start.outputs.engine-version }}

      # CMU14: a clean publish replaces any test merge build, so every test merge label goes.
      - name: End test merges
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@v9.0.0
        env:
          PUBLISH_VERSION: ${{ github.sha }}
        with:
          script: |
            await require('./.github/scripts/test_merge.js').endAll({github, context, core});

      - name: Verify packages without publishing
        if: inputs.dry_run
        run: python3 Tools/publish_multi_request.py verify
