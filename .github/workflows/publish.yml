# CMU14: One-time recovery of verified artifacts; never merge this workflow into master.
name: Publish
run-name: Recover publish c243d968
on:
  workflow_dispatch:
    inputs:
      use_changelog:
        description: Unused for this recovery
        type: boolean
        default: false
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  recover:
    name: Recover verified publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c243d9686dfff597f5328761c3f2916ef3adadfa
          persist-credentials: false
          sparse-checkout: Tools
      - name: Retrieve and verify existing packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path
          
          sys.path.insert(0, "Tools")
          import request_private_package as packages
          
          packages.API = "https://api.github.com/repos/AU-14/ColonialMarinesUniverse"
          token = os.environ["GH_TOKEN"]
          source = "c243d9686dfff597f5328761c3f2916ef3adadfa"
          run_id = 42997903909
          run = packages.api(f"/actions/runs/{run_id}", token)
          if run["head_sha"] != source or run["event"] != "workflow_dispatch":
              raise RuntimeError("Unexpected source publish run")
          specs = [
              (13846572501, "release-server-win-x64", "SS14.Server_win-x64.zip", "7f626bbc684f23939fbc549e20f84a634422c1ee9f6e559e02b353cc02d9b770"),
              (13846326378, "release-server-linux-x64", "SS14.Server_linux-x64.zip", "4620ac4cf91bc44afd7d028f983aa63cb4f294b9ff986839ce3fa564e72cef23"),
              (13844269097, "release-client", "SS14.Client.zip", "3619c9be2e98a616247321f533208eb14d0bdcd2f41e5b47fb681ad02482405e"),
          ]
          release = Path("release")
          release.mkdir()
          verified = {}
          for artifact_id, artifact_name, filename, expected_digest in specs:
              metadata = packages.api(f"/actions/artifacts/{artifact_id}", token)
              if (metadata["name"] != artifact_name or metadata["expired"]
                      or metadata["workflow_run"]["id"] != run_id
                      or metadata["workflow_run"]["head_sha"] != source
                      or metadata["digest"] != "sha256:" + expected_digest):
                  raise RuntimeError("Artifact provenance does not match")
              archive_path = Path(f"artifact-{artifact_id}.zip")
              url = packages.api(f"/actions/artifacts/{artifact_id}/zip", token)
              packages.download_artifact(url, archive_path)
              with archive_path.open("rb") as stream:
                  if hashlib.file_digest(stream, "sha256").hexdigest() != expected_digest:
                      raise RuntimeError("Artifact digest mismatch")
              with zipfile.ZipFile(archive_path) as archive:
                  entries = archive.infolist()
                  if len(entries) != 1 or entries[0].filename != filename:
                      raise RuntimeError("Unexpected artifact entries")
                  if not 0 < entries[0].file_size <= packages.MAX_PACKAGE_SIZE:
                      raise RuntimeError("Unexpected package size")
                  destination = release / filename
                  with archive.open(filename) as src, destination.open("xb") as dst:
                      shutil.copyfileobj(src, dst)
              with zipfile.ZipFile(destination) as package:
                  if package.testzip() is not None:
                      raise RuntimeError("Package CRC verification failed")
              with destination.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              verified[filename] = {"sha256": digest, "size": destination.stat().st_size}
              print(f"Verified {filename}: {destination.stat().st_size} bytes, SHA256 {digest}")
          Path("verified-packages.json").write_text(json.dumps(verified), encoding="utf-8")
      - name: Recover upload and confirm publication
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_VERSION: c243d9686dfff597f5328761c3f2916ef3adadfa
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path
          
          import requests
          
          sys.path.insert(0, "Tools")
          import publish_multi_request as publisher
          
          version = "c243d9686dfff597f5328761c3f2916ef3adadfa"
          baseline = "2d6b9dd92372b8854faa8dcc35e766430ea5bb19"
          base_url = "https://cmu-cdn.cm-ss13.com/fork/cmu"
          publisher.get_engine_version = lambda: "295.0.2"
          if publisher.VERSION != version:
              raise RuntimeError("Unexpected publish version")
          verified = json.loads(Path("verified-packages.json").read_text(encoding="utf-8"))
          
          def manifest():
              response = requests.get(base_url + "/manifest", timeout=30)
              response.raise_for_status()
              return response.json()["builds"]
          
          def upload(filename):
              response_file = Path("cdn-response.txt")
              auth_config = "header = " + json.dumps("Authorization: Bearer " + os.environ["PUBLISH_TOKEN"]) + "\n"
              result = subprocess.run([
                  "curl", "--config", "-", "--silent", "--show-error", "--fail-with-body",
                  "--http1.1", "--expect100-timeout", "10", "--connect-timeout", "30",
                  "--max-time", "600", "--request", "POST",
                  "--header", "Expect: 100-continue",
                  "--header", "Content-Type: application/octet-stream",
                  "--header", "Robust-Cdn-Publish-Version: " + version,
                  "--header", "Robust-Cdn-Publish-File: " + filename,
                  "--data-binary", "@release/" + filename,
                  "--output", str(response_file), "--write-out", "%{http_code}",
                  base_url + "/publish/file",
              ], input=auth_config, text=True, capture_output=True)
              status = result.stdout.strip()
              body = response_file.read_text(encoding="utf-8", errors="replace") if response_file.exists() else ""
              print(f"Upload {filename}: curl exit {result.returncode}, HTTP {status}", flush=True)
              if result.returncode != 0:
                  print(result.stderr.strip()[:500], flush=True)
                  print(body[:500], flush=True)
              return result.returncode == 0 and status == "204", status, body
          
          builds = manifest()
          latest = max(builds, key=lambda key: builds[key]["time"])
          if latest not in (baseline, version):
              raise RuntimeError("Another release has been published; refusing to replace it")
          if version not in builds:
              ok, status, body = upload("SS14.Server_win-x64.zip")
              if not ok:
                  if status != "409" or "File already published" not in body:
                      raise RuntimeError("Upload failed before a duplicate-file recovery could be justified")
                  print("CDN confirmed an existing file in the incomplete publish. Restarting this version.", flush=True)
                  if not publisher.start_publish("cmu"):
                      raise RuntimeError("Version was published concurrently; verify before any further changes")
                  for filename in ("SS14.Server_win-x64.zip", "SS14.Server_linux-x64.zip", "SS14.Client.zip"):
                      ok, _, _ = upload(filename)
                      if not ok:
                          raise RuntimeError("Recovery upload failed; release remains incomplete")
              publisher.finish_publish("cmu")
          
          for attempt in range(20):
              builds = manifest()
              if version in builds:
                  break
              time.sleep(3)
          else:
              raise RuntimeError("Published version did not appear in the CDN manifest")
          build = builds[version]
          if build["client"]["sha256"].lower() != verified["SS14.Client.zip"]["sha256"]:
              raise RuntimeError("Published client hash differs from the verified package")
          for platform in ("linux-x64", "win-x64"):
              item = build["server"][platform]
              expected_url = base_url + "/version/" + version + "/file/SS14.Server_" + platform + ".zip"
              if item["url"] != expected_url or item["size"] <= 0:
                  raise RuntimeError("Published server metadata is invalid")
              response = requests.head(expected_url, timeout=30)
              response.raise_for_status()
              if int(response.headers["Content-Length"]) != item["size"]:
                  raise RuntimeError("Published server size does not match its manifest")
          print("Published client and both server packages confirmed in the CDN manifest.", flush=True)
