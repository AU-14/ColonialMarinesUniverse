# CMU14: wave dispatcher. the serve gate in ci-shards.yml yields to higher-priority
# demand, and a yielded wave has no trigger of its own; this workflow re-fires it by
# re-running the triggering CI run's Required Checks job, whose re-completion fires the
# workflow_run trigger again. it also watches its own health via ci-sentinel.yml.
# no PAT, no protected environments, no holds anywhere: if this workflow dies, waves
# still fire naturally from every CI completion, only the priority ordering is lost
name: CI Dispatcher

on:
  schedule:
    # CMU14: github coalesces and drops schedules under load; the workflow_run triggers
    # carry the reaction time, this is the backstop
    - cron: '*/2 * * * *'
  workflow_run:
    workflows: [CI Shard Wave]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    name: Re-fire yielded waves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const repo = context.repo;
            const fresh = Date.now() - 6 * 3600 * 1000;

            // CMU14: served() helper removed; the loop below fetches each PR's
            // checks once and derives served + finalize state from the marker

            const waveInFlight = async (sha) => {
              const waves = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...repo, workflow_id: 'ci-shards.yml', per_page: 100,
              });
              return waves.some(w => w.head_sha === sha && w.status !== 'completed');
            };

            // open, non-draft PRs whose current head has a green CI run and no Testcases
            const open = await github.paginate(github.rest.pulls.list, {
              ...repo, state: 'open', per_page: 100, sort: 'updated', direction: 'desc',
            });
            const demand = [];
            for (const pr of open) {
              if (pr.draft) continue;
              const checks = await github.paginate(github.rest.checks.listForRef, {
                ...repo, ref: pr.head.sha, per_page: 100,
              });
              const marker = checks
                .filter(c => c.name === 'Testcases Complete')
                .sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at))[0];
              // CMU14: finalize pass. when the gate flags the final chunk, flip the
              // pending marker once every real leg has settled: all green -> success,
              // any red -> failure. red legs stay served and never reschedule.
              // skipped legs are the unfilled matrix placeholder, not real runs
              if (marker && marker.status === 'in_progress'
                  && marker.output?.title === 'final chunk admitted') {
                const legs = checks.filter(c =>
                  c.name.startsWith('Testcases /') && c.conclusion !== 'skipped');
                if (legs.length > 0 && legs.every(l => l.status === 'completed' && l.conclusion !== 'cancelled')) {
                  const green = legs.every(l => l.conclusion === 'success');
                  await github.rest.checks.update({
                    ...repo,
                    check_run_id: marker.id,
                    status: 'completed',
                    conclusion: green ? 'success' : 'failure',
                    output: {
                      title: green ? 'suite green' : 'suite has failed shards',
                      summary: `${legs.filter(l => l.conclusion === 'success').length}/${legs.length} shard legs green.`,
                    },
                  });
                  continue;
                }
              }
              if (marker && marker.status === 'completed') continue;
              if (Date.parse(pr.pushed_at) < fresh) continue;
              if (await waveInFlight(pr.head.sha)) continue;
              const runs = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'ci.yml', head_sha: pr.head.sha, per_page: 1,
              });
              const run = runs.data.workflow_runs[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') continue;
              // old-lineage runs serve their own inline shards; without this the
              // marker never appears and this loop re-runs them forever
              const rj = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: run.id, per_page: 100,
              });
              if (rj.some(j => j.name.startsWith('Testcases / '))) continue;
              const klass = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) ? 1 : 2;
              demand.push({ pr, run, klass });
            }
            if (demand.length === 0)
              return;
            demand.sort((a, b) => a.klass - b.klass || Date.parse(a.pr.pushed_at) - Date.parse(b.pr.pushed_at));

            for (const d of demand.slice(0, 2)) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: d.run.id, per_page: 100,
              });
              const handle = jobs.find(j => j.name === 'Required Checks');
              if (!handle) {
                core.info(`PR #${d.pr.number}: no Required Checks job to re-run`);
                continue;
              }
              try {
                await github.rest.actions.reRunJobForWorkflowRun({
                  ...repo, run_id: d.run.id, job_id: handle.id,
                });
                core.info(`re-fired wave for PR #${d.pr.number} via job ${handle.id}`);
              } catch (e) {
                // 403/422: run no longer completed or already re-running; the next
                // pass re-evaluates, never a wedged state
                core.info(`PR #${d.pr.number}: rerun refused (${e.status}), skipping`);
              }
            }
