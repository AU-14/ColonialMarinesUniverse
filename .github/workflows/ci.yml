name: CI

on:
  push:
    branches: [master, staging, stable]
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master, staging, stable]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # CMU14: per-PR supersession. a fresh push cancels the PR's own stale run instantly and
  # ci-queue-bouncer.yml cleans up closed/draft runs and the helper workflows. master
  # keeps its serial group so a merge burst waits for its evidence; staging/stable pushes
  # and merge queue runs keep per-run groups. shard capacity is arbitrated by
  # ci-shards.yml's serve gate, never by a run-level hold
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true && format('ci-pr-{0}', github.event.pull_request.number) || ((github.event_name == 'push' && github.ref == 'refs/heads/master') && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true }}

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: DebugOpt

jobs:
  source-guards:
    name: Source Guards
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Check CRLF
        run: python3 Tools/check_crlf.py

      - name: Reject RobustToolbox submodule updates in PRs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        env:
          SUBMODULE_EXEMPT_USERS: "maertayn"
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            if (!files.some(file => file.filename === 'RobustToolbox')) {
              return;
            }

            const author = context.payload.pull_request.user.login;

            const allowlist = (process.env.SUBMODULE_EXEMPT_USERS ?? '')
                .split(',')
                .map(name => name.trim())
                .filter(name => name.length > 0);

            const exempt = allowlist.includes(author)
                || ['OWNER', 'MEMBER'].includes(context.payload.pull_request.author_association);

            if (!exempt) {
              core.setFailed('Do not update the RobustToolbox submodule in pull requests.');
            }

      # engine must sit on an upstream release tag, never a master commit
      - name: Verify RobustToolbox submodule points at a release tag
        run: |
          SHA=$(git ls-tree HEAD RobustToolbox | awk '{print $3}')
          if ! git ls-remote --tags https://github.com/space-wizards/RobustToolbox.git | awk '{print $1}' | grep -qx "$SHA"; then
            echo "::error::RobustToolbox ${SHA} is not an upstream release tag. Pin a v* tag, not a master commit."
            exit 1
          fi

  build:
    name: Build
    needs: source-guards
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # CMU14: the environment is decorative only (deploy message on the PR), never
    # protected: nothing may hold this job runner-less
    environment: ci-build
    # CMU14: 35 covers the build plus the folded unit and lint runs
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: recursive

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore Content.YAMLLinter/Content.YAMLLinter.csproj

      - name: Build once
        run: dotnet build Content.YAMLLinter/Content.YAMLLinter.csproj --configuration ${{ env.CONFIGURATION }} --no-restore --property:WarningLevel=0 /m

      - name: Upload integration test build
        uses: actions/upload-artifact@v7
        with:
          name: build-integration-tests
          path: bin/Content.IntegrationTests/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload runtime build
        uses: actions/upload-artifact@v7
        with:
          name: build-runtime
          path: |
            bin/Content.Client/
            bin/Content.Server/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # CMU14: consumers restore the tracked tree from this artifact. one git fetch per
      # run replaces ~38 simultaneous fetches of the same 1.4G pack, which the git
      # backend throttled into 5-15 min checkout stalls. git archive carries tracked
      # files only: build output stays out and tracked obj texture dirs survive
      - name: Pack source tree
        run: |
          git archive --format=tar.gz -o source-tree.tar.gz HEAD
          # CMU14: -o resolves inside the -C directory, so climb out for the upload root
          git -C RobustToolbox archive --format=tar.gz -o ../toolbox-resources.tar.gz HEAD -- Resources

      - name: Upload source tree
        uses: actions/upload-artifact@v7
        with:
          name: source-tree
          path: |
            source-tree.tar.gz
            toolbox-resources.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # CMU14: lint and unit run on the build runner before any shard can queue. a red
      # lint or unit run fails Build, so a dead PR costs one job instead of a full
      # shard wave, and with no separate helper jobs nothing starves behind other
      # PRs' shard legs. the 12m step caps bound a hung run early, nothing retries
      # the build job
      - name: Run Content.Tests
        run: |
          set +e
          timeout 12m dotnet test bin/Content.Tests/Content.Tests.dll --verbosity normal \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory bin/Content.Tests/TestResults \
            -- NUnit.ExplicitMode=None > bin/Content.Tests/test-output.log 2>&1
          status=$?
          bash "$GITHUB_WORKSPACE/.github/scripts/report_test_failures.sh" \
            "$status" bin/Content.Tests/test-output.log "Unit Tests"

      - name: Run YAML Linter
        run: timeout 12m dotnet bin/Content.YAMLLinter/Content.YAMLLinter.dll

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-tests
          path: |
            bin/Content.Tests/TestResults/
            bin/Content.Tests/test-output.log
          if-no-files-found: ignore
          retention-days: 3

  asset-validation:
    name: Asset Validation
    needs: source-guards
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select asset checks
        id: changes
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let changed = null;
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
              });
              changed = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
            }
            const all = changed === null || changed.some(file =>
              file === 'RobustToolbox' || file === '.github/workflows/ci.yml' ||
              file.startsWith('.github/Schemas/') || file.startsWith('.github/scripts/'));
            const rga = all || changed.some(file => /attributions\.ya?ml$/.test(file));
            const maps = all || changed.some(file => /^(Content\.CMU\/)?Resources\/Maps\//.test(file));
            const rsi = all || changed.some(file => file.includes('.rsi/'));
            for (const [key, value] of Object.entries({rga, maps, rsi, any: rga || maps || rsi}))
              core.setOutput(key, String(value));

      - uses: actions/checkout@v7
        if: steps.changes.outputs.any == 'true'
        with:
          # CMU14: single-level submodules: validators read RobustToolbox/Schemas at depth 1,
          # the nested engine submodules are never read here
          submodules: true

      - uses: actions/setup-python@v7.1.0
        if: steps.changes.outputs.any == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/Schemas/*requirements.txt

      - name: Install asset validators
        if: steps.changes.outputs.any == 'true'
        run: python3 -m pip install pillow jsonschema yamale -r .github/Schemas/rga_requirements.txt -r .github/Schemas/mapfile_requirements.txt

      - name: Validate attributions
        if: steps.changes.outputs.rga == 'true'
        run: |
          python3 .github/scripts/validate_yamale.py \
            --schema .github/Schemas/rga.yml \
            --path-pattern '.*attributions.ya?ml$' \
            --validators .github/Schemas/rga_validators.py

      - name: Validate maps
        if: steps.changes.outputs.maps == 'true'
        run: |
          python3 .github/scripts/validate_yamale.py \
            --schema RobustToolbox/Schemas/mapfile.yml \
            --path-pattern '.*Resources/Maps/.*' \
            --validators RobustToolbox/Schemas/mapfile_validators.py

      - name: Validate RSIs
        if: steps.changes.outputs.rsi == 'true'
        run: |
          # CMU14: retain upstream structural checks and recognize the existing donor-cape license.
          python3 .github/scripts/validate_cmu_rsis.py Resources/ Content.CMU/Resources/

  required-checks:
    name: Required Checks
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - source-guards
      - build
      - asset-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required job results
        uses: actions/github-script@v9.0.0
        with:
          script: |
            // CMU14: Testcases live in the CI Shard Wave workflow (base-branch
            // triggered), so they land on the PR as their own check runs after this
            // run completes; this aggregator covers what runs in ci.yml itself
            const results = {
              'Source Guards': '${{ needs.source-guards.result }}',
              'Build': '${{ needs.build.result }}',
              'Asset Validation': '${{ needs.asset-validation.result }}',
            };

            const failed = Object.entries(results)
              .filter(([, result]) => result !== 'success')
              .map(([name, result]) => `${name}: ${result}`);

            if (failed.length > 0) {
              core.setFailed(`Required checks failed: ${failed.join(', ')}`);
            }
