name: CI

on:
  push:
    branches: [master, staging, stable]
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [master, staging, stable]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # CMU14: only PR pushes supersede each other. every branch push and merge-queue run
  # finishes, otherwise the next merge cancels it and nobody knows which merge broke master
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: DebugOpt

jobs:
  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: recursive

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore Content.YAMLLinter/Content.YAMLLinter.csproj

      - name: Build once
        run: dotnet build Content.YAMLLinter/Content.YAMLLinter.csproj --configuration ${{ env.CONFIGURATION }} --no-restore --property:WarningLevel=0 /m

      - name: Run Content.Tests
        run: dotnet test bin/Content.Tests/Content.Tests.dll --verbosity normal -- NUnit.ConsoleOut=0 NUnit.ExplicitMode=None

      - name: Upload YAML linter build
        uses: actions/upload-artifact@v7
        with:
          name: build-yaml-linter
          path: bin/Content.YAMLLinter/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload integration test build
        uses: actions/upload-artifact@v7
        with:
          name: build-integration-tests
          path: bin/Content.IntegrationTests/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload runtime build
        uses: actions/upload-artifact@v7
        with:
          name: build-runtime
          path: |
            bin/Content.Client/
            bin/Content.Server/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  yaml-linter:
    name: YAML Linter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: recursive

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-yaml-linter
          path: bin/Content.YAMLLinter/

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-runtime
          path: bin/

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run YAML Linter
        run: dotnet bin/Content.YAMLLinter/Content.YAMLLinter.dll

  asset-validation:
    name: Asset Validation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select asset checks
        id: changes
        uses: actions/github-script@v9.0.0
        with:
          script: |
            let changed = null;
            if (context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
              });
              changed = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
            }
            const all = changed === null || changed.some(file =>
              file === 'RobustToolbox' || file === '.github/workflows/ci.yml' ||
              file.startsWith('.github/Schemas/') || file.startsWith('.github/scripts/'));
            const rga = all || changed.some(file => /attributions\.ya?ml$/.test(file));
            const maps = all || changed.some(file => /^(Content\.CMU\/)?Resources\/Maps\//.test(file));
            const rsi = all || changed.some(file => file.includes('.rsi/'));
            for (const [key, value] of Object.entries({rga, maps, rsi, any: rga || maps || rsi}))
              core.setOutput(key, String(value));

      - uses: actions/checkout@v7
        if: steps.changes.outputs.any == 'true'
        with:
          submodules: recursive

      - uses: actions/setup-python@v7.0.0
        if: steps.changes.outputs.any == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/Schemas/*requirements.txt

      - name: Install asset validators
        if: steps.changes.outputs.any == 'true'
        run: python3 -m pip install pillow jsonschema yamale -r .github/Schemas/rga_requirements.txt -r .github/Schemas/mapfile_requirements.txt

      - name: Validate attributions
        if: steps.changes.outputs.rga == 'true'
        run: |
          python3 .github/scripts/validate_yamale.py \
            --schema .github/Schemas/rga.yml \
            --path-pattern '.*attributions.ya?ml$' \
            --validators .github/Schemas/rga_validators.py

      - name: Validate maps
        if: steps.changes.outputs.maps == 'true'
        run: |
          python3 .github/scripts/validate_yamale.py \
            --schema RobustToolbox/Schemas/mapfile.yml \
            --path-pattern '.*Resources/Maps/.*' \
            --validators RobustToolbox/Schemas/mapfile_validators.py

      - name: Validate RSIs
        if: steps.changes.outputs.rsi == 'true'
        run: |
          # CMU14: retain upstream structural checks and recognize the existing donor-cape license.
          python3 .github/scripts/validate_cmu_rsis.py Resources/ Content.CMU/Resources/

  required-checks:
    name: Required Checks
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - build
      - yaml-linter
      - asset-validation
      - integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required job results
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const results = {
              'Build': '${{ needs.build.result }}',
              'YAML Linter': '${{ needs.yaml-linter.result }}',
              'Asset Validation': '${{ needs.asset-validation.result }}',
              'Content.IntegrationTests': '${{ needs.integration-tests.result }}',
            };

            const failed = Object.entries(results)
              .filter(([, result]) => result !== 'success')
              .map(([name, result]) => `${name}: ${result}`);

            if (failed.length > 0) {
              core.setFailed(`Required checks failed: ${failed.join(', ')}`);
            }

  integration-tests:
    name: Testcases / ${{ matrix.shard.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: build
    # one instance of each shard at a time across overlapping staging runs
    # CMU14: staging only. on master a third overlapping run would cancel the second one's
    # waiting shards (github keeps one pending job per group), which is the gap we're closing
    concurrency:
      group: ${{ github.ref == 'refs/heads/staging' && format('ci-shard-{0}-{1}', github.ref, matrix.shard.name) || format('ci-shard-{0}-{1}-{2}', github.ref, matrix.shard.name, github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: root_1
            root_group: 0
            root_groups: 2
          - name: root_2
            root_group: 1
            root_groups: 2
          # Bulk entity/component sweeps remain in the manual Build & Test Debug workflow.
          - name: admin_access_ui
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Administration.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Access.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Commands.
              | FullyQualifiedName~Content.IntegrationTests.Tests.EncryptionKeys.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Lobby.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Roles.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Toolshed.
              | FullyQualifiedName~Content.IntegrationTests.Tests.UserInterface.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Afk.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Alerts.
              | FullyQualifiedName~Content.IntegrationTests.Tests.ClientSession.
              | FullyQualifiedName~Content.IntegrationTests.Tests.GameTestTests.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Helpers.
          - name: atmos_fluids_physics
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Atmos.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Explosion.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Fluids.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Gravity.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Physics.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Decals.
              | FullyQualifiedName~Content.IntegrationTests.Tests.FootPrint.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Weather.
          - name: mapping_station_shuttle_round
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.GameRules.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Mapping.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Procedural.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Replays.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Round.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Shuttle.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Station.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Tiles.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Chasm.
              | FullyQualifiedName~Content.IntegrationTests.Tests.EntityTable.
          - name: cleanup_entities_world
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Cleanup.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Damageable.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Destructible.
              | FullyQualifiedName~Content.IntegrationTests.Tests.DeviceLinking.
              | FullyQualifiedName~Content.IntegrationTests.Tests.DeviceNetwork.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Disposal.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Doors.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Embedding.
              | FullyQualifiedName~Content.IntegrationTests.Tests.GameObjects.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Payload.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Power.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Weldable.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Wires.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Containers.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Forensics.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Mobs.
          - name: gameplay_core
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Actions.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Body.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Buckle.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Chameleon.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Climbing.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Cloning.
              | FullyQualifiedName~Content.IntegrationTests.Tests.DoAfter.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Changeling.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Chat.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Clumsy.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Examine.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Eye.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Gibbing.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Humanoid.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Identity.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Medical.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Nutrition.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Paper.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Respirator.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Security.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Speech.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Stunnable.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Zombie.
          - name: gameplay_runtime
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Interaction.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Internals.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Minds.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Movement.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Networking.
              | FullyQualifiedName~Content.IntegrationTests.Tests.NPC.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Puller.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Follower.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Vehicle.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Trigger.
          - name: items_storage_crafting
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Chemistry.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Construction.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Hands.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Lathe.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Materials.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Sprite.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Engineering.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Holosign.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Inventory.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Items.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Kitchen.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Labels.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Light.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Markings.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Mousetrap.
              | FullyQualifiedName~Content.IntegrationTests.Tests.SmartFridge.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Stacks.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Tools.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Weapons.
          - name: storage_crafting_misc
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Storage.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Strip.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Tag.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Utility.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Vending.
              | FullyQualifiedName~Content.IntegrationTests.Tests.IconSmoothing.
          - name: proto_lint_serial
            filter: >-
              FullyQualifiedName~Content.IntegrationTests.Tests.Guidebook.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Linter.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Preferences.
              | FullyQualifiedName~Content.IntegrationTests.Tests.PrototypeTests.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Serialization.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Audio.
              | FullyQualifiedName~Content.IntegrationTests.Tests.NameIdentifier.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Research.
          - name: rmc
            filter: >-
              FullyQualifiedName~RMC14.
              & FullyQualifiedName!~RMC14.PlanetMapLoadTests.
          # CMU14: full-rotation map sweeps exceed the normal per-test watchdog.
          - name: map_loading
            filter: >-
              FullyQualifiedName~RMC14.PlanetMapLoadTests.
              | FullyQualifiedName~CMU14.Dropship.MohawkLandingTest.
          - name: cmu_medical_anatomy
            filter: >-
              FullyQualifiedName~CMU14.Medical.Anatomy.
          - name: cmu_medical_treatment
            filter: >-
              FullyQualifiedName~CMU14.Medical.Treatment.
          - name: cmu_chemistry
            filter: >-
              FullyQualifiedName~CMU14.Chemistry.
          - name: cmu_ships
            filter: >-
              (FullyQualifiedName~CMU14.Dropship.
              | FullyQualifiedName~CMU14.Blackfoot.
              | FullyQualifiedName~CMU14.Fighter.
              | FullyQualifiedName~CMU14.CargoVehicle.
              | FullyQualifiedName~CMU14.Maps.)
              & FullyQualifiedName!~CMU14.Dropship.MohawkLandingTest.
          - name: cmu_spatial
            filter: >-
              FullyQualifiedName~CMU14.ZLevels.
              | FullyQualifiedName~CMU14.Camera.
              | FullyQualifiedName~Content.IntegrationTests.CMU.
          # CMU14: keep the largest Yautja fixtures in separate test processes.
          - name: cmu_yautja
            filter: >-
              FullyQualifiedName~CMU14.Yautja.
              & FullyQualifiedName!~CMU14.Yautja.YautjaBowTest.
              & FullyQualifiedName!~CMU14.Yautja.YautjaPredatorRoleTest.
              & FullyQualifiedName!~CMU14.Yautja.YautjaSmokeTest.
          - name: cmu_yautja_weapons
            filter: FullyQualifiedName~CMU14.Yautja.YautjaBowTest.
          - name: cmu_yautja_roles
            filter: FullyQualifiedName~CMU14.Yautja.YautjaPredatorRoleTest.
          - name: cmu_yautja_smoke
            filter: FullyQualifiedName~CMU14.Yautja.YautjaSmokeTest.
          - name: cmu_diagnostics
            filter: >-
              FullyQualifiedName~CMU14.Diagnostics.
              | FullyQualifiedName~Content.IntegrationTests.Tests.Performance.
          # CMU14: fresh lobby pairs need memory headroom after the gameplay fixtures.
          - name: cmu_lobby_ui
            filter: >-
              FullyQualifiedName~CMU14.Round.CMUPresetVoteTest.
              | FullyQualifiedName~CMU14.Chat.ChatLogLayoutTest.
              | FullyQualifiedName~CMU14.Lobby.OptionsThemeRegressionTest.
              | FullyQualifiedName~CMU14.Overwatch.SupportLaunchButtonTest.
          - name: cmu_medical
            filter: >-
              FullyQualifiedName~CMU14.Medical.
              & FullyQualifiedName!~CMU14.Medical.Anatomy.
              & FullyQualifiedName!~CMU14.Medical.Treatment.
          - name: cmu
            filter: >-
              FullyQualifiedName~CMU14.
              & FullyQualifiedName!~CMU14.Medical.
              & FullyQualifiedName!~CMU14.Chemistry.
              & FullyQualifiedName!~CMU14.Dropship.
              & FullyQualifiedName!~CMU14.Blackfoot.
              & FullyQualifiedName!~CMU14.Fighter.
              & FullyQualifiedName!~CMU14.CargoVehicle.
              & FullyQualifiedName!~CMU14.Maps.
              & FullyQualifiedName!~CMU14.ZLevels.
              & FullyQualifiedName!~CMU14.Camera.
              & FullyQualifiedName!~CMU14.Yautja.
              & FullyQualifiedName!~CMU14.Diagnostics.
              & FullyQualifiedName!~CMU14.Round.CMUPresetVoteTest.
              & FullyQualifiedName!~CMU14.Chat.ChatLogLayoutTest.
              & FullyQualifiedName!~CMU14.Lobby.OptionsThemeRegressionTest.
              & FullyQualifiedName!~CMU14.Overwatch.SupportLaunchButtonTest.
          - name: au14
            filter: FullyQualifiedName~Content.IntegrationTests._AU14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          submodules: recursive

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-integration-tests
          path: bin/Content.IntegrationTests/

      - uses: actions/download-artifact@v8.0.2
        with:
          name: build-runtime
          path: bin/

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Prepare runtime content
        run: |
          mkdir -p bin/Resources bin/RobustToolbox/Resources
          cp -r Resources/* bin/Resources/
          cp -r RobustToolbox/Resources/* bin/RobustToolbox/Resources/

      - name: Run ${{ matrix.shard.name }}
        shell: bash
        env:
          # RT v290's parallel YAML loader mutates the variant dictionary without
          # synchronization. A single PLINQ worker avoids losing prototypes during
          # startup (e.g. GasOutletInjector in PushKindInheritance).
          # Keep this test-process workaround until the engine loader is fixed.
          DOTNET_PROCESSOR_COUNT: "1"
        run: |
          export DOTNET_gcServer=1
          shard="${{ matrix.shard.name }}"

          # CMU14: bound concurrent pairs and allow the full-rotation map sweeps to finish.
          workers=4
          hang_timeout=5m
          case "$shard" in
            root_1|cmu|cmu_spatial|cmu_medical_anatomy|cmu_yautja*) workers=2 ;;
            cmu_lobby_ui) workers=1 ;;
            map_loading) workers=1; hang_timeout=20m ;;
          esac

          if [[ "$shard" == root_* ]]; then
            root_group='${{ matrix.shard.root_group }}'
            root_groups='${{ matrix.shard.root_groups }}'
            shopt -s nullglob
            files=(Content.IntegrationTests/Tests/*.cs)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::$shard shard: no test files found in Content.IntegrationTests/Tests!"
              exit 1
            fi
            FILTER=""
            for i in "${!files[@]}"; do
              f="${files[$i]}"
              base=$(basename "$f" .cs)
              if [[ "$base" == "EntityTest" ]] || (( i % root_groups != root_group )); then
                continue
              fi
              FILTER="${FILTER:+$FILTER | }FullyQualifiedName~Content.IntegrationTests.Tests.$base."
            done
            if [ -z "$FILTER" ]; then
              echo "::error::$shard shard: no test files assigned!"
              exit 1
            fi
          else
            FILTER='${{ matrix.shard.filter }}'
          fi

          # Localization policy and upstream content freezes are opt-in in the full suite.
          FILTER="($FILTER) & FullyQualifiedName!~.Localization. & FullyQualifiedName!~.WizdenContentFreeze."
          echo "--- $shard shard filter ---"
          echo "$FILTER"
          cd bin/Content.IntegrationTests || exit 1
          # Runner shutdowns are retried by ci-retry-infra.yml; test failures need attention.
          # NUnit otherwise drops the execution filter when a shard exceeds 2,000 tests.
          dotnet test Content.IntegrationTests.dll \
            --verbosity normal --filter "$FILTER" \
            --blame-hang-timeout "$hang_timeout" --blame-hang-dump-type none \
            --logger "trx;LogFileName=$shard.trx" --results-directory TestResults \
            -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.ExplicitMode=None NUnit.AssemblySelectLimit=10000 \
            NUnit.NumberOfTestWorkers="$workers" # CMU14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard.name }}
          # CMU14: retain results and blame sequences without multi-gigabyte process dumps.
          path: |
            bin/Content.IntegrationTests/TestResults/
            !bin/Content.IntegrationTests/TestResults/**/*.dmp
          if-no-files-found: ignore
          retention-days: 3
