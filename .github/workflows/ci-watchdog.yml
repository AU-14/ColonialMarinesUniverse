name: CI Watchdog

# CMU14: fleet liveness probe. ci-scheduler admission passes are the only thing
# standing between gated waves and a runner; when none completes while CI demand
# exists, every PR freezes with no error anywhere on its checks page. this probe
# reads Actions metadata only, adds no log lines to any CI job, and never runs on
# PR events. keep it out of branch protection: it is fleet monitoring, not PR
# evidence, and a required check would freeze every PR the moment it alarms.
# limits: it needs a runner itself and GitHub drops scheduled runs under load, so
# it catches degradation, config breakage and scheduler livelock, not a fully
# dead pool. it raises the floor, it is not a guarantee.

on:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  issues: write

concurrency:
  group: ci-watchdog
  # CMU14: a stale probe still reads live state, so cancelling an older one only
  # saves runner minutes and never loses an alarm
  cancel-in-progress: true

jobs:
  probe:
    name: Fleet liveness probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const repo = context.repo;
            const GATED = ['ci.yml', 'build-test-debug.yml'];
            // demand must outlive a fresh push's transit time, else every PR
            // opening alarms for a minute
            const DEMAND_MIN_AGE = 10 * 60 * 1000;
            // a lone CI run completes no runs and fires no workflow_run trigger
            // for its whole duration, and github drops scheduled runs, so quiet
            // gaps past an hour are normal. silence past 90 min means a stall
            const STALE = 90 * 60 * 1000;

            let demand = 0;
            const cutoff = Date.now() - DEMAND_MIN_AGE;
            for (const file of GATED) {
              for (const status of ['queued', 'in_progress']) {
                const page = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...repo, workflow_id: file, status, per_page: 100,
                });
                demand += page.filter(r => Date.parse(r.created_at) < cutoff).length;
              }
            }

            const { data: done } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'ci-scheduler.yml', status: 'completed', per_page: 1,
            });
            const last = done.workflow_runs[0];
            const age = last ? Date.now() - Date.parse(last.updated_at) : null;
            const minutes = age === null ? null : Math.round(age / 60000);

            const MARKER = '[ci-watchdog alarm]';
            async function markerIssue() {
              const open = await github.paginate(github.rest.issues.list, {
                ...repo, state: 'open', per_page: 100,
              });
              return open.find(i => i.title.startsWith(MARKER));
            }
            // any healthy probe closes the alarm, not just a quiet fleet: a busy
            // fleet with a working scheduler would otherwise keep a stale alarm
            // open for hours
            async function recover() {
              const issue = await markerIssue();
              if (issue) {
                await github.rest.issues.createComment({
                  ...repo, issue_number: issue.number,
                  body: 'Recovered: the fleet liveness probe is healthy again.',
                });
                await github.rest.issues.update({ ...repo, issue_number: issue.number, state: 'closed' });
              }
            }
            async function raise(alarm) {
              const body = `${alarm}\n\nManaged by the CI Watchdog. It closes this issue when the fleet recovers.`;
              const issue = await markerIssue();
              if (!issue)
                await github.rest.issues.create({ ...repo, title: `${MARKER} scheduler stalled`, body });
              else if (issue.body !== body)
                await github.rest.issues.update({ ...repo, issue_number: issue.number, body });
              core.setFailed(alarm);
            }

            if (demand === 0) {
              await recover();
              core.info('fleet quiet: no demand past the transit threshold.');
              return;
            }

            if (!last) {
              await raise(`${demand} CI run(s) waiting and the scheduler has never completed a pass.`);
              return;
            }
            // cancelled and startup failures count too: a pass that never finished
            // its evaluation is livelock evidence, not health
            if (last.conclusion !== 'success') {
              await raise(`Newest completed scheduler pass ended ${last.conclusion} ${minutes} min ago while ${demand} CI run(s) wait: ${last.html_url}`);
              return;
            }
            if (age > STALE) {
              await raise(`No completed scheduler pass in ${minutes} min while ${demand} CI run(s) wait. Newest: ${last.html_url}`);
              return;
            }
            await recover();
            core.info(`healthy: scheduler pass ${last.conclusion} ${minutes} min ago, ${demand} CI run(s) waiting.`);
