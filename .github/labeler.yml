"C: Sprites": # CMU14: shorthand label
- changed-files:
  - any-glob-to-any-file: '**/*.rsi/*.png'

"C: Map": # CMU14: shorthand label
- changed-files:
  - any-glob-to-any-file:
    - 'Resources/Maps/**/*.yml'
    - 'Resources/Prototypes/Maps/**/*.yml'
    - 'Content.CMU/Resources/Maps/**/*.yml'
    - 'Content.CMU/Resources/Prototypes/**/Maps/**/*.yml'

"C: UI": # CMU14: shorthand label
- changed-files:
  - any-glob-to-any-file: '**/*.xaml*'

"C: Shaders": # CMU14: shorthand label
- changed-files:
  - any-glob-to-any-file: '**/*.swsl'

"C: Audio": # CMU14: shorthand label
- changed-files:
  - any-glob-to-any-file: '**/*.ogg'

"C: No C#": # CMU14: shorthand label
- changed-files:
  # Equiv to any-glob-to-all as long as this has one matcher. If ALL changed files are not C# files, then apply label.
  - all-globs-to-all-files: "!**/*.cs"

"C: Translations": # CMU14: shorthand label, for the slavs
  - changed-files:
      - any-glob-to-any-file:
          - "Resources/Locale/**/*.ftl"
          - "Content.CMU/Resources/Locale/**/*.ftl"
