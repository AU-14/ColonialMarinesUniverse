- type: entity
  id: ResearchAndDevelopmentServer
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: R&D server
  description: Contains the collective knowledge of the station's scientists. Destroying it would send them back to the stone age. You don't want that do you?
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    snapCardinals: true
    layers:
      - state: server-off
      - state: server-on
        visible: false
        map: ["enum.PowerDeviceVisualLayers.Powered"]
      - state: variant-research
      - state: server_o
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 1.2
    energy: 3.0
    color: "#b211b2"
  - type: LitOnPowered
  - type: ResearchServer
  - type: TechnologyDatabase
    supportedDisciplines:
    - Industrial
    - Arsenal
    - Experimental
    - CivilianServices
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: WiresPanel
  - type: WiresVisuals
  - type: Machine
    board: ResearchAndDevelopmentServerMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: Appearance
  - type: GenericVisualizer
    visuals:
        enum.PowerDeviceVisuals.Powered:
          enum.PowerDeviceVisualLayers.Powered:
            True: {visible: true}
            False: {visible: false}
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    enabled: false
    sound:
      collection: ServerFans
  - type: GuideHelp
    guides:
    - Science

- type: entity
  id: BaseResearchAndDevelopmentPointSource
  parent: BaseMachinePowered
  name: "base R&D point source"
  # We should make this abstract once there are actual point sources.
  components:
  - type: Sprite
    sprite: Structures/Machines/rndpointsource.rsi
    layers:
    - state: rndpointsource-off
    - state: rndpointsource
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: ResearchClient
  - type: ResearchPointSource
    pointspersecond: 25
    active: true
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#3db83b"
  - type: ActivatableUI
    key: enum.ResearchClientUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: {visible: true}
          False: {visible: false}
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
  - type: GuideHelp
    guides:
    - Science
- type: entity
  parent: CMBaseStructure
  id: CMUResearchDataTerminal
  name: research data terminal
  description: A terminal for accessing research data.
  components:
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: Transform
    anchored: false
  - type: Anchorable
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: research
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: ResearchDataTerminal
  - type: ActivatableUI
    key: enum.ResearchDataTerminalUI.Key
  - type: UserInterface
    interfaces:
      enum.ResearchDataTerminalUI.Key:
        type: ResearchDataTerminalBui

- type: entity
  parent: CMBaseStructure
  id: CMUXRFScanner
  name: XRF scanner
  description: A spectrometer that bombards a sample in high energy radiation to detect emitted fluorescent x-ray patterns. By using the emission spectrum of the sample it can identify its chemical composition.
  suffix: Corporate
  components:
  - type: Appearance
  - type: Anchorable
  - type: GenericVisualizer
    visuals:
      enum.XRFScannerVisuals.State:
        enum.XRFScannerVisuals.State:
          Scanner: { state: base }
          Sample: { state: sample }
          Processing: { state: processing }
          Finished: { state: finished }
          Error: { state: error }
          Failed: { state: failed }
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Structures/Machines/Science/reagent_analyzer.rsi
    noRot: true
    layers:
    - state: base
      map: [ "enum.XRFScannerVisuals.State" ]
    #- state: sample
    #  map: ["enum.XRFScannerState.Sample"]
    #  visible: false
    #- state: processing
    #  map: ["enum.XRFScannerState.Processing"]
    #  visible: false
    #- state: finished
    #  map: ["enum.XRFScannerState.Finished"]
    #  visible: false
    #- state: error
    #  map: ["enum.XRFScannerState.Error"]
    #  visible: false
    #- state: failed
    #  map: ["enum.XRFScannerState.Failed"]
    #  visible: false
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: XRFScanner
    faction: corporate
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: ContainerContainer
    containers:
      sample: !type:ContainerSlot

- type: entity
  parent: CMUXRFScanner
  id: CMUXRFScannerGovfor
  suffix: GOVFOR
  components:
  - type: XRFScanner
    faction: govfor

- type: entity
  parent: CMUXRFScanner
  id: CMUXRFScannerOpfor
  suffix: OPFOR
  components:
  - type: XRFScanner
    faction: opfor

- type: entity
  parent: CMUXRFScanner
  id: CMUXRFScannerColony
  suffix: Colony
  components:
  - type: XRFScanner
    faction: colony

- type: entity
  parent: CMUXRFScanner
  id: CMUXRFScannerNobody
  suffix: Generic
  components:
  - type: XRFScanner
    faction: none

- type: entity
  parent: CMBaseStructure
  id: CMUChemSimulator
  name: synthesis simulator
  description: This computer uses advanced algorithms to perform simulations of reagent properties, for the purpose of calculating the synthesis required to make a new variant.
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ChemSimulatorVisuals.Sim:
        enum.ChemSimulatorVisuals.Sim:
          Normal: { state: modifier }
          Off: { state: modifier_off }
          Running: { state: modifier_running }
          Reading: { state: modifier_reading }
          Printing: { state: modifier_printing }
          Ready: { state: modifier_ready }
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: Anchorable
  - type: Sprite
    sprite: Structures/Machines/Science/chem_simulator.rsi
    offset: "0.5, 0.5"
    state: modifier
  - type: ChemSimulator
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,0.4,1.40,1"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: ContainerContainer
    containers:
      target: !type:ContainerSlot
      reference: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.ChemSimulatorUI.Key
  - type: UserInterface
    interfaces:
      enum.ChemSimulatorUI.Key:
        type: ChemSimulatorBui
