- type: entity
  parent: StructureHealthMachineFlimsy
  id: SurveillanceCameraAssembly
  name: camera
  description: A surveillance camera. Doesn't seem to be watching anybody any time soon. Probably.
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
    - type: Clickable
    - type: InteractionOutline
    - type: Construction
      graph: SurveillanceCamera
      node: assembly
    - type: WallMount
    - type: Transform
      anchored: true
    - type: Damageable
      damageModifierSet: SteelMod
    - type: Destructible
      thresholds: *ThresholdsSurveilCamera
    - type: Sprite
      drawdepth: WallMountedItems
      sprite: Structures/Wallmounts/camera.rsi
      layers:
        - state: camera_off
