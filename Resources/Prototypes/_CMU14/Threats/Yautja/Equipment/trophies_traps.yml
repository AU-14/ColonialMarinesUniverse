- type: entity
  parent: BaseItem
  id: CMUYautjaHuntingTrap
  name: hunting trap
  description: A bizarre Yautja device used for trapping and killing prey.
  components:
  - type: Sprite
    sprite: _CMU14/Yautja/yautja_items.rsi
    drawdepth: Items
    layers:
    - state: yauttrap0
      map: [ "base" ]
  - type: Item
    sprite: _CMU14/Yautja/yautja_items.rsi
    size: Small
  - type: StaticPrice
    price: 50
  - type: YautjaTechItem
    blockPickup: false
    blockUse: false
  - type: YautjaTrap
    triggerSound: !type:SoundPathSpecifier
      path: /Audio/_CMU14/Yautja/tablehit1.ogg
    blocksXenoHeal: true
    forceXenoHelpEmote: true
    forceHumanPainEmote: true
    xenoInterferenceDuration: 100
  - type: StepTrigger
    active: false
    intersectRatio: 0.15
    requiredTriggeredSpeed: 0.5
    ignoreWeightless: true
    stepOn: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Layer:
        base:
          yauttrap0: { state: yauttrap0 }
          yauttrap1: { state: yauttrap1 }
          yauttrapgrass: { state: yauttrapgrass }
          yauttrapdirt: { state: yauttrapdirt }
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: false
        layer:
        - LowImpassable
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 30
        mask:
        - ItemMask
