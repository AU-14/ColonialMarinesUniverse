- type: entity
  parent: [ CMBaseMask, CMUBaseGasMaskFilterSlot ]
  id: CMUYautjaMask
  name: clan mask
  description: A beautifully designed metallic face mask, both ornate and functional.
  components:
  - type: Sprite
    sprite: _CMU14/Yautja/mask.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _CMU14/Yautja/mask.rsi
    slots:
    - Mask
    - Suitstorage
  - type: Item
    size: Small
  - type: Tag
    tags:
    - GasMask
  - type: Mask
    enabled: false
  - type: YautjaMask
    requiresYautjaWearer: true
    drain: 3
    drainEvery: 2
    zoomLevel: 1.6
    zoomOffset: 14
  - type: ParasiteResistance
    maxCount: 100
  - type: EyeProtection
    protectionTime: 20
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: FireProtection
    reduction: 0.5
  - type: IngestionBlocker
    # Yautja masks are worn by default and do not have a pull-down state. Keep
    # the food/drink interaction available while the mask's sealed systems are
    # represented by its dedicated Yautja visor logic.
    enabled: false
  - type: IdentityBlocker
  - type: YautjaMaskAccessoryHolder
  - type: YautjaTechItem
    blockPickup: false
  - type: CMArmor
    melee: 40
    bullet: 50
    bio: 45
    explosionArmor: 50
  - type: Corrodible
    isCorrodible: false
  - type: RMCImmuneToIgnition
    intensityResistance: 10
    immuneToDirectHits: false
  - type: StaticPrice
    price: 100

