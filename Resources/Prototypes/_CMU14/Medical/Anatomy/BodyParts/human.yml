- type: entity
  parent: BaseItem
  id: CMUPartHumanBase
  name: human body part
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: Gibbable
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
    - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  parent: CMUPartHumanBase
  id: CMUPartHumanTorso
  components:
  - type: BodyPart
    partType: Torso
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20
  - type: BodyPartHealth
    max: 150
    current: 150
    severanceThreshold: 999999  # safety lock — torso never severs
    resistance:
      Brute: 0.9
  - type: Bone
    integrity: 120
    integrityMax: 120
    bruteAbsorbFraction: 0.65
    fractureThresholds:
      Hairline: 80
      Simple: 50
      Compound: 25
      Shattered: 5
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
    drawdepth: Items

- type: entity
  parent: CMUPartHumanBase
  id: CMUPartHumanHead
  components:
  - type: BodyPart
    partType: Head
    vital: true
  - type: Input
    context: ghost
  - type: Tag
    tags:
    - Head
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10
  - type: BodyPartHealth
    max: 60
    current: 60
    severanceThreshold: 170  # decapitation requires 170 structural damage past zero health
    resistance:
      Brute: 0.85
  - type: Bone
    integrity: 80
    integrityMax: 80
    bruteAbsorbFraction: 0.7
    fractureThresholds:
      Hairline: 65
      Simple: 40
      Compound: 20
      Shattered: 5
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: head_m
    drawdepth: Items

