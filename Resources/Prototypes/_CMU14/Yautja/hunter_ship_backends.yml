- type: entity
  parent: CMFoodBase
  id: CMUHunterShipFishFingers
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
    - fishy
  - type: Tag
    tags:
    - Cooked
    - Meat
  - type: Food
    transferAmount: 5
  - type: Item
    size: Small
    sprite: _CMU14/HunterShip/obj/items/food/fish.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Protein
          Quantity: 5
  - type: Extractable
    grindableSolutionName: food
  - type: InjectableSolution
    solution: food
  - type: DrawableSolution
    solution: food

- type: entity
  parent: CMBeakerLarge
  id: CMUHunterShipSilverCatalystBeaker
  name: "Large silver beaker"
  description: "A large silver beaker. Can hold up to 240 units. The beaker itself acts as a silver catalyst."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _CMU14/HunterShip/obj/items/chemistry.rsi
    layers:
    - state: "beakersilver"
  - type: Icon
    sprite: _CMU14/HunterShip/obj/items/chemistry.rsi
    state: "beakersilver"
  - type: Item
    sprite: _RMC14/Objects/Medical/large_beaker.rsi
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 240
  - type: SolutionTransfer
    transferAmount: 5
    maxTransferAmount: 240
    canChangeTransferAmount: true
    transferAmounts: [5, 10, 15, 20, 25, 30, 40, 60, 80, 100, 120, 240]
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 5000

