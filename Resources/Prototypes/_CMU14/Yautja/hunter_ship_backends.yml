# Stable Hunter Ship semantic backends.
#
# These prototypes are intentionally outside the generated Maps directory. The
# converter may regenerate the visual wrappers on every source-table batch, but
# these source-exact gameplay roots must remain available to that generator and
# to the runtime prototype loader.

