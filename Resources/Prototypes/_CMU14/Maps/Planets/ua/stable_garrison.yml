    - WYPMC
    defaultgovfor: USCM
    defaultopfor: UPP
    govforinship: false
    opforinship: true
    daycycleenabled: true
    thirdparties:
    - ICRCReliefParty
    - TimeSharesSalesman
    - UPPGROM
    - UPPGROMAlt
    - UPPGROMAlt2
    - USArmyTank
    - UACGLostTeam
    - LACNSniperteam
    - cultistThirdParty
    - CMBInvestigationParty
    - CMBInvestigationPartyAlt
