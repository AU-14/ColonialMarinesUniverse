      AU14JobLEOLeaderBase: AU14JobCivilianCMBMarshal
      AU14JobLEOBase: AU14JobCivilianCMBDeputy
    jobScalingFof: DefaultGovforOpforScale
    jobScalingIns: DefaultInsurgencyScale

- type: lorePrimer
  id: AU14PrimerPlanetStableGarrison
  planetText: "Date 2183 - Stable Garrison, a UA controlled frontier world with a joint base and sizeable urban community."

- type: gameMap
  id: stablegarrison
  mapName: Stable Garrison
  allegiance: UA
  mapPath: /Maps/_AU14/garrison.yml
  mapsBelow:
  - /Maps/_AU14/garrison_below.yml
  mapsAbove:
  - /Maps/_AU14/garrison_above.yml
  minPlayers: 0
  maxPlayers: 75
  maxRandomOffset: 0
  randomRotation: false
  stations:
    stablegarrison:
      stationProto: StandardUNMCWarship
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Stable Garrison'
        - type: StationJobs
          availableJobs:
            AU14JobCivilianColonist: [-1, -1]
            AU14JobCivilianJournalist: [1, 1]

            # Colony Service
            AU14JobCivilianHeadOfService: [1, 1]
            AU14JobCivilianShopkeep: [1, 1]
            AU14JobCivilianFoodServiceWorker: [3, 3]
            AU14JobCivilianWasteManagementSpecialist: [3, 3]

            AU14JobCivilianColonySynthetic: [1, 1]
            AU14JobColonyWorkingJoe: [2, 2]

            # Colony Command (non department)
            AU14JobCivilianColonyAdministrator: [1, 1]
            AU14JobCivilianColonyAdminAssistant: [1, 1]

            # Ambassadors
            AU14JobCivilianAmbassadorUA: [1, 1]
            AU14JobCivilianUSASFRecruiter: [1, 1]

            # Corporate
            AU14JobCivilianCorporateLiaison: [1, 1]
            AU14JobCivilianCorporateAssistant: [1, 1]

            AU14JobCivilianScientist: [3, 3]
            AU14JobWYGuard: [3, 3]

            # Security/LEO
            AU14JobCivilianCMBMarshal: [1, 1]
            AU14JobCivilianCMBDeputy: [3, 3]

            # Engineering/Logi
            AU14JobCivilianForeman: [1, 1]
            AU14JobCivilianFreightSystemsSpecialist: [3, 3]

            AU14JobCivilianHeadOfEngineering: [1, 1]
            AU14JobCivilianEngineer: [4, 4]

            # Medical
            AU14JobCivilianHeadPhysician : [1, 1]
            AU14JobCivilianPhysician: [2, 2]
            AU14JobCivilianNurse: [3, 3]
            AU14JobCivilianEthicsAndWellnessAdvisor: [2, 2]
            AU14JobCivilianEmergencyResponseOfficer: [1, 1]

            # Orbital
            AU14JobCivilianOrbitalArbiter: [1, 1]
