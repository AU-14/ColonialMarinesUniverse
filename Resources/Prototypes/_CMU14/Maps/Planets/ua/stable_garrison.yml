    - ForeignCrimeGang
    - MigratingCivs
    - MigratingCivsMedium
    - MigratingCivsLarge
    - MissionariesParty
    - MissionariesPartyMedium
    threats:
    - XenoThreat
    - NeomorphsThreat
    - AbominationsThreatDS
    - ApeThreatDS
    - BadBloodClanThreat
    - XenoThreatCF
    - NeomorphsThreatCF
    - CultistThreatCF
    - WendigoThreatCF
    - AbominationsThreatCF
    - TribalsThreatCF
    - ApeThreatCF
