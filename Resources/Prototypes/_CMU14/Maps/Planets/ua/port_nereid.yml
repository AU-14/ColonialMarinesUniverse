- type: lorePrimer
  id: AU14PrimerPlanetLV327
  planetText: "Date 2181 - Port Nereid, a valuable waterport, atmospheric processor and transit hub on the Neroid Sector frontier world LV-109, named 'Elgin's Folley'. Port Nereid is a joint-venture colony established by the United Americas Colonial Administration and Weyland-Yutani."

