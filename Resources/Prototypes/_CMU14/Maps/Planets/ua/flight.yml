- type: entity
  id: AUPlanetFlight
  name: Flight
  components:
  - type: RMCPlanetMapPrototype
    votename: "Flight"
    mapId: Flight
    lorePrimer: AU14PrimerPlanetFlight
    allegiance: UA
    camouflage: Urban
    announcement: "A nine-story mixed-use tower surrounded by an artificial cityscape has gone dark. A response force has been dispatched to investigate the circumstances."
    platoonsGovfor:
    - LACN
    - CMBCIU
    - USCM
    - WYPMC
    - RMC
    - HAZOPS
    platoonsOpfor:
    - UPP
    - ProdigySF
    - VAIPO
    defaultgovfor: USCM
    defaultopfor: UPP
    govforinship: true
    opforinship: true
    daycycleenabled: true
    threats:
    - XenoThreat
    - NeomorphsThreat
    # - AbominationsThreatDS # no xenocf markers
    - ApeThreatDS
    - BadBloodClanThreat
    # - XenoThreatCF # no xenocf markers
    # - NeomorphsThreatCF # no xenocf markers
    - CultistThreatCF
    - WendigoThreatCF
    # - AbominationsThreatCF # no xenocf markers
    - TribalsThreatCF
    - ApeThreatCF
    thirdparties:
    - USArmy
    - USArmyAlt
    - USArmyAlt2
   # - cultistThirdParty
    - abominationThirdParty
    joboverrides:
      AU14JobLEOLeaderBase: AU14JobCivilianCMBMarshal
      AU14JobLEOBase: AU14JobCivilianCMBDeputy
    jobScalingFof: DefaultGovforOpforScale
    jobScalingIns: DefaultInsurgencyScale

- type: lorePrimer
  id: AU14PrimerPlanetFlight
  planetText: "Date 2181 - Flight, a multistory colony megastructure."

- type: gameMap
  id: Flight
  mapName: Flight
  allegiance: Neutral
  mapPath: /Maps/_AU14/flight.yml
  minPlayers: 0
  maxPlayers: 75
  maxRandomOffset: 0
  randomRotation: false
  stations:
    Flight:
      stationProto: StandardUNMCWarship
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Flight'
        - type: StationJobs
          availableJobs:
            AU14JobCivilianColonist: [ -1, -1 ]
            AU14JobCivilianJournalist: [1, 1]

            # Colony Service
            AU14JobCivilianHeadOfService: [1, 1]
            AU14JobCivilianShopkeep: [3, 3]
            AU14JobCivilianFoodServiceWorker: [2, 2]
            AU14JobCivilianWasteManagementSpecialist: [2, 2]

            AU14JobCivilianColonySynthetic: [1, 1]
            AU14JobColonyWorkingJoe: [2, 2]

            # Colony Command (non department)
            AU14JobCivilianColonyAdministrator: [1, 1]
            AU14JobCivilianColonyAdminAssistant: [1, 1]
            # Ambassadors

            # Corporate
            AU14JobCivilianCorporateLiaison: [1, 1]
            AU14JobCivilianScientist: [3, 3]
            AU14JobWYGuard: [2, 2]

            # Security/LEO
            AU14JobCivilianCMBMarshal: [1, 1]
            AU14JobCivilianCMBDeputy: [2, 2]

            # Engineering/Logi
            AU14JobCivilianForeman: [1, 1]
            AU14JobCivilianFreightSystemsSpecialist: [2, 2]

            AU14JobCivilianHeadOfEngineering: [1, 1]
            AU14JobCivilianEngineer: [3, 3]

            # Medical
            AU14JobCivilianHeadPhysician: [1, 1]
            AU14JobCivilianPhysician: [1, 1]
            AU14JobCivilianNurse: [1, 1]
            AU14JobCivilianEthicsAndWellnessAdvisor: [1, 1]
            AU14JobCivilianEmergencyResponseOfficer: [1, 1]

            # Orbital
            AU14JobCivilianOrbitalArbiter: [1, 1]
            AU14JobCivilianOrbitalLawyer: [2, 3]
