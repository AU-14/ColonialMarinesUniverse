  mapName: Chances Claim
  allegiance: WeylandYutani
  mapPath: /Maps/_CMU14/chances.yml
  mapsBelow:
  - /Maps/_CMU14/chances_below.yml
  mapsAbove:
  - /Maps/_CMU14/chances_above.yml
  minPlayers: 0
  maxPlayers: 75
  maxRandomOffset: 0
  randomRotation: false
  stations:
