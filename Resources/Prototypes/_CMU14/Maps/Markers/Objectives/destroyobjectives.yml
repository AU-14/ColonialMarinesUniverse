- type: entity
  name: Destroy Solaris Steel Vein
  parent: MarkerBase
  id: destroy_mineable_solaris_steel
  description: "Destroy a steel-rich mineable vein on the map"
  components:
  - type: Sprite
    state: red
  - type: CMUObjective
    id: destroymineablesolarissteel
    factionNeutral: false
    allowedPresets:
    - ForceOnForce
    factions:
    - opfor
    - govfor
    repeating: false
    objectiveLevel: 1
    customPoints: 5
    objectiveDescription: "Destroy a steel-rich mineable vein (mineablesolarisrocksteel)"
  - type: DestroyObjective
    targetPrototype: mineablesolarisrocksteel
    useAnyEntity: true
    destroyCount: 1

- type: entity
