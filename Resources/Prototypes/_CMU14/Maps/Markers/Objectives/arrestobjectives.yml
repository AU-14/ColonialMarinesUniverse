- type: entity
  name: Arrest enemies Objective
  parent: MarkerBase
  id: arrestteamobjective
  components:
  - type: Sprite
    state: red
  - type: CMUObjective
    id: arrestteamobjbasic
    factionNeutral: true
    allowedPresets:
    - ForceOnForce
    factions:
    - opfor
    - govfor
    repeating: true
