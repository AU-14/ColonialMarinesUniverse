- type: entity
  parent: MarkerBase
  id: fetchgenericmarker
  name: Fetch Generic Marker
  suffix: Fetch Objective
  components:
  - type: Sprite
    state: red
  - type: CMUObjectiveMarker
    generic: true

- type: entity
  name: Fetch Ore Objective
  parent: MarkerBase
  id: fetchoreobjective
  components:
  - type: Sprite
    state: red
  - type: CMUObjective
    id: fetchoreobj
    factionNeutral: true
    allowedPresets:
    - ForceOnForce
    factions:
    - opfor
    repeating: true
    objectiveLevel: 3
    customPoints: 100
    maxRepeatable: 3
    objectiveDescription: "Acquire Steel Ore"
  - type: FetchObjective
    targetPrototype: SteelOre
    spawnMarkerId: fetchoreobjectivemarker
    fetchCount: 500
    useAnyEntity: true
    catalog: false

- type: entity
