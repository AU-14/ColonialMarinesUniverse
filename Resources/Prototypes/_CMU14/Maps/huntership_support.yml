  description: Invisible marker for Hunter Ship teleporter mapping.
  suffix: Hunter Ship invisible marker

- type: entity
  parent: MarkerBase
  id: CMUHunterShipTeleporterBase
  name: Hunter ship hunting ground teleporter
  description: Invisible step trigger for Hunter Ship hunting ground teleporters.
  suffix: Hunter Ship teleporter
  abstract: true
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 1500
        hard: false
        mask:
        - MobMask
        - MobLayer
        - GhostImpassable
        layer:
        - MobMask
        - MobLayer
        - GhostImpassable
  - type: StepTrigger
    intersectRatio: 0.15
    requiredTriggeredSpeed: 0.5
    ignoreWeightless: true
    stepOn: true
  - type: YautjaHuntTeleporter
  - type: UserInterface
    interfaces:
      enum.DialogUiKey.Key:
        type: DialogBui

