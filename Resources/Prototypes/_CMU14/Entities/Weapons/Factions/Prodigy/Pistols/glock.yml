- type: entity
  parent: CMWeaponPistolM1984
  id: CMU14WeaponPistolGlock75
  name: Glock 75 pistol
  description: Austrian legend, designed in XX century, Glock quickly became a major player on the pistol market. This version was produced on a license for Prodigy CORP for security and police forces, features an underbarrel rail for a taser.
  components:
  - type: Tag
    tags:
    - Sidearm
    - CMU14WeaponPistolGlock
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    scatterWielded: 12
    scatterUnwielded: 14
    baseFireRate: 10
    burstScatterMult: 5
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Guns/Pistols/glock.rsi
  - type: Clothing
    sprite: _CMU14/Objects/Weapons/Guns/Pistols/glock.rsi
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_mk80_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/gun_88m4_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMU14MagazinePistolGlock75
          - CMU14MagazinePistolGlock77
        startingItem: CMU14MagazinePistolGlock75
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentLaserSight
          - CMU14AttachmentUnderbarrelTaser
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.62, 0.095
      rmc-aslot-rail: -0.065, 0.125
      rmc-aslot-underbarrel: 0, 0

- type: entity
  parent: CMU14WeaponPistolGlock75
  id: CMU14WeaponPistolGlock75Taser
  suffix: Taser
  components:
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentSuppressor
          - RMCAttachmentSuppressorCompact
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS5MicroRedDotSight
          - RMCAttachmentS6ReflexSight
