- type: entity
  parent: [ RMCUnderAttachmentBase, RMCAttachableToggleableBase ]
  id: CMU14AttachmentUnderbarrelTaser
  name: underbarrel taser
  description: Prodigy CORP underbarrel taser for Glock 70-series.
  components:
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Attachments/underbarreltaser.rsi
    state: underbarreltaser
  - type: Tag
    tags:
    - Taser
    - RMCAttachmentUnderbarrel
    - CMU14AttachmentUnderbarrelTaser
  - type: Item
    size: Normal
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
  - type: Battery
    maxCharge: 800
    startingCharge: 800
  - type: ProjectileBatteryAmmoProvider
    proto: RMCProjectileTaser
    fireCost: 100
  - type: GunPointBlank
  - type: GunDualWielding
    weaponGroup: Handgun
  - type: GunRequiresSkills
    skills:
      RMCSkillPolice: 1
  - type: Wieldable
  - type: MeleeWeapon
    attackRate: 1
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Weapons/Guns/Hits/energy_metal2.ogg
  - type: RMCStaminaDamageOnHit
    damage: 15
  - type: AttachableToggleable
    userOnly: true
    attachedOnly: true
    supercedeHolder: true
    wieldedUseOnly: true
    activatePopupText: attachable-popup-switch-to-generic
    deactivatePopupText: attachable-popup-switch-from-generic
    activateSound:
      path: /Audio/Weapons/flash.ogg
      params:
        volume: -2
    actionName: Switch to the underbarrel taser.
    actionDesc: Switch to using the underbarrel taser.
    icon:
      sprite: _CMU14/Objects/Weapons/Attachments/underbarreltaser.rsi
      state: underbarreltaser
    iconActive:
      sprite: _CMU14/Objects/Weapons/Attachments/underbarreltaser.rsi
      state: underbarreltaser-on
  - type: AttachableVisuals
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/shotgun_mouse.rsi
      state: all

