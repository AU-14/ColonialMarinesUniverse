# MP5 magazines
# These are intentionally not added to any vendor, loadout, map, kit, crate, or random-spawn pool.

- type: entity
  parent: CMMagazineSMGMP5
  id: CMUMagazineSMGMP5Drum
  name: MP5 drum magazine (9mm)
  description: A 60-round drum magazine for MP5-pattern submachine guns.
  suffix: Drum
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - CMMagazineSMGMP5
    - CMUMagazineSMGMP5Drum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridge9mmSMG
    proto: CMCartridge9mmSMG
    capacity: 60
  - type: Sprite
    sprite: _CMU14/Objects/Weapons/Guns/Ammunition/Magazines/mp5drum.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]

- type: entity
  parent: CMMagazineSMGMP5
  id: CMUMagazineSMGMP5AP
  name: MP5 AP magazine (9mm)
  description: A 30-round MP5 magazine loaded with armor-piercing 9mm ammunition.
  suffix: AP
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CMCartridgePistol9mmAP
    proto: CMCartridgePistolM77AP
    capacity: 30
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/mp5.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: ammo_band
      color: "#1F951F"
  - type: RefillableByBulletBox
    bulletType: CMUBoxBulletsPistol9MMAP

