- type: entity
  abstract: true
  id: ANPRCAntennaBase
  name: AN/PRC-117G antenna
  parent: BaseItem
  components:
  - type: Item
    size: Small

- type: entity
  parent: ANPRCAntennaBase
  id: ANPRCWhipAntenna
  name: AN/PRC-117G whip antenna
  description: >-
    The stock tape-whip antenna. Keeps the radio's relay range steady whether
    the operator is moving or not.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/flares.rsi
    state: flare_unlit
    color: "#6B7A6B"
  - type: ANPRCAntenna
    label: WHIP
    fullRange: 30
    partialRange: 45
    requiresStationary: false

- type: entity
  parent: ANPRCAntennaBase
  id: ANPRCMastAntenna
  name: AN/PRC-117G mast antenna
  description: >-
    A tall base-station whip that roughly doubles relay range, but only once
    it's planted — on the move the folded mast reaches barely half as far as
    the stock whip. Fit it at a command post or retrans site, not on patrol.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/vulture_spotter.rsi
    state: vulture_tripod
  - type: ANPRCAntenna
    label: MAST
    fullRange: 55
    partialRange: 80
    requiresStationary: true
    movingRangeMultiplier: 0.5
