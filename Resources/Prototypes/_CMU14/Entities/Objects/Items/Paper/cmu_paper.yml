- type: entity #27x27 pixel image to ss14 goodie with black background. Really nice if you know how to get shit done
  parent: CMPaper
  id: CMUPaperPhoto
  name: photograph
  description: A photograph of a person, place, or thing.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: photo
    - state: photo
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_CMU14/Interface/Paper/photo_bkg.png"
    maxWritableArea: 650, 680
    contentMargin: -20, 40, -25, 25
    backgroundPatchMargin: 0, 0, 0, 0
    backgroundScale: 1.0, 1.0

- type: entity #27x27 pixel image to ss14 goodie with black background. Really nice if you know how to get shit done
  parent: CMPaper
  id: CMUPaperParking
  name: parking ticket
  description: A municipal parking violation notice. Failure to comply may result in fines or vehicle impoundment.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: parking_ticket
    - state: parking_ticket
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_CMU14/Interface/Paper/parking_ticket_bkg.png"
    maxWritableArea: 600, 400
    contentMargin: 10, 10, 10, 90
    backgroundPatchMargin: 0, 0, 0, 0
    backgroundScale: 1.0, 1.0
  - type: Paper
    content: |
     [bold]Reason for Violation[/bold]
     [check] No Valid Parking Permit         [check] Blocking Driveway / Access
     [check] No Parking Area / Space        [check] Blocking Other Vehicle
     [check] Fire Lane                                     [check] Parked in 2 Spaces
     [check] Reserved / Assigned Space   [check] Other: [mono][color=DarkBlue][form][/color][/mono]
     ===============================================================
     Date/Time: [mono][color=DarkBlue][form][/color][/mono] [bold]/[/bold] License Plate: [mono][color=DarkBlue][form][/color][/mono]
     Location: [mono][color=DarkBlue][form][/color][/mono] [bold]/[/bold] Permit No: [mono][color=DarkBlue][form][/color][/mono] [bold]/[/bold] Driver: [mono][color=DarkBlue][form][/color][/mono]
     Vehicle Type & Model & Color: [mono][color=DarkBlue][form][/color][/mono]
     Issued By: [mono][color=DarkBlue][signature][/color][/mono]

