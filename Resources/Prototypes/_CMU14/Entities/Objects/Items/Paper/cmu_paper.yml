# ICSC
- type: entity
  parent: CMPaper
  id: CMUPaperICSC
  name: ICSC paper
  description: A paper with Independent Core System Colonies letterhead.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Misc/paper.rsi
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: icsc_letterhead
      visible: true
    - state: paper_stamped
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    headerImagePath: "/Textures/_CMU14/Interface/Paper/ICSCHeader.png"
    backgroundImagePath: "/Textures/_CMU14/Interface/Paper/paper_bkg.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    footerImagePath: "/Textures/_CMU14/Interface/Paper/ICSCFooter.png"
    footerMargin: 0, 0, 0, 40

