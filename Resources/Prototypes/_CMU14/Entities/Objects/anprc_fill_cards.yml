- type: entity
  abstract: true
  id: ANPRCFillCard
  name: COMSEC fill card
  description: A physical cryptographic fill card for the AN/PRC-117G radio. Insert into the radio's fill slot to load COMSEC. Zeroize or remove to eject.
  parent: BaseItem
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/synth_reset_key.rsi
    state: reset_key
  - type: Item
    size: Tiny
  - type: ANPRCFillCard

- type: entity
  parent: ANPRCFillCard
  id: ANPRCFillCardGOVFOR
  name: GOVFOR COMSEC fill card
  description: >-
    A GOVFOR KY-99A cryptographic fill card.
    Insert into a GOVFOR AN/PRC-117G to load COMSEC fill.
    Transmissions on CT mode are unreadable without a matching card.
  components:
  - type: ANPRCFillCard
    faction: govfor
    designation: KY-99A

