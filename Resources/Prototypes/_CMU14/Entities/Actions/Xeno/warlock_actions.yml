- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicCrush
  # Name and description are in Resources/Locale/en-US/_CMU14/xeno/warlock.ftl. A loc entry
  # overrides the prototype's name/description, so keeping text here as well would be dead.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_crush
    iconOn:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_crush_activate
    useDelay: 0.25
  # SharedActionsSystem gate is intentionally looser than the ability's true range so a click
  # anywhere on a tile the range overlay highlights (6-tile closest-point-of-tile check) reaches
  # the handler. The handler snaps to the tile centre and enforces the real 6-tile initiation
  # range via CMUXenoWarlockComponent.PsychicCrushInitRange. Worst-case click distance on a
  # highlighted boundary tile is 6 + tile diagonal ≈ 7.41, rounded up to 8.
  - type: TargetAction
    range: 8
    checkCanAccess: true
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicCrushActionEvent
  # Marker used by SetPsychicCrushActionMode to swap the crush action between WorldTargetAction
  # (idle / windup) and InstantAction (channeling, early-detonate on next press). See
  # CMUXenoWarlockSystem.SetPsychicCrushActionMode for the swap logic.
  - type: CMUXenoPsychicCrushActionMarker
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicBlast
  # Name and description are in Resources/Locale/en-US/_CMU14/xeno/warlock.ftl.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_blast
    useDelay: 10
  # See CMUActionXenoPsychicCrush above for why the gate range exceeds the true 6-tile range.
  - type: TargetAction
    range: 8
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicBlastActionEvent
  - type: ActionBlockIfResting
  - type: RMCDazeableAction

- type: entity
  parent: ActionXenoBase
  id: CMUActionXenoPsychicShield
  # Name and description are in Resources/Locale/en-US/_CMU14/xeno/warlock.ftl.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_shield
    iconOn:
      sprite: _CMU14/Actions/Xeno/warlock.rsi
      state: psy_shield_reflect
    useDelay: 0.25
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:CMUXenoPsychicShieldActionEvent
  - type: CMUXenoPsychicShieldActionMarker
  - type: ActionBlockIfResting
  - type: RMCDazeableAction
