- type: entity
  abstract: true
  parent: CMU14XenoPathogenMatureBase
  id: CMU14XenoNeomorphBase
  name: Neomorph
  description: A sleek, fast alien with sharp claws.
  components:
  - type: GhostRole
    name: cmu-job-name-pathogen-neomorph
  - type: Sprite
    sprite: _CMU14/Mobs/Xenonids/Pathogen/neomorph.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      375: Critical
      475: Dead
    stateAlertDict:
      Alive: XenoHealth
      Critical: XenoCrit
      Dead: XenoDead
    displayDamageInAlert: true
  - type: Xeno
    role: CMU14JobPathogenNeomorph
    tier: 2
    hudOffset: -0.1, 0.25
    emoteSounds: Pathogen
    actionIds:
    - CMU14ActionXenoPathogenRest
    - CMU14ActionXenoPathogenWatch
    - CMU14ActionXenoPathogenHide
    - CMU14ActionXenoPathogenLeap
    - CMU14ActionXenoPathogenTailStab
    - CMU14ActionXenoPathogenHeadbite
    - CMU14ActionXenoPathogenPlantWeeds
    - CMU14ActionXenoPathogenChooseStructure
    - CMU14ActionXenoPathogenSecreteStructure
    - CMU14ActionXenoPathogenParalyzingSlash
    - CMU14ActionXenoPathogenDigTunnel
    - CMU14ActionXenoPathogenDevolve
    - CMU14ActionXenoPathogenOrderConstruction
  - type: TunnelRenamer
  - type: XenoBurrow
  - type: XenoConstruction
    buildDelay: 1
    canBuild:
    - CMU14XenoMyceliumWall
    - CMU14XenoMyceliumMembrane
    - CMU14XenoMyceliumDoor
    canOrderConstruction:
    - CMU14PathogenBlightCoreConstructionNode
    - CMU14PathogenClusterConstructionNode
    - CMU14PathogenPlasmaTreeConstructionNode
    - CMU14PathogenRecoveryNodeConstructionNode
    - CMU14PathogenSporecasterConstructionNode
    - CMU14ActionXenoPathogenRegurgitate
  - type: XenoDevour
  - type: XenoHeadbite
    damage:
      groups:
        Brute: 60
  - type: XenoLeap
    delay: 0
    range: 4
    moveDelayTime: 0
    knockdownTime: 0
    leapSound: /Audio/_CMU14/Xeno/Pathogen/pathogen_pounce2.ogg
    hitEffect: RMCEffectExtraSlash
    targetJitterTime: 1
    targetCameraShakeStrength: 1
    damage:
      groups:
        Brute: 40
  - type: XenoRegen
    healOffWeeds: true
    restHealMultiplier: 1.0
  - type: XenoPlasma
    plasma: 400
    maxPlasma: 400
    plasmaRegenOnWeeds: 8
  - type: XenoEvolution
    actionId: CMU14ActionXenoPathogenEvolve
    canEvolveWithoutGranter: true
    requiresGranter: false
    max: 400
    evolvesTo:
    - CMU14XenoConditor
    - CMU14XenoBrute
    - CMU14XenoRoot
    - CMU14XenoHarbinger
    - CMU14XenoVenator
  - type: XenoDevolve
    devolvesTo:
    - CMU14XenoSprinter
    - CMU14XenoHaze
    canBeDevolvedByOther: false
  - type: XenoHide
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 100
        mask:
        - MobMask
        - BarbedBarricade
        - BarricadeImpassable
        layer:
        - MobLayer
      fix2:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        layer:
        - BulletImpassable
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 8.5
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      groups:
        Brute: 35
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 54
  - type: CMArmor
    explosionArmor: 10
    xenoArmor: 10
  - type: XenoClaws
    clawType: Sharp
  - type: Tackle
    min: 2
    max: 6
    chance: 0.35
    stunMin: 3
    stunMax: 4
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_CMU14/Interface/neo_blips.rsi
      state: neomorph
    background:
      sprite: /Textures/_CMU14/Interface/neo_blips.rsi
      state: background_pathogen
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: VentCrawler
    ventCrawlIcon: warrior
  - type: RMCActionOrder
    id: CMU14XenoNeomorph
  - type: FixedIdentity
    name: cmu-job-name-pathogen-neomorph
  - type: Speech
    speechSounds: Pathogen
 
- type: entity
  parent: CMU14XenoNeomorphBase
  id: CMU14XenoNeomorph
  name: Neomorph
  components:
  - type: RMCGibOnDeath
    gibChance: 0.1
  - type: RMCSpawnEntitiesOnGib
    entities:
    - CMU14GibEffectPathogenNeomorph