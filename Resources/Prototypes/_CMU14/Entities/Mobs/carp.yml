- type: entity
  id: CMUMobCarpBase
  parent:
  - BaseMob
  - MobAtmosExposed
  - MobCombat
  - MobBloodstream
  - MobFlammable
  abstract: true
  suffix: CMU
  components:
  - type: MobState
  - type: Pullable
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [Touch, Ingestion]
  - type: NameIdentifier
    group: GenericNumber
  - type: ShortExamine
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Critical
      130: Dead
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 2
        Slash: 3
        Bloodloss: 2.5
  - type: GenericVisualizer
    visuals:
      enum.CreamPiedVisuals.Creamed:
        clownedon:
          True: {visible: true}
          False: {visible: false}
      enum.UserAcidedVisuals.Acided:
        acided:
          None:
            visible: false
          Normal:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: human_acid
            visible: true
          Enhanced:
            sprite: _RMC14/Effects/xeno_spray_acid.rsi
            state: human_acid_enhanced
            visible: true
  - type: Body
    prototype: Bloodsucker
    requiredLegs: 0
  - type: Climbing
  - type: RMCRevivable
  - type: RMCMedicalExamine
    simple: true
    deadText: rmc-medical-examine-dead-simple-mob
  - type: RMCHealthIcons
  - type: CrashLandable
  - type: Woundable
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: null
    healthBarThreshold: 2 # some of these mobs literally only have 10 hit points
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.7
    baseSprintSpeed: 5
  - type: Bloodstream
    bloodMaxVolume: 150
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - Electrocution
    - ForcedSleep
    - TemporaryBlindness
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - PressureImmunity
    - Muted
    - Pacified
    - StaminaModifier
    - Flashed
    - Dazed
    - Blinded
    - Deaf
    - Unconscious
  - type: Buckle
  - type: StandingState
  - type: Deathgasp
    prototype: DefaultDeathgasp
  - type: RandomSound
    sound:
      collection: BodyFall
      #params:
        #volume: -10
    min: 45
    max: 60
  - type: ComplexInteraction
  - type: CanBeFirePatted
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: FactionException
  - type: NpcFactionMember
    factions:
      - Dragon
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Speech
    speechVerb: LargeMob
    speechSounds: Bass
    #allowedEmotes:
  - type: ReplacementAccent
    accent: genericAggressive
  #- type: Vocal
    #sounds:
      #Male:
      #Unsexed:
      #Female:
  #- type: BodyEmotes
    #soundsId:
  - type: TypingIndicator
    proto: alien
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _AU14/Mobs/Animals/carp.rsi
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      sprite: _AU14/Mobs/Animals/carp.rsi
      state: mouth
      #shader: unshaded
    - map: [ "mask" ]
    - map: [ "clownedon" ]
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
    - map: [ "acided" ]
    - map: [ "hooked" ]
      sprite: "_RMC14/Effects/xeno_spray_acid.rsi"
      state: hooked
      visible: false
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        alive: CMUCarpColors
      enum.DamageStateVisualLayers.BaseUnshaded:
        mouth: ""
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
        BaseUnshaded: mouth
      Critical:
        Base: crit
        BaseUnshaded: crit_mouth
      Dead:
        Base: dead
        BaseUnshaded: dead_mouth
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: FoodMeatFish
      amount: 2
  - type: Puller
    needsHands: false
  - type: Tag
    tags:
    - Carp
    - DoorBumpOpener

- type: entity
  parent:
  - CMUMobCarpBase
  - StripableInventoryBase
  id: CMUMobSmallHostCarp
  name: carp
  suffix: CMU, Small Host
  components:
  - type: Internals
  - type: Inventory
    templateId: carp
    speciesId: carp
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: CreamPied
  - type: Infectable
  - type: Tackleable
  - type: Devourable
  - type: XenoNestable
  - type: FixedIdentity
    name: cm-chatsan-replacement-monkey
    whitelist:
      components:
      - Xeno
  - type: NpcFactionMember
    factions:
    - Passive
    - Dragon

- type: inventoryTemplate
  id: carp
  slots:
  - name: mask
    slotTexture: mask
    slotFlags: MASK
    uiWindowPos: 0,1
    strippingWindowPos: 1,1
    displayName: Mask
    whitelist:
      tags:
        - RMCSynthGrabbable

- type: entity
  parent: CMSpawnMobMonkey
  id: CMUSpawnMobCarp
  name: Small host spawner
  suffix: CMU
  components:
  - type: Sprite
    layers:
    - state: carp_spawn
      sprite: _AU14/Mobs/Animals/carp.rsi
  - type: ProportionalSpawner
    id: CMUSpawnMobCarp
    ratio: 16
    prototypes:
    - CMUMobSmallHostCarp

- type: palette
  id: CMUCarpColors
  name: CarpColors
  colors:
    CopperA: "#645437"
    CopperB: "#786843"
    CopperC: "#8a794c"
    BronzeA: "#4b3921"
    BronzeB: "#5b4624"
    BronzeC: "#6b562a"
    GoldA: "#615520"
    GoldB: "#776725"
    GoldC: "#8d7b2a"
