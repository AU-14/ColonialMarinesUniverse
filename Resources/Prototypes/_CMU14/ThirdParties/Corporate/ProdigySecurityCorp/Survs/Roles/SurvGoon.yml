    AU14RankPrDEnforcer:
    - !type:RoleTimeRequirement
      role: CMU14JobCivilianProdigyGuard
      time: 180000 # 50 hours
    AU14RankPrDSeniorOperator:
    - !type:RoleTimeRequirement
      role: CMU14JobCivilianProdigyGuard
      time: 86400 # 24 hours
    AU14RankPrDOperator:
