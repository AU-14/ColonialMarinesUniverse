    factions:
    - CMUProdigy
  - type: EquipEntityPreset
    preset: CMU14ProdigySurvBasePreset
  - type: Skills
    skills:
      RMCSkillOverwatch: 1
      RMCSkillFirearms: 2
      RMCSkillCqc: 2
      RMCSkillEndurance: 2
      RMCSkillFireman: 2
      RMCSkillEngineer: 2
      RMCSkillIntel: 1
      RMCSkillVehicles: 1
      RMCSkillPolice: 2
      RMCSkillConstruction: 2
  - type: JobPrefix
    prefix: au14-job-prefix-wyguard
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/cm_job_icons.rsi
      state: weya_goon_standard
  - type: AssignSquad
    whitelist:
      tags:
      - CMU14SquadProdigy

  name: au14-job-name-wyguard
  description: au14-job-description-wyguard
