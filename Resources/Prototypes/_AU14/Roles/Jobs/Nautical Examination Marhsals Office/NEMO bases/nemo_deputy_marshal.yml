  playTimeTracker: AU14JobNEMODeputyMarshal
  ranks:
    AU14RankNEMODeputyMarshal: []
  startingGear: AU14GearNEMODeputyMarshal
  icon: AU14JobIconNEMODeputyMarshal
  joinNotifyCrew: false
  accessGroups:
  - AllAccess
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillConstruction: 2
        RMCSkillCqc: 1
        RMCSkillEndurance: 5
        RMCSkillEngineer: 2
        RMCSkillExecution: 1
        RMCSkillFirearms: 2
        RMCSkillFireman: 2
        RMCSkillIntel: 2
        RMCSkillJtac: 4
        RMCSkillLeadership: 3
        RMCSkillMedical: 3
        RMCSkillMeleeWeapons: 1
        RMCSkillOverwatch: 1
        RMCSkillPolice: 2
        RMCSkillPowerLoader: 2
        RMCSkillSmartGun: 1
        RMCSkillVehicles: 2
    - type: MarineOrders
      moveOrderSoundMale:
        collection: AU14MaleMoveOrder
      moveOrderSoundFemale:
        collection: AU14FemaleMoveOrder
      focusOrderSoundMale:
        collection: AU14MaleFocusOrder
      focusOrderSoundFemale:
        collection: AU14FemaleFocusOrder
      holdOrderSoundMale:
        collection: AU14MaleHoldOrder
      holdOrderSoundFemale:
        collection: AU14FemaleHoldOrder
    - type: DemoSpecWhitelist
    - type: GrenadeSpecWhitelist
    - type: ScoutWhitelist
    - type: SniperWhitelist
    - type: PyroWhitelist
    - type: JobPrefix
      prefix: au14-job-prefix-nemo-deputy-marshal
    - type: RMCTrackable
  hidden: true

- type: entity
  id: AU14RandomHumanoidNEMODeputyMarshal
  name: provost ghost role deputy marshal
  suffix: Spawner, Player, Friendly, High Law Understanding
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/provost.rsi
    state: provost
  - type: RandomHumanoidSpawner
    settings: AU14NEMODeputyMarshal

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: AU14NEMODeputyMarshal
  components:
  - type: GhostRole
    name: au14-job-name-corp-nemo-deputy-marshal
    description: au14-ghost-role-information-nemo-description
    rules: au14-ghost-role-information-nemo-rules
    reregister: false
    job: AU14NEMODeputyMarshal
    raffle:
      settings: short
  - type: GhostRoleApplySpecial

- type: startingGear
  id: AU14GearNEMODeputyMarshal
  equipment:
    head: RMCArmorCapProvost
    eyes: CMGlassesSecurity
    ears: AU14HeadsetNEMO
    ears2: RMCM5CameraGear
    jumpsuit: CMJumpsuitProvostMarshal
    outerClothing: RMCProvostCoatMarshalFilled
    gloves: CMHandsBlackMarine # TODO RMC14 black gloves
    shoes: CMBootsBlackFilled
    id: RMCIDCardProvostDeputyMarshal
    belt: RMCMatebaBeltLuxuriousFilled
    back: CMSatchelSecurityFilledProvostDeputyMarshal
    pocket1: RMCUniversalRecorder
    pocket2: RMCPouchMagazinePistolFilledMateba # TODO RMC14 3 listening devices

- type: playTimeTracker
  id: AU14JobNEMODeputyMarshal

- type: jobIcon
  parent: CMJobIconBase
  id: AU14JobIconNEMODeputyMarshal
  icon:
    sprite: _AU14/Interface/job_icons.rsi
    state: hudsquad_nemo_lead_team

- type: entity
  parent: CMIDCardGold
  id: RMCIDCardNEMODeputyMarshal
  name: NEMO Deputy Marshal ID card
  description: Issued to members of the Nautical Examination Marshal's Office.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/provost.rsi
    state: provost
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/provost.rsi
  - type: PresetIdCard
    job: AU14NEMODeputyMarshal
