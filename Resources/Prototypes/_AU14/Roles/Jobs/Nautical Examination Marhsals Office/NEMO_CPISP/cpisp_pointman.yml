    sprite: _RMC14/Objects/CMIDs/provost.rsi
    state: provost
  - type: RandomHumanoidSpawner
    settings: AU14CPISPPointman

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: AU14CPISPPointman
  components:
  - type: GhostRole
    name: au14-ghost-name-corp-nemo-cpisp-pointman
    description: au14-job-description-corp-nemo-cpisp-pointman
    rules: au14-ghost-role-information-nemo-hostile-rules
    reregister: false
    job: AU14CPISPPointman
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: AU14JobGOVFORSquadRifleman
      time: 18000 # 5 Hours
    - !type:RoleTimeRequirement
      role: AU14JobGOVFORMilitaryPoliceMan
      time: 18000 # 5 Hours
  - type: GhostRoleApplySpecial
    squad: AU14SquadCPISP

- type: startingGear
