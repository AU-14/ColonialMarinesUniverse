- type: job
  parent: CMJobBase
  id: AU14NEMOEnforcer
  name: au14-job-name-corp-nemo-enforcer
  description: au14-ghost-role-information-nemo-squad-description
  playTimeTracker: AU14JobNEMOEnforcer
  ranks:
    RMCRankProvostProvostEnforcer: []
  startingGear: AU14GearNEMOEnforcer
  icon: AU14JobIconNEMOEnforcer
  joinNotifyCrew: false
  accessGroups:
  - ShipMasterAccess
  spawnMenuRoleName: Provost Enforcer
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      skills:
        RMCSkillCqc: 3
        RMCSkillEndurance: 3
        RMCSkillFirearms: 2
        RMCSkillFireman: 2
        RMCSkillMeleeWeapons: 1
        RMCSkillPolice: 2
    - type: JobPrefix
      prefix: au14-job-prefix-nemo-enforcer
  hidden: true

- type: entity
  id: AU14RandomHumanoidNEMOEnforcer
  name: provost ghost role enforcer
  suffix: Spawner, Player, Friendly
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/provost.rsi
    state: provost
  - type: RandomHumanoidSpawner
    settings: AU14NEMOEnforcer

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: AU14NEMOEnforcer
  components:
  - type: GhostRole
    name: au14-ghost-name-corp-nemo-enforcer
    description: au14-ghost-role-information-nemo-squad-description
    rules: au14-ghost-role-information-nemo-rules
    reregister: false
    job: AU14NEMOEnforcer
    raffle:
      settings: short
    requirements:
    - !type:RoleTimeRequirement
      role: AU14JobGOVFORSquadRifleman
      time: 18000 # 5 Hours
    - !type:RoleTimeRequirement
      role: AU14JobGOVFORMilitaryPoliceMan
      time: 18000 # 5 Hours
  - type: GhostRoleApplySpecial
    squad: SquadProvost

- type: startingGear
  id: AU14GearNEMOEnforcer
  equipment:
    head: RMCHeadBeretProvost
    eyes: CMGlassesSecurity
    ears: AU14HeadsetNEMO
    ears2: RMCM5CameraGear
    jumpsuit: CMJumpsuitProvost
    outerClothing: RMCArmorProvost
    gloves: CMHandsBlackMarine # TODO RMC14 black gloves
    shoes: CMBootsBlackFilled
    suitstorage: WeaponShotgunM890
    id: RMCIDCardProvostEnforcer
    belt: RMCM1984BeltFilled
    back: CMSatchelSecurityFilledProvostEnforcer
    pocket1: RMCPouchShotgunLargeBeanbag
    pocket2: RMCPouchShotgunLargeSlugs # TODO RMC14 riot shield

- type: playTimeTracker
  id: AU14JobNEMOEnforcer

- type: jobIcon
  parent: CMJobIconBase
  id: AU14JobIconNEMOEnforcer
  icon:
    sprite: _AU14/Interface/job_icons.rsi
    state: hudsquad_nemo_clear_blank

- type: entity
  parent: CMIDCardGold
  id: RMCIDCardNEMOEnforcer
  name: NEMO Enforcer ID card
  description: Issued to members of the Nautical Examination Marshal's Office.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/provost.rsi
    state: provost
  - type: Clothing
    slots:
    - idcard
    sprite: _RMC14/Objects/CMIDs/provost.rsi
  - type: PresetIdCard
    job: AU14NEMOEnforcer
