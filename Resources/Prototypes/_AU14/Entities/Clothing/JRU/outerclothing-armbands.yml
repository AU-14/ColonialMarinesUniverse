- type: entity
  parent: RMCBaseMarineArmorLight
  id: CMU14ArmoredReflectiveVestJRU
  name: armored reflective vest
  description: A specialized reflective vest stuffed with armor plating and geared with extra webbing issued to JRU personnel. Very stealthy.
  components:
  - type: Sprite
    sprite: _AU14\Clothing\JRU\armoredreflective.rsi
  - type: CMArmor
    bullet: 18
    bio: 25
    explosionArmor: 13
  - type: RMCArmorSpeedTier
    speedTier: medium
  - type: ClothingSpeedModifier
    walkModifier: 0.555
    sprintModifier: 0.555
  - type: ExplosionResistance
    damageCoefficient: 0
    worn: false
  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,15,1
    blacklist:
      tags:
      - Pouch
  - type: LimitedStorage
    limits:
    - popup: rmc-storage-limit-cant-fit
      count: 5
      whitelist:
        components:
        - RMCFlask
        - CMScalpel
        - Figurine
        - CassettePlayer
        tags:
        #       - TODO RMC14 cards
        - Slice
        #       - TODO RMC14 glasses (eyewear)
        - Pen
        - Crayon
        - RMCHandful
        - Flashlight
        - Brutepack
        - CMOintment
        - CMAutoInjector
        - PillPacket
        - Syringe
        - Pill
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: IgnoreContentsSize
    items:
      components:
      - RMCLighter
      - RMCFlaskwas
      - CMScalpel
      - Figurine
      - Matchbox
      - OuterClothingAccessory
      - CassettePlayer
      - CassetteTape
      tags:
      - CigPack
      - Cigarette
      #      - TODO RMC14 cards
      - Slice
      #      - TODO RMC14 glasses (eyewear)
      - Pen
      - Crayon
      - RMCHandful
      - Flashlight
      - Brutepack
      - CMOintment
      - CMAutoInjector
      - PillPacket
  - type: FixedItemSizeStorage
  - type: Appearance
  - type: OuterClothingAccessoryHolder

- type: entity
  parent: RMCArmbandBase
  id: CMU14ArmbandJRU
  name: JRU armband
  description: A relfective armband, labelled J-R-U. Wearing it marks you as a member of the Joint Relief Unit. Pick up a gun and shoot the terrorists, recruit.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/Accessory/Armbands/med_green_armband.rsi
    state: icon
  - type: UniformAccessory
    playerSprite:
      sprite: _RMC14/Objects/Clothing/Accessory/Armbands/med_green_armband.rsi
      state: armband
  - type: JobTitleChanger
    jobTitle: JRU Recruit
    override: true

