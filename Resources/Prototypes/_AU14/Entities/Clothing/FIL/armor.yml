- type: entity
  parent: AU14BaseArmor
  id: AU14ArmorFILFire
  name: QT-10-IF Heavy Incinerator armor
  description: The standard body armor system of the French Armed Forces. This one has been modded to have increased protection against most forms of damage, mainly towards fire and similar sources of heat.
  components:
  - type: Sprite
    sprite: _AU14/Clothing/FIL/armor/fil_fire.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.3
  - type: ClothingGrantComponents
    components:
    - type: RMCImmuneToIgnition
      immuneToDirectHits: false
  - type: FirewalkArmor
    whitelist:
      components:
      - Marine
    addComponentsOnFirewalk:
    - type: RMCImmuneToFireTileDamage
      bypassWhitelist:
        components:
        - RMCFireImmunityBypass
    auraColor: "#03FCC6"