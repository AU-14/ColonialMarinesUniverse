    proto: AU14CartridgeRifleFPSAAP
    capacity: 40
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _AU14/Weapons/Guns/Ammo/Magazines/fpsa.rsi
    layers:
    - state: mag-0
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: band
      color: "#1F951F"
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Appearance
  - type: Clothing
    slots:
    - suitStorage

