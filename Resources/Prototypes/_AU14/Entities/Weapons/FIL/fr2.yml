- type: entity
  parent: [ RMCUnderAttachmentBase, RMCAttachableToggleableBase ]
  id: AU14AttachmentBipodFR2
  name: FR2 bipod
  description: An integrated bipod for the FR2 AMR.
  components:
  - type: Sprite
    sprite: _AU14/Weapons/Guns/Attachments/fil_attachments.rsi
    state: fr2_bipod
  - type: Tag
    tags:
    - RMCAttachmentUnderbarrel
    - AU14AttachmentBipodFR2
  - type: AttachableToggleable
    activateOnMove: false
    heldOnlyActivate: true
    userOnly: true
    doInterrupt: true
    attachedOnly: true
    breakOnMove: true
    breakOnFullRotate: true
    breakOnDrop: true
    slowOnBreak: true
    doAfter: 1.5
    deactivateDoAfter: 0
    doAfterNeedHand: false
    instantToggle: Brace
    useDelay: 0.5
    activatePopupText: attachable-popup-activate-deploy-on-ground
    deactivatePopupText: attachable-popup-deactivate-retract
    activateSound:
      path: /Audio/_RMC14/Attachable/bipod_toggle.ogg
      params:
        volume: -3
    deactivateSound:
      path: /Audio/_RMC14/Attachable/bipod_toggle.ogg
      params:
        volume: -3
    icon:
      sprite: _AU14/Weapons/Guns/Attachments/fil_attachments.rsi
      state: fr2_bipod
    iconActive:
      sprite: _AU14/Weapons/Guns/Attachments/fil_attachments.rsi
      state: fr2_bipod-on
    actionName: Deploy Bipod
    actionDesc: Deploy the bipod and get into a firing position.
  - type: AttachableVisuals
    showActive: true
  - type: AttachableTemporarySpeedMods
    alteration: Interrupted
  - type: AttachableSizeMods
    modifiers:
    - size: 2
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: 0.4
  - type: AttachableWeaponMeleeMods
    modifiers:
    - bonusDamage:
        types:
          Blunt: -10
  - type: AttachableWeaponRangedMods
    fireModeMods:
    - conditions:
        activeOnly: true
        whitelist:
          tags:
          - RMCGunBipodFullAuto
      extraFireModes: FullAuto
      setFireMode: FullAuto
    modifiers:
    - conditions:
        inactiveOnly: true
      fireDelayFlat: 0.12
    - conditions:
        wieldedOnly: true
        inactiveOnly: true
      accuracyAddMult: -0.25
      scatterFlat: 2
      recoilFlat: 1
      fireDelayFlat: 0.06
    - conditions:
        wieldedOnly: true
        activeOnly: true
      scatterFlat: -1
      recoilFlat: -2
    - conditions:
        activeOnly: true
      accuracyAddMult: 0.25
      burstScatterAddMult: -3
      fireDelayFlat: -0.09
    - conditions:
        activeOnly: true
        whitelist:
          tags:
          - AU14WeaponFR2
      fireDelayFlat: -0.4

