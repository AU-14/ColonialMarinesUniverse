- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseAttachableHolder, RMCBaseWeaponMagazineVisuals ]
  name: FR F20 bolt action marksman rifle
  id: AU14WeaponFR2
  description: Fusil à Répétition modèle F20 or repeating rifle model F20 is a bolt-action marksman rifle a very hardened old model of the French Military. Originally made by FAN in 2149 to give military and private arsenals. Used to take out targets in the old fashioned way by having more traditional mechanism and a variable zoom scope to land their target. Loaded with 10x50mm caseful caliber.
  suffix: Filled
  components:
  - type: Sprite
    sprite: _AU14/Weapons/Guns/FIL/fr2.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
    - sprite: _AU14/Weapons/Guns/Attachments/fil_attachments.rsi
      state: fr2_scope
      offset: 0.275, 0.22
    - sprite: _AU14/Weapons/Guns/Attachments/fil_attachments.rsi
      state: fr2_bipod
      offset: 0.8, -0.075
  - type: Clothing
    sprite: _AU14/Weapons/Guns/FIL/fr2.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 1
    recoilUnwielded: 4
    scatterWielded: 0
    scatterUnwielded: 20
    baseFireRate: 1.25
    burstScatterMult: 5
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 4
  - type: GunDualWielding
    weaponGroup: Rifle
  - type: GunRequiresWield
  - type: UniqueAction
  - type: BreechLoaded
    needOpenClose: true
    openSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg"
    closeSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg"
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          True: { state: bolt-open }
          False: { state: base }
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: AU14MagazineRifleFR2
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - AU14MagazineRifleFR2
          - AU14MagazineRifleFR2HP
          - AU14MagazineRifleFR2WP
          - AU14MagazineRifleFR2AP
  - type: GunDamageModifier
    multiplier: 1.4
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        startingAttachable: AU14AttachmentBarrelFR2
        locked: true
        whitelist:
          tags:
          - AU14AttachmentBarrelFR2
      rmc-aslot-rail:
        locked: true
        startingAttachable: AU14IntegratedScopeFR2
        whitelist:
          tags:
          - AU14IntegratedScopeFR2
      rmc-aslot-underbarrel:
        startingAttachable: AU14AttachmentBipodFR2
        whitelist:
          tags:
          - AU14AttachmentBipodFR2
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.80, 0.06
      rmc-aslot-rail: -0.28, 0.06
      rmc-aslot-stock: -0.74, -0.14
  - type: ItemCamouflage
    camouflageVariations: {}
  - type: Corrodible
    isCorrodible: false

