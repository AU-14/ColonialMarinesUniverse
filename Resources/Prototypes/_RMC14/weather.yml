# Solaris

- type: entity
  parent: WeatherBase
  id: RMCBigRedDust
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_RMC14/Effects/weather.rsi
      state: bigred_dust
    sound:
      path: /Audio/Effects/Weather/snowstorm_weak.ogg
      params:
        loop: true
        volume: -6

