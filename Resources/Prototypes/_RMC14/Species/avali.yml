# Ported from Cosmetic Drift.

- type: species
  id: Avali
  name: species-name-avali
  roundStart: false
  prototype: CMMobAvali
  dollPrototype: AppearanceAvali
  skinColoration: Hues
  maleFirstNames: RMCNamesAvaliFirst
  femaleFirstNames: RMCNamesAvaliFirst
  lastNames: RMCNamesAvaliLast
  naming: FirstLastCombined
  defaultSoundsBySex:
  - RMCMaleAvali
  - RMCFemaleAvali
  - RMCMaleAvali
  voices:
  - RMCMaleAvali
  - RMCFemaleAvali

- type: markingsGroup
  parent: Undergarments
  id: Avali
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ AvaliTailBase ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ AvaliEarsBase ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: true
      default: [ RMCUnderwearBoxersBlue ]
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: true
      default: [ RMCUndershirtStandard ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 4
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAvali
  categories: [ HideSpawnMenu ]
  name: avali appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganAvaliTorso
      Head: OrganAvaliHead
      ArmLeft: OrganAvaliArmLeft
      ArmRight: OrganAvaliArmRight
      HandRight: OrganAvaliHandRight
      HandLeft: OrganAvaliHandLeft
      LegLeft: OrganAvaliLegLeft
      LegRight: OrganAvaliLegRight
      FootLeft: OrganAvaliFootLeft
      FootRight: OrganAvaliFootRight
      Brain: OrganHumanBrain
      Eyes: OrganAvaliEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Avali
    voice: RMCMaleAvali
  - type: Inventory
    speciesId: avali

- type: entity
  parent: OrganBaseOrganic
  id: OrganAvali
  abstract: true
  suffix: avali

- type: entity
  id: OrganAvaliVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _RMC14/Mobs/Avali/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Avali

- type: entity
  parent: [ OrganAvali, OrganAvaliVisual ]
  id: OrganAvaliExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Avali/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganAvaliExternal ]
  id: OrganAvaliTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.UndergarmentTop

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganAvaliExternal ]
  id: OrganAvaliHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseArmLeft, OrganAvaliExternal ]
  id: OrganAvaliArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganAvaliExternal ]
  id: OrganAvaliArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganAvaliExternal ]
  id: OrganAvaliHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganAvaliExternal ]
  id: OrganAvaliHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganAvaliExternal ]
  id: OrganAvaliLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganAvaliExternal ]
  id: OrganAvaliLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganAvaliExternal ]
  id: OrganAvaliFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganAvaliExternal ]
  id: OrganAvaliFootRight

- type: entity
  parent: [ OrganAvaliVisual, OrganBaseEyes, OrganHumanInternal ]
  id: OrganAvaliEyes
