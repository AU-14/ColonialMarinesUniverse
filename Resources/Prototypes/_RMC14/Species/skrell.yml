# Ported from Baystation 12.

- type: species
  id: Skrell
  name: species-name-skrell
  roundStart: false
  prototype: RMCMobSkrell
  defaultSkinTone: "#8cd7a3"
  dollPrototype: AppearanceSkrell
  skinColoration: Hues
  maleFirstNames: RMCNamesSkrellFirst
  femaleFirstNames: RMCNamesSkrellFirst
  lastNames: RMCNamesSkrellLast
  defaultSoundsBySex:
  - RMCMaleSkrell
  - RMCFemaleSkrell
  - RMCMaleSkrell
  voices:
  - RMCMaleSkrell
  - RMCFemaleSkrell

- type: markingsGroup
  parent: Undergarments
  id: Skrell
  limits:
    enum.HumanoidVisualLayers.Special:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ RMCHairSkrellShort ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: true
      default: [ RMCUnderwearBoxersBlue ]
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: true
      default: [ RMCUndershirtStandard ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSkrell
  categories: [ HideSpawnMenu ]
  name: skrell appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganSkrellTorso
      Head: OrganSkrellHead
      ArmLeft: OrganSkrellArmLeft
      ArmRight: OrganSkrellArmRight
      HandRight: OrganSkrellHandRight
      HandLeft: OrganSkrellHandLeft
      LegLeft: OrganSkrellLegLeft
      LegRight: OrganSkrellLegRight
      FootLeft: OrganSkrellFootLeft
      FootRight: OrganSkrellFootRight
      Brain: OrganHumanBrain
      Eyes: OrganSkrellEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Skrell
    voice: RMCMaleSkrell

- type: entity
  parent: OrganBaseOrganic
  id: OrganSkrell
  abstract: true
  suffix: skrell

- type: entity
  id: OrganSkrellVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _RMC14/Mobs/Skrells/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Skrell

- type: entity
  parent: [ OrganSkrell, OrganSkrellVisual ]
  id: OrganSkrellExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Skrells/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganSkrellExternal ]
  id: OrganSkrellTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.UndergarmentTop

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganSkrellExternal ]
  id: OrganSkrellHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair

- type: entity
  parent: [ OrganBaseArmLeft, OrganSkrellExternal ]
  id: OrganSkrellArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganSkrellExternal ]
  id: OrganSkrellArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganSkrellExternal ]
  id: OrganSkrellHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganSkrellExternal ]
  id: OrganSkrellHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganSkrellExternal ]
  id: OrganSkrellLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganSkrellExternal ]
  id: OrganSkrellLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganSkrellExternal ]
  id: OrganSkrellFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganSkrellExternal ]
  id: OrganSkrellFootRight

- type: entity
  parent: [ OrganSkrellVisual, OrganBaseEyes, OrganHumanInternal ]
  id: OrganSkrellEyes
