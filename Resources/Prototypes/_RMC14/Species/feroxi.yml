# Ported from Delta-V.

- type: species
  id: Feroxi
  name: species-name-feroxi
  roundStart: false
  prototype: RMCMobFeroxi
  defaultSkinTone: "#985629"
  dollPrototype: AppearanceFeroxi
  skinColoration: Hues
  maleFirstNames: names_feroxi_male
  femaleFirstNames: names_feroxi_female
  lastNames: names_feroxi_last
  defaultSoundsBySex:
  - RMCMaleFeroxi
  - RMCFemaleFeroxi
  - RMCMaleFeroxi
  voices:
  - RMCMaleFeroxi
  - RMCFemaleFeroxi

- type: markingsGroup
  parent: Undergarments
  id: Feroxi
  limits:
    enum.HumanoidVisualLayers.Head:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FeroxiTailAndDorsal ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ FeroxiSnout ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ FeroxiEars ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.UndergarmentBottom:
      limit: 1
      required: true
      default: [ RMCUnderwearBoxersBlue ]
    enum.HumanoidVisualLayers.UndergarmentTop:
      limit: 1
      required: true
      default: [ RMCUndershirtStandard ]

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFeroxi
  categories: [ HideSpawnMenu ]
  name: feroxi appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganFeroxiTorso
      Head: OrganFeroxiHead
      ArmLeft: OrganFeroxiArmLeft
      ArmRight: OrganFeroxiArmRight
      HandRight: OrganFeroxiHandRight
      HandLeft: OrganFeroxiHandLeft
      LegLeft: OrganFeroxiLegLeft
      LegRight: OrganFeroxiLegRight
      FootLeft: OrganFeroxiFootLeft
      FootRight: OrganFeroxiFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Feroxi
    voice: RMCMaleFeroxi
  - type: Inventory
    speciesId: feroxi

- type: entity
  parent: OrganBaseOrganic
  id: OrganFeroxi
  abstract: true
  suffix: feroxi

- type: entity
  id: OrganFeroxiVisual
  abstract: true
  components:
  - type: VisualOrgan
    data:
      sprite: _RMC14/Mobs/Feroxi/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Feroxi

- type: entity
  parent: [ OrganFeroxi, OrganFeroxiVisual ]
  id: OrganFeroxiExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Feroxi/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganFeroxiExternal ]
  id: OrganFeroxiTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.UndergarmentTop

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganFeroxiExternal ]
  id: OrganFeroxiHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide

- type: entity
  parent: [ OrganBaseArmLeft, OrganFeroxiExternal ]
  id: OrganFeroxiArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganFeroxiExternal ]
