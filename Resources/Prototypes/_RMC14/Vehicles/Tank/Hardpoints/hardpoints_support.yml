- type: entity
  parent: VehicleTankHardpointBase
  id: VehicleTankWarningArray
  name: integrated weapons sensor array
  description: An integrated sensor array that improves accuracy and fire rate of onboard weapons.
  components:
  - type: Sprite
    state: warray
  - type: HardpointItem
    hardpointType: Support
    vehicleFamily: Tank
    slotType: SupportAttachment
    damageMultiplier: 0.075
    repairRate: 0.0125
  - type: HardpointIntegrity
    maxIntegrity: 250
  - type: VehicleWeaponSupportAttachment
    accuracyMultiplier: 1.2
    fireRateMultiplier: 1.15
  - type: HardpointVisual
    vehicleState: warray_0
    damagedVehicleState: warray_1

