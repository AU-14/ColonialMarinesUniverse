- type: entity
  parent: RMCRocket84mmAntiArmor
  id: VehicleRocket84mmAntiArmor
  categories: [ HideSpawnMenu ]
  components:
  - type: CartridgeAmmo
    proto: VehicleProjectileRocket84mmAntiArmor
    deleteOnSpawn: false

- type: entity
  parent: RMCProjectileRocket84mm
  id: VehicleProjectileRocket84mmAntiArmor
  categories: [ HideSpawnMenu ]
  components:
  - type: TankCookOffProjectile # CMU14: vehicle TOW hits can ignite tank ammunition.
    criticalChance: 0.15 # CMU14: FLOW-09
    hullFraction: 0.35 # CMU14: FLOW-09
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 160
        Heat: 150
    maxFixedRange: 32
  - type: CMArmorPiercing
    amount: 50
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/m5spec_projectiles.rsi
    layers:
    - state: m5_84mm_ap
  - type: Explosive
    explosionType: RMC
    maxIntensity: 10
    intensitySlope: 5
    totalIntensity: 35
    maxTileBreak: 0
  - type: RMCKnockOutOnCollide
    paralyzeTime: 6
  - type: TriggerOnFixedDistanceStop
    delay: 0
