- type: entity
  abstract: true
  parent: BaseItem
  id: VehicleAmmoBoxBase
  name: vehicle ammunition crate
  description: A bulky ammunition container for vehicle weapons.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/ammo/vehicles.rsi
    layers:
    - state: frontal_0
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: frontal_1, visible: true }
          Low: { state: frontal_1, visible: true }
          Medium: { state: frontal_0, visible: true }
          High: { state: frontal_0, visible: true }
          Full: { state: frontal_0, visible: true }
  - type: Appearance
  - type: BulletBox
    amount: 500
    max: 500
    bulletType: VehicleAmmoBoxFrontal
    usedIn: APC frontal cannon
  - type: Tag
    tags:
    - RMCAmmoBox

- type: entity
  parent: VehicleAmmoBoxBase
  id: VehicleAmmoBoxFrontal
  name: frontal cannon ammo crate
  description: Ammunition for frontal vehicle cannons.
  components:
  - type: Sprite
    layers:
    - state: frontal_0
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: frontal_0, visible: true }
          Low: { state: frontal_0, visible: true }
          Medium: { state: frontal_1, visible: true }
          High: { state: frontal_1, visible: true }
          Full: { state: frontal_1, visible: true }
  - type: BulletBox
    amount: 500
    max: 500
    bulletType: VehicleAmmoBoxFrontal

