- type: entity
  parent: RMCVehicleBase
  id: VehicleVanBase
  abstract: true
  name: van
  description: A rugged transport van.
  components:
  - type: WarpPoint
    follow: true
    location: cmu-vehicle-van # CMU14
  - type: GridVehicleMover
    maxSpeed: 6
    acceleration: 5
    deceleration: 12
    turnDelay: 0.25
    pushCooldown: 2
    xenoBlockMinimumSize: Immobile
    xenoPushMinimumSize: Immobile
  - type: VehicleOvercharge
    speedMultiplier: 1.35
    duration: 2.5
    cooldown: 14
    overchargeSound:
      path: /Audio/_RMC14/Vehicle/box_van_overdrive.ogg
      params:
        volume: -2
  - type: VehicleSound
    runningSound:
      path: /Audio/_RMC14/Vehicle/box_van_driving.ogg
      params:
        volume: -4
    runningSoundCooldown: 2.3
    hornSound: /Audio/_RMC14/Vehicle/honk_4_light.ogg
    hornCooldown: 1
    collisionSound:
      path: /Audio/Effects/metal_thud1.ogg
      params:
        volume: -2
    collisionSoundCooldown: 1.5
    collisionSoundMinSpeed: 6
    mobCollisionSound: /Audio/_RMC14/Xeno/alien_claw_block.ogg
  - type: VehicleSpotlight
    radius: 6
    energy: 2.5
    softness: 2
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-1.2,0.425,1.2
        density: 1000
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Structures/Vehicles/van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: PointLight
    enabled: false
    radius: 6
    energy: 2.5
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: ContainerContainer
    containers:
      wheel-1: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      insertDelay: 1.5
      whitelist:
        components:
        - VehicleWheelItem
  - type: HardpointState
  - type: VehicleEnter
    interiorPath: /Maps/_RMC14/Vehicles/van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    maxXenos: 2
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.5,-0.34
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1

- type: entity
  parent: VehicleVanBase
  id: VehicleVan
  suffix: Drivable, Van, Base

## CLF

- type: entity
  parent: VehicleVanBase
  id: VehicleCLFVan
  name: CLF van
  suffix: Drivable, Van, CLF
  description: A rugged transport van painted in CLF colors.
  components:
  - type: Damageable
    damageModifierSet: VehicleFrameCLFVan # CLF van modifiers
#   damageContainer: Inorganic # CMU14
  - type: Injurable # CMU14
    damageContainer: StructuralMarine
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/CLF_van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_RMC14/Vehicles/van_interior.yml #TODO RMC14 add a dedicated CLF interior
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 10
    maxXenos: 2
    entryPoints:
    - offset: 1,-1
      radius: 0.6
      interiorCoords: 3.25,0
    - offset: -1,-1
      radius: 0.6
      interiorCoords: 3.25,-1
    - offset: 0,2
      radius: 0.75
      interiorCoords: 0.25,-1

## Box Vans

- type: entity
  parent: VehicleVanBase
  id: VehicleBoxVanBase
  abstract: true
  name: box van
  description: A rugged transport van fitted with a box body.
  components:
  - type: Vehicle
    movementKind: Grid
  - type: Clickable
  - type: GridVehicleMover
    maxSpeed: 8
    acceleration: 5
    deceleration: 12
    turnDelay: 0.25
    pushCooldown: 2
    xenoBlockMinimumSize: Xeno
    xenoPushMinimumSize: Immobile
    canSmashWalls: true
    wallSmashMinSpeed: 5
    wallSmashWheelDamage: 0.8
    wallSmashHullDamage: 45
    wallSmashSlowdownMultiplier: 0.75
    wallSmashSlowdownDuration: 0.25
    mobCollisionHullDamage: 8
    speedAtZeroIntegrity: 0.35
    crashImmobileDuration: 8
    crashImmobileMinSpeed: 7.25
    mobCrashImmobileDuration: 4
    mobCrashImmobileMinSpeed: 5.5
    xenoMobCrashImmobileDuration: 8
    xenoMobCrashImmobileMinSpeed: 5.5
  - type: VehicleOvercharge
    speedMultiplier: 1.3
    duration: 2.75
    cooldown: 16
    overchargeSound:
      path: /Audio/_RMC14/Vehicle/box_van_overdrive.ogg
      params:
        volume: -3
  - type: VehicleSound
    runningSound:
      path: /Audio/_RMC14/Vehicle/box_van_driving.ogg
      params:
        volume: -5
        pitch: 0.92
    runningSoundCooldown: 2.3
    hornSound: /Audio/_RMC14/Vehicle/box_van_horn.ogg
    hornCooldown: 1
    collisionSound:
      path: /Audio/Effects/metal_slam1.ogg
      params:
        volume: -3
    collisionSoundCooldown: 1.5
    collisionSoundMinSpeed: 6
    mobCollisionSound: /Audio/_RMC14/Xeno/alien_claw_block.ogg
  - type: VehicleSpotlight
    radius: 6
    energy: 2.5
    softness: 2
  - type: Physics
    bodyType: Dynamic
  #CMU
  - type: CMUZPhysics
  - type: CMUVehicleZTraversal
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-0.35,0.425,1.4
        density: 1000
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -0.425,-0.35,0.425,1.4
        density: 1000
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Sprite
    offset: "0,0.5"
    drawdepth: Mobs
    sprite: _RMC14/Structures/Vehicles/box_van.rsi
    layers:
    - map: [ base ]
      state: van_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleEnter
    interiorPath: /Maps/_RMC14/Vehicles/box_van_interior.yml
    enterDoAfter: 1.0
    exitDoAfter: 1.0
    maxPassengers: 8
    maxXenos: 2
    entryPoints:
    - offset: 1,-0.25
      radius: 0.6
      interiorCoords: -0.42,1.6
    - offset: -1,-0.25
      radius: 0.6
      interiorCoords: -0.53,0.84
    - offset: 0,2
      radius: 0.75
      interiorCoords: -1.74,1.22

- type: entity
  parent: VehicleBoxVanBase
  id: VehicleBoxVan
  suffix: Drivable, Box Van, Base

