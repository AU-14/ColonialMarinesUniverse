  components:
  - type: Sprite
    layers:
    - map: [ base ]
      state: sppvant_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: VehicleHardpointVisuals
  - type: ItemSlots
    slots:
      secondary:
        startingItem: VehicleSPPVanTurret
        whitelist:
          components:
          - HardpointItem
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyVan
    slots:
    - id: secondary
      hardpointType: HardpointTypeSecondary
      slotType: HardpointSlotTypeLauncher
      compatibilityId: HardpointCompatibilitySPPVan
      visualLayer: secondary
      insertDelay: 2.0
      required: false
