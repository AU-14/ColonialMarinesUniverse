- type: entity
  id: ActionToggleMarineHud
  name: Toggle Marine Hud
  description: Toggle marine icons.
  components:
  - type: Action
    checkCanInteract: false
    autoPopulate: false # CMU14
  - type: Sprite
    layers:
    - sprite: _RMC14/Interface/cm_job_icons.rsi
      state: hudsquad_co
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleMarineHudActionEvent

- type: entity
  id: ActionToggleXenoHud
  name: Toggle Xeno Hud
  description: Toggle xeno health and plasma bars.
  components:
  - type: Action
    checkCanInteract: false
    autoPopulate: false # CMU14
  - type: Sprite
    layers:
    - sprite: _RMC14/Interface/Alerts/xeno_health.rsi
      state: health_full
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleXenoHudActionEvent

- type: entity
  id: ActionFindParasite
  name: Find Parasite
  description: Find Ghostrolable Parasites
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/observer_actions.rsi
      state: find_parasite
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:FindParasiteActionEvent

- type: entity
  id: ActionJoinXeno
  name: Join as Xeno
  description: Find burrowed larva to join as.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/observer_actions.rsi
      state: join_xeno
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:JoinXenoActionEvent

- type: entity
  id: ActionToggleVisibility
  name: Toggle Visibility
  description: Toggles your visibility, while you're invisible your friend can still hear what you say.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/ghost_human.rsi #TODO Find a better icon
      state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ImaginaryFriendToggleVisibilityActionEvent

- type: entity
  id: ActionStopBeingFriends
  name: Leave Friend
  description: Stop being an imaginary friend.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: _RMC14/Actions/marine_emplacement_actions.rsi #TODO Find a better icon
      state: cancel_view
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ImaginaryFriendStopBeingFriendsActionEvent
