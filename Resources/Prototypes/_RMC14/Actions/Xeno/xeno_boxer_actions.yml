- type: entity
  parent: ActionXenoBase
  id: ActionXenoBoxerPunch
  name: cm-xeno-boxer-punch-name
  description: cm-xeno-boxer-punch-description
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 4
    icon:
      sprite: _RMC14/Actions/xeno_actions.rsi
      state: pounce
  - type: TargetAction
    range: 2
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:XenoBoxerPunchActionEvent
    toggleOutline: false
  - type: XenoOffensiveAction

