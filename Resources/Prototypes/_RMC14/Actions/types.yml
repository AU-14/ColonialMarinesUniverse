# Vulpkanin Tail Wagging
- type: entity
  parent: ActionToggleWagging
  id: ActionToggleVulpkaninWagging
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1 # Prevents Emote Spam
  - type: Sprite
    layers:
    - sprite: _RMC14/Mobs/Vulpkanin/tail_markings.rsi
      state: tail-wag-icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:ToggleActionEvent

