# Base
- type: entity
  abstract: true
  id: RMCMechBase
  components:
  - type: Corrodible
    isCorrodible: true
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: powerloader_open
      map: [ "buckledLayer" ]
  - type: MobMover
  - type: DoAfter
  - type: MeleeWeapon
    hidden: true
    attackRate: 1
    damage:
      types:
        Blunt: 30
    soundHit:
      collection: MetalThud
  - type: Puller
    needsHands: false
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: CMUZPhysics 
  - type: CMUVehicleZTraversal 
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: ContainerContainer
    containers:
      rmc-mech-pilot: !type:ContainerSlot
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: FootstepModifier
    footstepSoundCollection:
      collection: CMUPowerLoaderStep # CMU14: the CM13 loader's own steps
  - type: RMCAllowStrapMovement
  - type: Strap
    modifyBuckleDrawDepth: false # CMU14: RMC upstream; RMCStrapDrawDepth owns the pilot's depth
    buckleSound:
      path: /Audio/_RMC14/Mecha/powerloader_buckle.ogg
      params:
        variation: 0.1
    unbuckleSound:
      path: /Audio/_RMC14/Mecha/powerloader_unbuckle.ogg
      params:
        variation: 0.1
    blacklist:
      components:
      - Xeno
  - type: RMCStrapDrawDepth
    unstrappedDepth: Mobs
    strappedDepth: OverMobs
    buckledDepth: Mobs # CMU14: keep the pilot under the overlay
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { state: powerloader_overlay }
          False: { state: powerloader_open }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          RMCPowerCellAPC:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Wreckages
- type: entity
  id: RMCMechPowerLoaderWreckage
  name: Caterpillar P-5000 Work Loader wreckage
  description: Remains of some unfortunate Power Loader. Completely unrepairable.
  components:
  - type: Corrodible
    isCorrodible: true
  - type: Sprite
    drawdepth: BelowMobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: wreck
  - type: Clickable
  - type: InputMover
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Strap
    blacklist:
      components:
      - Xeno
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: RMCMechPowerLoaderWreckage
  id: RMCMechPowerLoaderWreckageGreen
  name: John Deere 4300 Power Loader wreckage
  components:
  - type: Sprite
    drawdepth: BelowMobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: wreck_jd

- type: entity
  parent: RMCMechPowerLoaderWreckage
  id: RMCMechPowerLoaderWreckageBlue
  name: Caterpillar P-5200 Work Loader wreckage
  components:
  - type: Sprite
    drawdepth: BelowMobs
    noRot: true
    sprite: _RMC14/Objects/power_loader.rsi
    layers:
    - state: wreck_ft

- type: entity
  parent: RMCMechBase
  id: RMCMechPowerLoader
  name: Caterpillar P-5000 Work Loader
  description: The Caterpillar P-5000 Work Loader is a commercial mechanized exoskeleton used for lifting heavy materials and objects, first designed in January 29, 2025 by Weyland Corporation. An old but trusted design used in warehouses, constructions and military ships everywhere.
  components:
  - type: PowerLoader
    skills:
      all:
        RMCSkillPowerLoader: 1
  - type: CMUVehicleZTraversal
    canUseStairs: true
  - type: Hands
  - type: GiveHands
    hands:
    - name: Right Hand
      location: Right
    - name: Left Hand
      location: Left
  - type: IgnoreInteractionRange
    whitelist:
      tags:
      - RMCDropshipEnginePoint
    range: 2
  - type: SpawnOnTerminate
    spawn: RMCMechPowerLoaderWreckage
  # CMU14 Begin: a rotating beacon while piloted (from cmss13-devs/cmss13#13425), turn hydraulics, a seated pilot,
  # clamps that force doors and podlocks powered or not, and damage that shows and slows the loader until it's welded back
  - type: PointLight
    enabled: false
    radius: 4
    energy: 2.5
    color: "#FA9632"
    lightMask: ConeDouble
  - type: RotatingLight
    speed: 180
  - type: CMUPowerLoader
    turnSound: # CM13 hydraulics when the loader turns
      collection: CMUPowerLoaderTurn
      params:
        variation: 0.05
    pilotOffset: 0, -0.08 # the pilot sits low in the cab
    pilotDirectionOffsets: # CM13 leans the pilot 7px into the way the loader faces
      East: 0.21875, 0
      West: -0.21875, 0
    unpilotedDirectionDepths: # walk in front of an empty loader facing you, behind one facing away
      South: BelowMobs
      North: OverMobs
    beaconOffsets:
      South: 0, 0.45
      North: 0, 0.45
      East: 0.19, 0.45
      West: -0.17, 0.45
    damageStates:
    - damage: 200
      speedModifier: 0.8
      effect: RMCBruteSparks
      sound:
        collection: sparks
        params:
          volume: -6
      popup: cmu-power-loader-damaged
      examine: cmu-power-loader-examine-damaged
    - damage: 300
      speedModifier: 0.6
      effect: RMCBruteSparks
      sound:
        collection: sparks
        params:
          volume: -3
      popup: cmu-power-loader-critical
      examine: cmu-power-loader-examine-critical
  - type: Prying
    pryPowered: true
    speedModifier: 1.5
    useSound:
      path: /Audio/_RMC14/Machines/hydraulics_2.ogg
    pryingAlertProtoId: null
  - type: RMCRepairable
  # CMU14 End

- type: entity
  parent: RMCMechPowerLoader
  id: RMCMechPowerLoaderGreen
  name: John Deere 4300 Power Loader
  description: John Deere 4300 Work Loader is a commercial mechanized exoskeleton used for lifting heavy materials and objects based on the Caterpillar P-5000, first designed in January 29, 2025 by Weyland Corporation. An old but trusted design used in warehouses, constructions and military ships everywhere. This one has a signature green and yellow livery.
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_jd
      map: [ "buckledLayer" ]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { state: powerloader_overlay_jd }
          False: { state: powerloader_open_jd }
  - type: SpawnOnTerminate
    spawn: RMCMechPowerLoaderWreckageGreen
  # CMU14 Begin: the John Deere is 20% slower than the P-5000
  - type: PowerLoader
    speedPerSkill: 0.96
    skills:
      all:
        RMCSkillPowerLoader: 1
  # CMU14 End

- type: entity
  parent: RMCMechPowerLoader
  id: RMCMechPowerLoaderBlue
  name: Caterpillar P-5200 Work Loader
  description: A modernized design made to outdo the older models once used in fancy ports and facilities.
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_ft
      map: [ "buckledLayer" ]
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          True: { state: powerloader_overlay_ft }
          False: { state: powerloader_open_ft }
  - type: SpawnOnTerminate
    spawn: RMCMechPowerLoaderWreckageBlue
  # CMU14 Begin: the P-5200 is 12% faster than the P-5000
  - type: PowerLoader
    speedPerSkill: 1.344
    skills:
      all:
        RMCSkillPowerLoader: 1
  # CMU14 End
