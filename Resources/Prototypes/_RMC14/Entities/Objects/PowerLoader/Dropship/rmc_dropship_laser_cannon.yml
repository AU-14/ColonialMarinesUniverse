- type: entity
  parent: RMCDropshipAttachmentWeapon
  id: RMCDropshipAttachmentLaserCannon
  name: LWU-6B Laser Cannon
  description: State of the art technology recently acquired by the UNMC, it fires a battery-fed pulsed laser beam at near lightspeed setting on fire everything it touches. Moving this will require some sort of lifter. Accepts the BTU-17/LW Hi-Cap Laser Batteries.
  components:
  - type: Sprite
    layers:
    - state: laser_beam
      offset: 0.5, 0.5
  - type: DropshipFabricatorPrintable
    cost: 500
  - type: DropshipWeapon
    abbreviation: LZR
    fireDelay: 5
    fireInTransport: true
    skills:
      all:
        RMCSkillPilot: 1
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: laser_beam_installed
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: laser_beam_loaded
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: laser_beam_loaded

- type: entity
  parent: RMCDropshipAttachmentAmmo
  id: RMCDropshipAttachmentAmmoLaserCannon
  name: BTU-17/LW Hi-Cap Laser Battery
  description: A high-capacity laser battery used to power laser beam weapons.  Can be loaded into the LWU-6B Laser Cannon.
  components:
  - type: Sprite
    layers:
    - state: laser_battery_10
      map: [ "enum.DropshipAmmoVisuals.Fill"]
  - type: DropshipAmmo
    ammoType: laser_battery
    rounds: 100
    maxRounds: 100
    roundsPerShot: 10
    shotsPerVolley: 10
    targetSpread: 1
    bulletSpread: 0
    travelTime: 1
    fireMissionDelay: 3
    weapon: RMCDropshipAttachmentLaserCannon
    soundEveryShots: 1
    soundCockpit: /Audio/Machines/phasein.ogg
    soundMarker: /Audio/_RMC14/Binoculars/nightvision.ogg
    soundImpact:
      path: /Audio/_RMC14/Effects/laser_cannon.ogg
      params:
        volume: -6
    fire:
      type: RMCTileFireLaser
      range: 3
      total: 16
    deleteOnEmpty: true
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 500

- type: entity
  parent: RMCDropshipAttachmentAmmoLaserCannon
  id: RMCDropshipAttachmentAmmoLaserCannonGreen
  name: BTU-18/LW-G 'Verdant' Hi-Cap Laser Battery
  description: A high-capacity laser battery used to power laser beam weapons, tuned to a green wavelength that spreads intense green fire over a wide area. Can be loaded into the LWU-6B Laser Cannon.
  components:
  - type: DropshipAmmo
    ammoType: laser_battery_green
    roundsPerShot: 5
    fire:
      type: RMCTileFireGreen
      range: 6
      total: 32
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 600

- type: entity
  parent: RMCDropshipAttachmentAmmoLaserCannon
  id: RMCDropshipAttachmentAmmoLaserCannonBlue
  name: BTU-18/LW-B 'Glacier' Hi-Cap Laser Battery
  description: A high-capacity laser battery used to power laser beam weapons, tuned to a blue wavelength that concentrates blue fire on a small area. Can be loaded into the LWU-6B Laser Cannon.
  components:
  - type: DropshipAmmo
    ammoType: laser_battery_blue
    roundsPerShot: 20
    fire:
      type: RMCTileFireBlue
      range: 3
      total: 16
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 600

- type: entity
  parent: RMCDropshipAttachmentAmmoLaserCannon
  id: RMCDropshipAttachmentAmmoLaserCannonWhite
  name: BTU-18/LW-W 'Daybreak' Hi-Cap Laser Battery
  description: An experimental low-capacity laser battery used to power laser beam weapons, packing as much charge as possible into the tiny battery to release a searing white-hot blast. Can be loaded into the LWU-6B Laser Cannon.
  components:
  - type: DropshipAmmo
    ammoType: laser_battery_white
    roundsPerShot: 50
    fire:
      type: RMCTileFireOB
      range: 2
      total: 8
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 700

- type: entity
  parent: RMCDropshipAttachmentAmmoLaserCannon
  id: RMCDropshipAttachmentAmmoLaserCannonRapid
  name: BTU-18/LW-R 'Rapidfire' Hi-Cap Laser Battery
  description: A high-capacity laser battery used to power laser beam weapons, overclocked to dump charge rapidly and spread napalm fire over the target. Can be loaded into the LWU-6B Laser Cannon.
  components:
  - type: DropshipAmmo
    ammoType: laser_battery_rapid
    roundsPerShot: 20
    fire:
      type: RMCTileFireNapalm
      range: 3
      total: 16
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 600
