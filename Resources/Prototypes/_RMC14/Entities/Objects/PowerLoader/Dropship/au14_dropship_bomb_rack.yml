# AU-14: JDAM Bomb Clamp.
# A crew-compartment (interior) only bomb clamp that holds a single JDAM family
# bomb. Must be moved with a powerloader and loaded by hand.

- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentJDAMBombClamp
  name: JDAM Bomb Clamp
  description: A JDAM bomb clamp, holds one JDAM family bomb. Fits on the crew compartment attach points of dropships.
  components:
  - type: Sprite
    layers:
    - state: bomb_clamp_unloaded
  - type: DropshipFabricatorPrintable
    cost: 650
  - type: DropshipWeapon
    abbreviation: BMB
    fireDelay: 10
    skills:
      all:
        RMCSkillPilot: 2
  - type: DropshipAttachedSprite
    sprite:
      sprite: _RMC14/Objects/dropship_utility_attachments.rsi
      state: bomb_clamp_interior_loaded
  - type: Tag
    tags:
    - AU14JDAMBombClamp
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint

# region JDAM family bombs (loaded into the JDAM Bomb Clamp)

- type: entity
  parent: RMCDropshipAttachmentAmmoRocket
  id: AU14DropshipAttachmentAmmoJDAMHE
  name: GBU-89B JDAM (HE)
  description: The GBU-89B Joint Direct Attack Munition is an old but reliable large guided munition. It has an excessively long travel time, but can level entire buildings. Loaded into the JDAM Bomb Clamp.
  components:
  - type: Sprite
    layers:
    - state: jdam
      map: [ "enum.DropshipAmmoVisuals.Fill" ]
  - type: Tag
    tags:
    - AU14JDAMBomb
  - type: DropshipAmmo
    rounds: 1
    maxRounds: 1
    roundsPerShot: 1
    travelTime: 12
    zLevelPenetration: 2
    applyEffectsOnPenetrationLevels: true
    weapon: RMCDropshipAttachmentJDAMBombClamp
    explosion:
      total: 10000
      slope: 4.5
      max: 100000000
    impactEffects:
    - AU14EffectExplosionParticleJDAM
  - type: DropshipFabricatorPrintable
    category: Ammo
    cost: 7500

