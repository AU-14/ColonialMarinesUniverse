- type: entity
  parent: RMCDropshipAttachmentUtility
  id: RMCDropshipAttachmentJDAMBombClamp
  name: JDAM Bomb Clamp
  description: A JDAM bomb clamp, holds one JDAM family bomb rack. Fits on both the external weapon and crew compartment attach points of dropships.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/dropship_utility_attachments.rsi
    layers:
    - state: bomb_clamp
  - type: DropshipFabricatorPrintable
    cost: 650
  - type: DropshipWeapon
    abbreviation: BMB
    fireDelay: 10
    weaponAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: bomb_clamp_installed
    ammoEmptyAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: bomb_clamp_empty
    ammoAttachedSprite:
      sprite: _RMC14/Objects/dropship_attachments.rsi
      state: bomb_clamp_loaded
  - type: PowerLoaderAttachable
    attachableTypes:
    - RMCDropshipUtilityPoint