- type: injectorMode
  parent: BaseInjectMode
  id: RMCLethalSyringeInjectMode
  mobTime: 30
  delayPerVolume: 0
  transferAmounts: [ 50 ]

- type: entity
  parent: Syringe
  id: CMSyringe
  suffix: RMC14
  components:
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: syringe
  - type: Sprite
    sprite: _RMC14/Objects/Medical/syringe.rsi
    layers:
    - state: syringe
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: syringe1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Icon
    sprite: _RMC14/Objects/Medical/syringe.rsi
    state: "syringe"
  - type: Item
    storedRotation: 90
    size: Tiny
    sprite: _RMC14/Objects/Medical/syringe.rsi
  - type: Clothing
    quickEquip: false
    slots:
    - suitstorage
  - type: PhysicalComposition
    materialComposition:
      CMGlass: 150

- type: entity
  parent: CMSyringe
  id: RMCPrefilledSyringe
  suffix: RMC14, Inject
  components:
  - type: Injector
    activeModeProtoId: SyringeInjectMode

- type: entity
  parent: CMSyringe
  id: RMCSyringeLethal
  name: lethal injection syringe
  description: A syringe used for lethal injections.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Medical/lethal_syringe.rsi
  - type: Solution
    solution:
        maxVol: 50
  - type: Injector #TODO RMC14 can't draw blood
    currentTransferAmount: 50
    activeModeProtoId: RMCLethalSyringeInjectMode
    allowedModes:
    - RMCLethalSyringeInjectMode

- type: entity
  parent: RMCSyringeLethal
  id: RMCSyringeLethalPrefilled
  suffix: RMC14, Filled
  components:
  - type: Label
    currentLabel: reagent-name-rmc-chloral-hydrate
  - type: Solution
    solution:
        maxVol: 50
        reagents:
        - ReagentId: RMCChloralhydrate
          Quantity: 50
