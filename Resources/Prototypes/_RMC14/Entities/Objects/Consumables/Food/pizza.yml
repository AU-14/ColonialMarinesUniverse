# Food Pizza Base
- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: RMCFoodPizzaBase
  components:
  - type: FlavorProfile
    flavors:
    - oily
    - bread
  - type: Edible
  - type: Tag
    tags:
    - Pizza

- type: entity
  abstract: true
  parent: [RMCFoodPizzaBase, BaseSlicingRefinableFood]
  id: RMCFoodPizzaFullBase
  components:
  - type: Sprite
    state: pizza
  - type: Item
    heldPrefix: pizza
  - type: Solution
    id: food
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Vitamin
        Quantity: 5

- type: entity
  abstract: true
  parent: RMCFoodPizzaBase
  id: RMCFoodPizzaSliceBase
  components:
  - type: Sprite
    state: slice
  - type: Item
    heldPrefix: slice
    size: Tiny
  - type: Solution
    id: food
    solution:
      maxVol: 6
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 0.8

