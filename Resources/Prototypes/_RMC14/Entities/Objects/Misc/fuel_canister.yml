- type: entity
  parent: BaseItem
  id: RMCFuelCan
  name: fuel can
  description: A jerry can. In space! Or maybe a colony.
  components:
    - type: Sprite
      sprite: _RMC14/Objects/Misc/fuel_can.rsi
      state: can_1
    - type: Tag # CMU14: fits the jeep's jerry can rack.
      tags:
      - CMUJerryCan
    # CMU14 Begin: holds the jeep's fuel.
    - type: Solution
      id: fuel
      solution:
        maxVol: 60
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 60
    - type: RefillableSolution
      solution: fuel
    - type: DrainableSolution
      solution: fuel
    - type: SolutionTransfer
    # CMU14 End

- type: entity
  parent: RMCFuelCan
  id: RMCFuelCan2
  components:
    - type: Sprite
      state: can_2

- type: entity
  parent: RMCFuelCan
  id: RMCFuelCan3
  components:
    - type: Sprite
      state: can_3

- type: entity
  parent: RMCFuelCan
  id: RMCFuelCan4
  components:
    - type: Sprite
      state: can_4
