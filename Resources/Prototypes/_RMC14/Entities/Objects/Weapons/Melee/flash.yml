- type: entity
  parent: Flash
  id: CMFlash
  name: flash
  description: Used for blinding and being an asshole. Recharges one flash every 60 seconds. You must wait 5 seconds between uses for the capacitor to recharge.
  components:
  - type: Flash
    slowTo: 0.55
    meleeStunDuration: 8
    range: 3
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Melee/flash.rsi
  - type: Item
    size: Small
    sprite: _RMC14/Objects/Weapons/Melee/flash.rsi
  - type: LimitedCharges
    maxCharges: 2
    lastCharges: 2
  - type: AutoRecharge
    rechargeDuration: 60
  - type: UseDelay
    delay: 5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FlashVisuals.Flashing:
        enum.FlashVisualLayers.LightLayer:
          True: { visible: true }
          False: { visible: false }
  # cmu edit start: can set off epilepsy
  - type: CMUEpilepsyTrigger
  # cmu edit end
  - type: MeleeRequiresSkill
    skills:
      RMCSkillPolice: 1
