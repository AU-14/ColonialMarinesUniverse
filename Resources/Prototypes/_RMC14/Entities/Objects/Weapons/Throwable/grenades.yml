- type: entity
  abstract: true
  parent: GrenadeBase
  id: CMGrenadeBase
  name: grenade
  description: Duck and cover.
  components:
  - type: Explosive
    explosionType: RMC
  - type: ExplosionResistance
    damageCoefficient: 0
  - type: TriggerOnUse
    keyOut: startTimer
  - type: TimerTrigger
    keysIn:
    - startTimer
    keyOut: trigger
    delay: 4
    beepSound:
      # cmu edit start: grenade priming sound (cmss13-pve#517)
      path: "/Audio/CMU14/Weapons/Grenades/grenade.ogg"
      # cmu edit end
      params:
        volume: -5
    initialBeepDelay: 0
    beepInterval: 10
    popup: null
  - type: TimerTriggerVisuals
  - type: IgnorePredictionHide
  - type: Clothing
    slots:
    - suitStorage
  - type: Destructible
    thresholds: []
  - type: ChangeItemSizeOnTimerTrigger
  - type: CancelUseWithCloak

- type: entity
  abstract: true
  id: RMCM40DPTags
  components:
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40

- type: entity
  name: flashbang
  description: Excellent for stopping groups of Rioters. Don't expect sunglasses to protect you...
  parent: CMGrenadeBase
  id: RMCGrenadeFlashBang
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/flashbang.rsi
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Effects/flash_bang.ogg"
    positional: true
  # cmu edit start
  - type: FlashOnTrigger
    range: 7
  # cmu edit end
  - type: DeleteOnTrigger
  - type: SpawnOnTrigger
    proto: GrenadeFlashEffect
  - type: Appearance
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/countdown.ogg
  - type: Tag
    tags:
    - RMCGrenadeRiot
    - Grenade
    - RMCGrenadeFlashBang
  - type: RequiresSkill
    skills:
      RMCSkillPolice: 1

- type: entity
  parent:
  - CMGrenadeBase
  - RMCM40DPTags
  id: CMGrenadeHighExplosive
  # cmu edit start: M40 HEDP designation and impact fuse (cmss13-pve#517)
  name: M40 HEDP grenade
  description: High-Explosive Dual-Purpose. A small, but deceptively strong grenade that has been phasing out the M15 HE grenade. Explodes with a powerful blast. Can be fired from a grenade launcher for impact detonation, or primed in-hand and thrown to detonate after 4 seconds.
  # cmu edit end
  components:
  # cmu edit start: detonate on impact when fired from a launcher (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40hedp.rsi
  - type: ExplodeOnTrigger
  - type: Explosive
    maxIntensity: 20 # max 100 brute, 100 burn
    intensitySlope: 6
    totalIntensity: 200
    canCreateVacuum: false
  - type: Ammo
  - type: CMExplosionEffect
  - type: CMVocalizeTrigger
  - type: RMCScorchEffect
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeHEDP

- type: entity
  parent:
  - CMGrenadeBase
  - RMCM40DPTags
  id: CMGrenadeSmoke
  # cmu edit start: M47 HSDP designation and impact fuse (cmss13-pve#517)
  name: M47 HSDP smoke grenade
  description: The M47 HSDP is a small, but powerful smoke grenade. Based off the same platform as the M40 HEDP. Can be fired from a grenade launcher for impact detonation, or primed in-hand and thrown to detonate after 2.5 seconds.
  # cmu edit end
  components:
  # cmu edit start: detonate on impact when fired from a launcher (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
  # cmu edit end
  - type: TimerTrigger
    delay: 2.5
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40smoke.rsi
  - type: SpawnOnTrigger
    # cmu edit start: smoke grenades last 35 seconds
    proto: CMUSmokeGrenade
    # cmu edit end
  - type: EmitSoundOnTrigger
    sound: /Audio/Effects/smoke.ogg
    positional: true
  - type: DeleteOnTrigger
  # cmu edit start: use the standard grenade arm sound
  - type: TimerTriggerVisuals
    primingSound: null
  # cmu edit end
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeRiot
  - type: Ammo

- type: entity
  parent: Smoke
  id: RMCSmokeExplosionProof
  components:
  - type: Transform
    anchored: true
  - type: Occluder
  - type: Sprite
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke2
    # cmu edit start: non-lethal smoke is darker than WP smoke (cmss13-pve#719)
    color: "#adadad"
    # cmu edit end
  - type: TimedDespawn
    lifetime: 10
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: ActiveEdgeSpreader
  - type: EdgeSpreader
    id: RMCSmokeAcid
  - type: EvenSmoke
    spawn: RMCSmoke
    range: 3

- type: entity
  parent: RMCSmokeExplosionProof
  id: RMCSmokeExplosionProofSmall
  components:
  - type: EvenSmoke
    spawn: RMCSmoke
    range: 1

- type: entity
  parent: RMCSmokeExplosionProof
  id: RMCSmoke
  components:
  - type: DeleteOnExplosion

- type: entity
  parent: Smoke
  id: RMCSmokePhosphorusNoSpread
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Occluder
  - type: Sprite
    sprite: _RMC14/Effects/smoke.rsi
    state: smoke2
    # cmu edit start: WP smoke is lighter than non-lethal smoke (cmss13-pve#719)
    color: "#dddddd"
    # cmu edit end
  - type: TimedDespawn
    lifetime: 5
  - type: Tag
    tags:
    - HideContextMenu
  - type: Appearance
  - type: DeleteOnExplosion
  - type: RMCIgniteOnCollide
    maxStacks: 20 #TODO make this 45 after adding fire stacks over time works.
    duration: 5
    burnColor: "#EE6515"
    tileDamage:
      types:
        Heat: 0.5
  - type: EdgeSpreader
    id: Smoke

- type: entity
  parent: RMCSmokePhosphorusNoSpread
  id: RMCSmokeFireSentry
  components:
  - type: EvenSmoke
    spawn: RMCSmokePhosphorusNoSpread
    initialSpread: 1
    range: 1

- type: entity
  parent: RMCSmokePhosphorusNoSpread
  id: RMCSmokePhosphorusNoSpreadStrong
  components:
  - type: TimedDespawn
    lifetime: 3

- type: entity
  parent: RMCSmokePhosphorusNoSpreadStrong
  id: RMCSmokePhosphorus
  components:
  - type: EvenSmoke
    spawn: RMCSmokePhosphorusNoSpreadStrong
    initialSpread: 3
    range: 3

- type: entity
  parent: RMCSmokePhosphorusNoSpread
  id: RMCSmokePhosphorusNoSpreadWeak
  components:
  - type: TimedDespawn
    lifetime: 2
  - type: RMCIgniteOnCollide
    maxStacks: 15 #TODO make this 45 after adding fire stacks over time works.
    duration: 5

- type: entity
  parent: RMCSmokePhosphorusNoSpreadWeak
  id: RMCSmokePhosphorusWeak
  components:
  - type: EvenSmoke
    spawn: RMCSmokePhosphorusNoSpreadWeak
    initialSpread: 3
    range: 3

- type: entity
  parent: CMGrenadeHighExplosive
  id: CMGrenadeFrag
  name: 30mm HEFA grenade
  description: High-Explosive Fragmenting-Antipersonnel. A small, but deceptively strong fragmentation grenade that has been phasing out the M15 fragmentation grenades alongside the 30mm HEDP. Capable of being loaded in grenade launchers, or thrown by hand.
  components:
  # cmu edit start: not dual-purpose, so no impact fuse; the launcher's own fuse sets it off (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
    delay: 10
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m40hefa.rsi
  - type: Explosive
    maxIntensity: 8 # max 40 brute 40 burn
    intensitySlope: 4
    totalIntensity: 110
    deleteAfterExplosion: false
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: CMProjectileShrapnel
    capacity: 48
    directHit: false
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: Ammo
  - type: ClusterLimitHits
  - type: CMExplosionEffect
    maxShrapnel: 0
  - type: CMVocalizeTrigger
  - type: RMCScorchEffect
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
    - RMCGrenadeM40
    - RMCGrenadeHEFA

- type: entity
  parent: CMGrenadeHighExplosive
  id: CMGrenadeFragOld
  name: M15 fragmentation grenade
  # cmu edit start: no UNMC mentions
  description: An outdated fragmentation grenade. After decades of service, the old M15 Fragmentation Grenade is slowly being replaced by the slightly safer 30mm-series grenades. It is set to detonate in 4 seconds.
  # cmu edit end
  components:
  # cmu edit start: not dual-purpose, so no impact fuse; the launcher's own fuse sets it off (cmss13-pve#517)
  - type: TriggerOnFixedDistanceStop
    delay: 10
  # cmu edit end
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Grenades/m15frag.rsi
  - type: Explosive
    maxIntensity: 20
    intensitySlope: 6
    totalIntensity: 240
    deleteAfterExplosion: false
  - type: ProjectileGrenade
    triggerKey: trigger
    fillPrototype: CMProjectileShrapnel
    capacity: 65 #same as HEFA
    directHit: false
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container
  - type: Tag
    tags:
    - Grenade
    - LauncherCompatibleGrenade
  - type: Ammo
  - type: ClusterLimitHits
  - type: CMExplosionEffect
    maxShrapnel: 0
  - type: CMVocalizeTrigger
  - type: RMCScorchEffect
  # cmu edit start: M15 pin pull sound (ported from cmss13-pve#560)
  - type: TimerTrigger
    beepSound:
      path: /Audio/CMU14/Weapons/pinpull.ogg
  # cmu edit end

