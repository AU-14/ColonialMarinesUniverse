- type: entity
  parent: BaseItem
  id: CMSoap
  name: soap
  description: A cheap bar of soap. Doesn't smell.
  components:
  - type: Tag
    tags:
    - Soap
  # CMU14: four visual stages while retaining the existing forensic cleaning action.
  - type: CMUFourUseSoap
  - type: Appearance
  - type: Sprite
    sprite: CMU14/Items/soap_uses.rsi
    layers:
    - state: soap4
      map: [ "enum.CMUSoapVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.CMUSoapVisuals.Uses:
        enum.CMUSoapVisuals.Layer:
          3: { state: soap3 }
          2: { state: soap2 }
          1: { state: soap1 }
  - type: Item
    sprite: Objects/Specific/Janitorial/soap.rsi
    size: Tiny  
  - type: Physics
    bodyType: Dynamic
  - type: Solution
    id: soap
    solution:
        maxVol: 50
        reagents:
        - ReagentId: SoapReagent
          Quantity: 50
  - type: SolutionTransfer
    transferAmount: 10
    minTransferAmount: 1
    maxTransferAmount: 25
    canReceive: false
    canChangeTransferAmount: true
  - type: DrainableSolution
    solution: soap
  - type: DeleteOnSolutionEmpty
    solution: soap
  - type: FlavorProfile
    flavors:
      - clean
  - type: Edible
    transferAmount: 4.16 # CMU14: roughly three bites per quarter of a fresh 50u bar.
    solution: soap # CMU14: eating consumes the same remaining soap as cleaning.
  - type: BadFood
  - type: CleansForensics
  - type: Residue
    residueAdjective: residue-slippery
    residueColor: residue-green
    
- type: entity
  name: soap
  id: CMSoapDeluxe
