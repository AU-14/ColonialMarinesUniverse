- type: entity
  parent: BaseItem
  name: compact nailgun
  id: RMCNailgunCompact
  description: A carpentry tool, used to drive nails into tough surfaces. Cannot fire nails offensively due to a lack of a gas seal around the nail, meaning it cannot build up the pressure to fire.
  suffix: Filled
  components:
#cmu edit start: pre-resprite sprites (reverts RMC-14#5979)
  - type: Sprite
    sprite: CMU14/Weapons/SMGs/nailgun_compact_old.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: CMU14/Weapons/SMGs/nailgun_compact_old.rsi
#cmu edit end
    slots:
    - suitStorage
    - Back
    quickEquip: false
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Item
    size: Small
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineSMGNailgun
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/smg_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineSMGNailgun
  - type: Nailgun
  - type: MagazineAmmoProvider
    autoEject: true
  - type: RMCAmmoEject
#cmu edit start: pre-resprite sprites (reverts RMC-14#5979)
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
#cmu edit end
  - type: Appearance
  - type: AltFireMelee
  - type: MeleeWeapon
    resetOnHandSelected: false
    attackRate: 1
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: GenericHit
  - type: EmitSoundOnPickup
    sound:
      collection: RMCEquipGun
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      collection: RMCRustleGun
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      collection: RMCRustleGun
      params:
        volume: -4
  - type: UsableWhileDevoured
    canUnequip: true
  - type: Tag
    tags:
    - RMCNailgunCompact

- type: entity
  parent: RMCNailgunCompact
  name: tactical compact nailgun
  id: RMCNailgunTactical
  description: A carpentry tool, used to drive nails into tough surfaces. This one is military grade, it's olive drab and tacticool. Cannot fire nails as a projectile.
  suffix: Filled
  components:
#cmu edit start: pre-resprite sprites (reverts RMC-14#5979)
  - type: Sprite
    sprite: CMU14/Weapons/SMGs/nailgun_tactical_old.rsi
  - type: Clothing
    sprite: CMU14/Weapons/SMGs/nailgun_tactical_old.rsi
#cmu edit end
  - type: Nailgun
    materialPerRepair: 2
  - type: Tag
    tags:
    - RMCNailgunTactical

- type: Tag
  id: RMCNailgunCompact

- type: Tag
  id: RMCNailgunTactical
