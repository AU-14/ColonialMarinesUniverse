  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
  - type: Marine
  - type: RMCSuitLight
  - type: HolocardState
  - type: Satiation
    # baseDecayRate of 0.1/sec with all threshold modifiers at 1 means decay is a flat 6/min.
    # Okay(380) -> Peckish(110) is a gap of 270, i.e. exactly 45 minutes of not eating: warning popup + slowdown starts.
    # Peckish(110) -> Starving(50) is a gap of 60, i.e. exactly 10 more minutes: severe popup + screen desaturates.
    satiations:
      Hunger:
        prototype: RMCHumanHunger
      Thirst:
        prototype: RMCHumanThirst
  - type: SatiationSpeedModifier
    satiations:
      Hunger:
        thresholds:
          Peckish: 0.9
          Starving: 0.72 # Historical 0.9 peckish and 0.8 starving modifiers stacked.
      Thirst:
        thresholds:
          Thirsty: 0.9
          Parched: 0.72 # Historical 0.9 thirsty and 0.8 parched modifiers stacked.
    # baseDecayRate of 0.1/sec, decay multiplier is 1x at Okay and 0.8x at Thirsty.
    # Okay(278) -> Thirsty(98) is a gap of 180 at 1x (6/min), i.e. exactly 30 minutes: warning popup + slowdown starts.
    # Thirsty(98) -> Parched(50) is a gap of 48 at 0.8x (4.8/min), i.e. exactly 10 more minutes: severe popup + screen desaturates.
