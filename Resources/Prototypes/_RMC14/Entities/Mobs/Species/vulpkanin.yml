- type: entity
  save: false
  parent:
  - AppearanceVulpkanin
  - RMCBaseMobSpeciesOrganic
  id: RMCMobVulpkanin
  name: Urist C.M McVulp
  suffix: RMC14
  components:
  - type: HumanoidProfile
    species: Vulpkanin
  - type: InitialBody
    organs:
      Torso: RMCOrganVulpkaninTorso
      Head: RMCOrganVulpkaninHead
      ArmLeft: OrganVulpkaninArmLeft
      ArmRight: OrganVulpkaninArmRight
      HandRight: OrganVulpkaninHandRight
      HandLeft: OrganVulpkaninHandLeft
      LegLeft: OrganVulpkaninLegLeft
      LegRight: OrganVulpkaninLegRight
      FootLeft: OrganVulpkaninFootLeft
      FootRight: OrganVulpkaninFootRight
      Brain: OrganVulpkaninBrain
      Eyes: OrganVulpkaninEyes
      Tongue: OrganVulpkaninTongue
      Appendix: OrganVulpkaninAppendix
      Ears: OrganVulpkaninEars
      Lungs: OrganVulpkaninLungs
      Heart: OrganVulpkaninHeart
      Stomach: OrganVulpkaninStomach
      Liver: OrganVulpkaninLiver
      Kidneys: OrganVulpkaninKidneys
  - type: Icon
    sprite: _RMC14/Mobs/Vulpkanin/parts.rsi
    state: full
  - type: VulpkaninAccent
  - type: Speech
    speechVerb: Vulpkanin
    allowedEmotes: [ 'Bark', 'Snarl', 'Whine', 'Growl', 'Yip' ]
  - type: Vocal
  - type: Wagging
    action: ActionToggleVulpkaninWagging
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
  - type: Inventory
    speciesId: vulpkanin
  - type: CreamPied
    sprite:
      sprite: Effects/creampie.rsi
      state: creampie_vulpkanin
  - type: FixedIdentity
    name: cm-chatsan-replacement-vulpkanin

- type: entity
  parent: AppearanceVulpkanin
  name: Vulpkanin Dummy
  id: MobVulpkaninDummy
  categories: [ HideSpawnMenu ]
  description: A dummy vulpkanin meant to be used in character setup.
  components:
  - type: HumanoidProfile
    species: Vulpkanin

- type: entity
  parent: OrganVulpkaninTorso
  id: RMCOrganVulpkaninTorso
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.UndergarmentTop

- type: entity
  parent: OrganVulpkaninHead
  id: RMCOrganVulpkaninHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.Hair
