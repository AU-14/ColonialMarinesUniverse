# Light Tubes

# Light Tube, Always Powered
- type: entity
  parent: AlwaysPoweredWallLight
  id: RMCLightFixtureAlwaysPowered
  name: light fixture
  description: A lighting fixture that is fitted with a bright fluorescent light tube. Looking at it for too long makes your eyes go watery.
  suffix: Always powered, DO NOT MAP
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: _RMC14/Structures/Wallmounts/LightingOffset/light_tube.rsi
    state: tube1
    layers:
    - state: tube1
      map: ["enum.PoweredLightLayers.Base"]
  - type: PointLight
    color: "#FFEFD2"
    energy: 1
    radius: 10
    softness: 1
    offset: "0, -0.495"
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: tube-empty
      Off: tube0
      On: tube1
      Broken: tube-broken
      Burned: tube-burned
  - type: Destructible
    thresholds: []
  - type: Construction
    graph: RMCLightFixture
    node: tubeLight
  - type: RMCBreakLightOnAttack
  - type: RMCLightOffset
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: RMCMesonsNonviewable

- type: entity
  parent: RMCLightFixtureAlwaysPowered
  id: RMCLightFixtureAlwaysPoweredOffset
  suffix: Always powered

- type: entity
  parent: RMCLightFixtureAlwaysPowered
  id: RMCLightFixtureBlueAlwaysPowered
  suffix: Always powered, DO NOT MAP
  components:
  - type: Sprite
    state: btube1
    layers:
    - state: btube1
      map: ["enum.PoweredLightLayers.Base"]
  - type: PointLight
    color: "#D2E3EC"
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: btube-empty
      Off: btube0
      On: btube1
      Broken: btube-broken
      Burned: btube-burned

- type: entity
  parent: RMCLightFixtureBlueAlwaysPowered
  id: RMCLightFixtureBlueAlwaysPoweredOffset

- type: entity
  parent: RMCLightFixtureAlwaysPowered
  id: RMCLightFixtureDoubleAlwaysPowered
  description: A lighting fixture that can be fitted with two bright fluorescent light tubes for that extra eye-watering goodness.
  components:
  - type: Sprite
    state: ptube1
    layers:
    - state: ptube1
      map: ["enum.PoweredLightLayers.Base"]
  - type: PoweredLightVisuals
    spriteStateMap:
      Empty: ptube-empty
      Off: ptube0
      On: ptube1
      Broken: ptube-broken
      Burned: ptube-burned

- type: entity
  parent: RMCLightFixtureDoubleAlwaysPowered
  id: RMCLightFixtureDoubleAlwaysPoweredOffset
