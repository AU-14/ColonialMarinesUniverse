# Light Tube, Empty
- type: entity
  parent: RMCLightFixtureAlwaysPowered
  id: RMCLightFixtureEmpty
  suffix: Empty, DO NOT MAP
  components:
  - type: Sprite
    state: empty
  - type: PointLight
    enabled: false
  - type: PoweredLight
    bulb: Tube
    unarmedHitShock: 0
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
  - type: ContainerContainer
    containers:
      light_bulb: !type:ContainerSlot
  - type: ApcPowerReceiver
  - type: Appearance
  - type: RMCPowerReceiver
    idleLoad: 1
    activeLoad: 40
    channel: Lighting
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: AURandomLightBreak

