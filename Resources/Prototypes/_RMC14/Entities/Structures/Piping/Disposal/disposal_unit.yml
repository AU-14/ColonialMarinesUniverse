- type: entity
  id: CMDisposalUnit
  parent: DisposalUnitBase
  name: disposal unit
  description: A pneumatic waste disposal unit.
  components:
  - type: XenoCrusherChargable
    instantDestroy: true
    passOnDestroy: true
  - type: VehicleSmashable
  - type: Sprite
    sprite: _RMC14/Structures/Piping/disposal.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - BulletImpassable # Required for throwing items into it.
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
  - type: Damageable
    damageModifierSet: StructuralMarine
  - type: Injurable
    damageContainer: StructuralMarine
  - type: ApcPowerReceiver
    powerLoad: 0
    needsPower: false
  - type: PowerState
    idlePowerDraw: 0
    workingPowerDraw: 0
#  - type: Construction | TODO RMC14: Construction graph for steps to unanchor
  - type: DisposalUnit
  - type: ThrowInsertContainer
    containerId: DisposalUnitComponent
    probability: 1
  - type: RequireProjectileTarget
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: XenoToggleChargingDamage
    stageLoss: 2
    minimumStage: 2
    unanchor: true
  - type: RMCMesonsNonviewable
