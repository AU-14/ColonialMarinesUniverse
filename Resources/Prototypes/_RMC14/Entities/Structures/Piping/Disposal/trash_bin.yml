- type: entity
  abstract: true
  id: RMCTrashBinBase
  parent: BaseStructure
  name: trash bin
  description: A Weston-Yamada trash bin used for disposing your unwanted items, or you can just throw your shit on the ground like every other asshole.
  placement:
    mode: SnapgridCenter
    snap:
    - Disposal
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Piping/disposal.rsi
    layers:
    - state: trashcan
      map: [ "enum.DisposalUnitVisualLayers.Base" ]
    - state: disposal-flush
      map: [ "enum.DisposalUnitVisualLayers.OverlayFlushing" ]
      visible: false
    - state: dispover-ready
      map: [ "enum.DisposalUnitVisualLayers.OverlayCharging" ]
    - state: dispover-full
      map: [ "enum.DisposalUnitVisualLayers.OverlayFull" ]
      visible: false
    - state: dispover-handle
      map: [ "enum.DisposalUnitVisualLayers.OverlayEngaged" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.DisposalUnitVisuals.IsFlushing:
        enum.DisposalUnitVisualLayers.OverlayFlushing:
          True: { visible: true }
          False: { visible: false }
      enum.DisposalUnitVisuals.IsEngaged:
        enum.DisposalUnitVisualLayers.OverlayEngaged:
          True: { visible: true }
          False: { visible: false }
      enum.DisposalUnitVisuals.IsCharging:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          True: { state: dispover-charge, visible: true }
          False: { state: dispover-ready, visible: true }
      enum.DisposalUnitVisuals.IsFull:
        enum.DisposalUnitVisualLayers.OverlayFull:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          False: { visible: false }
        enum.DisposalUnitVisualLayers.OverlayFull:
          False: { visible: false }
      enum.AnchorVisuals.Anchored:
        enum.DisposalUnitVisualLayers.OverlayEngaged:
          False: { visible: false }
        enum.DisposalUnitVisualLayers.OverlayCharging:
          False: { visible: false }
        enum.DisposalUnitVisualLayers.OverlayFull:
          False: { visible: false }
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
  - type: Damageable
    damageContainer: StructuralMarine
    damageModifierSet: StructuralMarine
  - type: Appearance
  - type: InteractionOutline
  - type: Anchorable
    flags:
    - None
  - type: ContainerContainer
    containers:
      disposals: !type:Container
  - type: RequireProjectileTarget
  - type: DisposalUnit
  - type: ThrowInsertContainer
    containerId: disposals
    probability: 0
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno

- type: entity
  parent: RMCTrashBinBase
  id: RMCTrashBinGreen
  components:
  - type: Sprite
    layers:
    - state: trashgreen
      map: [ "enum.DisposalUnitVisualLayers.Base" ]
    - state: trashgreen
      map: [ "enum.DisposalUnitVisualLayers.OverlayFlushing" ]
      visible: false
    - state: trashgreen
      map: [ "enum.DisposalUnitVisualLayers.OverlayCharging" ]
    - state: trashgreen
      map: [ "enum.DisposalUnitVisualLayers.OverlayFull" ]
      visible: false
    - state: trashgreen
      map: [ "enum.DisposalUnitVisualLayers.OverlayEngaged" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.DisposalUnitVisuals.IsCharging:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          True: { state: trashgreen, visible: true }
          False: { state: trashgreen, visible: true }

- type: entity
  parent: RMCTrashBinBase
  id: RMCTrashBinBlue
  components:
  - type: Sprite
    layers:
    - state: trashblue
      map: [ "enum.DisposalUnitVisualLayers.Base" ]
    - state: trashblue
      map: [ "enum.DisposalUnitVisualLayers.OverlayFlushing" ]
      visible: false
    - state: trashblue
      map: [ "enum.DisposalUnitVisualLayers.OverlayCharging" ]
    - state: trashblue
      map: [ "enum.DisposalUnitVisualLayers.OverlayFull" ]
      visible: false
    - state: trashblue
      map: [ "enum.DisposalUnitVisualLayers.OverlayEngaged" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.DisposalUnitVisuals.IsCharging:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          True: { state: trashblue, visible: true }
          False: { state: trashblue, visible: true }
