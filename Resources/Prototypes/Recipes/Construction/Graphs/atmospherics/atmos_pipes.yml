- type: constructionGraph
  id: !type:CreateVariants
    values: [ GasPipe, GasPipeAlt1, GasPipeAlt2 ]
  start: start
  graph:
  - node: start
    edges:
    - to: half
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 1
        doAfter: 1

    - to: straight
