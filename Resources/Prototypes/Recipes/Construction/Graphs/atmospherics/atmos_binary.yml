- type: constructionGraph
  id: !type:CreateVariants
    values: [ GasBinary, GasBinaryAlt1, GasBinaryAlt2 ]
  start: start
  graph:
  - node: start
    edges:
    - to: pressurepump
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

    - to: volumepump
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

    - to: passivegate
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

    - to: valve
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

    - to: signalvalve
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

    - to: pressureregulator
      steps:
