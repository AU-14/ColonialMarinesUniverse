        amount: 2
        doAfter: 1

    - to: bendradiator
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

  - node: pressurepump
    entity: !type:CreateVariants
      values: [ CMUGasPressurePump, CMUGasPressurePumpAlt1, CMUGasPressurePumpAlt2 ] # CMU14
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1 # CMU14: refund fork metal
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 1

