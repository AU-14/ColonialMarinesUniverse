- type: constructionGraph
  id: !type:CreateVariants
    values: [ GasPipeSensor, GasPipeSensorAlt1, GasPipeSensorAlt2 ]
  start: start
  graph:
  - node: start
    edges:
    - to: sensor
      steps:
      - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
        amount: 2
        doAfter: 1

  - node: sensor
    entity: !type:CreateVariants
      values: [ CMUGasPipeSensor, CMUGasPipeSensorAlt1, CMUGasPipeSensorAlt2 ] # CMU14
    actions:
    - !type:SetAnchor
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: CMSheetMetal1 # CMU14: refund fork metal
        amount: 2
      - !type:DeleteEntity
      conditions:
      - !type:EntityAnchored
        anchored: false
      steps:
      - tool: Welding
        doAfter: 1