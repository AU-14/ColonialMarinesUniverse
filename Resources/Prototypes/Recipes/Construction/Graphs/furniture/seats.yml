- type: constructionGraph
  id: Seat
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: chair
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 1
              doAfter: 1
        - to: stool
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 1
              doAfter: 1
        - to: stoolBar
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 1
              doAfter: 1
        - to: chairBrass
          steps:
            - material: Brass
              amount: 1
              doAfter: 1
        - to: chairOffice
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
        - to: chairOfficeDark
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
        - to: chairComfy
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
        - to: chairPilotSeat
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
        - to: chairWood
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 1
        - to: chairMeat
          steps:
            - material: MeatSheets
              amount: 2
              doAfter: 1
        - to: chairFolding
          steps:
            - material: RMCPlastic # CMU14: fork plastic (RMCSheetPlastic), not upstream Plastic
              amount: 1
              doAfter: 1
            - material: CMRodMetal # CMU14: fork rods (CMRodMetal), not upstream MetalRod
              amount: 2
        - to: chairSteelBench
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
        - to: stoolCard
          steps:
            - material: Cardboard
              amount: 3
              doAfter: 1
        - to: chairWoodBench
          steps:
            - material: WoodPlank
              amount: 4
              doAfter: 2
        - to: redComfBench
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 1
        - to: blueComfBench
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 1

    - node: chair
      entity: Chair
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
          steps:
            - tool: Screwing
              doAfter: 1

    - node: stool
      entity: Stool
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
          steps:
            - tool: Screwing
              doAfter: 1

    - node: stoolBar
      entity: StoolBar
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairBrass
      entity: ChairBrass
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetBrass1
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairOffice
      entity: ChairOfficeLight
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairOfficeDark
      entity: ChairOfficeDark
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairComfy
