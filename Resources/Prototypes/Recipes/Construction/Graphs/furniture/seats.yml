              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairPilotSeat
      entity: ChairPilotSeat
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

    - node: chairWood
      entity: ChairWood
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 3
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairMeat
      entity: ChairMeat
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialSheetMeat1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairFolding
      entity: ChairFolding
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: RMCSheetPlastic1 # CMU14: refund fork plastic
              amount: 1
            - !type:SpawnPrototype
              prototype: CMRodMetal1 # CMU14: refund fork rods
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 1

    - node: chairSteelBench
      entity: SteelBench
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
