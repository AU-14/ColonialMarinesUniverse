    - node: stoolCard
      entity: CardStool
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialCardboard1
              amount: 3
            - !type:PlaySound
              sound: /Audio/Items/Toys/ToyFall2.ogg
          steps:
            - tool: Slicing
              doAfter: 1

    - node: chairWoodBench
      entity: WoodenBench
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 2

    - node: redComfBench
      entity: BenchRedComfy
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 1
          steps:
            - tool: Cutting
              doAfter: 1
            - tool: Screwing
              doAfter: 1

    - node: blueComfBench
      entity: BenchBlueComfy
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 1
          steps:
            - tool: Cutting
              doAfter: 1
            - tool: Screwing
              doAfter: 1
