- type: constructionGraph
  id: Shelf
  start: start
  graph:
    - node: start
      actions:
        - !type:DeleteEntity {}
      edges:
# Normal
        - to: ShelfWood
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: WoodPlank
              amount: 4
              doAfter: 2
        - to: ShelfMetal
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 5
              doAfter: 3
        - to: ShelfGlass
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: CMGlass # CMU14: fork glass (CMSheetGlass), not upstream Glass
              amount: 4
              doAfter: 2
# Reinforced
        - to: ShelfRWood
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: WoodPlank
              amount: 8
              doAfter: 3
            - material: Cable
              amount: 2
              doAfter: 1
        - to: ShelfRMetal
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: CMPlasteel # CMU14: fork plasteel (CMSheetPlasteel), not upstream Plasteel
              amount: 5
              doAfter: 3
            - material: ReinforcedGlass
              amount: 5
              doAfter: 2
            - material: Cable
              amount: 3
              doAfter: 1
        - to: ShelfRGlass
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: RMCPlastic # CMU14: fork plastic (RMCSheetPlastic), not upstream Plastic
              amount: 5
              doAfter: 2
            - material: ReinforcedGlass
              amount: 5
              doAfter: 3
            - material: Cable
              amount: 2
              doAfter: 1
# Departmental
        - to: ShelfBar
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: WoodPlank
              amount: 6
              doAfter: 2
        - to: ShelfKitchen
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: CMRodMetal # CMU14: fork rods (CMRodMetal), not upstream MetalRod
              amount: 2
              doAfter: 1
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 5
            - material: WoodPlank
              amount: 3
              doAfter: 2
        - to: ShelfChemistry
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: CMPlasteel # CMU14: fork plasteel (CMSheetPlasteel), not upstream Plasteel
              amount: 2
              doAfter: 2
            - material: ReinforcedGlass
              amount: 5
              doAfter: 2
            - material: RMCPlastic # CMU14: fork plastic (RMCSheetPlastic), not upstream Plastic
              amount: 5
              doAfter: 2
            - material: Cable
              amount: 2
              doAfter: 1

# Normal deconstructs
    - node: ShelfWood
      entity: ShelfWood
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: MaterialWoodPlank1
                amount: 4
          steps:
            - tool: Prying
              doAfter: 2

    - node: ShelfMetal
      entity: ShelfMetal
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: CMSheetMetal1 # CMU14: refund fork metal
                amount: 5
          steps:
            - tool: Screwing
              doAfter: 5

    - node: ShelfGlass
      entity: ShelfGlass
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: CMSheetGlass1 # CMU14: refund fork glass
                amount: 4
          steps:
            - tool: Screwing
              doAfter: 2
# Reinforced deconstructs
    - node: ShelfRWood
      entity: ShelfRWood
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: MaterialWoodPlank1
                amount: 8
            - !type:GivePrototype
                prototype: CableApcStack1
                amount: 2
          steps:
            - tool: Screwing
              doAfter: 5
            - tool: Prying
              doAfter: 2

    - node: ShelfRMetal
      entity: ShelfRMetal
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: CMSheetPlasteel1 # CMU14: refund fork plasteel
                amount: 5
            - !type:GivePrototype
                prototype: SheetRGlass1 # CMU14: refund the upstream sheet the build step consumed; the fork sheet carries CMSteel the shelf never cost
                amount: 5
            - !type:GivePrototype
                prototype: CableApcStack1
                amount: 3
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Welding
              doAfter: 5

    - node: ShelfRGlass
      entity: ShelfRGlass
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: RMCSheetPlastic1 # CMU14: refund fork plastic
                amount: 5
            - !type:GivePrototype
                prototype: SheetRGlass1 # CMU14: refund the upstream sheet the build step consumed; the fork sheet carries CMSteel the shelf never cost
                amount: 5
            - !type:GivePrototype
                prototype: CableApcStack1
                amount: 2
          steps:
            - tool: Welding
              doAfter: 2
            - tool: Screwing
              doAfter: 4

# Departmental deconstructs
    - node: ShelfBar
      entity: ShelfBar
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: MaterialWoodPlank1
                amount: 6
          steps:
            - tool: Prying
              doAfter: 3

    - node: ShelfKitchen
      entity: ShelfKitchen
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: CMRodMetal # CMU14: refund fork rods
                amount: 2
            - !type:GivePrototype
                prototype: CMSheetMetal1 # CMU14: refund fork metal
                amount: 5
            - !type:GivePrototype
                prototype: MaterialWoodPlank1
                amount: 3
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Welding
              doAfter: 2
            - tool: Prying
              doAfter: 1

    - node: ShelfChemistry
      entity: ShelfChemistry
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:GivePrototype
                prototype: CMSheetPlasteel1 # CMU14: refund fork plasteel
                amount: 2
            - !type:GivePrototype
                prototype: RMCSheetPlastic1 # CMU14: refund fork plastic
                amount: 5
            - !type:GivePrototype
                prototype: SheetRGlass1 # CMU14: refund the upstream sheet the build step consumed; the fork sheet carries CMSteel the shelf never cost
                amount: 5
            - !type:GivePrototype
                prototype: CableApcStack1
                amount: 2
          steps:
            - tool: Welding
              doAfter: 2
            - tool: Screwing
              doAfter: 1
            - tool: Anchoring
              doAfter: 2
            - tool: Prying
              doAfter: 4
