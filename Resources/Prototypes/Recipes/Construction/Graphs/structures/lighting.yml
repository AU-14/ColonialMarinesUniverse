- type: constructionGraph
  id: LightFixture
  start: start
  graph:
    - node: start
      edges:
        - to: bulbLight
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 1
              doAfter: 2.0
        - to: tubeLight
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 2
              doAfter: 2.0
        - to: groundLight
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 5
              doAfter: 2.0
        - to: strobeLight
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 1
              doAfter: 2.0
        - to: emergencyLight
          steps:
            - material: CMSteel # CMU14: fork metal (CMSheetMetal), not upstream Steel
              amount: 1
              doAfter: 1.0
            - material: CMGlass # CMU14: fork glass (CMSheetGlass), not upstream Glass
              amount: 1
              doAfter: 1.0
    - node: tubeLight
      entity: PoweredlightEmpty
      edges:
        - to: start
          conditions:
            - !type:ContainerEmpty
              container: "light_bulb"
          steps:
            - tool: Screwing
              doAfter: 2.0
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 2
            - !type:DeleteEntity {}
    - node: bulbLight
      entity: PoweredSmallLightEmpty
      edges:
        - to: start
          conditions:
            - !type:ContainerEmpty
              container: "light_bulb"
          steps:
            - tool: Screwing
              doAfter: 2.0
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 1
            - !type:DeleteEntity {}
    - node: groundLight
      entity: PoweredLightPostSmallEmpty
      edges:
        - to: start
          conditions:
            - !type:ContainerEmpty
              container: "light_bulb"
          steps:
            - tool: Screwing
              doAfter: 4.0
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 5
            - !type:DeleteEntity {}
    - node: strobeLight
      entity: PoweredStrobeLightEmpty
      edges:
        - to: start
          conditions:
            - !type:ContainerEmpty
              container: "light_bulb"
          steps:
            - tool: Screwing
              doAfter: 2.0
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 1
            - !type:DeleteEntity {}
    - node: emergencyLight
      entity: EmergencyLight
      edges:
        - to: start
          steps:
            - tool: Screwing
              doAfter: 2.0
          completed:
            - !type:SpawnPrototype
              prototype: CMSheetMetal1 # CMU14: refund fork metal
              amount: 1
            - !type:SpawnPrototype
              prototype: CMSheetGlass1 # CMU14: refund fork glass
              amount: 1
            - !type:DeleteEntity {}
