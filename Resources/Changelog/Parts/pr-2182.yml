author: rokudara-sen
category: CMU
changes:
- message: Thrown items and grenades no longer drop down the first hole they pass
    over while your cursor is over the level below. They land where you threw them,
    and fall if that spot is open.
  type: Fix
- message: Shooting across a wide drop no longer sends every shot into the pit. Empty
    floor below only pulls your shot down within 4 tiles of you, further than that
    you have to point at someone down there.
  type: Fix
- message: Aiming at someone on the level below now locks onto anyone within a tile
    of your cursor, so moving targets are easier to hit.
  type: Tweak
- message: Once you're aiming down at range, slipping off the target keeps you aiming
    down for half a second, and for as long as you hold the trigger, so bursts don't
    flip between levels.
  type: Tweak
- message: Added a "Shoot where you look across Z-levels" option under Controls ->
    CMU Z-Levels. Turn it off to bring back the old Ctrl+Shift+Space shoot down toggle.
  type: Add
time: '2026-10-15T08:07:11.0000000+00:00'
