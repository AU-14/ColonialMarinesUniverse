author: troytroy400
category: CMU
changes:
- message: Bosenmori Basho now has an almost pure nitrogen atmosphere.
  type: Add
- message: Breathing is turned on for humans while they're on Bosenmori Basho, so
    internals work.
  type: Add
- message: Bosenmori now has its own three custom survivors groups. These include
    stranded IASF paratroopers, a stranded IASF pilot and a colonist survivor group.
  type: Add
- message: LACN, RMC and USCM are now GOVFOR options on Bosenmori Basho, replacing
    WY PMC.
  type: Tweak
- message: Fire that spreads now burns as strong as the fire it came from, so a whole
    fire goes out at the same time unless burning on objects/walls.
  type: Tweak
- message: Removed the ghost button that appeared while in crit.
  type: Remove
- message: Ghosting while in crit no longer kills your character.
  type: Tweak
- message: Internals now work from gas tanks inside worn storage like satchels, armor
    and pouches.
  type: Add
- message: Added internals for GOVFOR/OPFOR in their vendors.
  type: Add
- message: Automated requisitions vendors have a new Protective Equipment section
    with the faction's gas mask, filters and high capacity oxygen tanks. Requisitions
    can also order a crate of high capacity oxygen tanks.
  type: Add
- message: Breathing from an oxygen tank now heals suffocation 1.5x as fast instead
    of 3x.
  type: Tweak
- message: Added a requisitions stock console that shows what the automated requisitions
    vendors on the ship have left so that the poor riflemen are no longer guessing
    what X platoon has.
  type: Add
- message: Old RTO packs in automated requisitions vendors are replaced with ANPRC
    radios and antennas.
  type: Tweak
- message: Automated requisitions vendors now stock large general pouches, large document
    pouches, large shotgun pouches and deployable z-level ladders.
  type: Add
- message: Removed attachments from automated requisitions vendors that none of that
    platoon's guns can use.
  type: Remove
- message: The Royal Marine Commandos requisitions vendor now stocks L88A1 and L88A2
    bullpup rifles.
  type: Add
- message: Emergency closets now have emergency gas masks, emergency oxygen tanks
    (with a chance of extended ones), a toolbox with flashlights and a survival knife
    and a first aid kit.
  type: Tweak
- message: Fire closets now have firefighting turnout gear, an oxygen tank, a firefighting
    helmet, two extinguishers, flares and a fire axe.
  type: Tweak
- message: Firefighting turnout gear now gives some fire and heat protection.
  type: Tweak
- message: The snow jacket/suit now protects against the cold.
  type: Tweak
- message: Default IFAKs now come with one hemostatic gauze packet and a tube of ointment
    instead of two gauze packets.
  type: Tweak
- message: The CAT tourniquet is now just called a tourniquet and mentions the brand
    in the description.
  type: Tweak
- message: You can now feed people pills from up to a tile and a half away.
  type: Tweak
- message: Ghost roles now get proper facial hair and several that had no appearance
    defined now do.
  type: Fix
- message: Fixed soda names in the soda fountain and cold drinks machine.
  type: Fix
- message: Fixed capitalization of some clothing names.
  type: Fix
- message: Fixed locale issues on some third party IDs.
  type: Fix
- message: BEAR localization issues resolved.
  type: Fix
- message: Added a rule to the Distress Signal rules that survivors and third parties
    may not rush the threat's hive, nest or spawn location until GOVFOR has arrived
    on the planet or 30 minutes have passed.
  type: Tweak
time: '2026-10-08T22:13:07.0000000+00:00'
url: https://github.com/AU-14/ColonialMarinesUniverse/pull/2110
