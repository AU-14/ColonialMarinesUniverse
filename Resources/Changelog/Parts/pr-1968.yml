changes:
- message: 'Added Rider antag, a morphling parasite that fuses with a willing/unwilling
    host to survive, based on the thing from the series, 3 versions: hitchhiker (survive
    within a host), leapfrog (ride 3 hosts), puppeteer (seize an objective item)'
  type: Add
- message: Added Replicant (evil-twin) synth colony antagonist, steals Id and name
    of their selected quarry
  type: Add
- message: Cannibal fixes, meat-only diet, can chop/spike non-rotten bodies
  type: Fix
- message: APC Batteries require a doAfter that scales with skill (saboteur) - not
    a free battery swap min. 7 seconds
  type: Tweak
- message: Up to 3 antags of same type, spawn with your wanted paper as antag (and
    lighter to burn it), first pass at forensics and detain system, starting supplemental
    skills for many antags
  type: Add
- message: Bounty Hunters (and CMB) gain forensic suspect descriptions and wanted
    posters
  type: Add
- message: CMB has to detain people in the system to get rewards, not complete yet
  type: Tweak
- message: Merged CorporateSpy & WeylandYutaniAgent into Corporate Rivals - can spawn
    in tandem as opposers, or individually alone
