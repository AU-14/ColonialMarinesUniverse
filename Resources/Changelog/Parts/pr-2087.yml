author: troytroy400
category: CMU
changes:
- message: Health scanners now show the patient's overall external bleeding tier and
    each limb's bleeding tier.
  type: Add
- message: Losing a limb now leaves an open stump that bleeds arterially until it
    is treated.
  type: Add
- message: Tourniquets can be applied to and removed from open stumps.
  type: Add
- message: Added the Close Stump surgery. Clamp the artery with a hemostat, then cauterize
    the stump.
  type: Add
- message: Health scanners show stumps on severed limbs.
  type: Add
- message: Examining someone with an open stump shows it squirting blood or notes
    the tourniquet on it.
  type: Add
- message: A tourniquet on a stump now falls to the floor when the stump is cauterized
    or the limb is reattached.
  type: Add
- message: Arterial bleeding now continues after death. Lesser bleeding still clots
    once the heart stops.
  type: Tweak
- message: Fixed "epinephrine" being misspelled in the health scanner's recommendations.
  type: Fix
- message: Added the option "Echo people's wounds to chat when you examine them like
    in CM13".
  type: Add
- message: Added a chat search button beside the chat settings.
  type: Add
- message: The "reset chat channel after sending" option now returns to OOC instead
    of Local when you're in the menu.
  type: Tweak
- message: Intelligence Officers no longer have logistics access.
  type: Tweak
- message: Fixed the lore primer showing "lore-primer-platoon-label" instead of the
    platoon information. All platoon primer text is now localized.
