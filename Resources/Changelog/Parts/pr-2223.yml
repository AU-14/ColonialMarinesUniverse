author: troytroy400
category: CMU
changes:
- message: Ghosts look like the character they died as, same as in CM13. The ghost
    colour option has been removed as it will no-longer work with this system.
  type: Add
- message: Toggle action to show or hide your own ghost.
  type: Add
- message: SSD timer shows how long someone has been disconnected.
  type: Add
- message: Squad optic ammo HUD. While your optic is down, your held gun's ammo type
    and round count shows under your status alerts. Toggle it with the optic's Ammo
    HUD action. The smartgun head mounted sight shows it too.
  type: Add
- message: IX-50 MGAD anti-air cannon.
  type: Add
- message: Added the XM43 carbine.
  type: Add
- message: Dog War firearms. Added the M38 LMG, M20A2, XM24A and Type 40 rifles with
    their magazines and attachments.
  type: Add
- message: Smartgun aim assist toggle.
  type: Add
- message: New smartgun firing sounds with a rattle when low on ammo.
  type: Add
- message: Flanged pulse rifle sounds.
  type: Add
- message: M19 anti-tank mine. It has no IFF and is set off by vehicles. Can be found
    in requisitions and CT vendors.
  type: Add
- message: Squad leaders points outline/highlight what they point at temporarily for
    their squad.
  type: Add
- message: Flare light rework and lit flare inhand sprites.
  type: Add
- message: Pill canisters can be broken open.
  type: Add
- message: Stompers boots (the Ripley shoes) can now be found in the paid civilian
    clothing wardrobe.
  type: Add
- message: USCM snow and urban camo USCM equipment.
  type: Add
- message: MRE update from CM. Every faction's ration has new contents. USCM MREs,
    PMC CFRs, TWE ORPs, UPP IRPs, We-Yu colony rations and CLF makeshift meals, plus
    a new FSR ration. MREs are named after their main course. Adds sporks, spread
    packets, spread tubes, tea bags, electrolyte and protein drink powders, mini cigarette
    packs and new matchbooks. Instant drink mix packets in MREs, to mix with water.
    Spreads, tubes and some cans can be put onto other food.
  type: Add
- message: UPP main course cans are sealed and need a can opener, or a knife. UPP
    platoon vendors have regular and folding can openers and the folding one fits
    in an MRE.
  type: Add
- message: Food allergies traits for nuts, fish, dairy and eggs.
  type: Add
- message: UPP, CLF, LACN, WY and PMC platoon vendors stock their own faction's rations.
  type: Tweak
- message: Upstream names are automatically converted to their lore friendly versions.
  type: Tweak
- message: The LACN Kramer rifle and Karbine take either stock and come without one.
    The Kramer AR comes with the LACN grenade launcher.
  type: Tweak
- message: The Kramer enforcer is now a DMR with a built-in 2x scope.
  type: Tweak
- message: The civilian TPR is a loadout handgun option.
  type: Tweak
- message: LACN shipside crew now have white gloves and boots. Pilots, the DCC, the
    CMO and command spawn in their uniforms.
  type: Tweak
- message: The XM43E1 uses its proper lore friendly sprites again.
  type: Tweak
- message: LACN uniforms and gear use the map's camo.
  type: Fix
- message: Left out CMU camo items now change with the map's camo.
  type: Fix
time: '2026-10-19T06:43:04.0000000+00:00'
